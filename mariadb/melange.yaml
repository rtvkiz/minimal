# Melange build configuration for minimal MariaDB
# Builds MariaDB 11.4 LTS from source with cmake
# LTS series, EOL 2029-05-29

package:
  name: mariadb-minimal
  version: 11.4.12
  epoch: 0
  description: "Minimal MariaDB LTS server built from source"
  copyright:
    - license: GPL-2.0-only

vars:
  # SHA256 checksum of source tarball - updated by update-mariadb.yml workflow
  sha256: 5ab7883db519bfcebfdd2aac09bc5544a12ce328f39edd46d0bf01690615ef6c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - cmake
      - linux-headers
      - openssl-dev
      - ncurses-dev
      - bison
      - perl
      - libtirpc-dev
      - rpcsvc-proto
      - pcre2-dev
      - libxml2-dev
      - zstd-dev
      - lz4-dev
      - fmt-dev

pipeline:
  # Download and verify MariaDB source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://archive.mariadb.org/mariadb-${{package.version}}/source/mariadb-${{package.version}}.tar.gz" \
        -o /home/build/mariadb.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/mariadb.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf mariadb.tar.gz
      rm mariadb.tar.gz

  # Configure, build, and install MariaDB.
  #
  # Pattern follows wolfi-dev/os mariadb-12.3.yaml (and our own mysql/melange.yaml):
  # full `make install DESTDIR=…` so the cmake install rules place every file
  # — binaries, share/, plugin/, mariadb-install-db script — at its canonical
  # path. Stops us from re-patching manual `cp` paths every time MariaDB's
  # build tree layout shifts between minor versions.
  - runs: |
      cd /home/build/mariadb-${{package.version}}
      mkdir build && cd build
      cmake .. \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DINSTALL_PLUGINDIR=lib/mysql/plugin \
        -DINSTALL_SBINDIR=bin \
        -DINSTALL_SCRIPTDIR=bin \
        -DMYSQL_DATADIR=/var/lib/mysql \
        -DSYSCONFDIR=/etc/mysql \
        -DWITH_SSL=system \
        -DWITH_ZLIB=system \
        -DWITH_PCRE=system \
        -DWITH_READLINE=ON \
        -DWITH_UNIT_TESTS=OFF \
        -DWITH_DEBUG=OFF \
        -DWITH_JEMALLOC=OFF \
        -DWITH_SYSTEMD=no \
        -DWITH_LINUX_AIO=OFF \
        -DSKIP_TESTS=ON \
        -DCMAKE_C_FLAGS="-g0" \
        -DCMAKE_CXX_FLAGS="-g0" \
        -DPLUGIN_TOKUDB=NO \
        -DPLUGIN_ROCKSDB=NO \
        -DPLUGIN_MROONGA=NO \
        -DPLUGIN_OQGRAPH=NO \
        -DPLUGIN_CONNECT=NO \
        -DPLUGIN_SPIDER=NO \
        -DPLUGIN_WSREP=NO \
        -DWITH_WSREP=OFF \
        -DWITHOUT_EXAMPLE_STORAGE_ENGINE=1 \
        -DWITHOUT_FEDERATED_STORAGE_ENGINE=1
      make -j$(nproc)
      make install DESTDIR="${{targets.destdir}}"

  # Trim the install to a minimal footprint and ship mysqld/mysql compat
  # symlinks + entrypoint.
  - runs: |
      D="${{targets.destdir}}"

      # Drop dev / test / docs — keep server, client, plugins, share/.
      rm -rf "$D/usr/mysql-test" \
             "$D/usr/mariadb-test" \
             "$D/usr/sql-bench" \
             "$D/usr/include" \
             "$D/usr/share/doc" \
             "$D/usr/share/man" \
             "$D/usr/share/info" \
             "$D/usr/share/groonga" \
             "$D/usr/share/groonga-normalizer-mysql" \
             "$D/usr/lib/pkgconfig" \
             "$D/usr/lib64/pkgconfig"

      # Drop the client SDK — this is a server image, not a libmariadb consumer.
      # libmariadb is statically linked into the mariadb CLI by default, so
      # removing the .so does not break the bundled binaries.
      find "$D/usr/lib" "$D/usr/lib64" -maxdepth 1 \
        \( -name 'libmariadb*' -o -name 'libmysqlclient*' -o -name '*.a' \) \
        -delete 2>/dev/null || true

      # Older /usr/share/mysql/ path (some tooling still looks here even with
      # share/mariadb-…/ present). Mirror so init scripts that pass
      # --basedir=/usr keep working.
      if [ -d "$D/usr/share/mariadb" ]; then
        mkdir -p "$D/usr/share/mysql"
        cp -rn "$D/usr/share/mariadb/." "$D/usr/share/mysql/" 2>/dev/null || true
      fi

      # Compat symlinks: legacy tooling calls mysqld/mysql (and so does our
      # docker-entrypoint).
      ln -sf mariadbd "$D/usr/bin/mysqld"
      ln -sf mariadb  "$D/usr/bin/mysql"

      # Strip ELF binaries and shared libraries in the destdir.
      find "$D" -type f \( -perm -u+x -o -name '*.so*' \) -print0 |
        while IFS= read -r -d '' f; do
          case "$(file -L "$f" 2>/dev/null)" in
            *ELF*) strip --strip-unneeded "$f" 2>/dev/null || true ;;
          esac
        done

      # Entrypoint script — auto-initialize on first run.
      cat > "$D/usr/bin/docker-entrypoint.sh" << 'ENTRY'
      #!/bin/sh
      set -e

      if [ ! -f /var/lib/mysql/ibdata1 ]; then
        echo "Initializing MariaDB data directory..."
        mariadb-install-db --user=mysql --basedir=/usr --datadir=/var/lib/mysql --force
      fi

      exec mariadbd --user=mysql "$@"
      ENTRY
      chmod +x "$D/usr/bin/docker-entrypoint.sh"

  # Verify the build
  - runs: |
      echo "Verifying MariaDB build..."
      "${{targets.destdir}}/usr/bin/mariadbd" --version
      "${{targets.destdir}}/usr/bin/mariadb" --version
      test -x "${{targets.destdir}}/usr/bin/mariadb-install-db" || \
        echo "WARNING: mariadb-install-db missing — entrypoint will fail at runtime"
      echo "Checking binary sizes..."
      ls -lh "${{targets.destdir}}/usr/bin/mariadbd"
      ls -lh "${{targets.destdir}}/usr/bin/mariadb"

update:
  enabled: true
  github:
    identifier: MariaDB/server
    use-tag: true
    tag-filter: "mariadb-11.4."
