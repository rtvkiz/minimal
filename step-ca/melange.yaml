# Melange build configuration for minimal step-ca
# Pure Go from source. Single static `step-ca` binary — an online private
# certificate authority / ACME server (smallstep).
# License: Apache-2.0.

package:
  name: step-ca-minimal
  version: 0.30.2
  epoch: 0
  description: "Minimal step-ca online certificate authority built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of step-ca (smallstep/certificates) source tarball - updated by update-versions.yml
  sha256: 327391f301b79818f2418302516b4f6b41bdf08e38edc9011cc7f1b351e19452

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify step-ca source (repo: smallstep/certificates)
  - runs: |
      mkdir -p /home/build/step-ca-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/smallstep/certificates/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/step-ca.tar.gz

      echo "${{vars.sha256}}  /home/build/step-ca.tar.gz" | sha256sum -c -

      tar xzf /home/build/step-ca.tar.gz -C /home/build/step-ca-${{package.version}} --strip-components=1
      rm /home/build/step-ca.tar.gz

  # CGO_ENABLED=0 → static binary; the PKCS#11/HSM KMS (which needs cgo) is
  # excluded by build constraints. The default (file/soft) KMS is unaffected.
  # Version is reported via main.Version (see upstream Makefile).
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/step-ca-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/jackc/pgx/v5@v5.9.2 github.com/go-jose/go-jose/v3@v3.0.5 github.com/go-jose/go-jose/v4@v4.1.4 go.opentelemetry.io/otel@v1.44.0 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/step-ca-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X main.Version=v${{package.version}}" \
        -o /home/build/step-ca-bin \
        ./cmd/step-ca

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/step-ca-bin "${{targets.destdir}}/usr/bin/step-ca"
      chmod 0755 "${{targets.destdir}}/usr/bin/step-ca"

  # Verify the build
  - runs: |
      echo "Verifying step-ca binary..."
      "${{targets.destdir}}/usr/bin/step-ca" version

update:
  enabled: true
  github:
    identifier: smallstep/certificates
    use-tag: true
    tag-filter: "v0."
