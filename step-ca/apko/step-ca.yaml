# Minimal step-ca image - built from source via melange
# Shell-less, distroless. CVE patching via daily rebuilds from upstream source.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - step-ca
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# Provide config + secrets via a mounted $STEPPATH (e.g. -v ./step:/home/step)
# containing ca.json + keys. Entrypoint takes the config path as an argument.
entrypoint:
  command: /usr/bin/step-ca

environment:
  PATH: /usr/bin:/bin
  STEPPATH: /home/step

paths:
  - path: /home/step
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

annotations:
  org.opencontainers.image.title: "minimal-step-ca"
  org.opencontainers.image.description: "Hardened shell-less step-ca online certificate authority built from source via melange with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/step-ca"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
