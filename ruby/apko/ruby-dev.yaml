# Development variant of minimal-ruby.
# Same Ruby 4.0.x runtime as the prod image, plus a shell, package manager,
# build toolchain, and common native-gem dependencies. Intended for CI build
# stages and in-pod debugging. NOT intended for production deployment.
#
# CVE posture is intentionally larger than prod and is not tracked on the
# public dashboard. See /.github/SECURITY.md for the dev-variant policy.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Our Ruby runtime (built from source via melange — same as prod)
    - ruby
    # Bundler subpackage (dev-only; prod strips bundler)
    - ruby-bundler

    # Core runtime dependencies (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libstdc++

    # Ruby runtime libs (same as prod)
    - libssl3
    - libcrypto3
    - libcrypt1
    - zlib
    - yaml
    - libffi
    - readline
    - ca-certificates-bundle

    # --- Dev-only additions below ---

    # Shells
    - busybox
    - bash

    # Package manager
    - apk-tools

    # C/C++ toolchain (for native gem compilation)
    - build-base
    - gcc
    - binutils
    - make
    - pkgconf
    - posix-cc-wrappers
    - linux-headers
    - openssf-compiler-options

    # Dev headers
    - glibc-dev
    - libstdc++-dev
    - libxcrypt-dev

    # VCS for `bundle install --git` and gem source fetches
    - git

    # Auth + network libs needed by popular native gems
    - krb5-libs
    - libldap
    - libcurl-openssl4
    - libexpat1

    # DB client libs for native gems (sqlite3, pg, mysql2 builds)
    - sqlite-libs

    # Ruby stdlib helpers reactivated for interactive use
    - gdbm
    - ncurses
    - ncurses-terminfo-base

    # General-purpose fetch tool
    - wget

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/ruby

cmd: --version

work-dir: /work

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
  # Writable gem dir for `gem install --user-install`
  - path: /home/nonroot/.gem
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
    recursive: true

annotations:
  org.opencontainers.image.title: "minimal-ruby-dev"
  org.opencontainers.image.description: "Dev variant of minimal-ruby: same Ruby runtime + shell + build toolchain. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/ruby"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
