# Melange build configuration for minimal Ruby
# Builds Ruby from source (ruby-lang.org)
# You control version and security patches; no dependency on Wolfi's ruby package

package:
  name: ruby-minimal
  version: 4.0.5
  epoch: 0
  description: "Minimal Ruby runtime built from source"
  copyright:
    - license: Ruby AND MIT
  options:
    no-depends: true

vars:
  ruby_version: 4.0.5
  # SHA256 from https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.4.tar.gz
  sha256: 7d6149079a63f8ae1d326c9fa65c6019ba2dc3155eae7b39159817911c88958e

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - linux-headers
      - openssl-dev
      - zlib-dev
      - yaml-dev
      - libffi-dev
      - readline-dev
      - gdbm-dev

pipeline:
  # Download and verify Ruby source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://cache.ruby-lang.org/pub/ruby/4.0/ruby-${{vars.ruby_version}}.tar.gz" \
        -o /home/build/ruby.tar.gz
      echo "${{vars.sha256}}  /home/build/ruby.tar.gz" | sha256sum -c -
      cd /home/build
      tar xzf ruby.tar.gz
      rm ruby.tar.gz

  # Configure and build Ruby
  - runs: |
      cd /home/build/ruby-${{vars.ruby_version}}
      ./configure \
        --prefix=/usr \
        --disable-install-doc \
        --disable-install-rdoc \
        --with-openssl-dir=/usr \
        --with-readline-dir=/usr \
        --enable-shared \
        --disable-jit-support
      make -j$(nproc)

  # Install Ruby to system for validation
  - runs: |
      cd /home/build/ruby-${{vars.ruby_version}}
      make install

      ruby -v
      gem --version
      ruby -e "require 'bundler'; puts Bundler::VERSION"
      echo "✓ Ruby installed to system"

  # Install to destdir
  - runs: |
      cd /home/build/ruby-${{vars.ruby_version}}
      make install DESTDIR="${{targets.destdir}}"

      find "${{targets.destdir}}/usr" -type f -name "*.so" -exec strip --strip-unneeded {} \; 2>/dev/null || true
      strip --strip-unneeded "${{targets.destdir}}/usr/bin/ruby" 2>/dev/null || true
      strip --strip-unneeded "${{targets.destdir}}/usr/bin/gem" 2>/dev/null || true

  # Match Chainguard's curated default-gem set to drive CVE count to zero:
  #   - bump json from the version Ruby 4.0.4 vendors to a CVE-patched release
  #   - remove net-imap (5 CVEs, rarely needed in app images)
  #   - remove bundler (Chainguard removes it; users add via `gem install bundler`)
  #   - remove rexml (historical XML CVE risk, niche use)
  # Ruby keeps two copies of default gems — one in the gems registry and one
  # in stdlib (/usr/lib/ruby/4.0.0/<gem>.rb). require uses stdlib first, so
  # both copies must be removed for the bump or strip to take effect.
  # Documented in ruby/README.md.
  - runs: |
      DEST="${{targets.destdir}}"
      GEMDIR="${DEST}/usr/lib/ruby/gems/4.0.0"
      STDLIB="${DEST}/usr/lib/ruby/4.0.0"

      # Strip vulnerable / unused default + bundled gems from BOTH locations
      for gem in json net-imap bundler rexml; do
        rm -rf "${GEMDIR}/gems/${gem}-"*
        rm -f  "${GEMDIR}/specifications/default/${gem}-"*.gemspec
        rm -f  "${GEMDIR}/specifications/${gem}-"*.gemspec
        rm -rf "${STDLIB}/${gem}" "${STDLIB}/${gem}.rb"
      done
      # net/imap lives under net/ namespace in stdlib
      rm -rf "${STDLIB}/net/imap" "${STDLIB}/net/imap.rb"
      # bundler binaries
      rm -f "${DEST}/usr/bin/bundle" "${DEST}/usr/bin/bundler"

      # Install patched json (matches Chainguard's 2.19.x line) into the gem
      # registry. With the stdlib copy gone, `require 'json'` will activate it.
      gem install --no-document --no-user-install \
        --install-dir "${GEMDIR}" \
        json --version 2.19.5

      # Sanity: confirm the destdir files were actually placed/removed.
      # We don't `require` here because the destdir ruby binary has compiled-in
      # paths pointing at the system Ruby install (not the destdir), so a
      # require would test the wrong filesystem. The apko smoke test in
      # ruby/test.sh validates the published image end-to-end.
      [ -d "${GEMDIR}/gems/json-2.19.5" ] || { echo "::error::json 2.19.5 not installed"; exit 1; }
      [ ! -e "${STDLIB}/bundler.rb" ] || { echo "::error::bundler.rb still in stdlib"; exit 1; }
      [ ! -e "${STDLIB}/net/imap.rb" ] || { echo "::error::net/imap.rb still in stdlib"; exit 1; }
      [ ! -e "${STDLIB}/rexml" ] || { echo "::error::rexml/ still in stdlib"; exit 1; }
      echo "Curated gem set: destdir layout verified"

      echo "Verifying Ruby build..."
      ls -lh "${{targets.destdir}}/usr/bin/ruby"
      ls -lh "${{targets.destdir}}/usr/bin/gem"

subpackages:
  # Bundler as a separate apk so prod ruby-minimal stays curated (bundler
  # stripped) while ruby-minimal-dev pulls bundler back in. Built against
  # the same source ruby so gem paths line up by construction.
  - name: ruby-minimal-bundler
    description: "Bundler dependency manager for ruby-minimal"
    dependencies:
      runtime:
        - ruby-minimal
    pipeline:
      - runs: |
          SUBPKG="${{targets.subpkgdir}}"
          GEMDIR="${SUBPKG}/usr/lib/ruby/gems/4.0.0"
          mkdir -p "${GEMDIR}" "${SUBPKG}/usr/bin"

          # Loose pin — picks up whatever bundler is current at build time.
          # 6h scheduled rebuild + smoke tests catch any regression.
          gem install --no-document --no-user-install \
            --install-dir "${GEMDIR}" \
            --bindir "${SUBPKG}/usr/bin" \
            bundler

          [ -x "${SUBPKG}/usr/bin/bundle" ]   || { echo "::error::bundle binstub missing"; exit 1; }
          [ -x "${SUBPKG}/usr/bin/bundler" ]  || { echo "::error::bundler binstub missing"; exit 1; }
          ls -d "${GEMDIR}/gems/bundler-"* >/dev/null || { echo "::error::bundler gem dir missing"; exit 1; }
          echo "✓ ruby-minimal-bundler built"

update:
  enabled: true
  github:
    identifier: ruby/ruby
    use-tag: true
    tag-filter: "v4_0_"
