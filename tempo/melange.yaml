# Melange build configuration for minimal Grafana Tempo
# Pure Go from source. Single-binary mode by default.
# License: AGPL-3.0 (Grafana Labs).

package:
  name: tempo-minimal
  version: 3.0.2
  epoch: 0
  description: "Minimal Grafana Tempo distributed tracing backend built from source"
  copyright:
    - license: AGPL-3.0-only

vars:
  # SHA256 of tempo source tarball - updated by update-versions.yml workflow
  sha256: 9da6e1c411694d1010bb7641ab55e365095bc85fd76d02e142ede0fa2162cf71

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify tempo source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/grafana/tempo/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/tempo.tar.gz

      echo "${{vars.sha256}}  /home/build/tempo.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf tempo.tar.gz
      rm tempo.tar.gz

  # Build tempo (static binary).
  # Tempo defines its own main.{Version,Branch,Revision} and copies them
  # into prometheus/common/version in init(). Setting prometheus/common/version
  # directly is overwritten — so we target main.* on cmd/tempo instead.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/tempo-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/klauspost/compress@v1.18.7 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel@v1.45.0 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/tempo-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X main.Version=${{package.version}} \
          -X main.Revision=source-build \
          -X main.Branch=tag-v${{package.version}}" \
        -o /home/build/tempo-bin \
        ./cmd/tempo

  # Install binary + minimal single-binary all-in-one config
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/tempo-bin "${{targets.destdir}}/usr/bin/tempo"
      chmod 0755 "${{targets.destdir}}/usr/bin/tempo"

      mkdir -p "${{targets.destdir}}/etc/tempo"
      cat > "${{targets.destdir}}/etc/tempo/tempo.yaml" << 'CFG'
      # Minimal single-binary Tempo config. All components in one process,
      # local filesystem storage. Override by mounting your own config and
      # passing -config.file=/path/to/your/tempo.yaml.
      # NB: Tempo v3 dropped the top-level `ingester:` and `compactor:`
      # sections; their tunables now live elsewhere (defaults are sane).
      stream_over_http_enabled: true
      server:
        http_listen_port: 3200
        log_level: info

      distributor:
        receivers:
          otlp:
            protocols:
              http:
                endpoint: "0.0.0.0:4318"
              grpc:
                endpoint: "0.0.0.0:4317"

      storage:
        trace:
          backend: local
          wal:
            path: /var/tempo/wal
          local:
            path: /var/tempo/blocks

      usage_report:
        reporting_enabled: false
      CFG

  # Verify
  - runs: |
      echo "Verifying tempo build..."
      "${{targets.destdir}}/usr/bin/tempo" -version
      echo "Binary size:"
      ls -lh "${{targets.destdir}}/usr/bin/tempo"

update:
  enabled: true
  github:
    identifier: grafana/tempo
    use-tag: true
    strip-prefix: "v"
    tag-filter: "v3."
