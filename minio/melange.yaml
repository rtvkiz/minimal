# Melange build configuration for minimal MinIO
# Builds MinIO from source (Go) with static binary
# CGO_ENABLED=0 produces fully static binary - zero runtime deps beyond glibc

package:
  name: minio-minimal
  # Date-based version derived from RELEASE tag (e.g. RELEASE.2025-10-15T17-29-55Z → 2025.10.15)
  version: 2025.10.15
  epoch: 0
  description: "Minimal MinIO S3-compatible object storage built from source"
  copyright:
    - license: AGPL-3.0-only

vars:
  # Full RELEASE tag — used for download URL and ldflags
  # Updated by update-minio.yml workflow
  minio_release: RELEASE.2025-10-15T17-29-55Z
  # SHA256 checksum of source tarball - updated by update-minio.yml workflow
  sha256: be6d0bd3696c3a13a35f02d3a0280b64319c67918b4501c5c3d87f96d000085c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify MinIO source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/minio/minio/archive/refs/tags/${{vars.minio_release}}.tar.gz" \
        -o /home/build/minio.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/minio.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf minio.tar.gz
      rm minio.tar.gz


  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/minio-${{vars.minio_release}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get filippo.io/edwards25519@v1.1.1 github.com/Azure/go-ntlmssp@v0.1.1 github.com/apache/thrift@v0.23.0 github.com/buger/jsonparser@v1.1.2 github.com/eclipse/paho.mqtt.golang@v1.5.1 github.com/go-jose/go-jose/v4@v4.1.4 github.com/prometheus/prometheus@v0.311.3 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel/sdk@v1.44.0 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  # Build MinIO from source (static binary)
  - runs: |
      cd /home/build/minio-${{vars.minio_release}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X github.com/minio/minio/cmd.Version=${{vars.minio_release}} \
          -X github.com/minio/minio/cmd.ReleaseTag=${{vars.minio_release}} \
          -X github.com/minio/minio/cmd.CommitID=source-build \
          -X github.com/minio/minio/cmd.ShortCommitID=source" \
        -o minio \
        .

  # Install to destdir
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/minio-${{vars.minio_release}}/minio "${{targets.destdir}}/usr/bin/"

  # Verify the build
  - runs: |
      echo "Verifying MinIO build..."
      "${{targets.destdir}}/usr/bin/minio" --version
      echo "Checking binary size..."
      ls -lh "${{targets.destdir}}/usr/bin/minio"

update:
  enabled: true
  github:
    identifier: minio/minio
    use-tag: true
    tag-filter: "RELEASE."
