# Development variant of minimal-minio.
# Same source-built minio server as prod, plus bash, apk-tools,
# curl + openssl + jq for S3 HTTP API debugging.
#
# Note: Chainguard's public reference is `minio-client-public` (the
# `mc` CLI image, not the server). Their server dev variant is
# Enterprise-only. Ours mirrors their *client* dev composition for
# the debugging utilities and adds them to the server image.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base + minio (same as prod)
    - wolfi-baselayout
    - minio
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- S3 HTTP API debugging ---
    - curl

    # --- TLS debugging ---
    - openssl

    # --- DNS debugging (S3 endpoint resolution) ---
    - bind-tools

    # --- JSON parsing ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: minio
      gid: 65532
  users:
    - username: minio
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/minio server --console-address :9001 /data

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-minio-dev"
  org.opencontainers.image.description: "Dev variant of minimal-minio: same server + shell + curl/openssl/dig/jq for S3 API debugging. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/minio"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
