# Melange build configuration for minimal Cosign
# Pure Go from source. Single static `cosign` binary (container signing/verify).
# License: Apache-2.0 (Sigstore authors).

package:
  name: cosign-minimal
  version: 3.1.3
  epoch: 0
  description: "Minimal Sigstore Cosign (container signing & verification) built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of cosign source tarball - updated by update-versions.yml workflow
  sha256: ab8fcb8e0b4c0b8d01aefa37790cdd5ad099366b2efb8636b7a0250915b93362

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify cosign source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/sigstore/cosign/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/cosign.tar.gz

      echo "${{vars.sha256}}  /home/build/cosign.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf cosign.tar.gz
      rm cosign.tar.gz

  # Version is reported via sigs.k8s.io/release-utils/version.gitVersion.
  # CGO_ENABLED=0 gives a static binary; the pivkey/pkcs11key build tags
  # (hardware token support) are intentionally omitted — they require CGO and
  # are not needed for the core sign/verify/attest workflows.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/cosign-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/klauspost/compress@v1.18.7 google.golang.org/grpc@v1.82.1 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/cosign-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X sigs.k8s.io/release-utils/version.gitVersion=v${{package.version}} \
          -X sigs.k8s.io/release-utils/version.gitTreeState=clean \
          -X sigs.k8s.io/release-utils/version.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -o /home/build/cosign-bin \
        ./cmd/cosign

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/cosign-bin "${{targets.destdir}}/usr/bin/cosign"
      chmod 0755 "${{targets.destdir}}/usr/bin/cosign"

  # Verify the build
  - runs: |
      echo "Verifying cosign binary..."
      "${{targets.destdir}}/usr/bin/cosign" version
