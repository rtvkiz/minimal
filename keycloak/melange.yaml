# Melange build configuration for minimal Keycloak
# Downloads pre-built Keycloak distribution — Java-based IAM server
# Uses Wolfi openjdk-21-jre at runtime

package:
  name: keycloak-minimal
  version: 26.7.0
  epoch: 0
  description: "Minimal Keycloak identity and access management server"
  copyright:
    - license: Apache-2.0

vars:
  sha256: f771df0aa1e4820f57d56f7d6d015beb6415487b43f8de7e5a6d48f8a7fe118a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/keycloak/keycloak/releases/download/${{package.version}}/keycloak-${{package.version}}.tar.gz" \
        -o /home/build/keycloak.tar.gz
      echo "${{vars.sha256}}  /home/build/keycloak.tar.gz" | sha256sum -c -
      cd /home/build && tar xzf keycloak.tar.gz && rm keycloak.tar.gz

  # Install
  - runs: |
      mkdir -p "${{targets.destdir}}/opt/keycloak"
      cp -r /home/build/keycloak-${{package.version}}/* "${{targets.destdir}}/opt/keycloak/"

      # Ensure scripts are executable
      chmod +x "${{targets.destdir}}/opt/keycloak/bin/kc.sh"
      rm -f "${{targets.destdir}}/opt/keycloak/lib/quarkus/transformed-bytecode.jar"
      # Keycloak start-dev writes generated artifacts under /opt/keycloak.
      chown -R 65532:65532 "${{targets.destdir}}/opt/keycloak"

  - runs: |
      echo "Verifying Keycloak installation..."
      ls -lh "${{targets.destdir}}/opt/keycloak/bin/kc.sh"
      ls "${{targets.destdir}}/opt/keycloak/lib/" | head -5

  # patch-bundled-jars: auto-generated — do not edit manually
  - runs: |
      # Bundled-jar CVE fixes, sha256-pinned. Regenerated from grype by
      # .github/scripts/patch-bundled-jars.sh — do not edit by hand.
      _swap() {  # $1=artifact $2=group-path $3=oldver $4=newver $5=sha256 $6=mode
        # rename: jar filename carries the version, match it exactly. keep-filename:
        # filename stays the upstream version while contents change, so match any
        # version of the artifact and overwrite in place.
        if [ "$6" = "keep-filename" ]; then
          found=$(find "${{targets.destdir}}/opt/keycloak" -name "*$1-*.jar")
        else
          found=$(find "${{targets.destdir}}/opt/keycloak" -name "*$1-$3.jar")
        fi
        [ -n "$found" ] || { echo "  $1 $3 not present (upstream may already ship >=$4)"; return 0; }
        curl -fsSL --retry 5 --retry-all-errors \
          "https://repo1.maven.org/maven2/$2/$1/$4/$1-$4.jar" -o /tmp/_bj.jar
        echo "$5  /tmp/_bj.jar" | sha256sum -c -
        for f in $found; do
          if [ "$6" = "keep-filename" ]; then cp /tmp/_bj.jar "$f";
          else cp /tmp/_bj.jar "$(dirname "$f")/$1-$4.jar"; rm -f "$f"; fi
          echo "  patched $1 $3 -> $4 ($6)"
        done
        rm -f /tmp/_bj.jar
      }
      _swap jackson-databind com/fasterxml/jackson/core 2.21.2 2.21.5 507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0 keep-filename
  # end-patch-bundled-jars
update:
  enabled: true
  github:
    identifier: keycloak/keycloak
    use-tag: true
    tag-filter: "26."
