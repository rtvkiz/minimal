# Melange build configuration for minimal Keycloak
# Downloads pre-built Keycloak distribution — Java-based IAM server
# Uses Wolfi openjdk-21-jre at runtime

package:
  name: keycloak-minimal
  version: 26.6.4
  epoch: 0
  description: "Minimal Keycloak identity and access management server"
  copyright:
    - license: Apache-2.0

vars:
  sha256: 386b566bbea05527226e275c43e5cf6f218896ad2441ac4be5c39f1226772e8f

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/keycloak/keycloak/releases/download/${{package.version}}/keycloak-${{package.version}}.tar.gz" \
        -o /home/build/keycloak.tar.gz
      echo "${{vars.sha256}}  /home/build/keycloak.tar.gz" | sha256sum -c -
      cd /home/build && tar xzf keycloak.tar.gz && rm keycloak.tar.gz

  # Install
  - runs: |
      mkdir -p "${{targets.destdir}}/opt/keycloak"
      cp -r /home/build/keycloak-${{package.version}}/* "${{targets.destdir}}/opt/keycloak/"

      # CVE fix: the bundled jackson-databind 2.21.2 (Quarkus lib) is flagged by
      # 14 advisories fixed in 2.21.4. Quarkus references jars by exact filename
      # (quarkus-application.dat / quarkus-run.jar Class-Path), so we overwrite
      # the jar CONTENTS in place and KEEP the 2.21.2 filename — the classpath
      # stays valid and grype reads the real version (2.21.4) from the jar's
      # internal pom.properties. jackson 2.x patch releases are binary-compatible
      # (bundled jackson-core 2.21.2 stays within the supported 2.21.x range).
      # Pinned by sha256; tolerant if a future upstream bump already ships >=2.21.4.
      JDB_VER=2.21.4
      JDB_SHA=3888e9e69ab66fbacaacc9aea0e9ffbf15368288e4aca468b024dba11c09fbf9
      jar=$(find "${{targets.destdir}}/opt/keycloak" -name '*jackson-databind-2.21.2.jar')
      if [ -n "$jar" ]; then
        curl -fsSL --retry 5 --retry-all-errors \
          "https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/${JDB_VER}/jackson-databind-${JDB_VER}.jar" \
          -o /home/build/jdb.jar
        echo "${JDB_SHA}  /home/build/jdb.jar" | sha256sum -c -
        for j in $jar; do
          cp /home/build/jdb.jar "$j"
          echo "${JDB_SHA}  $j" | sha256sum -c -
          echo "Patched $j -> jackson-databind ${JDB_VER} (filename kept for Quarkus classpath)"
        done
        rm -f /home/build/jdb.jar
      else
        echo "No jackson-databind-2.21.2.jar found (upstream may already ship >=${JDB_VER})"
      fi

      # Ensure scripts are executable
      chmod +x "${{targets.destdir}}/opt/keycloak/bin/kc.sh"
      rm -f "${{targets.destdir}}/opt/keycloak/lib/quarkus/transformed-bytecode.jar"
      # Keycloak start-dev writes generated artifacts under /opt/keycloak.
      chown -R 65532:65532 "${{targets.destdir}}/opt/keycloak"

  - runs: |
      echo "Verifying Keycloak installation..."
      ls -lh "${{targets.destdir}}/opt/keycloak/bin/kc.sh"
      ls "${{targets.destdir}}/opt/keycloak/lib/" | head -5

update:
  enabled: true
  github:
    identifier: keycloak/keycloak
    use-tag: true
    tag-filter: "26."
