# Melange build configuration for minimal kube-state-metrics
# Pure Go from source. Single static `kube-state-metrics` binary — exposes
# Kubernetes object state (Deployments, Pods, Nodes, ...) as Prometheus metrics.
# License: Apache-2.0.

package:
  # Named `kube-state-metrics` (not `kube-state-metrics-minimal`) so
  # vulnerability scanners can identify it. Syft derives a package's CPE from
  # its apk name, and every CPE it generated kept -minimal in the product field
  # (cpe:2.3:a:kube-state-metrics:kube-state-metrics-minimal:*,
  # cpe:2.3:a:kube-state-metrics-minimal:kube-state-metrics-minimal:*, ...).
  # NVD indexes this product bare, as
  # cpe:2.3:a:kube-state-metrics:kube-state-metrics:*, so none of them matched,
  # and the Wolfi secdb missed it too.
  name: kube-state-metrics
  version: 2.19.1
  epoch: 0
  description: "Minimal kube-state-metrics Kubernetes object-state exporter built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `kube-state-metrics`, so without this apk could install Wolfi's
    # build instead of this source-built one. provider-priority is evaluated
    # BEFORE version in that comparator, so this pins resolution to our package
    # permanently.
    provider-priority: 100

vars:
  # SHA256 of kube-state-metrics source tarball - updated by update-versions.yml
  sha256: d62da96bd2c0497aa866f396762f1c11f3f6a066bb4e86c8168d96ddcddb9025

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify kube-state-metrics source
  - runs: |
      mkdir -p /home/build/kube-state-metrics-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/kubernetes/kube-state-metrics/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/kube-state-metrics.tar.gz

      echo "${{vars.sha256}}  /home/build/kube-state-metrics.tar.gz" | sha256sum -c -

      tar xzf /home/build/kube-state-metrics.tar.gz -C /home/build/kube-state-metrics-${{package.version}} --strip-components=1
      rm /home/build/kube-state-metrics.tar.gz

  # Version is reported through the shared prometheus/common version package
  # (upstream Makefile sets PKG = github.com/prometheus/common), NOT this
  # project's own module path. `--version` prints an empty version if this is
  # pointed at k8s.io/kube-state-metrics/v2 instead.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/kube-state-metrics-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/google/cel-go@v0.29.0 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel@v1.45.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/kube-state-metrics-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/prometheus/common/version.Version=${{package.version}}" \
        -o /home/build/kube-state-metrics-bin \
        .

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/kube-state-metrics-bin "${{targets.destdir}}/usr/bin/kube-state-metrics"
      chmod 0755 "${{targets.destdir}}/usr/bin/kube-state-metrics"

  # Verify the build. Note: kube-state-metrics exposes a `version` SUBCOMMAND,
  # not a --version flag (that errors with "unknown flag: --version").
  - runs: |
      echo "Verifying kube-state-metrics binary..."
      "${{targets.destdir}}/usr/bin/kube-state-metrics" version

update:
  enabled: true
  github:
    identifier: kubernetes/kube-state-metrics
    use-tag: true
    tag-filter: "v2."
