# Development variant of minimal-kube-state-metrics.
# Same binary from prod, plus a shell and the HTTP/JSON tools needed to inspect
# the metrics and telemetry endpoints from inside the pod.
#
# In-house composition (no public Chainguard kube-state-metrics-dev reference).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # kube-state-metrics (same as prod)
    - kube-state-metrics

    # Certificates (same as prod)
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/TLS/JSON debugging (scrape + API-server access) ---
    - curl
    - jq
    - openssl

    # --- DNS troubleshooting ---
    - bind-tools

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/kube-state-metrics

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  LANG: C.UTF-8

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-kube-state-metrics-dev"
  org.opencontainers.image.description: "Dev variant of minimal-kube-state-metrics: same binary + shell, curl/jq/openssl and dig. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/kube-state-metrics"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
