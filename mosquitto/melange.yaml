# Melange build configuration for minimal Eclipse Mosquitto
# Pure C from source, make-based build.
# License: EPL-2.0 OR EDL-1.0 (dual-licensed by Eclipse Foundation).

package:
  # Named `mosquitto` (not `mosquitto-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:mosquitto:mosquitto-minimal:*,
  # cpe:2.3:a:mosquitto-minimal:mosquitto-minimal:*, ...). NVD indexes this
  # product bare, as cpe:2.3:a:mosquitto:mosquitto:*, so none of them matched,
  # and the Wolfi secdb missed it too.
  name: mosquitto
  version: 2.1.2
  epoch: 0
  description: "Minimal Eclipse Mosquitto MQTT broker built from source"
  copyright:
    - license: EPL-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `mosquitto`, so without this apk could install Wolfi's build instead
    # of this source-built one. provider-priority is evaluated BEFORE version
    # in that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of mosquitto source tarball - updated by update-versions.yml workflow
  sha256: fd905380691ac65ea5a93779e8214941829e3d6e038d5edff9eac5fd74cbed02

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - openssl-dev
      - cjson-dev

pipeline:
  # Download and verify mosquitto source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors \
        "https://mosquitto.org/files/source/mosquitto-${{package.version}}.tar.gz" \
        -o /home/build/mosquitto.tar.gz

      echo "${{vars.sha256}}  /home/build/mosquitto.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf mosquitto.tar.gz
      rm mosquitto.tar.gz

  # Build: TLS yes, docs no, no bundled deps, no websockets/SRV (avoids
  # extra runtime deps we don't want), CJSON yes for mosquitto_ctrl.
  # mosquitto 2.1 added several optional features we don't ship in a minimal
  # broker and which pull extra dev deps: WITH_EDITLINE (mosquitto_ctrl shell →
  # editline), WITH_HTTP_API (→ libmicrohttpd), WITH_SQLITE (persist-sqlite
  # plugin → sqlite3). All disabled below. WITH_SQLITE=no skips *building* the
  # plugin, but plugins/Makefile lists persist-sqlite in DIRS unconditionally so
  # `make install` still tries to install its .so — drop it from DIRS so it is
  # neither built nor installed (no sqlite dependency added).
  - runs: |
      cd /home/build/mosquitto-${{package.version}}
      sed -i '/persist-sqlite/d' plugins/Makefile
      make -j"$(nproc)" \
        WITH_TLS=yes \
        WITH_TLS_PSK=yes \
        WITH_THREADING=yes \
        WITH_DOCS=no \
        WITH_BUNDLED_DEPS=yes \
        WITH_CJSON=yes \
        WITH_SRV=no \
        WITH_WEBSOCKETS=no \
        WITH_EDITLINE=no \
        WITH_HTTP_API=no \
        WITH_SQLITE=no \
        WITH_SHARED_LIBRARIES=yes \
        WITH_STATIC_LIBRARIES=no \
        prefix=/usr

  # Install into destdir
  - runs: |
      cd /home/build/mosquitto-${{package.version}}
      make install \
        WITH_TLS=yes \
        WITH_DOCS=no \
        WITH_BUNDLED_DEPS=yes \
        WITH_CJSON=yes \
        WITH_SRV=no \
        WITH_WEBSOCKETS=no \
        WITH_EDITLINE=no \
        WITH_HTTP_API=no \
        WITH_SQLITE=no \
        WITH_SHARED_LIBRARIES=yes \
        WITH_STATIC_LIBRARIES=no \
        prefix=/usr \
        DESTDIR="${{targets.destdir}}"

      # Wolfi enforces usrmerge — /usr/sbin doesn't exist on these images.
      # Upstream installs the broker at sbin/mosquitto; relocate to /usr/bin.
      if [ -f "${{targets.destdir}}/usr/sbin/mosquitto" ]; then
        mv "${{targets.destdir}}/usr/sbin/mosquitto" "${{targets.destdir}}/usr/bin/mosquitto"
        rmdir "${{targets.destdir}}/usr/sbin" 2>/dev/null || true
      fi

      # Replace upstream's commented-out default config with a minimal
      # broker that listens on all interfaces and allows anonymous
      # connections — sane default for the smoke test and for a fresh
      # container. Users override by mounting their own /etc/mosquitto.conf.
      mkdir -p "${{targets.destdir}}/etc/mosquitto"
      cat > "${{targets.destdir}}/etc/mosquitto/mosquitto.conf" << 'CFG'
      # Minimal mosquitto config — broker only, anonymous, no persistence.
      listener 1883 0.0.0.0
      allow_anonymous true
      persistence false
      log_dest stdout
      log_type all
      CFG

  # Verify
  - runs: |
      echo "Verifying mosquitto build..."
      "${{targets.destdir}}/usr/bin/mosquitto" --help | head -3
      echo "Binary size:"
      ls -lh "${{targets.destdir}}/usr/bin/mosquitto"
      echo "Tools:"
      ls "${{targets.destdir}}/usr/bin/mosquitto"* 2>/dev/null

update:
  enabled: true
  release-monitor:
    identifier: 7710
