# Development variant of minimal-alertmanager.
# Same source-built alertmanager + amtool, plus shell + curl/openssl/dig
# + jq for HTTP API debugging.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - alertmanager-minimal
    - ca-certificates-bundle
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - jq
    - git

accounts:
  groups:
    - groupname: alertmanager
      gid: 65532
  users:
    - username: alertmanager
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/alertmanager

cmd: >-
  --config.file=/etc/alertmanager/alertmanager.yml
  --storage.path=/alertmanager

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8

paths:
  - path: /etc/alertmanager
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /alertmanager
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-alertmanager-dev"
  org.opencontainers.image.description: "Dev variant of minimal-alertmanager: same alertmanager + amtool + shell + curl/openssl/dig/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/alertmanager"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
