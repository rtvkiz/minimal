# Minimal Alertmanager image - built from source via melange
# Web UI is embedded in the binary; no extra assets needed.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - alertmanager
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: alertmanager
      gid: 65532
  users:
    - username: alertmanager
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/alertmanager

cmd: >-
  --config.file=/etc/alertmanager/alertmanager.yml
  --storage.path=/alertmanager

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/alertmanager
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /alertmanager
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-alertmanager"
  org.opencontainers.image.description: "Hardened Alertmanager built from source via melange with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/alertmanager"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
