# Minimal Apache ZooKeeper image - official binary release + custom jlink JRE.
# CVE patching via daily rebuilds.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    # Shell required for the entrypoint
    - busybox
    - zookeeper
    # Core libraries for native JRE components
    - glibc
    - glibc-locale-posix
    - ld-linux
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: zookeeper
      gid: 65532
  users:
    - username: zookeeper
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/zookeeper-entrypoint.sh

environment:
  PATH: /usr/bin:/bin
  ZOO_CONFIG: /opt/zookeeper/conf/zoo.cfg
  ZOO_HEAP_OPTS: -Xmx1G -Xms256M

paths:
  - path: /var/zookeeper/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/zookeeper
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-zookeeper"
  org.opencontainers.image.description: "Hardened Apache ZooKeeper image with custom jlink JRE, daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/zookeeper"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
