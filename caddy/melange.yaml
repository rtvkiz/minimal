# Melange build configuration for minimal Caddy
# Builds Caddy from source (Go) with static binary
# First Go-based melange build in the project

package:
  name: caddy-minimal
  version: 2.11.4
  epoch: 0
  description: "Minimal Caddy web server built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 checksum of source tarball - updated by update-caddy.yml workflow
  sha256: 2c3d02078286a6282cdb4d1d8744077788d556659dac0b64d8ed5886a7e5aeb9

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify Caddy source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/caddyserver/caddy/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/caddy.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/caddy.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf caddy.tar.gz
      rm caddy.tar.gz

  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/caddy-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/go-chi/chi/v5@v5.3.0 github.com/google/cel-go@v0.29.0 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel@v1.44.0 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  # Build Caddy from source (static binary)
  - runs: |
      cd /home/build/caddy-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -X github.com/caddyserver/caddy/v2.CustomVersion=v${{package.version}}" \
        -o caddy \
        ./cmd/caddy

  # Install to destdir (no strip needed - Go ldflags already removes debug info)
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/caddy-${{package.version}}/caddy "${{targets.destdir}}/usr/bin/"

  # Verify the build
  - runs: |
      echo "Verifying Caddy build..."
      "${{targets.destdir}}/usr/bin/caddy" version
      echo "Checking binary size..."
      ls -lh "${{targets.destdir}}/usr/bin/caddy"

update:
  enabled: true
  github:
    identifier: caddyserver/caddy
    use-tag: true
    tag-filter: "v2."
