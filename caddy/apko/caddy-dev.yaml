# Development variant of minimal-caddy.
# Same source-built caddy as prod (static CGO_ENABLED=0 binary), plus
# shell, apk-tools, curl/openssl/dig for HTTP/TLS/DNS debugging.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base + caddy (same as prod)
    - wolfi-baselayout
    - caddy-minimal
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/TLS/DNS debugging ---
    - curl
    - openssl
    - bind-tools

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: caddy
      gid: 65532
  users:
    - username: caddy
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8
  XDG_CONFIG_HOME: /var/lib/caddy
  XDG_DATA_HOME: /var/lib/caddy

paths:
  - path: /etc/caddy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/caddy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
    recursive: true
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-caddy-dev"
  org.opencontainers.image.description: "Dev variant of minimal-caddy: same caddy + shell + curl/openssl/dig. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/caddy"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
