# Minimal Apache Tomcat image - official binary + custom jlink JRE.
# Hardened: default manager/docs/examples webapps removed (ROOT only).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - tomcat
    - glibc
    - glibc-locale-posix
    - ld-linux
    - ca-certificates-bundle
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - jq
    - git

accounts:
  groups:
    - groupname: tomcat
      gid: 65532
  users:
    - username: tomcat
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/tomcat-entrypoint.sh

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  CATALINA_HOME: /opt/tomcat
  CATALINA_BASE: /opt/tomcat
  CATALINA_OPTS: -Xmx512M -Xms128M

paths:
  - path: /opt/tomcat/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/tomcat/temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/tomcat/work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-tomcat-dev"
  org.opencontainers.image.description: "Dev variant of minimal-tomcat: same server + shell + curl/openssl/jq/git. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/tomcat"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
