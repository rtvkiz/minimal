# Melange build configuration for minimal metrics-server
# Pure Go from source. Single static `metrics-server` binary — the Kubernetes
# resource-metrics API server behind `kubectl top` and the HPA.
# License: Apache-2.0.

package:
  name: metrics-server-minimal
  version: 0.9.0
  epoch: 0
  description: "Minimal Kubernetes metrics-server built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of metrics-server source tarball - updated by update-versions.yml
  sha256: a7dec9bb2f58a32ec2ce4e25a838aca18978546f28d58c4bc5c3f62c8c3dfcfa

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify metrics-server source
  - runs: |
      mkdir -p /home/build/metrics-server-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/kubernetes-sigs/metrics-server/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/metrics-server.tar.gz

      echo "${{vars.sha256}}  /home/build/metrics-server.tar.gz" | sha256sum -c -

      tar xzf /home/build/metrics-server.tar.gz -C /home/build/metrics-server-${{package.version}} --strip-components=1
      rm /home/build/metrics-server.tar.gz

  # Version is reported through client-go's version package, not a local one:
  # upstream's Makefile sets PKG:=k8s.io/client-go/pkg and injects
  # $(PKG)/version.gitVersion. `kubectl top`/the apiserver surface this as the
  # server version, and it must carry the leading "v" to parse as a semver.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/metrics-server-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/google/cel-go@v0.29.0 google.golang.org/grpc@v1.82.1 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/metrics-server-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -mod=readonly \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X k8s.io/client-go/pkg/version.gitVersion=v${{package.version}}" \
        -o /home/build/metrics-server-bin \
        sigs.k8s.io/metrics-server/cmd/metrics-server

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/metrics-server-bin "${{targets.destdir}}/usr/bin/metrics-server"
      chmod 0755 "${{targets.destdir}}/usr/bin/metrics-server"

  # Verify the build
  - runs: |
      echo "Verifying metrics-server binary..."
      "${{targets.destdir}}/usr/bin/metrics-server" --version

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/metrics-server
    use-tag: true
    tag-filter: "v0."
