# Minimal metrics-server image - built from source via melange
# CVE patching via the 6-hourly rebuild from upstream source

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Our metrics-server (built from source via melange)
    - metrics-server-minimal

    # Certificates — metrics-server talks to the kubelet over TLS and serves
    # the aggregated API over TLS.
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# metrics-server is a Kubernetes aggregated API server: it scrapes resource
# metrics from every kubelet and serves metrics.k8s.io for `kubectl top` and the
# HorizontalPodAutoscaler. It runs in-cluster and reads its API credentials from
# the mounted service-account token, so no flags are baked in here — supply the
# usual --kubelet-preferred-address-types / --kubelet-insecure-tls (dev) at
# deploy time.
#
# Serves :10250 by default (--secure-port). That is above 1024, so nonroot can
# bind it without any capability.
entrypoint:
  command: /usr/bin/metrics-server

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-metrics-server"
  org.opencontainers.image.description: "Hardened shell-less Kubernetes metrics-server built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/metrics-server"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
