# Development variant of minimal-nats.
# Same nats-server (CGO_ENABLED=0 static, source-built via melange) as
# prod, plus shell, apk-tools, curl/socat/jq for HTTP monitoring
# endpoint debugging.
#
# nats CLI (`nats` binary) is a separate upstream tool — not yet baked.
# Users typically reach NATS via its HTTP monitoring endpoint or by
# `apk add nats` (when Wolfi ships it) at runtime.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem + NATS (same as prod)
    - wolfi-baselayout
    - nats
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP monitoring endpoint debugging ---
    - curl
    - socat

    # --- JSON parsing for monitoring endpoint output ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: nats
      gid: 65532
  users:
    - username: nats
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/nats-server

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  LANG: C.UTF-8

paths:
  - path: /etc/nats
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /data/nats
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
    recursive: true
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-nats-dev"
  org.opencontainers.image.description: "Dev variant of minimal-nats: same nats-server + shell + curl/socat/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/nats"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
