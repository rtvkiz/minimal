# Melange build configuration for minimal Velero
# Pure Go from source. Single static `velero` binary — Kubernetes cluster
# backup/restore and migration (runs as both CLI and in-cluster server).
# License: Apache-2.0.

package:
  name: velero-minimal
  version: 1.18.2
  epoch: 0
  description: "Minimal Velero Kubernetes backup and restore tool built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of velero source tarball - updated by update-versions.yml
  sha256: 68d8c95817d882b2832c4c08689eb5f7b14dd581f71292a6c794acd15633b6d9

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify Velero source
  - runs: |
      mkdir -p /home/build/velero-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/velero-io/velero/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/velero.tar.gz

      echo "${{vars.sha256}}  /home/build/velero.tar.gz" | sha256sum -c -

      tar xzf /home/build/velero.tar.gz -C /home/build/velero-${{package.version}} --strip-components=1
      rm /home/build/velero.tar.gz

  # Version is reported via pkg/buildinfo.Version (see upstream hack/build.sh).
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/velero-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/klauspost/compress@v1.18.7 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel@v1.45.0 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/velero-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/vmware-tanzu/velero/pkg/buildinfo.Version=v${{package.version}} \
          -X github.com/vmware-tanzu/velero/pkg/buildinfo.GitTreeState=clean" \
        -o /home/build/velero-bin \
        ./cmd/velero

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/velero-bin "${{targets.destdir}}/usr/bin/velero"
      chmod 0755 "${{targets.destdir}}/usr/bin/velero"

  # Verify the build
  - runs: |
      echo "Verifying velero binary..."
      "${{targets.destdir}}/usr/bin/velero" version --client-only

update:
  enabled: true
  github:
    identifier: velero-io/velero
    use-tag: true
    tag-filter: "v1."
