# Melange build configuration for minimal Prometheus
# Builds Prometheus from source (Go) — no builtinassets tag for minimal footprint.
# All core functionality (metrics scraping, PromQL, alerting, HTTP API) works fully.
# The browser UI at /graph is not available without the embedded assets,
# but the API at /api/v1/... is fully functional.

package:
  name: prometheus-minimal
  version: 3.13.1
  epoch: 0
  description: "Minimal Prometheus monitoring server built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 checksum of source tarball - updated by update-prometheus.yml workflow
  sha256: 84109edc0eaa0ade4f9d3b96fa826cd3112a0b2f17262c1f8338a58fb9fc7b52

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify Prometheus source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/prometheus/prometheus/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/prometheus.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/prometheus.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf prometheus.tar.gz
      rm prometheus.tar.gz


  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/prometheus-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/klauspost/compress@v1.18.7 google.golang.org/grpc@v1.82.1 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  # Build Prometheus from source (static binary, no embedded web UI)
  - runs: |
      cd /home/build/prometheus-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X github.com/prometheus/common/version.Version=${{package.version}} \
          -X github.com/prometheus/common/version.Branch=HEAD \
          -X github.com/prometheus/common/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          -X github.com/prometheus/common/version.BuildUser=melange" \
        -o prometheus \
        ./cmd/prometheus

      # Build promtool
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X github.com/prometheus/common/version.Version=${{package.version}}" \
        -o promtool \
        ./cmd/promtool

  # Install to destdir
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/prometheus-${{package.version}}/prometheus "${{targets.destdir}}/usr/bin/"
      cp /home/build/prometheus-${{package.version}}/promtool "${{targets.destdir}}/usr/bin/"

      # Default configuration file
      mkdir -p "${{targets.destdir}}/etc/prometheus"
      cat > "${{targets.destdir}}/etc/prometheus/prometheus.yml" << 'EOF'
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9090"]
      EOF

      # Data and rules directories are created by apko paths:
      # /prometheus (data), /etc/prometheus/rules (rules)

  # Verify the build
  - runs: |
      echo "Verifying Prometheus build..."
      "${{targets.destdir}}/usr/bin/prometheus" --version
      "${{targets.destdir}}/usr/bin/promtool" --version
      echo "Checking binary sizes..."
      ls -lh "${{targets.destdir}}/usr/bin/prometheus"
      ls -lh "${{targets.destdir}}/usr/bin/promtool"

update:
  enabled: true
  github:
    identifier: prometheus/prometheus
    use-tag: true
    tag-filter: "v3."
