# Development variant of minimal-kubeconform.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - kubeconform-minimal
    - ca-certificates-bundle
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - jq
    - git

accounts:
  groups: [{ groupname: nonroot, gid: 65532 }]
  users:  [{ username: nonroot, uid: 65532, gid: 65532 }]
  run-as: 65532

entrypoint:
  command: /usr/bin/kubeconform

work-dir: /workspace
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  HOME: /tmp

paths:
  - { path: /workspace, type: directory, uid: 65532, gid: 65532, permissions: 0o755 }
  - { path: /tmp, type: directory, uid: 65532, gid: 65532, permissions: 0o1777 }

annotations:
  org.opencontainers.image.title: "minimal-kubeconform-dev"
  org.opencontainers.image.description: "Dev variant of minimal-kubeconform: same kubeconform + shell + curl/openssl/jq/git. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/kubeconform"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs: [x86_64, aarch64]
