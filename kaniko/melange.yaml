# Melange build configuration for minimal Kaniko
# Pure Go from source. Single static `executor` binary — builds container
# images from a Dockerfile inside a container/Kubernetes, without a Docker daemon.
# License: Apache-2.0.

package:
  name: kaniko-minimal
  version: 1.24.0
  epoch: 0
  description: "Minimal Kaniko container image builder (executor) built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of kaniko source tarball - updated by update-versions.yml
  sha256: a61cb1e24fe9d818cb07521fb4f177fcebc4828b3d5571a8cfa590a6804f7669

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify Kaniko source
  - runs: |
      mkdir -p /home/build/kaniko-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/GoogleContainerTools/kaniko/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/kaniko.tar.gz

      echo "${{vars.sha256}}  /home/build/kaniko.tar.gz" | sha256sum -c -

      tar xzf /home/build/kaniko.tar.gz -C /home/build/kaniko-${{package.version}} --strip-components=1
      rm /home/build/kaniko.tar.gz

  # NOTE: excluded from patch-go-deps (SKIP_IMAGES) — kaniko vendors the
  # docker/moby stack, whose graph is too tangled to force-bump (a docker/docker
  # bump breaks vendored archive_deprecated.go). Builds pure upstream from
  # vendor/; transitive CVEs ride the version bump + base rebuild + VEX.
  # Version is reported via pkg/version.version (see upstream Makefile).
  # patch-go-deps: auto-generated — do not edit manually (test-and-keep)
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      for root in /home/build/kaniko-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-base.mod
          [ -f go.sum ] && cp go.sum .pgd-base.sum || true
          # Probe each candidate CVE fix against the real build; keep the ones
          # that still compile, drop those that need upstream to update its
          # vendored code first (logged, not silent). Patches everything safely
          # patchable now instead of skipping the image wholesale.
          KEPT=""
          for fix in  github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8 github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3 github.com/cloudflare/circl@v1.6.3 github.com/containerd/containerd/v2@v2.2.5 github.com/containerd/containerd@v1.7.33 github.com/docker/cli@v29.2.1+incompatible github.com/go-git/go-billy/v5@v5.9.0 github.com/go-git/go-git/v5@v5.19.2 github.com/go-jose/go-jose/v4@v4.1.4 github.com/klauspost/compress@v1.18.7 github.com/moby/buildkit@v0.28.1 github.com/nwaples/rardecode/v2@v2.2.0 github.com/opencontainers/selinux@v1.13.1 github.com/ulikunitz/xz@v0.5.15 google.golang.org/grpc@v1.82.1 oras.land/oras-go/v2@v2.6.1 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel@v1.45.0 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0; do
            cp .pgd-base.mod go.mod
            [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
            if go get $KEPT "$fix" >/dev/null 2>&1 && GOTOOLCHAIN=local CGO_ENABLED=0 go build -mod=mod -o /dev/null ./cmd/executor >/dev/null 2>&1; then
              KEPT="$KEPT $fix"; echo "pgd-testkeep KEPT: $fix"
            else
              echo "pgd-testkeep dropped (needs upstream): $fix"
            fi
          done
          cp .pgd-base.mod go.mod
          [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
          if [ -n "$KEPT" ]; then _retry go get $KEPT; fi
          go mod tidy -e
          rm -f .pgd-base.mod .pgd-base.sum
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/kaniko-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/GoogleContainerTools/kaniko/pkg/version.version=v${{package.version}}" \
        -o /home/build/executor \
        ./cmd/executor

  # Install into /kaniko (the path the ecosystem expects the executor at).
  - runs: |
      mkdir -p "${{targets.destdir}}/kaniko"
      cp /home/build/executor "${{targets.destdir}}/kaniko/executor"
      chmod 0755 "${{targets.destdir}}/kaniko/executor"
      # Also expose it on PATH for convenience.
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -sf ../../kaniko/executor "${{targets.destdir}}/usr/bin/executor"

  # Verify the build
  - runs: |
      echo "Verifying kaniko executor..."
      "${{targets.destdir}}/kaniko/executor" version

update:
  enabled: true
  github:
    identifier: GoogleContainerTools/kaniko
    use-tag: true
    tag-filter: "v1."
