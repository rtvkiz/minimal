# Melange build configuration for minimal HashiCorp Consul
# Pure Go from source. Upstream tarball ships the pre-built UI under
# agent/uiserver/dist/, which is go:embed'd at compile time — no yarn/ember
# step required to get the web UI.
#
# License: BUSL-1.1 (Business Source License) since Consul v1.16+ (Aug 2023).
# Allowed for production use except as a competing managed Consul service.

package:
  name: consul-minimal
  version: 2.0.3
  epoch: 0
  description: "Minimal HashiCorp Consul (service discovery + KV) built from source"
  copyright:
    - license: BUSL-1.1

vars:
  # SHA256 of consul source tarball - updated by update-versions.yml workflow
  sha256: d91f6f99338216f9fbbe3035f67debb990f5fa49f8c554281ee5c4c352e69019

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify consul source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/hashicorp/consul/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/consul.tar.gz

      echo "${{vars.sha256}}  /home/build/consul.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf consul.tar.gz
      rm consul.tar.gz

  # Build consul (static binary, embedded UI is already in source tree)
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/consul-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get google.golang.org/grpc@v1.82.1 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/consul-${{package.version}}
      BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X github.com/hashicorp/consul/version.GitCommit=source-build \
          -X github.com/hashicorp/consul/version.BuildDate=${BUILD_DATE}" \
        -o /home/build/consul-bin \
        .

  # Install
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/consul-bin "${{targets.destdir}}/usr/bin/consul"
      chmod 0755 "${{targets.destdir}}/usr/bin/consul"

  # Verify
  - runs: |
      echo "Verifying consul build..."
      "${{targets.destdir}}/usr/bin/consul" version
      echo "Binary size:"
      ls -lh "${{targets.destdir}}/usr/bin/consul"

update:
  enabled: true
  github:
    identifier: hashicorp/consul
    use-tag: true
    strip-prefix: "v"
    tag-filter: "v2."
