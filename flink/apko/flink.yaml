# Minimal Apache Flink image - official binary release + jlink JRE via melange
# Stream processing engine. Runs as jobmanager (default) or taskmanager.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    # Flink's launchers are bash scripts (#!/usr/bin/env bash) that compute the
    # classpath and exec java, so a shell is a hard requirement — the same
    # reason solr and kafka carry one. busybox+bash only: no apk-tools, no
    # package manager in prod.
    - busybox
    - bash
    - flink
    - glibc
    - glibc-locale-posix
    - ld-linux
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: flink
      gid: 65532
  users:
    - username: flink
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/flink-entrypoint.sh

work-dir: /opt/flink

environment:
  PATH: /usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-21-minimal
  FLINK_HOME: /opt/flink
  # /opt/flink is read-only for uid 65532; Flink writes logs at startup.
  FLINK_LOG_DIR: /tmp/flink-logs

paths:
  - path: /tmp/flink-logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-flink"
  org.opencontainers.image.description: "Hardened Apache Flink stream processing engine with a custom jlink JRE"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/flink"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
