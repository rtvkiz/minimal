# Melange build configuration for minimal kong
# Kong Gateway (OSS) built from source with upstream's Bazel build
# (//build:kong, --config release): OpenResty + LuaJIT + Kong's Lua tree,
# atc-router (Rust), simdjson-ffi, ada, snappy, the bundled luarocks, and the
# Kong Manager admin GUI. Installed under /usr/local exactly like upstream's
# packages and the previous Wolfi package. License: Apache-2.0.
#
# Two edits to upstream's build, both inherited from Wolfi's recipe:
#   - OpenSSL: upstream vendors and statically builds OpenSSL (3.2.x - an old
#     line). The patch below drops @openssl from the Bazel graph so OpenResty
#     and luarocks link Wolfi's maintained system OpenSSL instead, and OpenSSL
#     fixes land on the daily rebuild rather than with the next Kong release.
#   - Kong Manager: upstream fetches it through a github_release rule that
#     needs the gh CLI / a GITHUB_TOKEN. Replaced with a plain http_archive of
#     the same release asset - pinned to KONG_VAR["KONG_MANAGER"] from
#     .requirements (Wolfi pointed at the moving `nightly` asset instead).
#
# Source-built rather than apko-only: Wolfi's `kong` package stopped receiving
# builds in June 2026 (recipe removed from wolfi-dev/os), frozen at 3.9.2.

package:
  # Named exactly what upstream calls it, not `kong-minimal` — see
  # docs/onboarding.md "Package naming and scanner visibility".
  name: kong
  version: 3.9.4
  epoch: 0
  description: "Minimal Kong Gateway (OSS) built from source"
  copyright:
    - license: Apache-2.0
  options:
    # Kong ships its own `resty` (OpenResty), so do not generate a dependency
    # on some other package's cmd:resty.
    no-commands: true
  resources:
    cpu: "4"
    memory: 16Gi
  dependencies:
    runtime:
      # `resty` (the interpreter behind the `kong` CLI shebang) is a perl script.
      - perl
    # Wolfi still ships a frozen `kong` package; apko picks the highest version
    # across ALL repositories unless provider-priority pins ours.
    provider-priority: 100

vars:
  # SHA256 of the source tarball - updated by update-versions.yml workflow
  sha256: 099636a1dea318f59c0cc7b4921f313623701d7e9917ea334e1e0f8d5404494a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - bazel-7
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - expat-dev
      - git
      - jq
      - libelf
      - luajit-dev
      - openjdk-21
      - openjdk-21-default-jvm
      # <4: the nginx 1.25.3 inside OpenResty 1.25.3.2 does not build against
      # OpenSSL 4.0, which made ASN1_INTEGER and friends opaque
      # (ngx_event_openssl_stapling.c: incomplete typedef). openssl-4.0-dev
      # also provides `openssl-dev` at a higher version, so without the
      # bound apk resolves to it. Runtime then links libssl.so.3 (3.6 line).
      - openssl-dev<4
      - patch
      - pcre2-dev
      - perl
      - pkgconf
      - procps
      - protobuf-dev
      - valgrind-dev
      - yaml-dev
      - zlib-dev

pipeline:
  - runs: |
      mkdir -p /home/build/kong-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/Kong/kong/archive/refs/tags/${{package.version}}.tar.gz" \
        -o /home/build/kong.tar.gz
      echo "${{vars.sha256}}  /home/build/kong.tar.gz" | sha256sum -c -
      tar xzf /home/build/kong.tar.gz -C /home/build/kong-${{package.version}} --strip-components=1
      rm /home/build/kong.tar.gz

  # Build against Wolfi's system OpenSSL (Wolfi's openssl.patch, verbatim).
  - runs: |
      cd /home/build/kong-${{package.version}}
      patch -p1 <<'KONG_OPENSSL_PATCH'
      diff --git a/build/BUILD.bazel b/build/BUILD.bazel
      index b83f4f4..42aa986 100644
      --- a/build/BUILD.bazel
      +++ b/build/BUILD.bazel
      @@ -10,7 +10,6 @@ exports_files([
       # C libraries
       
       clib_deps = [
      -    "@openssl",
           "@libexpat",
           "@snappy",
           "@ada",
      @@ -21,7 +20,7 @@ clib_deps = [
               name = "install-%s" % get_workspace_name(k),
               src = k,
               # only install openssl headers
      -        exclude = [] if k in ("@openssl",) else ["include"],
      +        exclude = ["include"],
               prefix = "kong/lib" if k in ("@passwdqc", "@snappy", "@ada") else "kong",
               strip_path = "snappy" if k == "@snappy" else "ada" if k == "@ada" else "",
           )
      @@ -47,7 +46,6 @@ kong_rules_group(
       kong_rules_group(
           name = "cacheable-targets",
           propagates = [
      -        "@openssl",
               "@libexpat",
               "@atc_router",
               "@simdjson_ffi",
      @@ -73,7 +71,6 @@ kong_install(
           prefix = "openresty",
           deps = [
               ":install-openresty-luajit",
      -        ":install-openssl",
           ],
       )
       
      diff --git a/build/luarocks/BUILD.luarocks.bazel b/build/luarocks/BUILD.luarocks.bazel
      index b23ad96..d9dda79 100644
      --- a/build/luarocks/BUILD.luarocks.bazel
      +++ b/build/luarocks/BUILD.luarocks.bazel
      @@ -40,7 +40,6 @@ kong_template_genrule(
           name = "luarocks_exec",
           srcs = [
               "@libexpat",
      -        "@openssl",
           ] + select({
               "@kong//:any-cross": ["@cross_deps_libyaml//:libyaml"],
               "//conditions:default": [
      diff --git a/build/luarocks/templates/luarocks_exec.sh b/build/luarocks/templates/luarocks_exec.sh
      index 10515f8..f8cc445 100644
      --- a/build/luarocks/templates/luarocks_exec.sh
      +++ b/build/luarocks/templates/luarocks_exec.sh
      @@ -3,7 +3,6 @@
       # template variables starts
       libexpat_path="{{@@libexpat//:libexpat}}"
       libxml2_path="invalid"
      -openssl_path="{{@@openssl//:openssl}}"
       luarocks_host_path="{{@@luarocks//:luarocks_host}}"
       luajit_path="{{@@openresty//:luajit}}"
       kongrocks_path="invalid"
      @@ -27,7 +26,6 @@ ROCKS_CONFIG=$(readlink -f "$ROCKS_DIR/../luarocks_config.lua")
       
       EXPAT_DIR=$root_path/$libexpat_path
       LIBXML2_DIR=$root_path/$libxml2_path
      -OPENSSL_DIR=$root_path/$openssl_path
       
       # The Bazel rules doesn't export the `libexpat.so` file,
       # it only exports something like `libexpat.so.1.6.0`,
      @@ -121,8 +119,6 @@ fi
       # some distros has BINPRM_BUF_SIZE smaller than the shebang generated,
       # which is usually more than 160 bytes
       $host_lua $root_path/$LUAROCKS_HOST/bin/luarocks \$private_rocks_args \$@ \\
      -    OPENSSL_DIR=$OPENSSL_DIR \\
      -    CRYPTO_DIR=$OPENSSL_DIR \\
           EXPAT_DIR=$EXPAT_DIR \\
           LIBXML2_DIR=$LIBXML2_DIR \\
           YAML_DIR=$YAML_DIR
      diff --git a/build/openresty/BUILD.openresty.bazel b/build/openresty/BUILD.openresty.bazel
      index 81ad172..157f6b7 100644
      --- a/build/openresty/BUILD.openresty.bazel
      +++ b/build/openresty/BUILD.openresty.bazel
      @@ -147,10 +147,8 @@ CONFIGURE_OPTIONS = [
           "--without-http_rds_csv_module",
           "--with-luajit=$$EXT_BUILD_DEPS/luajit",
           "--with-cc-opt=\"-I$$EXT_BUILD_DEPS/pcre/include\"",
      -    "--with-cc-opt=\"-I$$EXT_BUILD_DEPS/openssl/include\"",
           "--with-cc-opt=\"-I$$EXT_BUILD_DEPS/luajit/include\"",
           "--with-ld-opt=\"-L$$EXT_BUILD_DEPS/pcre/lib\"",
      -    "--with-ld-opt=\"-L$$EXT_BUILD_DEPS/openssl/lib\"",
           "--with-ld-opt=\"-L$$EXT_BUILD_DEPS/luajit/lib\"",
           "--with-ld-opt=\"-L$$EXT_BUILD_DEPS/lib\"",
           # Here let's try not having --disable-new-dtags; --disable-new-dtags creates rpath instead of runpath
      @@ -326,7 +324,6 @@ configure_make(
           visibility = ["//visibility:public"],
           deps = [
               "@openresty//:luajit",
      -        "@openssl",
               "@pcre",
           ] + select({
               "@kong//:any-cross": [
      diff --git a/build/openresty/repositories.bzl b/build/openresty/repositories.bzl
      index f4cafe9..6ced994 100644
      --- a/build/openresty/repositories.bzl
      +++ b/build/openresty/repositories.bzl
      @@ -7,7 +7,6 @@ load("//build:build_system.bzl", "git_or_local_repository")
       load("//build/openresty/ada:ada_repositories.bzl", "ada_repositories")
       load("//build/openresty/atc_router:atc_router_repositories.bzl", "atc_router_repositories")
       load("//build/openresty/brotli:brotli_repositories.bzl", "brotli_repositories")
      -load("//build/openresty/openssl:openssl_repositories.bzl", "openssl_repositories")
       load("//build/openresty/pcre:pcre_repositories.bzl", "pcre_repositories")
       load("//build/openresty/simdjson_ffi:simdjson_ffi_repositories.bzl", "simdjson_ffi_repositories")
       load("//build/openresty/snappy:snappy_repositories.bzl", "snappy_repositories")
      @@ -31,7 +30,6 @@ filegroup(
       
       def openresty_repositories():
           pcre_repositories()
      -    openssl_repositories()
           simdjson_ffi_repositories()
           atc_router_repositories()
           wasmx_repositories()
      KONG_OPENSSL_PATCH
      rm -r build/openresty/openssl

  # Kong Manager via http_archive of the pinned release asset (no gh CLI).
  - runs: |
      cd /home/build/kong-${{package.version}}
      perl -0pi -e 's/maybe\(\n\s+github_release,\n(\s+)name = "kong_admin_gui",\n\s+repo = "kong\/kong-manager",\n\s+tag = KONG_VAR\["KONG_MANAGER"\],\n\s+pattern = "release.tar.gz",\n/http_archive(\n$1name = "kong_admin_gui",\n$1url = "https:\/\/github.com\/Kong\/kong-manager\/releases\/download\/%s\/release.tar.gz" % KONG_VAR["KONG_MANAGER"],\n/' build/repositories.bzl
      grep -q 'kong-manager/releases/download/%s/release.tar.gz' build/repositories.bzl \
        || { echo "FAIL: kong_admin_gui rewrite did not apply - repositories.bzl changed upstream"; exit 1; }

  - runs: |
      cd /home/build/kong-${{package.version}}
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      # .bazelrc already sets --spawn_strategy=local, so Bazel's own sandbox
      # (which would need namespaces inside melange's) is never used.
      # --output_user_root keeps Bazel's output base (and its root-owned
      # 0700 server dir) out of /home/build: melange scans the workspace as
      # the unprivileged host user after the build and fails with
      # "failed to store workspace xattrs: ... server: permission denied".
      bazel --output_user_root=/tmp/bazel build //build:kong --config release --verbose_failures

  - runs: |
      cd /home/build/kong-${{package.version}}
      D="${{targets.destdir}}"
      mkdir -p "$D/usr/local/bin" "$D/etc/kong"
      cp kong.conf.default "$D/etc/kong/"
      cp build/package/kong.logrotate "$D/etc/kong/"
      cp -a bazel-bin/build/kong-dev/. "$D/usr/local/"
      cp bin/kong* "$D/usr/local/bin/"
      mkdir -p "$D/usr/local/kong/include"
      cp -R kong/include/. "$D/usr/local/kong/include/"
      # Same convenience links upstream's packages create. Relative: absolute
      # symlinks dangle in the destdir during melange verify.
      ln -sf ../openresty/bin/resty "$D/usr/local/bin/resty"
      ln -sf ../openresty/luajit/bin/luajit "$D/usr/local/bin/luajit"
      ln -sf ../openresty/luajit/bin/luajit "$D/usr/local/bin/lua"
      ln -sf ../openresty/nginx/sbin/nginx "$D/usr/local/bin/nginx"
      # Stop the Bazel server; its output root is under /tmp, outside the
      # workspace melange scans.
      bazel --output_user_root=/tmp/bazel shutdown >/dev/null 2>&1 || true

  - runs: |
      D="${{targets.destdir}}"
      echo "Verifying kong install layout and linkage..."
      for f in usr/local/bin/kong usr/local/openresty/nginx/sbin/nginx usr/local/openresty/bin/openresty usr/local/share/lua/5.1/kong/meta.lua; do
        [ -e "$D/$f" ] || { echo "FAIL: missing $f"; exit 1; }
      done
      grep -q 'major = 3' "$D/usr/local/share/lua/5.1/kong/meta.lua" || { echo "FAIL: kong/meta.lua does not look like Kong 3.x"; exit 1; }
      # The point of the OpenSSL patch: nginx must link the system libssl, not
      # a bundled copy under /usr/local/kong/lib.
      if [ -e "$D/usr/local/kong/lib/libssl.so.3" ]; then echo "FAIL: bundled OpenSSL still installed"; exit 1; fi
      [ -f "$D/usr/local/kong/gui/index.html" ] || { echo "FAIL: Kong Manager GUI not installed"; exit 1; }
