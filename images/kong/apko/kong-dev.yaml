# Development variant of minimal-kong.
# Same Kong from prod, plus bash, apk-tools, curl and jq for debugging.
# In-house composition (no public Chainguard kong-dev reference).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Kong (same as prod)
    - kong

    # env/perl-script shebang resolution (same as prod)
    - coreutils

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/JSON utilities ---
    - curl
    - jq

    - ca-certificates-bundle

accounts:
  groups:
    - groupname: kong
      gid: 65532
  users:
    - username: kong
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/local/bin/kong start --prefix /usr/local/kong

work-dir: /usr/local/kong

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  LD_LIBRARY_PATH: /usr/local/openresty/luajit/lib
  KONG_PREFIX: /usr/local/kong
  KONG_DATABASE: "off"
  KONG_NGINX_DAEMON: "off"

paths:
  - path: /usr/local/kong
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-kong-dev"
  org.opencontainers.image.description: "Dev variant of minimal-kong: same Kong + shell, curl, jq for debugging. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/kong"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
