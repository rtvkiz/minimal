# Melange build configuration for minimal kubeconform
# Pure Go from source. Single static `kubeconform` binary.
# License: Apache-2.0.

package:
  # Named `kubeconform` (not `kubeconform-minimal`) so vulnerability scanners
  # can identify it. Syft derives a package's CPE from its apk name, and every
  # CPE it generated kept -minimal in the product field
  # (cpe:2.3:a:kubeconform:kubeconform-minimal:*,
  # cpe:2.3:a:kubeconform-minimal:kubeconform-minimal:*, ...). NVD indexes this
  # product bare, as cpe:2.3:a:kubeconform:kubeconform:*, so none of them
  # matched, and the Wolfi secdb missed it too.
  name: kubeconform
  version: 0.8.0
  epoch: 0
  description: "Kubeconform Kubernetes manifest validator built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `kubeconform` package today, but if it ever adds one at a higher
    # version, apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of kubeconform source tarball - updated by update-versions.yml workflow
  sha256: c345de9c3207f2d24628c64fe3cb9bed55c4248b12c181efe81ee907d6c994f2

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  - runs: |
      mkdir -p /home/build/kubeconform-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/yannh/kubeconform/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/kubeconform.tar.gz

      echo "${{vars.sha256}}  /home/build/kubeconform.tar.gz" | sha256sum -c -

      tar xzf /home/build/kubeconform.tar.gz -C /home/build/kubeconform-${{package.version}} --strip-components=1
      rm /home/build/kubeconform.tar.gz

  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/kubeconform-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/kubeconform-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= -X main.version=${{package.version}}" \
        -o /home/build/kubeconform-bin \
        ./cmd/kubeconform

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/kubeconform-bin "${{targets.destdir}}/usr/bin/kubeconform"
      chmod 0755 "${{targets.destdir}}/usr/bin/kubeconform"

  - runs: |
      echo "Verifying kubeconform binary..."
      "${{targets.destdir}}/usr/bin/kubeconform" -v
