# Minimal Groovy image
# Apache Groovy (built from the official ASF release via melange) on Wolfi's
# OpenJDK 25 JRE. Shell-less: Groovy's bin/ launchers are shell scripts, so the
# entrypoint runs groovy.ui.GroovyMain on a lib/* classpath with java directly.
#
#   docker run IMAGE -e 'println "hello"'
#   docker run -v "$PWD:/work" IMAGE script.groovy
#
# OpenJDK is pinned to the 25 LTS line, so a new JDK major arrives as a PR
# that CI tests, not silently on a rebuild.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our Groovy (built from the official ASF release via melange)
    - groovy

    # Base filesystem
    - wolfi-baselayout

    # Java runtime
    - openjdk-25-jre
    - openjdk-25-default-jvm

    # Certificates (@Grab and scripts that call out over TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/lib/jvm/java-25-openjdk/bin/java -Dgroovy.home=/usr/share/groovy -Dscript.name=groovy -cp /usr/share/groovy/lib/* groovy.ui.GroovyMain

work-dir: /work

# HOME=/tmp: @Grab's Ivy cache lands in /tmp/.groovy (mount a volume there to
# keep it between runs).
environment:
  PATH: /usr/lib/jvm/java-25-openjdk/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  GROOVY_HOME: /usr/share/groovy
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-groovy"
  org.opencontainers.image.description: "Hardened shell-less Apache Groovy on OpenJDK 25, built from the official ASF release with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/groovy"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
