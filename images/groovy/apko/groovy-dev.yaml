# Development variant of minimal-groovy.
# Same Groovy + OpenJDK 25 as prod, plus the dev minimum (shell, apk-tools),
# the full JDK (javac, for joint Groovy/Java compilation) and git.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our Groovy (built from the official ASF release via melange)
    - groovy

    # Base filesystem
    - wolfi-baselayout

    # Java runtime
    - openjdk-25-jre
    - openjdk-25-default-jvm
    # Full JDK (javac) for joint Groovy/Java compilation in the dev image
    - openjdk-25-default-jdk

    # Certificates (@Grab and scripts that call out over TLS)
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - git

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/lib/jvm/java-25-openjdk/bin/java -Dgroovy.home=/usr/share/groovy -Dscript.name=groovy -cp /usr/share/groovy/lib/* groovy.ui.GroovyMain

work-dir: /work

# HOME=/tmp: @Grab's Ivy cache lands in /tmp/.groovy (mount a volume there to
# keep it between runs).
environment:
  PATH: /usr/lib/jvm/java-25-openjdk/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  GROOVY_HOME: /usr/share/groovy
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-groovy-dev"
  org.opencontainers.image.description: "Dev variant of minimal-groovy: same Groovy plus the full OpenJDK 25, a shell, apk-tools and git. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/groovy"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
