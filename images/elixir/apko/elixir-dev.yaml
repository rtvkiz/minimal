# Development variant of minimal-elixir.
# Same Elixir, OTP and CMD as prod, plus the dev minimum and the runtime
# template's build toolchain (C NIFs) and git (mix deps from git).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our Elixir (official release via melange; listed first: build.yml takes
    # the primary package's version from the first line matching `elixir`)
    - elixir
    # Erlang/OTP runtime (the OTP-29 Elixir build needs OTP 29)
    - erlang-29
    # elixir/iex/mix are #!/bin/sh launchers
    - busybox
    - wolfi-baselayout
    - ca-certificates-bundle
    # --- Dev variant minimum + runtime template (CONVENTIONS.md) ---
    - bash
    - apk-tools
    - wget
    - build-base
    - git

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

cmd: /usr/bin/iex

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-elixir-dev"
  org.opencontainers.image.description: "Dev variant of minimal-elixir: same Elixir plus bash, a C toolchain for NIFs, git for mix deps and apk-tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/elixir"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
