# Minimal Elixir image
# Elixir (official precompiled release, built via melange) on Wolfi's
# erlang-29. Declared prod-shell exception (busybox only, never bash):
# elixir, iex, mix and elixirc are #!/bin/sh launchers.
#
# No entrypoint, CMD iex: the Docker Hub elixir shape, so
#   docker run -it IMAGE                    # iex
#   docker run IMAGE elixir -e 'IO.puts 1'
#   docker run -v "$PWD:/app" -w /app IMAGE mix test
# work as a drop-in. HOME=/tmp holds ~/.mix and ~/.hex for nonroot.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our Elixir (official release via melange; listed first: build.yml takes
    # the primary package's version from the first line matching `elixir`)
    - elixir
    # Erlang/OTP runtime (the OTP-29 Elixir build needs OTP 29)
    - erlang-29
    # elixir/iex/mix are #!/bin/sh launchers
    - busybox
    - wolfi-baselayout
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

cmd: /usr/bin/iex

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-elixir"
  org.opencontainers.image.description: "Hardened Elixir on Erlang/OTP 29 with no package manager, built from the official release with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/elixir"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
