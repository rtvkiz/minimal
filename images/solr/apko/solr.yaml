# Minimal Apache Solr image - official binary release + custom jlink JRE (Java 21)
# CVE patching via daily rebuilds. License: Apache-2.0.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # bin/solr is a #!/usr/bin/env bash launcher with heavy bashisms
    - busybox
    - bash
    # The upstream launcher uses procps-only flags such as `ps -p`.
    - procps

    # Our Solr (binary release + custom JRE via melange)
    - solr

    # Core libraries for JNI / native JRE components
    - glibc
    - glibc-locale-posix
    - ld-linux

    # Certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: solr
      gid: 65532
  users:
    - username: solr
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/solr-entrypoint.sh

environment:
  PATH: /usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-21-minimal
  SOLR_HOME: /var/solr/data
  SOLR_LOGS_DIR: /var/solr/logs
  SOLR_HOST_BIND: 0.0.0.0

# SOLR_HOME + logs must be writable by nonroot; create them here, never in the
# melange pipeline (the SBOM step can't mkdir into the root-owned destdir).
paths:
  - path: /var/solr
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/solr/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/solr/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-solr"
  org.opencontainers.image.description: "Hardened Apache Solr search server with custom jlink JRE, daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/solr"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
