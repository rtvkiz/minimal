# Melange build configuration for minimal kubectl CLI.
# Pure Go from source (Kubernetes monorepo, ./cmd/kubectl).
# Statically linked, version stamps injected via -ldflags. No daemon — this
# image packages the `kubectl` binary for use in CI pipelines and one-shot
# cluster ops.
# License: Apache-2.0.

package:
  # Named `kubectl` (not `kubectl-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:kubectl:kubectl-minimal:*,
  # cpe:2.3:a:kubectl-minimal:kubectl-minimal:*, ...). NVD indexes this product
  # bare, as cpe:2.3:a:kubectl:kubectl:*, so none of them matched, and the
  # Wolfi secdb missed it too.
  name: kubectl
  version: 1.37.0
  epoch: 0
  description: "Minimal kubectl CLI for Kubernetes built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `kubectl` package today, but if it ever adds one at a higher
    # version, apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of kubernetes source tarball - updated by update-versions.yml workflow
  sha256: 956ddae3b12acc08a715aea0411a168a36d5989b3e7185deeb6bf46b7dac19cf

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify kubernetes source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/kubernetes/kubernetes/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/k8s.tar.gz

      echo "${{vars.sha256}}  /home/build/k8s.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf k8s.tar.gz
      rm k8s.tar.gz

  # Build kubectl — single static binary. Kubernetes' Makefile invokes a custom
  # hack/ pipeline (git-derived version stamps, codegen) that doesn't work in
  # the bwrap sandbox without git history. We set ldflags directly to the
  # k8s.io/{client-go,component-base}/version.* fields the binary surfaces via
  # `kubectl version --client`.


  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      for root in /home/build/kubernetes-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter go.opentelemetry.io/otel@v1.46.0 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/kubernetes-${{package.version}}
      BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      LDFLAGS="-s -w"
      for pkg in k8s.io/client-go/pkg/version k8s.io/component-base/version; do
        LDFLAGS="$LDFLAGS \
          -X $pkg.gitVersion=v${{package.version}} \
          -X $pkg.gitCommit=source-build \
          -X $pkg.gitTreeState=clean \
          -X $pkg.buildDate=$BUILD_DATE \
          -X $pkg.gitMajor=1 \
          -X $pkg.gitMinor=36"
      done
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="$LDFLAGS" \
        -o /home/build/kubectl-bin \
        ./cmd/kubectl

  # Install
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/kubectl-bin "${{targets.destdir}}/usr/bin/kubectl"
      chmod 0755 "${{targets.destdir}}/usr/bin/kubectl"

  # Verify
  - runs: |
      echo "Verifying kubectl build..."
      "${{targets.destdir}}/usr/bin/kubectl" version --client
      echo "Binary size:"
      ls -lh "${{targets.destdir}}/usr/bin/kubectl"

update:
  enabled: true
  github:
    identifier: kubernetes/kubernetes
    use-tag: true
    strip-prefix: "v"
    tag-filter: "v1."
