# Minimal zot image - using Wolfi's pre-built package
# Shell-less/distroless for security
# CVE patching via the 6-hourly rebuild (Wolfi rolling package)

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # zot from Wolfi (CVE-patched)
    - zot

    # Certificates (registry clients and auth backends are TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# zot is a pure-Go OCI-native registry: a single static binary, no shell wrapper.
#
# `serve` is the only sensible default — zot requires a config file argument and
# exits immediately without one, so the image ships the flag but expects you to
# mount your own config over /etc/zot/config.json. The `zli` client is also on
# PATH for inspecting a running registry (`--entrypoint /usr/bin/zli`).
entrypoint:
  command: /usr/bin/zot serve /etc/zot/config.json

work-dir: /var/lib/registry

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /etc/zot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/registry
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-zot"
  org.opencontainers.image.description: "Hardened shell-less zot OCI-native container image registry built on Wolfi with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/zot"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
