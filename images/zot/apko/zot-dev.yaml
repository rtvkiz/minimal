# Development variant of minimal-zot.
# Same zot from prod, plus a shell and registry-troubleshooting tools
# (curl/jq for the /v2/ API, skopeo-style inspection via zli).
#
# In-house composition (no public Chainguard zot-dev reference).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # zot (same as prod)
    - zot

    # Certificates (same as prod)
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Registry / HTTP troubleshooting ---
    - curl
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/zot serve /etc/zot/config.json

work-dir: /var/lib/registry

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  LANG: C.UTF-8
  HOME: /tmp

paths:
  - path: /etc/zot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/registry
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-zot-dev"
  org.opencontainers.image.description: "Dev variant of minimal-zot: same zot + shell and curl/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/zot"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
