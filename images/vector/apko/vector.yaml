# Minimal Vector image - built from source via melange
# Vector observability data pipeline (Rust), upstream default feature set,
# linked against Wolfi's maintained OpenSSL. Shell-less/distroless.
#
# Source-built since 2026-10-31: Wolfi's vector package stopped receiving
# builds in June 2026 and was frozen at 0.56.0.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Vector, built from source (melange.yaml)
    - vector

    # Core system libraries
    - glibc
    - ld-linux
    - libgcc

    # TLS (HTTP/Kafka/Elasticsearch sinks) + DNS resolution
    - openssl
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# Vector runs in the foreground by default (no daemonisation), so no flag is
# needed to keep it attached — unlike dnsmasq/keepalived.
#
# The Wolfi package ships a default /etc/vector/vector.yaml (a demo_logs ->
# remap -> console pipeline), so the image starts and emits parsed JSON with no
# config mounted. Real deployments mount their own config over that path, or
# override the command with `--config /path/to/vector.yaml`.
entrypoint:
  command: /usr/bin/vector

environment:
  PATH: /usr/bin:/bin
  # Vector writes disk buffers and checkpoint state here. Must be writable by
  # nonroot; see the paths: entry below.
  VECTOR_DATA_DIR: /var/lib/vector

paths:
  - path: /var/lib/vector
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-vector"
  org.opencontainers.image.description: "Hardened shell-less Vector observability data pipeline built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/vector"
  org.opencontainers.image.licenses: "MPL-2.0"

archs:
  - x86_64
  - aarch64
