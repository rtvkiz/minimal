# Minimal Ghost image - built from source via melange
# Ghost (npm release, built admin included) on Wolfi's nodejs-24, pulled in as
# the package's runtime dependency. Shell-less: the official image's
# docker-entrypoint.sh (seed the content volume, then boot) is replaced by a
# few lines of Node (/usr/lib/ghost/minimal-entrypoint.js).
#
# Database: defaults to SQLite in the content volume, the same default the
# official ghost image ships. For production use MySQL 8 — override with the
# usual env vars (database__client=mysql, database__connection__host=..., ...).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Ghost (built from source via melange; depends on nodejs-24)
    - ghost

    # Certificates (outbound mail, oEmbed, webhooks over TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/node /usr/lib/ghost/minimal-entrypoint.js

work-dir: /usr/lib/ghost

# Same defaults as the official ghost image: production mode, SQLite in the
# content dir, listen on 0.0.0.0:2368. Set `url` to your public URL.
environment:
  PATH: /usr/bin:/bin
  NODE_ENV: production
  url: http://localhost:2368
  server__host: 0.0.0.0
  server__port: "2368"
  paths__contentPath: /var/lib/ghost/content
  database__client: sqlite3
  database__connection__filename: /var/lib/ghost/content/data/ghost.db
  database__useNullAsDefault: "true"
  database__debug: "false"

paths:
  - path: /var/lib/ghost/content
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-ghost"
  org.opencontainers.image.description: "Hardened shell-less Ghost publishing platform built from source via melange with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/ghost"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
