# Development variant of minimal-ghost.
# Same Ghost + Node as prod, plus shell, apk-tools, npm (themes / custom
# adapters / storage plugins) and a C toolchain for native npm addons.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ghost
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Node package manager + native addon toolchain ---
    - npm
    - build-base
    - python-3.14

    # --- Utilities ---
    - curl
    - jq
    - git

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/node /usr/lib/ghost/minimal-entrypoint.js

work-dir: /usr/lib/ghost

environment:
  PATH: /usr/bin:/bin
  NODE_ENV: production
  url: http://localhost:2368
  server__host: 0.0.0.0
  server__port: "2368"
  paths__contentPath: /var/lib/ghost/content
  database__client: sqlite3
  database__connection__filename: /var/lib/ghost/content/data/ghost.db
  database__useNullAsDefault: "true"
  database__debug: "false"

paths:
  - path: /var/lib/ghost/content
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-ghost-dev"
  org.opencontainers.image.description: "Dev variant of minimal-ghost: same Ghost + shell, npm and a native-addon toolchain. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/ghost"
  org.opencontainers.image.licenses: "MIT"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
