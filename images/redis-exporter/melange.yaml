# Melange build configuration for minimal redis_exporter
# Pure Go from source. Single static `redis_exporter` binary — scrapes Redis /
# Valkey INFO and exposes it as Prometheus metrics.
# License: MIT.

package:
  # Named `redis-exporter` (not `redis-exporter-minimal`) so vulnerability
  # scanners can identify it. Syft derives a package's CPE from its apk name,
  # and every CPE it generated kept -minimal in the product field
  # (cpe:2.3:a:redis-exporter:redis-exporter-minimal:*,
  # cpe:2.3:a:redis-exporter-minimal:redis-exporter-minimal:*, ...). NVD
  # indexes this product bare, as cpe:2.3:a:redis-exporter:redis-exporter:*, so
  # none of them matched, and the Wolfi secdb missed it too.
  name: redis-exporter
  version: 1.90.0
  epoch: 0
  description: "Minimal Redis exporter for Prometheus built from source"
  copyright:
    - license: MIT
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `redis-exporter` package today, but if it ever adds one at a higher
    # version, apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of redis_exporter source tarball - updated by update-versions.yml
  sha256: 451d6fa5c2e62b6787d2e170d0c58d14fd8919eaf63e84203491e59c73b03403

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify redis_exporter source. Note the upstream repo is
  # `redis_exporter` (underscore) while our image is `redis-exporter` (hyphen,
  # matching the catalog's naming convention).
  - runs: |
      mkdir -p /home/build/redis-exporter-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/oliver006/redis_exporter/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/redis-exporter.tar.gz

      echo "${{vars.sha256}}  /home/build/redis-exporter.tar.gz" | sha256sum -c -

      tar xzf /home/build/redis-exporter.tar.gz -C /home/build/redis-exporter-${{package.version}} --strip-components=1
      rm /home/build/redis-exporter.tar.gz

  # Version lives in package main (upstream: -X main.BuildVersion). The binary
  # prints "<<< filled in by build >>>" if this is not injected, which the smoke
  # test greps against.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      _pgd_workfix() {  # raise an enclosing go.work above every member's go directive
        # A go.work whose `go` directive sits below a bumped member's requirement
        # hard-fails every go command in the tree — even under GOWORK=off — before
        # the build is reached. x/crypto v0.56.0 declares go 1.26.0, which stranded
        # prometheus (go.work at 1.25.8) and etcd (1.26). Raise the workspace to the
        # build toolchain first so a bump can never sit above it; the explicit
        # go.work argument keeps `go work edit` working under GOWORK=off. No-op for
        # the majority of images, which ship no workspace at all.
        _d="$1"
        while [ -n "$_d" ] && [ "$_d" != "/" ]; do
          if [ -f "$_d/go.work" ]; then
            _gv=$(go env GOVERSION | sed 's/^go//')
            echo "pgd-work: raising $_d/go.work go directive to $_gv"
            ( cd "$_d" && go work edit -go="$_gv" go.work ) || true
            return 0
          fi
          _d=$(dirname "$_d")
        done
      }
      for root in /home/build/redis-exporter-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        _pgd_workfix "$root"
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter github.com/klauspost/compress@v1.18.7 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/redis-exporter-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X main.BuildVersion=${{package.version}}" \
        -o /home/build/redis-exporter-bin \
        .

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/redis-exporter-bin "${{targets.destdir}}/usr/bin/redis_exporter"
      chmod 0755 "${{targets.destdir}}/usr/bin/redis_exporter"

  # Verify the build
  - runs: |
      echo "Verifying redis_exporter binary..."
      "${{targets.destdir}}/usr/bin/redis_exporter" --version 2>&1 | head -2

update:
  enabled: true
  github:
    identifier: oliver006/redis_exporter
    use-tag: true
    tag-filter: "v1."
