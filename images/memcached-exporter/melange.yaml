# Melange build configuration for minimal memcached-exporter
# Exposes Memcached server statistics as Prometheus metrics on :9150. The upstream
# binary keeps its underscore name (memcached_exporter); image and package use the
# catalog's hyphenated convention, same as redis-exporter.
# Pure Go from source, CGO off (static, shell-less). License: Apache-2.0.
#
# Source-built rather than apko-only: Wolfi's `memcached-exporter` package stopped receiving
# builds in June 2026 (recipe removed from wolfi-dev/os), so it is frozen several
# releases behind upstream.

package:
  # Named exactly what upstream calls it, not `memcached-exporter-minimal` — see
  # docs/onboarding.md "Package naming and scanner visibility".
  name: memcached-exporter
  version: 0.18.0
  epoch: 0
  description: "Minimal Memcached Exporter built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # Wolfi still ships a (frozen) `memcached-exporter` package; apko picks the highest
    # version across ALL repositories unless provider-priority pins ours.
    provider-priority: 100

vars:
  # SHA256 of the source tarball - updated by update-versions.yml workflow
  sha256: acb980f90a29285d063eed55b1f889955273a45d15e81380cadb7af5710bd3c7

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  - runs: |
      mkdir -p /home/build/memcached-exporter-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/prometheus/memcached_exporter/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/memcached-exporter.tar.gz
      echo "${{vars.sha256}}  /home/build/memcached-exporter.tar.gz" | sha256sum -c -
      tar xzf /home/build/memcached-exporter.tar.gz -C /home/build/memcached-exporter-${{package.version}} --strip-components=1
      rm /home/build/memcached-exporter.tar.gz

  - runs: |
      cd /home/build/memcached-exporter-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/prometheus/common/version.Version=${{package.version}}" \
        -o /home/build/memcached_exporter-bin \
        ./cmd/memcached_exporter

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/memcached_exporter-bin "${{targets.destdir}}/usr/bin/memcached_exporter"
      chmod 0755 "${{targets.destdir}}/usr/bin/memcached_exporter"

  - runs: |
      echo "Verifying memcached-exporter binary and injected version..."
      "${{targets.destdir}}/usr/bin/memcached_exporter" --version 2>&1 | grep -q "version ${{package.version}}" \
        || { echo "FAIL: version ${{package.version}} not reported - ldflag wrong?"; exit 1; }
