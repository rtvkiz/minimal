# Melange build configuration for minimal Alertmanager
# Builds Alertmanager + amtool from source (Go).
# Single static binary per command; web UI is embedded in the binary via go embed.

package:
  # Named `alertmanager` (not `alertmanager-minimal`) so vulnerability scanners
  # can identify it. Syft derives a package's CPE from its apk name, and every
  # CPE it generated kept -minimal in the product field
  # (cpe:2.3:a:alertmanager:alertmanager-minimal:*,
  # cpe:2.3:a:alertmanager-minimal:alertmanager-minimal:*, ...). NVD indexes
  # this product bare, as cpe:2.3:a:alertmanager:alertmanager:*, so none of
  # them matched, and the Wolfi secdb missed it too.
  name: alertmanager
  version: 0.34.0
  epoch: 0
  description: "Minimal Alertmanager built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `alertmanager` package today, but if it ever adds one at a higher
    # version, apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of source tarball — updated by .github/versions.yaml row + update-versions workflow
  sha256: f09117dd6ad62d3f53d2618ba3950ced4a318110b95ce5afe76b7df0ba74000f

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.26
      - git

pipeline:
  # Download and verify source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/prometheus/alertmanager/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/alertmanager.tar.gz

      echo "${{vars.sha256}}  /home/build/alertmanager.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf alertmanager.tar.gz
      rm alertmanager.tar.gz

  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      for root in /home/build/alertmanager-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8 github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3 github.com/cloudflare/circl@v1.6.3 github.com/containerd/containerd/v2@v2.2.1 github.com/containerd/containerd@v1.7.33 github.com/docker/cli@v29.2.1+incompatible github.com/go-git/go-billy/v5@v5.9.0 github.com/go-git/go-git/v5@v5.19.1 github.com/go-jose/go-jose/v4@v4.1.4 github.com/klauspost/compress@v1.18.7 github.com/moby/buildkit@v0.28.1 github.com/nwaples/rardecode/v2@v2.2.0 github.com/opencontainers/selinux@v1.13.1 github.com/ulikunitz/xz@v0.5.15 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.0 oras.land/oras-go/v2@v2.6.1 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.45.0 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel@v1.45.0 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  # Build alertmanager and amtool from source (static binaries).
  # The browser UI is NOT shipped — ui/web.go has //go:embed app/dist which
  # normally points at the compiled Vite frontend. Building that needs node +
  # yarn + the whole frontend toolchain; the embed pattern fails the build if
  # no files match. Create an empty placeholder so the embed yields an empty
  # FS; the binary serves the alertmanager API normally (/api/v2/...) and the
  # configured-receivers webhook path. Same tradeoff as prometheus-minimal.
  - runs: |
      cd /home/build/alertmanager-${{package.version}}
      # Empty placeholder so //go:embed app/dist matches. Filename must NOT
      # start with `.` or `_` — Go's embed silently skips those.
      mkdir -p ui/app/dist
      echo 'Alertmanager web UI is intentionally not shipped in minimal-alertmanager. Use the API at /api/v2/.' \
        > ui/app/dist/index.html

      BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      LDFLAGS="-s -w \
        -X github.com/prometheus/common/version.Version=${{package.version}} \
        -X github.com/prometheus/common/version.Branch=HEAD \
        -X github.com/prometheus/common/version.BuildDate=${BUILD_DATE} \
        -X github.com/prometheus/common/version.BuildUser=melange"

      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath -ldflags="${LDFLAGS}" \
        -o alertmanager ./cmd/alertmanager

      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath -ldflags="${LDFLAGS}" \
        -o amtool ./cmd/amtool

  # Install to destdir + ship a minimal default config
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/alertmanager-${{package.version}}/alertmanager "${{targets.destdir}}/usr/bin/"
      cp /home/build/alertmanager-${{package.version}}/amtool       "${{targets.destdir}}/usr/bin/"

      mkdir -p "${{targets.destdir}}/etc/alertmanager"
      cat > "${{targets.destdir}}/etc/alertmanager/alertmanager.yml" << 'EOF'
      route:
        receiver: 'noop'
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      receivers:
        - name: 'noop'
      EOF

  # Verify the build
  - runs: |
      echo "Verifying Alertmanager build..."
      "${{targets.destdir}}/usr/bin/alertmanager" --version
      "${{targets.destdir}}/usr/bin/amtool" --version
      ls -lh "${{targets.destdir}}/usr/bin/"

update:
  enabled: true
  github:
    identifier: prometheus/alertmanager
    use-tag: true
    tag-filter: "v0."
