# Development variant of minimal-perl.
# Same Perl from prod, plus a shell, the C toolchain needed to build XS
# modules, and cpanminus for installing from CPAN.
#
# Runtime template (docs/dev-variants/CONVENTIONS.md).

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem layout
    - wolfi-baselayout

    # Perl, built from source (same as prod)
    - perl

    # Core runtime deps (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - zlib
    - libbz2-1
    - libxcrypt
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- C toolchain for building XS modules from CPAN ---
    - build-base
    - gcc
    - binutils
    - make
    - pkgconf
    - posix-cc-wrappers
    - linux-headers
    - openssf-compiler-options
    - glibc-dev
    - libstdc++-dev
    - libxcrypt-dev

    # --- CPAN client + fetching dependencies ---
    - perl-app-cpanminus
    - git

    # --- HTTP/JSON utilities ---
    - curl
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/perl

work-dir: /app

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  LANG: C.UTF-8
  HOME: /tmp

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-perl-dev"
  org.opencontainers.image.description: "Dev variant of minimal-perl: same Perl + shell, C toolchain and cpanminus. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/perl"
  org.opencontainers.image.licenses: "Artistic-1.0-Perl OR GPL-1.0-or-later"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
