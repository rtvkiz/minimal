# Minimal kong-ingress-controller image - built from source via melange
# Kong Ingress Controller: configures Kong Gateway from Ingress, Gateway API
# and Kong CRDs. Entry point is /manager, the path upstream's image and Helm
# chart use. Data plane: the minimal kong image.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - kong-ingress-controller
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /manager

work-dir: /tmp

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  HOME: /tmp

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-kong-ingress-controller"
  org.opencontainers.image.description: "Hardened shell-less kong-ingress-controller built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/kong-ingress-controller"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
