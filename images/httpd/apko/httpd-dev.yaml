# Development variant of minimal-httpd.
# Same Apache HTTPD as prod, plus shell, apk-tools, curl + openssl CLI
# + bind-tools for HTTP/TLS/DNS debugging.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base + Apache (same as prod)
    - wolfi-baselayout
    - apache2
    - apache2-compat
    - apache2-config
    - apache2-config-compat
    - libapr
    - apr-util

    # Core libs (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libcrypt1
    - libxcrypt
    - libssl3
    - libcrypto3
    - libbrotlicommon1
    - libbrotlienc1
    - libbz2-1
    - zlib
    - libexpat1
    - libxml2-16
    - libnghttp2-14
    - libpcre2-8-0
    - libldap-2.6
    - cyrus-sasl
    - heimdal-libs
    - lua5.4
    - lua5.4-libs
    - sqlite-libs
    - gdbm
    - ncurses
    - ncurses-terminfo-base
    - readline
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/TLS/DNS debugging ---
    - curl
    - openssl
    - bind-tools

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: www-data
      gid: 65532
  users:
    - username: www-data
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/sbin/httpd -DFOREGROUND -C "ServerName localhost" -C "PidFile /run/apache2/httpd.pid"

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8

paths:
  - path: /run/apache2
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/apache2
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-httpd-dev"
  org.opencontainers.image.description: "Dev variant of minimal-httpd: same Apache + shell + curl/openssl/dig. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/httpd"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
