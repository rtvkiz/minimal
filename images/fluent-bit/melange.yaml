# Melange build configuration for minimal Fluent Bit
# Builds Fluent Bit from source (C/CMake) — lightweight log processor/forwarder

package:
  # Named `fluent-bit` (not `fluent-bit-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, so the
  # `-minimal` suffix produced
  # cpe:2.3:a:fluent-bit-minimal:fluent-bit-minimal:* — which matches nothing
  # in NVD (indexed as cpe:2.3:a:fluent-bit:fluent-bit:*) and nothing in the
  # Wolfi secdb either, so both of grype's matchers missed every CVE for this
  # package.
  name: fluent-bit
  version: 5.1.2
  epoch: 0
  description: "Minimal Fluent Bit log processor built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `fluent-bit` package today, but if it ever adds one at a higher
    # version, apk would silently install Wolfi's build instead of this
    # source-built one. provider-priority is evaluated BEFORE version in that
    # comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  sha256: 1971d86c7dc0f3e6b906890297635d6a3a84e5e7ad64d36521b74da202fda62f

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - cmake
      - flex
      - bison
      - openssl-dev
      - curl-dev
      - zlib-dev
      - yaml-dev
      - linux-headers

pipeline:
  - runs: |
      mkdir -p /home/build
      rm -f /home/build/fluent-bit.tar.gz
      for URL in \
        "https://codeload.github.com/fluent/fluent-bit/tar.gz/refs/tags/v${{package.version}}" \
        "https://github.com/fluent/fluent-bit/archive/refs/tags/v${{package.version}}.tar.gz"
      do
        echo "Downloading Fluent Bit from ${URL}"
        if curl -fsSL --connect-timeout 20 --retry 8 --retry-all-errors "${URL}" \
          -o /home/build/fluent-bit.tar.gz; then
          break
        fi
        rm -f /home/build/fluent-bit.tar.gz
      done
      test -s /home/build/fluent-bit.tar.gz
      echo "${{vars.sha256}}  /home/build/fluent-bit.tar.gz" | sha256sum -c -
      cd /home/build && tar xzf fluent-bit.tar.gz && rm fluent-bit.tar.gz

      # FLB_HTTP_SERVER vendors Monkey, whose tls_init_library() calls the
      # legacy SSL_load_error_strings() unconditionally — even in the
      # "OpenSSL >= 1.1.0" branch, where it's a redundant no-op
      # (OPENSSL_init_ssl() already loads error strings by default). Current
      # OpenSSL headers no longer declare it, and GCC 16 (Wolfi's build-base)
      # promotes that implicit declaration to a hard error, so drop the
      # redundant call rather than fight the header visibility.
      sed -i '/^\s*SSL_load_error_strings();\s*$/d' \
        /home/build/fluent-bit-${{package.version}}/lib/monkey/tls/tls_openssl.c

  # Build Fluent Bit (minimal plugins)
  - runs: |
      mkdir -p /home/build/fluent-bit-${{package.version}}/build
      cd /home/build/fluent-bit-${{package.version}}/build
      # src/flb_crypto.c uses the legacy OpenSSL 1.x low-level RSA API
      # (RSA_new/RSA_set0_key/EVP_PKEY_set1_RSA/RSA_free), which current
      # OpenSSL headers hide behind OPENSSL_NO_DEPRECATED_3_0 by default —
      # targeting the 1.1.0 API keeps that whole surface (RSA type included)
      # visible without patching fluent-bit's own crypto code. This is
      # OpenSSL's documented mechanism for exactly this: pre-3.0 callers
      # building against current headers.
      cmake .. \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_FLAGS=-DOPENSSL_API_COMPAT=0x10100000L \
        -DFLB_RELEASE=On \
        -DFLB_JEMALLOC=Off \
        -DFLB_TLS=On \
        -DFLB_HTTP_SERVER=On \
        -DFLB_EXAMPLES=Off \
        -DFLB_SHARED_LIB=Off \
        -DFLB_LUAJIT=Off \
        -DFLB_SYSTEMD=Off
      make -j$(nproc)

  # Install — only keep the binary
  - runs: |
      cd /home/build/fluent-bit-${{package.version}}/build
      make DESTDIR="${{targets.destdir}}" install
      # Remove headers and default configs — not needed in container
      rm -rf "${{targets.destdir}}/usr/include"
      rm -rf "${{targets.destdir}}/usr/etc"
      rm -rf "${{targets.destdir}}/lib"

      mkdir -p "${{targets.destdir}}/etc/fluent-bit"
      cat > "${{targets.destdir}}/etc/fluent-bit/fluent-bit.yaml" << 'EOF'
      service:
        http_server: on
        http_listen: 0.0.0.0
        http_port: 2020
        health_check: on
        log_level: info

      pipeline:
        inputs:
          - name: dummy
            tag: test
            dummy: '{"message": "fluent-bit is running"}'
            rate: 1

        outputs:
          - name: stdout
            match: "*"
      EOF

  - runs: |
      echo "Verifying Fluent Bit build..."
      "${{targets.destdir}}/usr/bin/fluent-bit" --version
      ls -lh "${{targets.destdir}}/usr/bin/fluent-bit"

update:
  enabled: true
  github:
    identifier: fluent/fluent-bit
    use-tag: true
    tag-filter: "v5."
