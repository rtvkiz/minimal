# Melange build configuration for minimal restic
# Pure Go from source. Single static `restic` binary — fast, verified,
# deduplicating backup to local disk, SFTP, S3 and other object stores.
# License: BSD-2-Clause (Alexander Neumann / the restic authors).

package:
  # Named `restic` (not `restic-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:restic:restic-minimal:*, ...). NVD indexes this product bare,
  # as cpe:2.3:a:restic:restic:*, so none of them matched.
  name: restic
  version: 0.19.1
  epoch: 0
  description: "Minimal restic deduplicating backup program built from source"
  copyright:
    - license: BSD-2-Clause
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `restic`, so without this apk could install Wolfi's build instead of
    # this source-built one. provider-priority is evaluated BEFORE version in
    # that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of restic source tarball - updated by update-versions.yml workflow
  sha256: bb9b1a19040744d26d8a79be029d4e6b189c45ccc9d8831d7fe367d3c33df725

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify restic source
  - runs: |
      mkdir -p /home/build/restic-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/restic/restic/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/restic.tar.gz

      echo "${{vars.sha256}}  /home/build/restic.tar.gz" | sha256sum -c -

      tar xzf /home/build/restic.tar.gz -C /home/build/restic-${{package.version}} --strip-components=1
      rm /home/build/restic.tar.gz

  # Upstream builds via its own build.go helper, which only shells out to
  # `go build` with -X main.version — so invoke go directly and set the same
  # symbol. CGO_ENABLED=0 gives a static binary.
  - runs: |
      cd /home/build/restic-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= -X main.version=${{package.version}}" \
        -o /home/build/restic-bin \
        ./cmd/restic

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/restic-bin "${{targets.destdir}}/usr/bin/restic"
      chmod 0755 "${{targets.destdir}}/usr/bin/restic"

  # Verify the build
  - runs: |
      echo "Verifying restic binary..."
      "${{targets.destdir}}/usr/bin/restic" version
