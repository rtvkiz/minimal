# Minimal restic image - restic deduplicating backup program, built from source via melange
# Shell-less, distroless. CVE patching via daily rebuilds from upstream source.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - restic
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# restic takes its repository from --repo or RESTIC_REPOSITORY and its
# password from RESTIC_PASSWORD/--password-file. Nothing is baked in.

entrypoint:
  command: /usr/bin/restic

environment:
  PATH: /usr/bin:/bin

# Writable working directory. Both tools need somewhere to place caches and
# config, and a nonroot process cannot create one at runtime.
paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-restic"
  org.opencontainers.image.description: "Hardened shell-less restic deduplicating backup program built from source via melange with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/restic"
  org.opencontainers.image.licenses: "BSD-2-Clause"

archs:
  - x86_64
  - aarch64
