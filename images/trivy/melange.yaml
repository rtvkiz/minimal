# Melange build configuration for minimal Trivy
# Pure Go from source. Single static `trivy` binary.
# License: Apache-2.0 (Aqua Security).

package:
  # Named `trivy` (not `trivy-minimal`) so vulnerability scanners can identify
  # it. Syft derives a package's CPE from its apk name, and every CPE it
  # generated kept -minimal in the product field
  # (cpe:2.3:a:trivy:trivy-minimal:*, cpe:2.3:a:trivy-minimal:trivy-minimal:*,
  # ...). NVD indexes this product bare, as cpe:2.3:a:trivy:trivy:*, so none of
  # them matched, and the Wolfi secdb missed it too.
  name: trivy
  version: 0.74.0
  epoch: 0
  description: "Minimal Trivy (vulnerability/IaC/secret scanner) built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `trivy`, so without this apk could install Wolfi's build instead of
    # this source-built one. provider-priority is evaluated BEFORE version in
    # that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of trivy source tarball - updated by update-versions.yml workflow
  sha256: 04268af574690b84bc3474a5f19e002cd6da3e16899fac9fd39c6e84e7843940

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      # Pinned to go-1.26, NOT the bare `go` provider. `go` is a virtual
      # provider and apk takes the highest version, so the moment Wolfi
      # published go-1.27 (2026-08-19) every image using bare `go` jumped
      # toolchains silently. Only trivy broke, because only trivy builds with
      # GOEXPERIMENT=jsonv2: it imports the stdlib `encoding/json/v2` and calls
      # json.SkipFunc (pkg/x/json/json.go:109), which Go 1.27 changed —
      # "undefined: json.SkipFunc". Upstream trivy 0.74.0 (current latest) has
      # not adapted yet. Drop this pin once trivy builds clean on 1.27.
      - go-1.26
      - git

pipeline:
  # Download and verify Trivy source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/aquasecurity/trivy/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/trivy.tar.gz

      echo "${{vars.sha256}}  /home/build/trivy.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf trivy.tar.gz
      rm trivy.tar.gz

  # Build the trivy binary (static).
  # Version is reported via pkg/version/app.ver (defaults to "dev").
  # GOEXPERIMENT=jsonv2 is required: trivy (v0.71+) imports the experimental
  # encoding/json/v2 + encoding/json/jsontext stdlib packages, which are gated
  # behind this experiment — without it the build fails with "build constraints
  # exclude all Go files in .../encoding/json/v2". Matches upstream's
  # goreleaser.yml, which sets GOEXPERIMENT=jsonv2 for every build target.
  # No transitive Go dep-patching block here by design: trivy's dependency graph
  # (buildkit, containerd, rclone, sigstore, aws-sdk, …) is too large and tightly
  # coupled to force-bump — grype flags ~20 transitive CVEs at once and pinning
  # them to exact fix versions fights Go's MVS into cascading conflicts. trivy is
  # excluded from patch-go-deps.yml (SKIP_IMAGES); its transitive CVEs are picked
  # up via the upstream version bump (update-versions.yml — Aqua bumps their own
  # go.mod) plus the 6-hourly base rebuild. Build from pure upstream source.
  # patch-go-deps: auto-generated — do not edit manually (test-and-keep)
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_workfix() {  # raise an enclosing go.work above every member's go directive
        # A go.work whose `go` directive sits below a bumped member's requirement
        # hard-fails every go command in the tree — even under GOWORK=off — before
        # the build is reached. x/crypto v0.56.0 declares go 1.26.0, which stranded
        # prometheus (go.work at 1.25.8) and etcd (1.26). Raise the workspace to the
        # build toolchain first so a bump can never sit above it; the explicit
        # go.work argument keeps `go work edit` working under GOWORK=off. No-op for
        # the majority of images, which ship no workspace at all.
        _d="$1"
        while [ -n "$_d" ] && [ "$_d" != "/" ]; do
          if [ -f "$_d/go.work" ]; then
            _gv=$(go env GOVERSION | sed 's/^go//')
            echo "pgd-work: raising $_d/go.work go directive to $_gv"
            ( cd "$_d" && go work edit -go="$_gv" go.work ) || true
            return 0
          fi
          _d=$(dirname "$_d")
        done
      }
      for root in /home/build/trivy-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        _pgd_workfix "$root"
        ( set -e
          cd "$root"
          cp go.mod .pgd-base.mod
          [ -f go.sum ] && cp go.sum .pgd-base.sum || true
          # Probe each candidate CVE fix against the real build; keep the ones
          # that still compile, drop those that need upstream to update its
          # vendored code first (logged, not silent). Patches everything safely
          # patchable now instead of skipping the image wholesale.
          KEPT=""
          for fix in  filippo.io/edwards25519@v1.2.0 github.com/Azure/go-ntlmssp@v0.1.1 github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.13 github.com/aws/aws-sdk-go-v2/service/s3@v1.103.3 github.com/cloudflare/circl@v1.6.3 github.com/containerd/containerd/v2@v2.2.5 github.com/containerd/containerd@v1.7.33 github.com/docker/cli@v29.5.3+incompatible github.com/go-chi/chi/v5@v5.3.0 github.com/go-git/go-billy/v5@v5.9.0 github.com/go-git/go-git/v5@v5.19.2 github.com/go-jose/go-jose/v3@v3.0.5 github.com/go-jose/go-jose/v4@v4.1.4 github.com/google/cel-go@v0.29.0 github.com/jackc/pgx/v5@v5.9.2 github.com/klauspost/compress@v1.18.7 github.com/moby/buildkit@v0.31.1 github.com/moby/go-archive@v0.3.0 github.com/nwaples/rardecode/v2@v2.2.2 github.com/opencontainers/selinux@v1.15.1 github.com/projectcontour/contour@v1.33.5 github.com/prometheus/prometheus@v0.311.3 github.com/quic-go/quic-go@v0.59.1 github.com/rclone/rclone@v1.74.3 github.com/sigstore/cosign/v2@v2.6.3 github.com/sigstore/fulcio@v1.8.6 github.com/sigstore/sigstore-go@v1.2.1 github.com/sigstore/timestamp-authority/v2@v2.1.2 github.com/ulikunitz/xz@v0.5.15 github.com/valyala/fasthttp@v1.70.0 github.com/yuin/goldmark@v1.7.17 go.etcd.io/etcd/client/pkg/v3@v3.5.33 go.mongodb.org/mongo-driver@v1.17.9 golang.org/x/image@v0.43.0 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.1 oras.land/oras-go/v2@v2.6.2 software.sslmate.com/src/go-pkcs12@v0.7.2 go.opentelemetry.io/otel/bridge/opentracing@v1.46.0 go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.46.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.46.0 go.opentelemetry.io/otel/sdk@v1.46.0 go.opentelemetry.io/otel@v1.46.0 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0; do
            cp .pgd-base.mod go.mod
            [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
            if go get $KEPT "$fix" >/dev/null 2>&1 && GOTOOLCHAIN=local CGO_ENABLED=0 GOEXPERIMENT=jsonv2 go build -mod=mod -o /dev/null ./cmd/trivy >/dev/null 2>&1; then
              KEPT="$KEPT $fix"; echo "pgd-testkeep KEPT: $fix"
            else
              echo "pgd-testkeep dropped (needs upstream): $fix"
            fi
          done
          cp .pgd-base.mod go.mod
          [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
          if [ -n "$KEPT" ]; then _retry go get $KEPT; fi
          go mod tidy -e
          rm -f .pgd-base.mod .pgd-base.sum
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/trivy-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 GOEXPERIMENT=jsonv2 go build \
        -trimpath \
        -ldflags="-s -w -X github.com/aquasecurity/trivy/pkg/version/app.ver=${{package.version}}" \
        -o /home/build/trivy-bin \
        ./cmd/trivy

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/trivy-bin "${{targets.destdir}}/usr/bin/trivy"
      chmod 0755 "${{targets.destdir}}/usr/bin/trivy"

  # Verify the build
  - runs: |
      echo "Verifying trivy binary..."
      "${{targets.destdir}}/usr/bin/trivy" --version
