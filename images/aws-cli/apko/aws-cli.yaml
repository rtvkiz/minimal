# Minimal AWS CLI v2 image - using Wolfi's pre-built package
# Drop-in for amazon/aws-cli: same `aws` entrypoint and /aws workdir, so
# `docker run IMAGE s3 ls` and `-v "$PWD:/aws"` work unchanged.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    # Versioned major line. update-wolfi-packages.yml watches for the next
    # aws-cli-N line and opens a PR for review (not auto-merged: a CLI major can
    # break scripts).
    - aws-cli-2
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/aws

work-dir: /aws

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  # No pager in a shell-less image: without this, output that would be paged
  # tries to spawn `less` and fails. `aws help` is a dev-variant feature: the
  # man macros it needs come with full groff, which depends on perl.
  AWS_PAGER: ""

paths:
  - path: /aws
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot/.aws
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-aws-cli"
  org.opencontainers.image.description: "Hardened shell-less AWS CLI v2 image built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/aws-cli"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
