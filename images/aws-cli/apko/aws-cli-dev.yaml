# Development variant of minimal-aws-cli.
# Same AWS CLI, plus shell + curl + jq + git for scripting and debugging.
# Not intended for production use — prefer minimal-aws-cli for that.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - aws-cli-2
    - ca-certificates-bundle
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - jq
    - git
    # `aws help` renders man pages with groff and pipes them through a pager.
    # aws-cli-2 only pulls groff-base, which has no man macros (help prints
    # blank lines). Full groff adds them but depends on perl, so it lives here
    # and not in prod.
    - groff
    - less

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/aws

work-dir: /aws

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  HOME: /home/nonroot

paths:
  - path: /aws
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot/.aws
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-aws-cli-dev"
  org.opencontainers.image.description: "Dev variant of minimal-aws-cli: same AWS CLI v2 + shell + curl/jq/git. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/aws-cli"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
