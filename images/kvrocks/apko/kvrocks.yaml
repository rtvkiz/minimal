# Minimal Kvrocks image - built from source via melange
# Redis-compatible store on RocksDB; CVE patching via 6-hourly rebuilds from upstream source

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout

    # Our Kvrocks (built from source via melange)
    - kvrocks

    # Core runtime libraries the clang-built binary links against
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libstdc++
    - libatomic

    # TLS support
    - libssl3
    - libcrypto3

    - ca-certificates-bundle

accounts:
  groups:
    - groupname: kvrocks
      gid: 65532
  users:
    - username: kvrocks
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/kvrocks -c /etc/kvrocks/kvrocks.conf

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-kvrocks"
  org.opencontainers.image.description: "Hardened shell-less Kvrocks image built from source via melange with CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/kvrocks"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
