# Development variant of minimal-kvrocks.
# Same kvrocks binary (built from source via melange) as prod, plus
# bash, apk-tools, valkey (for valkey-cli, RESP-compatible), curl/socat/jq for debugging.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout

    # Kvrocks (built from source via melange — same as prod)
    - kvrocks

    # Core libs (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libstdc++
    - libatomic
    - libssl3
    - libcrypto3
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- RESP client for manual poking (kvrocks speaks the Redis protocol) ---
    - valkey

    # --- HTTP/socket debugging ---
    - curl
    - socat

    # --- JSON parsing ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: kvrocks
      gid: 65532
  users:
    - username: kvrocks
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/kvrocks -c /etc/kvrocks/kvrocks.conf

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  LANG: C.UTF-8

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-kvrocks-dev"
  org.opencontainers.image.description: "Dev variant of minimal-kvrocks: same kvrocks binary + shell + valkey-cli + curl/socat/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/kvrocks"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
