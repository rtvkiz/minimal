# Minimal PostGIS image - PostgreSQL 18 + PostGIS from Wolfi's pre-built packages.
# Same base as postgres-slim (busybox-only shell for initdb, uid 70, no apk-tools),
# plus postgis-18 and the geospatial libraries it links (GEOS, PROJ, GDAL).
#
# postgis-18 depends on perl (postgis_restore.pl and friends), so perl ships too.
# Unlike upstream's postgis/postgis there is no docker-entrypoint script: create
# the extension yourself (CREATE EXTENSION postgis;), as with postgres-slim.
# The postgresql-18/postgis-18 pins move in lockstep with postgres-slim via
# update-wolfi-packages.yml.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Shell — REQUIRED, not a convenience. initdb runs `"postgres" -V` through
    # popen(), which execs /bin/sh. Without a shell initdb fails with
    #   initdb: error: program "postgres" is needed by initdb but was not found
    # so the image cannot initialise a fresh PGDATA and will not start against
    # an empty volume — the normal first-run path. This is the "unless the
    # service genuinely needs it" exception in docs/onboarding.md, scoped to the
    # postgres family. busybox only — no bash, no apk-tools (those are -dev).
    - busybox

    # PostgreSQL from Wolfi (CVE-patched)
    - postgresql-18

    - postgresql-18-base
    - postgresql-18-client
    - postgresql-18-client-base
    - postgresql-18-contrib
    # PostGIS (+ GEOS/PROJ/GDAL/protobuf-c via its dependencies)
    - postgis-18
    - libpq-18
    - pgaudit-18

    # Core libraries
    - glibc
    - glibc-locale-posix
    - glibc-locale-en
    - ld-linux
    - libgcc
    - libstdc++
    - libcrypt1
    - libxcrypt

    # SSL/TLS libraries
    - libssl3
    - libcrypto3

    # ICU (internationalization)
    - libicu78
    - icu78-data-full

    # Authentication/security libraries
    - cyrus-sasl
    - heimdal-libs
    - krb5-libs
    - krb5-conf
    - keyutils-libs
    - libldap-2.6
    - libverto
    - linux-pam
    - libselinux
    - libsepol

    # XML/XSLT
    - libxml2-16
    - libxslt

    # Compression
    - liblz4-1
    - libzstd1
    - zlib

    # Database/utility libraries
    - libedit
    - libffi
    - libpcre2-8-0
    - libuuid
    - libcom_err
    - sqlite-libs
    - gdbm

    # Terminal
    - ncurses
    - ncurses-terminfo-base
    - readline

    # Locale and timezone
    - localedef
    - tzdata

    # Certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: postgres
      gid: 70
  users:
    - username: postgres
      uid: 70
      gid: 70
      shell: /bin/false
  run-as: 70

entrypoint:
  command: /usr/bin/postgres

environment:
  PGDATA: /var/lib/postgresql/data
  LANG: en_US.UTF-8
  PATH: /usr/lib/postgresql18/bin:/usr/bin:/bin

paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 70
    gid: 70
    permissions: 0o700
  - path: /var/lib/postgresql/data
    type: directory
    uid: 70
    gid: 70
    permissions: 0o700
  - path: /var/run/postgresql
    type: directory
    uid: 70
    gid: 70
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 70
    gid: 70
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-postgis"
  org.opencontainers.image.description: "Hardened PostgreSQL + PostGIS image built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/postgis"
  org.opencontainers.image.licenses: "PostgreSQL AND GPL-2.0-or-later"

archs:
  - x86_64
  - aarch64
