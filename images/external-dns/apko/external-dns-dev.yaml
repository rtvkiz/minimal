# Development variant of minimal-external-dns.
# Same source-built external-dns as prod, plus a shell and the tools you reach
# for when debugging DNS reconciliation: bind-tools (dig), curl/openssl, jq.
#
# In-house composition. Not for production.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - external-dns
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- DNS debugging: dig / nslookup (verify records external-dns writes) ---
    - bind-tools

    # --- HTTP / TLS debugging (provider + k8s API) ---
    - curl
    - openssl

    # --- JSON (provider API responses) ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/external-dns

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8

annotations:
  org.opencontainers.image.title: "minimal-external-dns-dev"
  org.opencontainers.image.description: "Dev variant of minimal-external-dns: same external-dns + shell + bind-tools (dig) + curl/openssl/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/external-dns"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
