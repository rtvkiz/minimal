# Development variant of minimal-mailpit.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - mailpit
    - ca-certificates-bundle
    - tzdata
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - jq
    - git

accounts:
  groups:
    - groupname: mailpit
      gid: 65532
  users:
    - username: mailpit
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/mailpit

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  MP_DATABASE: /data/mailpit.db
  MP_MAX_MESSAGES: "500"

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-mailpit-dev"
  org.opencontainers.image.description: "Dev variant of minimal-mailpit: same SMTP/email tester + shell + curl/openssl/dig/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/mailpit"
  org.opencontainers.image.licenses: "MIT"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
