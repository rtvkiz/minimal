# Minimal dnsmasq image - using Wolfi's pre-built package
# Shell-less/distroless for security
# CVE patching via the 6-hourly rebuild (Wolfi rolling package)

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # dnsmasq from Wolfi (CVE-patched)
    - dnsmasq

    # Core system libraries
    - glibc
    - ld-linux
    - libgcc

    # Certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# Foreground (-k) DNS forwarder/cache.
#
# The Wolfi package ships no /etc/dnsmasq.conf and apko cannot author file
# contents, so the image is flag-driven: `--conf-file=` explicitly disables
# config-file lookup rather than silently falling back to a missing path.
# `--pid-file=` suppresses the pidfile — nonroot cannot write /var/run.
# `--log-facility=-` sends logs to stderr; the default is syslog, which in a
# container means the logs go nowhere.
# Mount your own config and override the command to use one.
#
# Binding :53 as nonroot requires the NET_BIND_SERVICE capability or
# `--sysctl net.ipv4.ip_unprivileged_port_start=0` (same as unbound).
entrypoint:
  command: /usr/bin/dnsmasq -k --conf-file= --pid-file= --log-facility=-

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-dnsmasq"
  org.opencontainers.image.description: "Hardened shell-less dnsmasq DNS forwarder/cache and DHCP server built on Wolfi with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/dnsmasq"
  org.opencontainers.image.licenses: "GPL-2.0-or-later"

archs:
  - x86_64
  - aarch64
