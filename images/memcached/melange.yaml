# Melange build configuration for minimal Memcached
# Builds Memcached from source with TLS support
# Minimal footprint - single binary

package:
  # Named `memcached` (not `memcached-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:memcached:memcached-minimal:*,
  # cpe:2.3:a:memcached-minimal:memcached-minimal:*, ...). NVD indexes this
  # product bare, as cpe:2.3:a:memcached:memcached:*, so none of them matched,
  # and the Wolfi secdb missed it too.
  name: memcached
  version: 1.6.45
  epoch: 0
  description: "Minimal Memcached built from source"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `memcached`, so without this apk could install Wolfi's build instead
    # of this source-built one. provider-priority is evaluated BEFORE version
    # in that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 checksum of source tarball - updated by update-versions.yml workflow
  sha256: d362c64e6d8d5287153501eabf7c85b4a761432fbf53f5d7b085d0bb1653c1dd

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - linux-headers
      - libevent-dev
      - openssl-dev

pipeline:
  # Download and verify Memcached source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors "https://memcached.org/files/memcached-${{package.version}}.tar.gz" \
        -o /home/build/memcached.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/memcached.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf memcached.tar.gz
      rm memcached.tar.gz

  # Build Memcached from source
  - runs: |
      cd /home/build/memcached-${{package.version}}
      ./configure \
        --prefix=/usr \
        --enable-tls
      make -j$(nproc)

  # Install to destdir
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/memcached-${{package.version}}/memcached "${{targets.destdir}}/usr/bin/"

      # Strip binary
      strip --strip-unneeded "${{targets.destdir}}/usr/bin/memcached"

  # Verify the build
  - runs: |
      echo "Verifying Memcached build..."
      "${{targets.destdir}}/usr/bin/memcached" -h || true
      echo "Checking binary size..."
      ls -lh "${{targets.destdir}}/usr/bin/memcached"

update:
  enabled: true
  github:
    identifier: memcached/memcached
    use-tag: true
    tag-filter: "1.6."
