# Development variant of minimal-zookeeper.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - zookeeper
    - glibc
    - glibc-locale-posix
    - ld-linux
    - ca-certificates-bundle
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - jq
    - git

accounts:
  groups:
    - groupname: zookeeper
      gid: 65532
  users:
    - username: zookeeper
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/zookeeper-entrypoint.sh

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  ZOO_CONFIG: /opt/zookeeper/conf/zoo.cfg
  ZOO_HEAP_OPTS: -Xmx1G -Xms256M

paths:
  - path: /var/zookeeper/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/zookeeper
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-zookeeper-dev"
  org.opencontainers.image.description: "Dev variant of minimal-zookeeper: same server + shell + curl/openssl/jq/git. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/zookeeper"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
