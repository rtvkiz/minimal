# Development variant of minimal-haproxy.
# Same source-built haproxy as prod, plus bash, apk-tools, curl + openssl
# CLI + bind-tools, and socat (the canonical way to talk to haproxy's
# admin socket: `socat - UNIX-CONNECT:/var/lib/haproxy/admin.sock`).
#
# In-house composition (Chainguard's haproxy-public/devConfigs is empty).

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base + haproxy (same as prod)
    - wolfi-baselayout
    - haproxy
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libssl3
    - libcrypto3
    - libpcre2-8-0
    - zlib
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP debugging ---
    - curl

    # --- TLS debugging ---
    - openssl

    # --- DNS debugging (resolver config in haproxy is common to misconfigure) ---
    - bind-tools

    # --- HAProxy admin socket (`socat - UNIX-CONNECT:/...`) ---
    - socat

    # --- JSON parsing for `show servers state` output ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: haproxy
      gid: 65532
  users:
    - username: haproxy
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/haproxy -f /etc/haproxy/haproxy.cfg

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8

paths:
  - path: /etc/haproxy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/haproxy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
    recursive: true
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-haproxy-dev"
  org.opencontainers.image.description: "Dev variant of minimal-haproxy: same haproxy + shell + socat (admin socket) + curl/openssl/dig. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/haproxy"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
