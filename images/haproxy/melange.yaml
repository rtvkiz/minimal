# Melange build configuration for minimal HAProxy
# Builds HAProxy from source with TLS, PCRE2, and compression
# Minimal footprint - single binary

package:
  # Named `haproxy` (not `haproxy-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, so a
  # `-minimal` suffix produced cpe:2.3:a:haproxy-minimal:haproxy-minimal:* —
  # which matches nothing in NVD (indexed as cpe:2.3:a:haproxy:haproxy:*) and
  # nothing in the Wolfi secdb either. Both of grype's matchers therefore
  # missed every HAProxy CVE: a controlled test at this exact version reported
  # 0 findings suffixed vs 14 unsuffixed, including 2 Criticals. HAProxy is a C
  # app with no second identity (Go images get a go-module entry as a fallback;
  # this one has only the apk name), so the suffix made it entirely unscannable.
  name: haproxy
  version: 3.4.0
  epoch: 0
  description: "Minimal HAProxy built from source"
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `haproxy` package today (only versioned haproxy-3.2/haproxy-3.3),
    # but if it ever adds one at a higher version, apk would silently install
    # Wolfi's build instead of this source-built one. provider-priority is
    # evaluated BEFORE version in that comparator, so this pins resolution to
    # our package permanently.
    provider-priority: 100

vars:
  # SHA256 checksum of source tarball - updated by update-versions.yml workflow
  # 2026-08-27: haproxy.org RE-ROLLED the 3.4.0 tarball without regenerating
  # its own published .sha256/.md5, which still describe the artifact they no
  # longer serve. Verified benign before changing this: extracted both the
  # served tarball and the official git tag v3.4.0 — 1496 files each, identical
  # except SUBVERS, which records the same commit 64a3353 at a different
  # abbreviation length (-64a3353 vs -64a335366dc1). Same source, different
  # packaging run.
  sha256: 084aaba7fdf03e2fa64434ddbbf4f79ae9d8e07897898d9662fe478beedf4384

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - linux-headers
      - openssl-dev
      - pcre2-dev
      - zlib-dev

pipeline:
  # Download and verify HAProxy source
  - runs: |
      mkdir -p /home/build
      MINOR_VER=$(echo "${{package.version}}" | cut -d. -f1,2)
      curl -fsSL --retry 8 --retry-all-errors "https://www.haproxy.org/download/${MINOR_VER}/src/haproxy-${{package.version}}.tar.gz" \
        -o /home/build/haproxy.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/haproxy.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf haproxy.tar.gz
      rm haproxy.tar.gz

  # Build HAProxy from source
  - runs: |
      cd /home/build/haproxy-${{package.version}}
      make -j$(nproc) \
        TARGET=linux-glibc \
        USE_OPENSSL=1 \
        USE_PCRE2=1 \
        USE_ZLIB=1 \
        PREFIX=/usr

  # Install to destdir
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/haproxy-${{package.version}}/haproxy "${{targets.destdir}}/usr/bin/"

      # Strip binary
      strip --strip-unneeded "${{targets.destdir}}/usr/bin/haproxy"

  # Verify the build
  - runs: |
      echo "Verifying HAProxy build..."
      "${{targets.destdir}}/usr/bin/haproxy" -v
      echo "Checking binary size..."
      ls -lh "${{targets.destdir}}/usr/bin/haproxy"

update:
  enabled: true
  github:
    identifier: haproxy/haproxy
    use-tag: true
    tag-filter: "v3."
