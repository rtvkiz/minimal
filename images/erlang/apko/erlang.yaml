# Minimal Erlang/OTP image - built from source via melange
# Shell-less is not possible here (see busybox note below). Rebuilt every 6
# hours; patched via versions.yaml + the melange build, not Wolfi's package.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem layout
    - wolfi-baselayout

    # Erlang/OTP, built from source (provider-priority pins this over Wolfi's
    # erlang-29 package — see melange.yaml)
    - erlang

    # busybox only — no bash, no apk-tools (those are -dev).
    #
    # Unlike zot/perl this image cannot be shell-less: OTP ships /usr/bin/erl as
    # a `#!/bin/sh` wrapper that computes ROOTDIR and execs erlexec. Without a
    # shell `erl` dies with "no such file or directory" and only the ELF
    # `escript`/`erlexec` would run. Same family as the kafka/cassandra/rabbitmq
    # images, whose launchers are also shell scripts.
    - busybox

    # Core runtime dependencies
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libstdc++

    # crypto app (OpenSSL), zlib, terminal handling for the shell
    - libcrypto3
    - libssl3
    - zlib
    - ncurses
    - ncurses-terminfo-base

    # TLS/SSL certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/erl

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  LANG: C.UTF-8
  # The BEAM writes .erlang.cookie into $HOME on first distributed start and
  # refuses to boot distribution if it cannot.
  HOME: /tmp
  # Terminal type for the erl shell; without it the line editor is unusable.
  TERM: xterm

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-erlang"
  org.opencontainers.image.description: "Hardened Erlang/OTP runtime built from source with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/erlang"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
