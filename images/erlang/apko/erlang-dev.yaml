# Development variant of minimal-erlang.
# Same Erlang/OTP from prod, plus bash/apk-tools, the C toolchain for building
# NIFs and ports, and rebar3 for building OTP applications.
#
# Runtime template (docs/dev-variants/CONVENTIONS.md).

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem layout
    - wolfi-baselayout

    # Erlang/OTP, built from source (same as prod)
    - erlang

    # Core runtime deps (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libstdc++
    - libcrypto3
    - libssl3
    - zlib
    - ncurses
    - ncurses-terminfo-base
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- C toolchain for NIFs and port drivers ---
    - build-base
    - gcc
    - binutils
    - make
    - pkgconf
    - posix-cc-wrappers
    - linux-headers
    - openssf-compiler-options
    - glibc-dev
    - libstdc++-dev

    # --- OTP build tooling + fetching dependencies ---
    # Our source-built `erlang` package is not split into a -dev subpackage,
    # so erl_nif.h / erl_driver.h ship inside it already (under
    # /usr/lib/erlang/erts-*/include and lib/erl_interface/include).
    - rebar3
    - git

    # --- HTTP/JSON utilities ---
    - curl
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/erl

work-dir: /app

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  LANG: C.UTF-8
  HOME: /tmp
  TERM: xterm

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-erlang-dev"
  org.opencontainers.image.description: "Dev variant of minimal-erlang: same OTP + shell, C toolchain and rebar3. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/erlang"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
