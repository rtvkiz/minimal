# Melange build configuration for minimal-temporal-admin-tools
# Temporal admin and schema tooling built from source

package:
  # Named exactly what upstream calls it. syft derives the apk CPE from this
  # string, so a `-minimal` suffix would produce a CPE matching nothing in NVD
  # and nothing in the Wolfi secdb, and grype would report zero CVEs for the
  # image. See docs/onboarding.md "Package naming and scanner visibility".
  name: temporal-admin-tools
  version: 1.32.0
  epoch: 0
  description: "Temporal admin and schema tooling built from source"
  copyright:
    - license: MIT

vars:
  sha256: a089b27f11b6910ee2ff7e7bb429831f87f1fe3dd6d82419cef3aca24039c47c
  # Secondary upstreams. Each is tracked by its own versions.yaml row
  # (temporal-cli / temporal-tctl) writing these fields, so none of them can
  # freeze silently — that is what check-autoupdate exists to prevent.
  cli_version: 1.8.3
  cli_sha256: 14280dbc5f157373a2b34d7d333dd0c8f1b8506fa9ff5b332edc9048527af6f8
  tctl_version: 1.18.4
  tctl_sha256: 6d4f749754f816b9569459fe6a82c521349dc6dfb75e6419514bae80b4eb6c92

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/temporalio/temporal/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/temporal.tar.gz
      echo "${{vars.sha256}}  /home/build/temporal.tar.gz" | sha256sum -c -
      tar xzf /home/build/temporal.tar.gz -C /home/build && rm /home/build/temporal.tar.gz

      # temporalio/cli — provides the modern `temporal` CLI.
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/temporalio/cli/archive/refs/tags/v${{vars.cli_version}}.tar.gz" \
        -o /home/build/cli.tar.gz
      echo "${{vars.cli_sha256}}  /home/build/cli.tar.gz" | sha256sum -c -
      tar xzf /home/build/cli.tar.gz -C /home/build && rm /home/build/cli.tar.gz

      # temporalio/tctl — the legacy CLI plus its authorization plugin. Upstream
      # still ships both in the server and admin-tools images, so dropping them
      # would break anyone scripting against the official images.
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/temporalio/tctl/archive/refs/tags/v${{vars.tctl_version}}.tar.gz" \
        -o /home/build/tctl.tar.gz
      echo "${{vars.tctl_sha256}}  /home/build/tctl.tar.gz" | sha256sum -c -
      tar xzf /home/build/tctl.tar.gz -C /home/build && rm /home/build/tctl.tar.gz

  - runs: |
      # The schema/admin tools, matching upstream's admin-tools.Dockerfile.
      cd /home/build/temporal-${{package.version}}
      for t in tdbg:./cmd/tools/tdbg \
               temporal-cassandra-tool:./cmd/tools/cassandra \
               temporal-sql-tool:./cmd/tools/sql \
               temporal-elasticsearch-tool:./cmd/tools/elasticsearch; do
        out="${t%%:*}"; pkg="${t##*:}"
        echo "building $out from $pkg"
        GOTOOLCHAIN=local CGO_ENABLED=0 go build \
          -trimpath -ldflags="-s -w -buildid=" -o "/home/build/$out" "$pkg"
      done

  - runs: |
      # `temporal` CLI. Version is a package var (internal/temporalcli.Version,
      # default "0.0.0-DEV"), so it must be injected or the CLI reports DEV.
      cd /home/build/cli-${{vars.cli_version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/temporalio/cli/internal/temporalcli.Version=${{vars.cli_version}}" \
        -o /home/build/temporal \
        ./cmd/temporal

  - runs: |
      # tctl + its authorization plugin.
      #
      # tctl's version is NOT a linkable symbol: cli/app.go assigns
      # `app.Version = "next"` inside NewCliApp(), so -X cannot reach it and
      # upstream ships it reporting "next". Stamp the literal instead, guarded
      # so a restructure upstream fails the build rather than silently
      # reverting to "next".
      cd /home/build/tctl-${{vars.tctl_version}}
      grep -q 'app.Version = "next"' cli/app.go \
        || { echo "FAIL: tctl version literal moved — re-check cli/app.go"; exit 1; }
      sed -i 's/app.Version = "next"/app.Version = "${{vars.tctl_version}}"/' cli/app.go

      GOTOOLCHAIN=local CGO_ENABLED=0 go build -trimpath \
        -ldflags="-s -w -buildid=" -o /home/build/tctl ./cmd/tctl
      GOTOOLCHAIN=local CGO_ENABLED=0 go build -trimpath \
        -ldflags="-s -w -buildid=" -o /home/build/tctl-authorization-plugin \
        ./cmd/plugins/tctl-authorization-plugin

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/tdbg /home/build/temporal-cassandra-tool \
         /home/build/temporal-sql-tool /home/build/temporal-elasticsearch-tool \
         /home/build/temporal /home/build/tctl /home/build/tctl-authorization-plugin \
         "${{targets.destdir}}/usr/bin/"

      # Schema files are the whole point of this image: the sql/cassandra tools
      # apply them, and upstream mounts them at /etc/temporal/schema.
      mkdir -p "${{targets.destdir}}/etc/temporal"
      cp -r /home/build/temporal-${{package.version}}/schema \
            "${{targets.destdir}}/etc/temporal/schema"

  - runs: |
      echo "Verifying temporal-admin-tools build..."
      for b in tdbg temporal-cassandra-tool temporal-sql-tool \
               temporal-elasticsearch-tool temporal tctl tctl-authorization-plugin; do
        ls -lh "${{targets.destdir}}/usr/bin/$b"
      done
      test -d "${{targets.destdir}}/etc/temporal/schema/cassandra"

update:
  enabled: true
  github:
    identifier: temporalio/temporal
    use-tag: true
    tag-filter: "v"
