# Development variant of minimal-temporal-admin-tools
# Dev variant of minimal-temporal-admin-tools: same binaries plus shell, curl, openssl, dig and jq. Not for production.
#
# Runtime shape mirrors the published temporalio/Chainguard images so this is a
# drop-in replacement: uid 1000, TEMPORAL_HOME=/etc/temporal, work-dir
# /etc/temporal.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - temporal-admin-tools
    - ca-certificates-bundle
    - busybox
    - tini
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - jq
    - git

accounts:
  groups:
    - groupname: temporal
      gid: 1000
  users:
    - username: temporal
      uid: 1000
      gid: 1000
  run-as: 1000

entrypoint:
  command: /sbin/tini --

cmd: >-
  sleep infinity

work-dir: /etc/temporal

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  TEMPORAL_HOME: /etc/temporal
  LANG: C.UTF-8

paths:
  - path: /tmp
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-temporal-admin-tools-dev"
  org.opencontainers.image.description: "Dev variant of minimal-temporal-admin-tools: same binaries plus shell, curl, openssl, dig and jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/temporal-admin-tools"
  org.opencontainers.image.licenses: "MIT"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
