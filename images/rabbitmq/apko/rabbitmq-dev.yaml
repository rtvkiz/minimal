# Development variant of minimal-rabbitmq.
# Same RabbitMQ 4 + Erlang 27 as prod, plus bash, apk-tools,
# curl (for management plugin HTTP API), socat, jq.
#
# rabbitmqctl + rabbitmq-diagnostics already ship in the rabbitmq package.
#
# In-house composition.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # RabbitMQ + Erlang (same as prod)
    - rabbitmq
    - erlang-27

    # Core libs (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libstdc++
    - libssl3
    - libcrypto3
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Management HTTP API debugging ---
    - curl
    - socat

    # --- JSON parsing (rabbitmqctl --formatter=json output) ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: rabbitmq
      gid: 65532
  users:
    - username: rabbitmq
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /opt/rabbitmq/sbin/rabbitmq-server

environment:
  PATH: /opt/rabbitmq/sbin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  HOME: /var/lib/rabbitmq
  LANG: C.UTF-8

paths:
  - path: /var/lib/rabbitmq
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
    recursive: true
  - path: /var/log/rabbitmq
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-rabbitmq-dev"
  org.opencontainers.image.description: "Dev variant of minimal-rabbitmq: same broker + shell + curl/socat/jq for HTTP API debugging. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/rabbitmq"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
