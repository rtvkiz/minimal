# Minimal Ollama image - using Wolfi's pre-built packages
# CVE patching via the daily rebuild (Wolfi's `ollama` package is unversioned and
# rolls forward to each upstream release).
#
# CPU inference only: ollama-cpu carries the llama.cpp CPU backends (one per x86
# micro-arch, picked at runtime). No CUDA/ROCm - Wolfi ships no GPU backend
# subpackage, and a GPU image would carry the vendor runtime's EULA.
#
# Models live in $HOME/.ollama (/home/nonroot/.ollama) - mount a volume there.
# Upstream's image runs as root with /root/.ollama; that path does not exist here.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Ollama from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `ollama`)
    - ollama
    # llama.cpp CPU backends (libggml-cpu-*.so) - without it the server starts
    # but cannot load a model
    - ollama-cpu
    - wolfi-baselayout
    # Certificates (model pulls from registry.ollama.ai are HTTPS)
    - ca-certificates-bundle


accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/ollama

cmd: serve

work-dir: /home/nonroot

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  # Same as upstream's image: listen on all interfaces, not just loopback
  OLLAMA_HOST: 0.0.0.0:11434

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot/.ollama
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-ollama"
  org.opencontainers.image.description: "Hardened shell-less Ollama (CPU) built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/ollama"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
