# Development variant of minimal-ollama.
# Same Ollama + CPU backends as prod, plus a shell and debugging tools. Not for production.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Ollama from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `ollama`)
    - ollama
    # llama.cpp CPU backends (libggml-cpu-*.so) - without it the server starts
    # but cannot load a model
    - ollama-cpu
    - wolfi-baselayout
    # Certificates (model pulls from registry.ollama.ai are HTTPS)
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Debugging ---
    - curl
    - openssl
    - bind-tools
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/ollama

cmd: serve

work-dir: /home/nonroot

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  # Same as upstream's image: listen on all interfaces, not just loopback
  OLLAMA_HOST: 0.0.0.0:11434

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot/.ollama
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-ollama-dev"
  org.opencontainers.image.description: "Dev variant of minimal-ollama: same binary + shell + debugging tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/ollama"
  org.opencontainers.image.licenses: "MIT"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
