# Minimal aws-xray-daemon image - built from source via melange
# AWS X-Ray daemon: UDP :2000 in, X-Ray API out.
# Same entry point and default flags as upstream's amazon/aws-xray-daemon image
# (/xray, listening on all interfaces), default config at /etc/amazon/xray/cfg.yaml.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - aws-xray-daemon
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /xray -t 0.0.0.0:2000 -b 0.0.0.0:2000

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin:/usr/sbin:/sbin
  HOME: /tmp

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-aws-xray-daemon"
  org.opencontainers.image.description: "Hardened shell-less aws-xray-daemon built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/aws-xray-daemon"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
