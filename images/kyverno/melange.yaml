# Melange build configuration for minimal-kyverno
# Kyverno policy engine admission controller built from source.

package:
  # Named exactly what upstream calls it, not `kyverno-minimal`: syft derives the
  # apk CPE from this string, so a suffix produces a CPE that matches nothing
  # in NVD and nothing in the Wolfi secdb, and grype then reports zero CVEs
  # for the image. See docs/onboarding.md "Package naming and scanner
  # visibility" (haproxy-minimal: 0 findings vs haproxy: 14, same version).
  name: kyverno
  version: 1.19.1
  epoch: 0
  description: "Kyverno policy engine admission controller built from source."
  copyright:
    - license: Apache-2.0
  dependencies:
    # Wolfi ships a package of this name, and apko resolves a top-level name
    # across ALL repositories picking the highest version — it does not prefer
    # our local repo. provider-priority is evaluated before version in apko's
    # comparator, so this pins resolution to our source build permanently.
    # Without it apk silently installs Wolfi's binary over ours (gitlab-runner
    # and buildkit both hit this).
    provider-priority: 100

vars:
  sha256: f016955f08e3113575380b9155d9c93b8a930567b4439be6702e8ab49734f148

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/kyverno/kyverno/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/kyverno.tar.gz
      echo "${{vars.sha256}}  /home/build/kyverno.tar.gz" | sha256sum -c -
      cd /home/build
      tar xzf kyverno.tar.gz
      rm kyverno.tar.gz

  - runs: |
      cd /home/build/kyverno-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/kyverno/kyverno/pkg/version.BuildVersion=${{package.version}}" \
        -o /home/build/kyverno \
        ./cmd/kyverno

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/kyverno "${{targets.destdir}}/usr/bin/"

  - runs: |
      echo "Verifying kyverno build..."
      ls -lh "${{targets.destdir}}/usr/bin/kyverno"

update:
  enabled: true
  github:
    identifier: kyverno/kyverno
    use-tag: true
    tag-filter: "v"
