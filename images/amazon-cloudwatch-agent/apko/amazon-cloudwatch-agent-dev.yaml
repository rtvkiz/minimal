# Development variant of minimal-amazon-cloudwatch-agent.
# Same contents as prod, plus a shell and debugging tools. Not for production.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - amazon-cloudwatch-agent
    - ca-certificates-bundle
    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Debugging ---
    - curl
    - openssl
    - bind-tools
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /opt/aws/amazon-cloudwatch-agent/bin/start-amazon-cloudwatch-agent

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin:/usr/sbin:/sbin
  HOME: /tmp
  RUN_IN_CONTAINER: "True"

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
  - path: /opt/aws/amazon-cloudwatch-agent/etc
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.d
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/aws/amazon-cloudwatch-agent/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/aws/amazon-cloudwatch-agent/var
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-amazon-cloudwatch-agent-dev"
  org.opencontainers.image.description: "Dev variant of minimal-amazon-cloudwatch-agent: same binary + shell + debugging tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/amazon-cloudwatch-agent"
  org.opencontainers.image.licenses: "MIT"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
