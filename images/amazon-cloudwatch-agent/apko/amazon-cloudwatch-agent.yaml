# Minimal amazon-cloudwatch-agent image - built from source via melange
# Amazon CloudWatch Agent, laid out like upstream's amazon/cloudwatch-agent image
# (/opt/aws/amazon-cloudwatch-agent, start-amazon-cloudwatch-agent as the entry point).
# start-amazon-cloudwatch-agent runs config-translator, then execs the agent -
# all Go, no shell. Config comes from CW_CONFIG_CONTENT or a file mounted at
# /etc/cwagentconfig, exactly as upstream. The translator writes its output
# into etc/, so etc/, logs/ and var/ are owned by nonroot.
# Container Insights DaemonSets that read host paths (/rootfs, /var/run/docker.sock)
# must grant that access in the pod spec, as with upstream.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - amazon-cloudwatch-agent
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /opt/aws/amazon-cloudwatch-agent/bin/start-amazon-cloudwatch-agent

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin:/usr/sbin:/sbin
  HOME: /tmp
  RUN_IN_CONTAINER: "True"

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
  - path: /opt/aws/amazon-cloudwatch-agent/etc
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.d
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/aws/amazon-cloudwatch-agent/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/aws/amazon-cloudwatch-agent/var
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-amazon-cloudwatch-agent"
  org.opencontainers.image.description: "Hardened shell-less amazon-cloudwatch-agent built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/amazon-cloudwatch-agent"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
