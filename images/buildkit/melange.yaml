# Melange build configuration for minimal BuildKit
# Go from source. Two binaries: `buildkitd` (the build daemon) and `buildctl`
# (its client). License: Apache-2.0 (the Moby authors).
#
# Wolfi ships a `buildkitd` package, but this is a source build so the image
# tracks upstream releases directly rather than Wolfi's packaging cadence.

package:
  # Named `buildkit` (not `buildkit-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name; a suffix
  # produces cpe:2.3:a:buildkit-minimal:buildkit-minimal:*, matching nothing.
  name: buildkit
  version: 0.33.0
  epoch: 0
  description: "Minimal BuildKit concurrent container image builder built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # Wolfi has no package called `buildkit`, but its `buildkitd` package
    # *provides* `buildkit`, and apk resolves a top-level request against
    # provides as well as names. Our 0.33.0 currently outranks their 0.27.1 on
    # version alone, so the right package installs today — by luck, not by rule.
    # The day Wolfi ships a newer buildkitd, apko would silently install theirs
    # instead of this source build. provider-priority is evaluated before
    # version, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of buildkit source tarball - updated by update-versions.yml workflow
  sha256: c365476e1b10e27a2ab809e3a7a6dcd0647a60fa6e8917799b894d4127af7306

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git
      # buildkitd is built with the `seccomp` tag, which is cgo and links
      # libseccomp. The -static archive keeps the result a static binary so the
      # runtime image needs no libseccomp of its own. See the build step.
      - libseccomp-dev
      - libseccomp-static

pipeline:
  # Download and verify buildkit source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/moby/buildkit/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/buildkit.tar.gz

      echo "${{vars.sha256}}  /home/build/buildkit.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf buildkit.tar.gz
      rm buildkit.tar.gz

  # buildctl is the client: pure Go, no cgo, nothing platform-specific.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      _pgd_workfix() {  # raise an enclosing go.work above every member's go directive
        # A go.work whose `go` directive sits below a bumped member's requirement
        # hard-fails every go command in the tree — even under GOWORK=off — before
        # the build is reached. x/crypto v0.56.0 declares go 1.26.0, which stranded
        # prometheus (go.work at 1.25.8) and etcd (1.26). Raise the workspace to the
        # build toolchain first so a bump can never sit above it; the explicit
        # go.work argument keeps `go work edit` working under GOWORK=off. No-op for
        # the majority of images, which ship no workspace at all.
        _d="$1"
        while [ -n "$_d" ] && [ "$_d" != "/" ]; do
          if [ -f "$_d/go.work" ]; then
            _gv=$(go env GOVERSION | sed 's/^go//')
            echo "pgd-work: raising $_d/go.work go directive to $_gv"
            ( cd "$_d" && go work edit -go="$_gv" go.work ) || true
            return 0
          fi
          _d=$(dirname "$_d")
        done
      }
      for root in /home/build/buildkit-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        _pgd_workfix "$root"
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter github.com/moby/go-archive@v0.3.0 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/buildkit-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/moby/buildkit/version.Version=v${{package.version}} \
          -X github.com/moby/buildkit/version.Revision=v${{package.version}} \
          -X github.com/moby/buildkit/version.Package=github.com/moby/buildkit" \
        -o /home/build/buildctl-bin \
        ./cmd/buildctl

  # buildkitd keeps upstream's build tags, and the `seccomp` one is the reason
  # this step is CGO_ENABLED=1 while everything else in this catalogue is 0:
  # seccomp support links libseccomp through cgo. Dropping the tag would build a
  # simpler pure-Go daemon that silently runs every build container WITHOUT a
  # seccomp profile — a security regression upstream does not ship, and not one
  # a hardened image should introduce. `-extldflags -static` plus
  # libseccomp-static keeps the binary static anyway, so the runtime image gains
  # no shared-library dependency from this.
  #
  # osusergo/netgo force Go's own user and DNS resolvers instead of glibc's,
  # which is what makes a cgo-enabled binary safe to run in a distroless image.
  # no_btrfs drops the btrfs snapshotter (needs btrfs headers, unused here).
  - runs: |
      cd /home/build/buildkit-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=1 go build \
        -trimpath \
        -tags "osusergo netgo static_build seccomp no_btrfs" \
        -ldflags="-s -w -buildid= \
          -X github.com/moby/buildkit/version.Version=v${{package.version}} \
          -X github.com/moby/buildkit/version.Revision=v${{package.version}} \
          -X github.com/moby/buildkit/version.Package=github.com/moby/buildkit \
          -extldflags '-static'" \
        -o /home/build/buildkitd-bin \
        ./cmd/buildkitd

  # Install binaries
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/buildctl-bin "${{targets.destdir}}/usr/bin/buildctl"
      cp /home/build/buildkitd-bin "${{targets.destdir}}/usr/bin/buildkitd"
      chmod 0755 "${{targets.destdir}}/usr/bin/buildctl" "${{targets.destdir}}/usr/bin/buildkitd"

  # Verify the build. `file`-free static check: a dynamically linked buildkitd
  # would carry an INTERP segment and fail to run in the distroless image.
  - runs: |
      echo "Verifying buildkit binaries..."
      "${{targets.destdir}}/usr/bin/buildctl" --version
      "${{targets.destdir}}/usr/bin/buildkitd" --version
