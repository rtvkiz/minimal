# Melange build configuration for minimal OSV-Scanner
# Pure Go from source. Single static `osv-scanner` binary (SCA / vuln scanner).
# License: Apache-2.0 (Google / OSV authors).

package:
  # Named `osv-scanner` (not `osv-scanner-minimal`) so vulnerability scanners
  # can identify it. Syft derives a package's CPE from its apk name, and every
  # CPE it generated kept -minimal in the product field
  # (cpe:2.3:a:osv-scanner:osv-scanner-minimal:*,
  # cpe:2.3:a:osv-scanner-minimal:osv-scanner-minimal:*, ...). NVD indexes this
  # product bare, as cpe:2.3:a:osv-scanner:osv-scanner:*, so none of them
  # matched, and the Wolfi secdb missed it too.
  name: osv-scanner
  version: 2.5.1
  epoch: 0
  description: "Minimal OSV-Scanner (dependency vulnerability scanner) built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `osv-scanner`, so without this apk could install Wolfi's build
    # instead of this source-built one. provider-priority is evaluated BEFORE
    # version in that comparator, so this pins resolution to our package
    # permanently.
    provider-priority: 100

vars:
  # SHA256 of osv-scanner source tarball - updated by update-versions.yml workflow
  sha256: 9a81d802aa0c0f667f8a80a045d4bab058fb9d9a6fb21f5cf2f1ea2007f73eef

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify osv-scanner source
  - runs: |
      mkdir -p /home/build/osv-scanner-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/google/osv-scanner/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/osv-scanner.tar.gz

      echo "${{vars.sha256}}  /home/build/osv-scanner.tar.gz" | sha256sum -c -

      tar xzf /home/build/osv-scanner.tar.gz -C /home/build/osv-scanner-${{package.version}} --strip-components=1
      rm /home/build/osv-scanner.tar.gz

  # Version is reported via internal/version.OSVVersion (see upstream .goreleaser).
  # CGO_ENABLED=0 gives a static binary.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      _pgd_workfix() {  # raise an enclosing go.work above every member's go directive
        # A go.work whose `go` directive sits below a bumped member's requirement
        # hard-fails every go command in the tree — even under GOWORK=off — before
        # the build is reached. x/crypto v0.56.0 declares go 1.26.0, which stranded
        # prometheus (go.work at 1.25.8) and etcd (1.26). Raise the workspace to the
        # build toolchain first so a bump can never sit above it; the explicit
        # go.work argument keeps `go work edit` working under GOWORK=off. No-op for
        # the majority of images, which ship no workspace at all.
        _d="$1"
        while [ -n "$_d" ] && [ "$_d" != "/" ]; do
          if [ -f "$_d/go.work" ]; then
            _gv=$(go env GOVERSION | sed 's/^go//')
            echo "pgd-work: raising $_d/go.work go directive to $_gv"
            ( cd "$_d" && go work edit -go="$_gv" go.work ) || true
            return 0
          fi
          _d=$(dirname "$_d")
        done
      }
      for root in /home/build/osv-scanner-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        _pgd_workfix "$root"
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter github.com/klauspost/compress@v1.18.7 github.com/yuin/goldmark@v1.7.17 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.1 go.opentelemetry.io/otel@v1.46.0 golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/osv-scanner-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/google/osv-scanner/v2/internal/version.OSVVersion=${{package.version}}" \
        -o /home/build/osv-scanner-bin \
        ./cmd/osv-scanner

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/osv-scanner-bin "${{targets.destdir}}/usr/bin/osv-scanner"
      chmod 0755 "${{targets.destdir}}/usr/bin/osv-scanner"

  # Verify the build
  - runs: |
      echo "Verifying osv-scanner binary..."
      "${{targets.destdir}}/usr/bin/osv-scanner" --version
