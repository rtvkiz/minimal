# Melange build configuration for minimal OpenTelemetry Collector
# Builds otelcorecol from source (Go) — vendor-agnostic telemetry pipeline
# Receives OTLP traces/metrics/logs; ships with debug + OTLP exporters

package:
  # Named `otelcol` (not `otelcol-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:otelcol:otelcol-minimal:*,
  # cpe:2.3:a:otelcol-minimal:otelcol-minimal:*, ...). NVD indexes this product
  # bare, as cpe:2.3:a:otelcol:otelcol:*, so none of them matched, and the
  # Wolfi secdb missed it too.
  name: otelcol
  version: 0.159.0
  epoch: 0
  description: "Minimal OpenTelemetry Collector built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `otelcol` package today, but if it ever adds one at a higher
    # version, apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  sha256: 3a28ae62c568e73205fc0313f7ed085ef4686db76ea663a2db46bf2dcac7e72b

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/open-telemetry/opentelemetry-collector/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/otelcol.tar.gz
      echo "${{vars.sha256}}  /home/build/otelcol.tar.gz" | sha256sum -c -
      cd /home/build && tar xzf otelcol.tar.gz && rm otelcol.tar.gz

  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/opentelemetry-collector-${{package.version}}/cmd/otelcorecol; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get google.golang.org/grpc@v1.82.1 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/opentelemetry-collector-${{package.version}}/cmd/otelcorecol
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X go.opentelemetry.io/collector/internal/version.Version=${{package.version}}" \
        -o otelcol \
        .

  - runs: |
      cd /home/build/opentelemetry-collector-${{package.version}}/cmd/otelcorecol

      mkdir -p "${{targets.destdir}}/usr/bin"
      cp otelcol "${{targets.destdir}}/usr/bin/"

      # Default config: OTLP receiver → debug exporter for all signals
      mkdir -p "${{targets.destdir}}/etc/otelcol"
      cat > "${{targets.destdir}}/etc/otelcol/config.yaml" << 'EOF'
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch:

      exporters:
        debug:
          verbosity: normal

      extensions:
        zpages:
          endpoint: 0.0.0.0:55679

      service:
        extensions: [zpages]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]
          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]
      EOF

  - runs: |
      echo "Verifying OTel Collector build..."
      "${{targets.destdir}}/usr/bin/otelcol" --version
      ls -lh "${{targets.destdir}}/usr/bin/otelcol"

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector
    use-tag: true
    tag-filter: "v0."
