# Melange build configuration for minimal Gitea
# Builds Gitea from source (Go + Node.js frontend) with SQLite support
# CGO_ENABLED=1 required for SQLite — produces dynamically linked binary

package:
  # Named `gitea` (not `gitea-minimal`) so vulnerability scanners can identify
  # it. Syft derives a package's CPE from its apk name, and every CPE it
  # generated kept -minimal in the product field
  # (cpe:2.3:a:gitea:gitea-minimal:*, cpe:2.3:a:gitea-minimal:gitea-minimal:*,
  # ...). NVD indexes this product bare, as cpe:2.3:a:gitea:gitea:*, so none of
  # them matched, and the Wolfi secdb missed it too.
  name: gitea
  version: 1.27.2
  epoch: 0
  description: "Minimal Gitea git hosting server built from source"
  copyright:
    - license: MIT
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `gitea`, so without this apk could install Wolfi's build instead of
    # this source-built one. provider-priority is evaluated BEFORE version in
    # that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 checksum of source tarball
  sha256: 343cea5b32511b4bba9e721acf5fe4f726d83ec5ea09aa65ccce6a7fb35dfc7b

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git
      # Frontend build dependencies
      - nodejs-26
      - pnpm
      # SQLite support (CGO_ENABLED=1)
      - sqlite-dev

pipeline:
  # Download and verify Gitea source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors "https://github.com/go-gitea/gitea/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/gitea.tar.gz

      echo "${{vars.sha256}}  /home/build/gitea.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf gitea.tar.gz
      rm gitea.tar.gz


  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      for root in /home/build/gitea-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter github.com/Azure/go-ntlmssp@v0.1.1 github.com/go-git/go-git/v5@v5.19.2 github.com/klauspost/compress@v1.18.7 golang.org/x/image@v0.45.0 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.82.1 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  # Build frontend assets and backend binary via Makefile
  # make frontend: pnpm install + vite build
  # make backend:  go generate (creates bindata.dat embeds) + go build
  - runs: |
      cd /home/build/gitea-${{package.version}}
      GOTOOLCHAIN=local \
      TAGS="bindata sqlite sqlite_unlock_notify" \
      CGO_ENABLED=1 \
      EXTRA_GOFLAGS="-trimpath" \
      GITEA_VERSION=${{package.version}} \
      make build

  # Install to destdir
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/gitea-${{package.version}}/gitea "${{targets.destdir}}/usr/bin/"

  # Verify the build
  - runs: |
      echo "Verifying Gitea build..."
      "${{targets.destdir}}/usr/bin/gitea" --version
      echo "Checking binary size..."
      ls -lh "${{targets.destdir}}/usr/bin/gitea"

update:
  enabled: true
  github:
    identifier: go-gitea/gitea
    use-tag: true
    tag-filter: "v1."
