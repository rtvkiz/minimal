# Melange build configuration for minimal NATS Server
# Builds NATS from source (Go) with static binary
# CGO_ENABLED=0 produces fully static binary - zero runtime deps beyond glibc

package:
  # Named `nats-server` (not `nats-minimal`, and NOT bare `nats`) so
  # vulnerability scanners can identify it. Syft derives a package's CPE from
  # its apk name, and the -minimal suffix kept landing in the product field
  # (cpe:2.3:a:nats:nats-minimal:*, ...), matching nothing in NVD.
  #
  # `nats` would be wrong: in Wolfi that name is the NATS *command line
  # interface* (a different program, versioned 0.x), while this package is the
  # NATS *server*. Wolfi ships the server as `nats-server`, and that is the
  # name upstream and NVD use for it. Taking the bare `nats` name would have
  # matched the CLI's advisories against this server and derived a CPE for the
  # wrong product — worse than not matching at all, because the comparison is
  # meaningless rather than merely missing.
  name: nats-server
  version: 2.14.5
  epoch: 0
  description: "Minimal NATS Server built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # `nats-server` (2.12.x) too, so without this apk could install Wolfi's
    # build instead of this source-built one. provider-priority is evaluated
    # BEFORE version in that comparator, so this pins resolution to ours
    # permanently.
    provider-priority: 100

vars:
  # SHA256 checksum of source tarball - updated by update-versions.yml workflow
  sha256: e52606786923a346de676ae238889a79f55df61680f492ee5e2b1353b58418b5

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify NATS source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/nats-io/nats-server/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/nats.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/nats.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf nats.tar.gz
      rm nats.tar.gz

  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      for root in /home/build/nats-server-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter github.com/klauspost/compress@v1.18.7)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  # Build NATS from source (static binary)
  - runs: |
      cd /home/build/nats-server-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -X github.com/nats-io/nats-server/v2/server.VERSION=${{package.version}}" \
        -o nats-server \
        .

  # Install to destdir
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/nats-server-${{package.version}}/nats-server "${{targets.destdir}}/usr/bin/"

  # Verify the build
  - runs: |
      echo "Verifying NATS build..."
      "${{targets.destdir}}/usr/bin/nats-server" --version
      echo "Checking binary size..."
      ls -lh "${{targets.destdir}}/usr/bin/nats-server"

update:
  enabled: true
  github:
    identifier: nats-io/nats-server
    use-tag: true
    tag-filter: "v2."
