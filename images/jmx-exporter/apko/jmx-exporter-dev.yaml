# Development variant of minimal-jmx-exporter. Not intended for production.
#
# Minimal jmx-exporter image - pinned upstream release jars via melange
# Runs the standalone JMX Exporter: scrapes a remote JVM over JMX/RMI and serves
# Prometheus metrics. Mount your exporter config at /etc/jmx_exporter/config.yaml:
#
#   docker run -p 5556:5556 -v ./config.yaml:/etc/jmx_exporter/config.yaml:ro IMAGE
#
# The javaagent jar ships alongside for multi-stage builds:
#   COPY --from=IMAGE /opt/jmx_exporter/jmx_prometheus_javaagent.jar /opt/

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - jmx-exporter
    - openjdk-25-jre
    - openjdk-25-default-jvm
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Debugging ---
    - curl
    - openssl
    - bind-tools
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/java -jar /opt/jmx_exporter/jmx_prometheus_standalone.jar

cmd: 5556 /etc/jmx_exporter/config.yaml

work-dir: /tmp

environment:
  PATH: /usr/lib/jvm/java-25-openjdk/bin:/usr/bin:/bin:/usr/local/bin:/usr/sbin:/sbin
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  HOME: /tmp

paths:
  - path: /etc/jmx_exporter
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-jmx-exporter-dev"
  org.opencontainers.image.description: "Dev variant of minimal-jmx-exporter: same binary + shell + curl/openssl/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/jmx-exporter"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
