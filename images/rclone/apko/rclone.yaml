# Minimal rclone image - rclone cloud storage sync tool, built from source via melange
# Shell-less, distroless. CVE patching via daily rebuilds from upstream source.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - rclone
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# rclone is configured per-invocation: pass flags, or mount a config at
# /data/rclone.conf and point RCLONE_CONFIG at it. Built with CGO_ENABLED=0,
# which drops the FUSE `mount` backend — that needs /dev/fuse and elevated
# privileges a distroless image is not the right place for. Use `rclone serve`
# or `sync`/`copy` instead.

entrypoint:
  command: /usr/bin/rclone

environment:
  PATH: /usr/bin:/bin

# Writable working directory. Both tools need somewhere to place caches and
# config, and a nonroot process cannot create one at runtime.
paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-rclone"
  org.opencontainers.image.description: "Hardened shell-less rclone cloud storage sync tool built from source via melange with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/rclone"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
