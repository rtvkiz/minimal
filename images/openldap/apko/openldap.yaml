# Minimal OpenLDAP image - using Wolfi's pre-built openldap-2.7 packages
#
# Fail-closed by design. The package ships a sample /etc/openldap/slapd.conf
# with `rootpw secret`; slapd reads it when started with no -f/-F. This image
# instead points slapd at /etc/openldap/slapd.d, an empty directory, so it
# refuses to start until you supply your own configuration:
#
#   docker run -v ./slapd.conf:/etc/openldap/slapd.conf:ro IMAGE \
#     -d stats -h "ldap://0.0.0.0:1389/" -f /etc/openldap/slapd.conf
#   (or mount a cn=config tree at /etc/openldap/slapd.d)
#
# Listens on 1389 (unprivileged; Bitnami's port convention) since it runs as
# nonroot. Schemas ship under /etc/openldap/schema; modules under
# /usr/lib/openldap (moduleload back_mdb.so etc.).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    # Versioned line. update-wolfi-packages.yml watches for the next
    # openldap-2.N line and opens a PR for review.
    - openldap-2.7
    - openldap-2.7-back-mdb
    # The overlays and password schemes most directory deployments enable.
    - openldap-2.7-overlay-memberof
    - openldap-2.7-overlay-refint
    - openldap-2.7-overlay-ppolicy
    - openldap-2.7-overlay-syncprov
    - openldap-2.7-overlay-unique
    - openldap-2.7-passwd-argon2
    - openldap-2.7-passwd-pbkdf2
    - openldap-2.7-passwd-sha2
    # ldapsearch/ldapadd/ldapmodify: healthchecks and bootstrapping via
    # `docker exec`, no shell needed.
    - openldap-2.7-clients
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/slapd

# Foreground, log connections/operations, unprivileged port, and the empty
# config dir (fail-closed, see header). Override the whole cmd to use yours.
cmd: -d stats -h ldap://0.0.0.0:1389/ -F /etc/openldap/slapd.d

work-dir: /var/lib/openldap

environment:
  PATH: /usr/bin:/bin
  HOME: /var/lib/openldap

paths:
  - path: /etc/openldap/slapd.d
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /var/lib/openldap
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/openldap/openldap-data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /var/lib/openldap/run
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-openldap"
  org.opencontainers.image.description: "Hardened shell-less OpenLDAP slapd built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/openldap"
  org.opencontainers.image.licenses: "OLDAP-2.8"

archs:
  - x86_64
  - aarch64
