# Development variant of minimal-rethinkdb.
# Same RethinkDB, entrypoint and cmd as prod, plus the dev minimum.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # RethinkDB from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `rethinkdb`)
    - rethinkdb

    # Base filesystem
    - wolfi-baselayout

    # Certificates (TLS connections)
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/rethinkdb
cmd: --bind all --directory /data/rethinkdb_data

work-dir: /data

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-rethinkdb-dev"
  org.opencontainers.image.description: "Dev variant of minimal-rethinkdb: same RethinkDB plus a shell, apk-tools and wget. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/rethinkdb"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
