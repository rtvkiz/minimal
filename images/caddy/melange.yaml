# Melange build configuration for minimal Caddy
# Builds Caddy from source (Go) with static binary
# First Go-based melange build in the project

package:
  # Named `caddy` (not `caddy-minimal`) so vulnerability scanners can identify
  # it. Syft derives a package's CPE from its apk name, and every CPE it
  # generated kept -minimal in the product field
  # (cpe:2.3:a:caddy:caddy-minimal:*, cpe:2.3:a:caddy-minimal:caddy-minimal:*,
  # ...). NVD indexes this product bare, as cpe:2.3:a:caddy:caddy:*, so none of
  # them matched, and the Wolfi secdb missed it too.
  name: caddy
  version: 2.11.4
  epoch: 0
  description: "Minimal Caddy web server built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `caddy`, so without this apk could install Wolfi's build instead of
    # this source-built one. provider-priority is evaluated BEFORE version in
    # that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 checksum of source tarball - updated by update-versions.yml workflow
  sha256: 2c3d02078286a6282cdb4d1d8744077788d556659dac0b64d8ed5886a7e5aeb9

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify Caddy source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/caddyserver/caddy/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/caddy.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/caddy.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf caddy.tar.gz
      rm caddy.tar.gz

  # Caddy v2.11.4 predates cel-go v0.29's InterpretableV2 API. Backport the
  # exact upstream compatibility change from caddyserver/caddy@b2693fb so the
  # patched dependency can be used without building an unreleased Caddy tree.
  # The assertions make this self-expiring: a future Caddy release containing
  # the change passes unchanged, while an unexpected source layout fails closed.
  - runs: |
      celmatcher="/home/build/caddy-${{package.version}}/modules/caddyhttp/celmatcher.go"
      old_count=$(grep -cF '[]interpreter.Interpretable{reqAttr}' "$celmatcher" || true)
      new_count=$(grep -cF '[]interpreter.InterpretableV2{reqAttr}' "$celmatcher" || true)
      if [ "$old_count" -eq 2 ] && [ "$new_count" -eq 0 ]; then
        sed -i 's/\[\]interpreter\.Interpretable{reqAttr}/[]interpreter.InterpretableV2{reqAttr}/g' "$celmatcher"
      elif [ "$old_count" -eq 0 ] && [ "$new_count" -eq 2 ]; then
        echo "Caddy source already contains the cel-go v0.29 compatibility change"
      else
        echo "Unexpected Caddy CEL matcher API shape (old=$old_count, new=$new_count)" >&2
        exit 1
      fi
      test "$(grep -cF '[]interpreter.InterpretableV2{reqAttr}' "$celmatcher")" -eq 2

  # patch-go-deps: auto-generated — do not edit manually (test-and-keep)
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      for root in /home/build/caddy-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-base.mod
          [ -f go.sum ] && cp go.sum .pgd-base.sum || true
          # Probe each candidate CVE fix against the real build; keep the ones
          # that still compile, drop those that need upstream to update its
          # vendored code first (logged, not silent). Patches everything safely
          # patchable now instead of skipping the image wholesale.
          KEPT=""
          for fix in github.com/google/cel-go@v0.29.2   github.com/go-chi/chi/v5@v5.3.0 github.com/klauspost/compress@v1.18.7 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel@v1.46.0 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0 ; do
            cp .pgd-base.mod go.mod
            [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
            if go get $KEPT "$fix" >/dev/null 2>&1 && GOTOOLCHAIN=local CGO_ENABLED=0 go build -mod=mod -o /dev/null ./cmd/caddy >/dev/null 2>&1; then
              KEPT="$KEPT $fix"; echo "pgd-testkeep KEPT: $fix"
            else
              echo "pgd-testkeep dropped (needs upstream): $fix"
            fi
          done
          cp .pgd-base.mod go.mod
          [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
          if [ -n "$KEPT" ]; then _retry go get $KEPT; fi
          go mod tidy -e
          rm -f .pgd-base.mod .pgd-base.sum
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  # Build Caddy from source (static binary)
  - runs: |
      cd /home/build/caddy-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -X github.com/caddyserver/caddy/v2.CustomVersion=v${{package.version}}" \
        -o caddy \
        ./cmd/caddy

  # Install to destdir (no strip needed - Go ldflags already removes debug info)
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/caddy-${{package.version}}/caddy "${{targets.destdir}}/usr/bin/"

  # Verify the build
  - runs: |
      echo "Verifying Caddy build..."
      "${{targets.destdir}}/usr/bin/caddy" version
      echo "Checking binary size..."
      ls -lh "${{targets.destdir}}/usr/bin/caddy"

update:
  enabled: true
  github:
    identifier: caddyserver/caddy
    use-tag: true
    tag-filter: "v2."
