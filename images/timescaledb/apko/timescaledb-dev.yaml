# Development variant of minimal-timescaledb.
# Same PostgreSQL 18 + timescaledb extension as prod, plus shell, apk-tools,
# gosu, curl, socat, jq. Mirrors postgres-slim-dev's delta.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout

    # PostgreSQL server + client + timescaledb extension (same as prod)
    - postgresql-18
    - postgresql-18-base
    - postgresql-18-client
    - postgresql-18-client-base
    - postgresql-18-contrib
    - libpq-18
    - pgaudit-18
    - timescaledb

    # Core libs (same as prod)
    - glibc
    - glibc-locale-posix
    - glibc-locale-en
    - ld-linux
    - libgcc
    - libstdc++
    - libcrypt1
    - libxcrypt
    - libssl3
    - libcrypto3
    - libicu78
    - icu78-data-full
    - cyrus-sasl
    - heimdal-libs
    - krb5-libs
    - krb5-conf
    - keyutils-libs
    - libldap-2.6
    - libverto
    - linux-pam
    - libselinux
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- User-switching in init scripts ---
    - gosu

    # --- HTTP/socket debugging ---
    - curl
    - socat

    # --- JSON parsing for psql output ---
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  # Bare, matching prod and postgres-slim-dev - see timescaledb.yaml for why
  # the preload flag is not baked in here.
  command: /usr/bin/postgres

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  LANG: C.UTF-8
  PGDATA: /var/lib/postgresql/data

paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
    recursive: true
  - path: /var/lib/postgresql/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /var/run/postgresql
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-timescaledb-dev"
  org.opencontainers.image.description: "Dev variant of minimal-timescaledb: same PostgreSQL + extension + shell + psql/curl/socat/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/timescaledb"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
