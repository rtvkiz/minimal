# Development variant of minimal-rust.
# Same toolchain as prod, plus the runtime dev template: shell, apk-tools, the
# full C toolchain, and pkgconf + openssl-dev for the common *-sys crates
# (openssl-sys, the most frequent native dependency in cargo builds).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - rust-1.99
    - gcc
    - binutils
    - glibc-dev
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- C/C++ toolchain for build.rs / cc-rs native code ---
    - build-base
    - make
    - pkgconf
    - posix-cc-wrappers
    - linux-headers
    - openssf-compiler-options
    - libstdc++-dev

    # --- Common -sys crate dependencies ---
    - openssl-dev

    # --- SCM + utilities ---
    - git
    - curl
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/cargo

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-rust-dev"
  org.opencontainers.image.description: "Dev variant of minimal-rust: same toolchain + shell, C toolchain, pkgconf and openssl-dev for -sys crates. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/rust"
  org.opencontainers.image.licenses: "MIT OR Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
