# Minimal Patroni image - using Wolfi's pre-built package
# Shell-less/distroless for security
# CVE patching via the 6-hourly rebuild (Wolfi rolling package)

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Patroni from Wolfi (CVE-patched). Pulls python-3.13 and the py3.13-*
    # runtime deps (psycopg, pysyncobj, boto3, click, prettytable, ...).
    - patroni

    # PostgreSQL itself — Patroni is a *supervisor*: it runs initdb, starts and
    # stops postgres, and promotes/demotes replicas. Without the server binaries
    # the image can only act as a patronictl client. Pinned to the same major
    # the postgres-slim image ships so a cluster is version-consistent.
    - postgresql-18
    - postgresql-18-client

    # Shell — REQUIRED, not a convenience. PostgreSQL's initdb runs
    # `"postgres" -V` through popen(), which execs /bin/sh; with no shell it
    # fails with ENOENT and Patroni cannot bootstrap a cluster at all:
    #   initdb: error: program "postgres" is needed by initdb but was not found
    # This is the "unless the service genuinely needs it" exception in
    # docs/onboarding.md, scoped to the postgres family. busybox only — no bash,
    # no apk-tools; those stay in the -dev variant.
    - busybox

    # Core system libraries
    - glibc
    - ld-linux
    - libgcc

    # Certificates (DCS over TLS: etcd/consul/k8s API)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# Patroni runs in the foreground and takes a single YAML config argument.
#
# apko cannot author file contents and the Wolfi package ships no sample config,
# so there is no default /etc/patroni.yml to point at. Patroni is instead fully
# configurable from the environment (PATRONI_* variables — PATRONI_SCOPE,
# PATRONI_NAME, PATRONI_ETCD3_HOSTS, PATRONI_POSTGRESQL_DATA_DIR, ...), which is
# the container-native path and what this entrypoint assumes.
#
# To use a config file instead, mount it and override the command:
#   docker run -v ./patroni.yml:/etc/patroni.yml minimal-patroni /etc/patroni.yml
#
# Patroni needs a DCS (etcd / consul / kubernetes) to hold cluster state; a
# single-node dev cluster can use the built-in raft DCS (pysyncobj is included).
entrypoint:
  command: /usr/bin/patroni

environment:
  PATH: /usr/bin:/bin
  LANG: C.UTF-8
  # Where Patroni will initdb and run the managed cluster. Must be writable by
  # nonroot; see the paths: entry below.
  PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
  PGDATA: /var/lib/postgresql/data

paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/postgresql/data
    type: directory
    uid: 65532
    gid: 65532
    # 0700 — postgres refuses to start if PGDATA is group/world readable.
    permissions: 0o700
  - path: /run/postgresql
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-patroni"
  org.opencontainers.image.description: "Hardened shell-less Patroni PostgreSQL high-availability supervisor built on Wolfi with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/patroni"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
