# Minimal victoria-logs image - built from source via melange
# VictoriaLogs log database built from source via melange.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - victoria-logs
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/victoria-logs

cmd: >-
  --storageDataPath=/victoria-logs-data
  --httpListenAddr=:9428

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /victoria-logs-data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-victoria-logs"
  org.opencontainers.image.description: "VictoriaLogs is a fast, resource-efficient log database from the VictoriaMetrics team. Built from source, signed with SLSA provenance, rebuilt every six hours."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/victoria-logs"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
