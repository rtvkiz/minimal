# Development variant of minimal-headscale.
contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - headscale
    - ca-certificates-bundle
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - jq
    - git

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/headscale

cmd: >-
  serve

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8
  HOME: /tmp

paths:
  - path: /var/lib/headscale
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /etc/headscale
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/run/headscale
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-headscale-dev"
  org.opencontainers.image.description: "Dev variant of minimal-headscale: same binary plus shell, curl, openssl, dig and jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/headscale"
  org.opencontainers.image.licenses: "BSD-3-Clause"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
