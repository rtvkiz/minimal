# Minimal headscale image - built from source via melange
# Headscale self-hosted Tailscale control server, from source.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - headscale
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/headscale

cmd: >-
  serve

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /var/lib/headscale
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /etc/headscale
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/run/headscale
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-headscale"
  org.opencontainers.image.description: "Headscale is a self-hosted open source implementation of the Tailscale control server. Built from source, signed with SLSA provenance, rebuilt every six hours."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/headscale"
  org.opencontainers.image.licenses: "BSD-3-Clause"

archs:
  - x86_64
  - aarch64
