# Development variant of minimal-nginx.
# Same nginx mainline + config packages as prod, plus bash, apk-tools,
# curl + openssl CLI (cert/TLS debugging), bind-tools (DNS resolution
# checks for upstream blocks).
#
# Mirrors Chainguard's nginx-public/devConfigs.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base + nginx (same as prod)
    - wolfi-baselayout
    - nginx-mainline
    - nginx-mainline-config
    - nginx-mainline-fastcgi-params
    - nginx-mainline-mime-types
    - nginx-mainline-package-config
    - nginx-mainline-scgi-params
    - nginx-mainline-uwsgi-params

    # Core libs (same as prod)
    - glibc
    - libgcc
    - libssl3
    - libcrypto3
    - libpcre2-8-0
    - zlib
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/TLS/DNS debugging ---
    - curl
    - openssl
    - bind-tools

    # --- VCS for fetching nginx modules or configs from git ---
    - git

accounts:
  groups:
    - groupname: nginx
      gid: 65532
  users:
    - username: nginx
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/sbin/nginx -g "daemon off;"

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8

paths:
  - path: /var/log/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/cache/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-nginx-dev"
  org.opencontainers.image.description: "Dev variant of minimal-nginx: same nginx mainline + shell + curl/openssl/dig for HTTP/TLS/DNS debugging. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/nginx"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
