contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - wordpress
    # PHP-FPM is the variant this image targets: it speaks FastCGI and expects a
    # web server in front of it (our `nginx` image pairs directly). That matches
    # upstream's most-deployed `wordpress:php-fpm` tag and keeps the web server
    # out of this image's attack surface.
    - php-8.4-fpm
    - php-8.4-fpm-config
    # WordPress core's hard requirements. mysqli is the DB driver core uses;
    # without it WordPress halts at "Your PHP installation appears to be missing
    # the MySQL extension" before serving a single request.
    - php-8.4-mysqli
    - php-8.4-mysqlnd
    - php-8.4-mbstring
    - php-8.4-xml
    - php-8.4-dom
    - php-8.4-curl
    - php-8.4-gd
    - php-8.4-zip
    - php-8.4-exif
    - php-8.4-fileinfo
    - php-8.4-iconv
    - php-8.4-openssl
    - php-8.4-opcache
    - ca-certificates-bundle
    - tini
    # Debugging surface for the dev variant.
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - iputils
    - jq
    - git
    # php CLI so wp-cli-style inspection and `php -r` work interactively.
    - php-8.4

accounts:
  groups:
    - groupname: wordpress
      gid: 65532
  users:
    - username: wordpress
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /sbin/tini -- /usr/bin/php-fpm --nodaemonize

work-dir: /usr/share/wordpress

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  HOME: /tmp
  WORDPRESS_DB_HOST: localhost
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_TABLE_PREFIX: wp_

paths:
  # wp-content is the only tree WordPress writes to at runtime (uploads,
  # plugins, themes). Everything else stays read-only — DISALLOW_FILE_MODS in
  # wp-config.php stops core from attempting to rewrite itself.
  - path: /usr/share/wordpress/wp-content
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
    recursive: true
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-wordpress-dev"
  org.opencontainers.image.description: "Dev variant of minimal-wordpress with a shell, PHP CLI, and network debugging tools"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/wordpress"
  org.opencontainers.image.licenses: "GPL-2.0-or-later"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
