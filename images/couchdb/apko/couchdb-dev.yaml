# Development variant of minimal-couchdb.
# Same CouchDB from prod, plus bash, apk-tools, curl and jq for debugging.
# In-house composition (no public Chainguard couchdb-dev reference).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - couchdb-3.3
    - busybox
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - bash
    - apk-tools
    - wget

    # --- HTTP/JSON utilities ---
    - curl
    - jq

accounts:
  groups:
    - groupname: couchdb
      gid: 65532
  users:
    - username: couchdb
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/couchdb

work-dir: /data

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-couchdb-dev"
  org.opencontainers.image.description: "Dev variant of minimal-couchdb: same CouchDB + shell, curl, jq for debugging. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/couchdb"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
