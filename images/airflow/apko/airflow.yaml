contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - airflow
    - python-3.12
    - ca-certificates-bundle
    - tini
    # SHELL — REQUIRED, not a convenience. This is the same documented exception
    # docs/onboarding.md grants the postgres family. BashOperator is one of the
    # most-used operators in Airflow and execs the command through /bin/sh;
    # without a shell every BashOperator task fails at runtime with ENOENT while
    # the scheduler itself looks healthy, which is a far worse failure mode than
    # shipping busybox. busybox ONLY — never bash, never apk-tools. test.sh
    # asserts sh is present (regression guard) and bash/apk are absent
    # (restraint guard).
    - busybox

accounts:
  groups:
    - groupname: airflow
      gid: 65532
  users:
    - username: airflow
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /sbin/tini -- /usr/bin/airflow

work-dir: /opt/airflow

environment:
  PATH: /opt/airflow/venv/bin:/usr/bin:/bin
  HOME: /tmp
  AIRFLOW_HOME: /opt/airflow
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

paths:
  - path: /opt/airflow
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/airflow/dags
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/airflow/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-airflow"
  org.opencontainers.image.description: "Hardened Apache Airflow built from the ASF source distribution"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/airflow"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
