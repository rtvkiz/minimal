contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - airflow
    - python-3.12
    - ca-certificates-bundle
    - tini
    # Full debugging surface; the dev variant is expected to have a shell.
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools
    - iputils
    - jq
    - git

accounts:
  groups:
    - groupname: airflow
      gid: 65532
  users:
    - username: airflow
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /sbin/tini -- /usr/bin/airflow

work-dir: /opt/airflow

environment:
  PATH: /opt/airflow/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  HOME: /tmp
  AIRFLOW_HOME: /opt/airflow
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

paths:
  - path: /opt/airflow
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/airflow/dags
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/airflow/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-airflow-dev"
  org.opencontainers.image.description: "Dev variant of minimal-airflow with a shell, package manager, and network debugging tools"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/airflow"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
