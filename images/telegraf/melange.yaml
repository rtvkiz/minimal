# Melange build configuration for minimal Telegraf
# Builds Telegraf from source (Go) — all core input/output plugins, no plugin
# signing. Default agent loop, HTTP/file/cpu/mem/net/disk inputs, file/http/
# prometheus_client/influxdb outputs all work fully.

package:
  # Named `telegraf` (not `telegraf-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:telegraf:telegraf-minimal:*,
  # cpe:2.3:a:telegraf-minimal:telegraf-minimal:*, ...). NVD indexes this
  # product bare, as cpe:2.3:a:telegraf:telegraf:*, so none of them matched,
  # and the Wolfi secdb missed it too.
  name: telegraf
  version: 1.40.0
  epoch: 0
  description: "Minimal Telegraf metrics agent built from source"
  copyright:
    - license: MIT
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `telegraf` package today, but if it ever adds one at a higher
    # version, apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 checksum of source tarball - updated by update-versions.yml workflow
  sha256: edef75c677e2c2d8b32848397fe9a4736a1b81e3c170b9bedf77d952ae5fa1db

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify Telegraf source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors "https://github.com/influxdata/telegraf/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/telegraf.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/telegraf.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf telegraf.tar.gz
      rm telegraf.tar.gz

  # Build Telegraf from source (static binary)
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      _pgd_get() {  # go get, resolving conflicts BETWEEN pins in the same batch
        # _pgd_filter compares each pin against the graph as it is BEFORE this
        # batch, so it structurally cannot see a conflict introduced by a SIBLING
        # pin. Bumping sigstore/fulcio to v1.8.6 raises fulcio own docker/cli
        # requirement to v29.4.0, which contradicts our docker/cli@v29.2.1 pin,
        # and go then rejects the whole batch: "requires X@vHI, not X@vLO".
        # Six images failed that way at once (PR #677) and, because the bot opens
        # one shared PR, they blocked every other image patches too.
        #
        # Raise the losing pin to vHI and retry: vHI is above the CVE fix, so the
        # fix is kept rather than dropped. This only ever raises. A vHI BELOW our
        # pin would mean satisfying the sibling un-fixes the CVE, so that case
        # fails loudly instead of silently shipping a downgrade.
        #
        # Parsed with parameter expansion, not sed: backslashes are stripped
        # twice on the way into the melange file (bash double quotes, then
        # printf %b), so a sed backreference silently arrives empty.
        _args="$*"
        _i=0
        while :; do
          _err=$(go get $_args 2>&1) && return 0
          echo "$_err" >&2
          _line=$(echo "$_err" | grep -m1 ", not " || true)
          [ -n "$_line" ] || return 1
          _rp=${_line##*requires }
          _hp=${_rp%%,*}
          _lp=${_rp##*not }
          _m=${_hp%@*}
          _hi=${_hp##*@}
          _lo=${_lp##*@}
          [ -n "$_m" ] && [ -n "$_hi" ] || return 1
          _top=$( { echo "$_lo"; echo "$_hi"; } | sort -V | tail -1 )
          if [ "$_top" != "$_hi" ]; then
            echo "pgd-conflict: $_m needs $_hi but our CVE pin is $_lo - refusing to downgrade" >&2
            return 1
          fi
          echo "pgd-raise: $_m $_lo -> $_hi (required by a sibling pin, still >= the CVE fix)" >&2
          _new=""
          _hit=0
          for _a in $_args; do
            case "$_a" in
              "$_m@"*) _new="$_new $_m@$_hi"; _hit=1 ;;
              *) _new="$_new $_a" ;;
            esac
          done
          [ "$_hit" = 1 ] || { echo "pgd-conflict: $_m is not one of our pins" >&2; return 1; }
          _args="$_new"
          _i=$((_i + 1))
          [ "$_i" -ge 6 ] && return 1
        done
      }
      _pgd_workfix() {  # raise an enclosing go.work above every member's go directive
        # A go.work whose `go` directive sits below a bumped member's requirement
        # hard-fails every go command in the tree — even under GOWORK=off — before
        # the build is reached. x/crypto v0.56.0 declares go 1.26.0, which stranded
        # prometheus (go.work at 1.25.8) and etcd (1.26). Raise the workspace to the
        # build toolchain first so a bump can never sit above it; the explicit
        # go.work argument keeps `go work edit` working under GOWORK=off. No-op for
        # the majority of images, which ship no workspace at all.
        _d="$1"
        while [ -n "$_d" ] && [ "$_d" != "/" ]; do
          if [ -f "$_d/go.work" ]; then
            _gv=$(go env GOVERSION | sed 's/^go//')
            echo "pgd-work: raising $_d/go.work go directive to $_gv"
            ( cd "$_d" && go work edit -go="$_gv" go.work ) || true
            return 0
          fi
          _d=$(dirname "$_d")
        done
      }
      for root in /home/build/telegraf-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        _pgd_workfix "$root"
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8 github.com/aws/aws-sdk-go-v2/service/s3@v1.99.0 github.com/cloudflare/circl@v1.6.3 github.com/containerd/containerd/v2@v2.2.1 github.com/containerd/containerd@v1.7.33 github.com/docker/cli@v29.2.1+incompatible github.com/go-chi/chi/v5@v5.3.0 github.com/go-git/go-billy/v5@v5.9.0 github.com/go-git/go-git/v5@v5.19.1 github.com/go-jose/go-jose/v4@v4.1.4 github.com/klauspost/compress@v1.18.7 github.com/moby/buildkit@v0.28.1 github.com/moby/go-archive@v0.3.0 github.com/nwaples/rardecode/v2@v2.2.2 github.com/opencontainers/selinux@v1.13.1 github.com/ulikunitz/xz@v0.5.15 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.46.0 go.opentelemetry.io/otel/sdk@v1.46.0 go.opentelemetry.io/otel@v1.46.0 golang.org/x/crypto@v0.57.0 golang.org/x/image@v0.45.0 golang.org/x/mod@v0.41.0 golang.org/x/net@v0.59.0 golang.org/x/sync@v0.23.0 golang.org/x/sys@v0.48.0 golang.org/x/term@v0.46.0 golang.org/x/text@v0.42.0 golang.org/x/time@v0.16.0 golang.org/x/tools@v0.50.0 google.golang.org/grpc@v1.83.1 oras.land/oras-go/v2@v2.6.1)
          if [ -n "$_PGDA" ]; then _pgd_get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/telegraf-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X github.com/influxdata/telegraf/internal.Version=${{package.version}} \
          -X github.com/influxdata/telegraf/internal.Branch=HEAD \
          -X github.com/influxdata/telegraf/internal.Commit=melange" \
        -o telegraf \
        ./cmd/telegraf

  # Install to destdir
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/telegraf-${{package.version}}/telegraf "${{targets.destdir}}/usr/bin/"

      # Default configuration file (minimal: agent + http_listener_v2 disabled, cpu input only)
      mkdir -p "${{targets.destdir}}/etc/telegraf"
      cat > "${{targets.destdir}}/etc/telegraf/telegraf.conf" << 'EOF'
      # Minimal Telegraf configuration. Override at runtime by mounting a
      # different telegraf.conf or passing --config <url> to the entrypoint.
      [agent]
        interval = "10s"
        round_interval = true
        metric_batch_size = 1000
        metric_buffer_limit = 10000
        collection_jitter = "0s"
        flush_interval = "10s"
        flush_jitter = "0s"
        precision = ""
        hostname = ""
        omit_hostname = false

      [[inputs.cpu]]
        percpu = true
        totalcpu = true
        collect_cpu_time = false
        report_active = false

      [[outputs.file]]
        files = ["stdout"]
        data_format = "influx"
      EOF

  # Verify the build
  - runs: |
      echo "Verifying Telegraf build..."
      "${{targets.destdir}}/usr/bin/telegraf" --version
      echo "Checking binary size..."
      ls -lh "${{targets.destdir}}/usr/bin/telegraf"

  # Workspace cleanup: telegraf imports github.com/snowflakedb/gosnowflake
  # (via its SQL output plugin). When the verify step above runs
  # `telegraf --version`, the Go runtime fires gosnowflake's init(), which
  # calls os.MkdirAll($HOME/.cache/snowflake, 0o700) to set up its OCSP
  # response cache. The dir ends up at /home/build/.cache/snowflake.
  #
  # After bwrap exits, melange's "store workspace xattrs" step (running as
  # the host runner uid) can't open() a 0700 dir whose owner-uid was
  # remapped by --unshare-user. Earlier `chmod -R u+rwX` was a no-op since
  # the owner already had rwx; the host process needed o+rX. Fix with a+rX.
  - runs: |
      chmod -R a+rX /home/build/.cache 2>/dev/null || true

update:
  enabled: true
  github:
    identifier: influxdata/telegraf
    use-tag: true
    tag-filter: "v1."
