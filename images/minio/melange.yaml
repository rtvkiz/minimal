# Melange build configuration for minimal MinIO
# Builds MinIO from source (Go) with static binary
# CGO_ENABLED=0 produces fully static binary - zero runtime deps beyond glibc

package:
  # Named `minio` (not `minio-minimal`) so vulnerability scanners can identify
  # it. Syft derives a package's CPE from its apk name, and every CPE it
  # generated kept -minimal in the product field
  # (cpe:2.3:a:minio:minio-minimal:*, cpe:2.3:a:minio-minimal:minio-minimal:*,
  # ...). NVD indexes this product bare, as cpe:2.3:a:minio:minio:*, so none of
  # them matched, and the Wolfi secdb missed it too.
  name: minio
  # Date-based version derived from RELEASE tag (e.g. RELEASE.2025-10-15T17-29-55Z → 2025.10.15)
  version: 2025.10.15
  epoch: 0
  description: "Minimal MinIO S3-compatible object storage built from source"
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `minio`, so without this apk could install Wolfi's build instead of
    # this source-built one. provider-priority is evaluated BEFORE version in
    # that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # Full RELEASE tag — used for download URL and ldflags
  # Updated by update-minio.yml workflow
  minio_release: RELEASE.2025-10-15T17-29-55Z
  # SHA256 checksum of source tarball - updated by update-minio.yml workflow
  sha256: be6d0bd3696c3a13a35f02d3a0280b64319c67918b4501c5c3d87f96d000085c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify MinIO source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/minio/minio/archive/refs/tags/${{vars.minio_release}}.tar.gz" \
        -o /home/build/minio.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/minio.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf minio.tar.gz
      rm minio.tar.gz


  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      for root in /home/build/minio-${{vars.minio_release}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter filippo.io/edwards25519@v1.1.1 github.com/Azure/go-ntlmssp@v0.1.1 github.com/apache/thrift@v0.23.0 github.com/buger/jsonparser@v1.1.2 github.com/eclipse/paho.mqtt.golang@v1.5.1 github.com/go-jose/go-jose/v4@v4.1.4 github.com/klauspost/compress@v1.18.7 github.com/prometheus/prometheus@v0.311.3 go.etcd.io/etcd/client/pkg/v3@v3.5.33 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel/sdk@v1.45.0 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  # Build MinIO from source (static binary)
  - runs: |
      cd /home/build/minio-${{vars.minio_release}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X github.com/minio/minio/cmd.Version=${{vars.minio_release}} \
          -X github.com/minio/minio/cmd.ReleaseTag=${{vars.minio_release}} \
          -X github.com/minio/minio/cmd.CommitID=source-build \
          -X github.com/minio/minio/cmd.ShortCommitID=source" \
        -o minio \
        .

  # Install to destdir
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/minio-${{vars.minio_release}}/minio "${{targets.destdir}}/usr/bin/"

  # Verify the build
  - runs: |
      echo "Verifying MinIO build..."
      "${{targets.destdir}}/usr/bin/minio" --version
      echo "Checking binary size..."
      ls -lh "${{targets.destdir}}/usr/bin/minio"

update:
  enabled: true
  github:
    identifier: minio/minio
    use-tag: true
    tag-filter: "RELEASE."
