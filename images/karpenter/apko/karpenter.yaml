# Minimal karpenter image - built from source via melange
# Karpenter node autoscaler controller (AWS provider), /usr/bin/controller.
# Static CGO-off Go binary.
#
# Source-built since 2026-10-31: Wolfi's karpenter-1.12 stopped receiving
# builds in June 2026 and was frozen at 1.12.1.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout
    - karpenter

    # Certificates (Kubernetes API + AWS API are both TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/controller

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-karpenter"
  org.opencontainers.image.description: "Hardened shell-less Karpenter Kubernetes node autoscaler built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/karpenter"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
