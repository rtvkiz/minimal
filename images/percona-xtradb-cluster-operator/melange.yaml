# Melange build configuration for minimal percona-xtradb-cluster-operator
# Percona Operator for MySQL (XtraDB Cluster): runs Galera-replicated MySQL on
# Kubernetes with HAProxy/ProxySQL, backups and point-in-time recovery.
# Go from source, CGO off (static). License: Apache-2.0.
#
# Source-built: Wolfi does not package the operator.
#
# The operator image is also the init-container toolbox: its init containers
# run build/*-init-entrypoint.sh FROM THIS IMAGE to `install` the helper
# binaries and scripts below into the PXC, HAProxy, ProxySQL and backup pods.
# So everything upstream's Dockerfile copies to / is shipped at the same path.

package:
  # Named exactly what upstream calls it — see docs/onboarding.md
  # "Package naming and scanner visibility".
  name: percona-xtradb-cluster-operator
  version: 1.20.0
  epoch: 0
  description: "Minimal percona-xtradb-cluster-operator built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of the source tarball - updated by update-versions.yml workflow
  sha256: 541ef85e2713057ec486f7e2cd482765046a52315f4db9f4f8b2fc0d9bbf2502

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  - runs: |
      mkdir -p /home/build/percona-xtradb-cluster-operator-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/percona/percona-xtradb-cluster-operator/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/percona-xtradb-cluster-operator.tar.gz
      echo "${{vars.sha256}}  /home/build/percona-xtradb-cluster-operator.tar.gz" | sha256sum -c -
      tar xzf /home/build/percona-xtradb-cluster-operator.tar.gz -C /home/build/percona-xtradb-cluster-operator-${{package.version}} --strip-components=1
      rm /home/build/percona-xtradb-cluster-operator.tar.gz

  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      _pgd_get() {  # go get, resolving conflicts BETWEEN pins in the same batch
        # _pgd_filter compares each pin against the graph as it is BEFORE this
        # batch, so it structurally cannot see a conflict introduced by a SIBLING
        # pin. Bumping sigstore/fulcio to v1.8.6 raises fulcio own docker/cli
        # requirement to v29.4.0, which contradicts our docker/cli@v29.2.1 pin,
        # and go then rejects the whole batch: "requires X@vHI, not X@vLO".
        # Six images failed that way at once (PR #677) and, because the bot opens
        # one shared PR, they blocked every other image patches too.
        #
        # Raise the losing pin to vHI and retry: vHI is above the CVE fix, so the
        # fix is kept rather than dropped. This only ever raises. A vHI BELOW our
        # pin would mean satisfying the sibling un-fixes the CVE, so that case
        # fails loudly instead of silently shipping a downgrade.
        #
        # Parsed with parameter expansion, not sed: backslashes are stripped
        # twice on the way into the melange file (bash double quotes, then
        # printf %b), so a sed backreference silently arrives empty.
        _args="$*"
        _i=0
        while :; do
          _err=$(go get $_args 2>&1) && return 0
          echo "$_err" >&2
          _line=$(echo "$_err" | grep -m1 ", not " || true)
          [ -n "$_line" ] || return 1
          _rp=${_line##*requires }
          _hp=${_rp%%,*}
          _lp=${_rp##*not }
          _m=${_hp%@*}
          _hi=${_hp##*@}
          _lo=${_lp##*@}
          [ -n "$_m" ] && [ -n "$_hi" ] || return 1
          _top=$( { echo "$_lo"; echo "$_hi"; } | sort -V | tail -1 )
          if [ "$_top" != "$_hi" ]; then
            echo "pgd-conflict: $_m needs $_hi but our CVE pin is $_lo - refusing to downgrade" >&2
            return 1
          fi
          echo "pgd-raise: $_m $_lo -> $_hi (required by a sibling pin, still >= the CVE fix)" >&2
          _new=""
          _hit=0
          for _a in $_args; do
            case "$_a" in
              "$_m@"*) _new="$_new $_m@$_hi"; _hit=1 ;;
              *) _new="$_new $_a" ;;
            esac
          done
          [ "$_hit" = 1 ] || { echo "pgd-conflict: $_m is not one of our pins" >&2; return 1; }
          _args="$_new"
          _i=$((_i + 1))
          [ "$_i" -ge 6 ] && return 1
        done
      }
      _pgd_workfix() {  # raise an enclosing go.work above every member's go directive
        # A go.work whose `go` directive sits below a bumped member's requirement
        # hard-fails every go command in the tree — even under GOWORK=off — before
        # the build is reached. x/crypto v0.56.0 declares go 1.26.0, which stranded
        # prometheus (go.work at 1.25.8) and etcd (1.26). Raise the workspace to the
        # build toolchain first so a bump can never sit above it; the explicit
        # go.work argument keeps `go work edit` working under GOWORK=off. No-op for
        # the majority of images, which ship no workspace at all.
        _d="$1"
        while [ -n "$_d" ] && [ "$_d" != "/" ]; do
          if [ -f "$_d/go.work" ]; then
            _gv=$(go env GOVERSION | sed 's/^go//')
            echo "pgd-work: raising $_d/go.work go directive to $_gv"
            ( cd "$_d" && go work edit -go="$_gv" go.work ) || true
            return 0
          fi
          _d=$(dirname "$_d")
        done
      }
      for root in /home/build/percona-xtradb-cluster-operator-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        _pgd_workfix "$root"
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter github.com/cert-manager/cert-manager@v1.20.3 github.com/klauspost/compress@v1.20.2 google.golang.org/grpc@v1.83.2 go.opentelemetry.io/otel/trace@v1.47.0 go.opentelemetry.io/otel@v1.47.0 golang.org/x/crypto@v0.59.0 golang.org/x/net@v0.63.0 golang.org/x/sys@v0.50.0 golang.org/x/text@v0.44.0 golang.org/x/term@v0.48.0 golang.org/x/time@v0.16.0 golang.org/x/sync@v0.25.0 golang.org/x/tools@v0.53.0)
          if [ -n "$_PGDA" ]; then _pgd_get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/percona-xtradb-cluster-operator-${{package.version}}
      mkdir -p /home/build/pxc-bin
      # Same six binaries upstream's build/Dockerfile builds.
      for spec in \
        percona-xtradb-cluster-operator:cmd/manager/main.go \
        peer-list:cmd/peer-list/main.go \
        pitr:cmd/pitr/main.go \
        xtrabackup-server-sidecar:cmd/xtrabackup/server/main.go \
        xtrabackup-run-backup:cmd/xtrabackup/run-backup/main.go \
        mysql-state-monitor:cmd/mysql-state-monitor/main.go; do
        out=${spec%%:*}; main=${spec#*:}
        GOTOOLCHAIN=local CGO_ENABLED=0 go build \
          -trimpath \
          -ldflags="-s -w -buildid= -X main.GitCommit=v${{package.version}} -X main.GitBranch=v${{package.version}}" \
          -o /home/build/pxc-bin/$out \
          ./$main
      done

  - runs: |
      d="${{targets.destdir}}"
      src=/home/build/percona-xtradb-cluster-operator-${{package.version}}
      mkdir -p "$d/usr/local/bin" "$d/licenses"
      install -m 0755 /home/build/pxc-bin/percona-xtradb-cluster-operator "$d/usr/local/bin/percona-xtradb-cluster-operator"
      for b in peer-list pitr mysql-state-monitor xtrabackup-server-sidecar xtrabackup-run-backup; do
        install -m 0755 /home/build/pxc-bin/$b "$d/$b"
      done
      # Scripts and configs the init containers install into the data-plane
      # pods - the exact set upstream's Dockerfile COPYs to /.
      for f in pxc-entrypoint.sh pxc-init-entrypoint.sh pitr-init-entrypoint.sh \
        backup-init-entrypoint.sh pxc-configure-pxc.sh liveness-check.sh readiness-check.sh \
        pmm-prerun.sh get-pxc-state wsrep_cmd_notify_handler.sh prepare_restored_cluster.sh \
        haproxy-entrypoint.sh haproxy-init-entrypoint.sh haproxy_add_pxc_nodes.sh \
        haproxy_check_pxc.sh haproxy_liveness_check.sh haproxy_readiness_check.sh \
        proxysql-entrypoint.sh proxysql-init-entrypoint.sh proxysql_add_cluster_nodes.sh \
        proxysql_add_proxysql_nodes.sh proxysql_add_pxc_nodes.sh; do
        install -m 0755 "$src/build/$f" "$d/$f"
      done
      for f in haproxy.cfg haproxy-global.cfg proxysql.cnf proxysql-admin.cnf proxysql_scheduler_config.tmpl; do
        install -m 0644 "$src/build/$f" "$d/$f"
      done
      cp -a "$src/build/logcollector" "$d/logcollector"
      cp -a "$src/build/backup" "$d/backup"
      chmod -R a+rX "$d/logcollector" "$d/backup"
      cp "$src/LICENSE" "$d/licenses/LICENSE"

  - runs: |
      echo "Verifying percona-xtradb-cluster-operator build..."
      "${{targets.destdir}}/usr/local/bin/percona-xtradb-cluster-operator" --help 2>&1 | grep -q "kubeconfig" \
        || { echo "FAIL: operator binary did not run as expected"; exit 1; }
      test -x "${{targets.destdir}}/pxc-init-entrypoint.sh"
      test -x "${{targets.destdir}}/peer-list"
