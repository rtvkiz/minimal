# Minimal percona-xtradb-cluster-operator image - built from source via melange
# Percona Operator for MySQL (XtraDB Cluster), laid out like upstream's image:
# the operator at /usr/local/bin, helper binaries and scripts at /.
#
# Declared prod-shell exception: this image doubles as the init-container
# toolbox. The operator's init containers run /pxc-init-entrypoint.sh,
# /haproxy-init-entrypoint.sh, /proxysql-init-entrypoint.sh,
# /backup-init-entrypoint.sh and /pitr-init-entrypoint.sh FROM THIS IMAGE
# (#!/bin/bash, using install/id/mkdir) to copy helpers into the data-plane
# pods. So bash + busybox ship in prod; apk-tools does not.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - percona-xtradb-cluster-operator
    - ca-certificates-bundle
    - busybox
    - bash

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/local/bin/percona-xtradb-cluster-operator

work-dir: /tmp

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  HOME: /tmp

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-percona-xtradb-cluster-operator"
  org.opencontainers.image.description: "Hardened percona-xtradb-cluster-operator built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/percona-xtradb-cluster-operator"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
