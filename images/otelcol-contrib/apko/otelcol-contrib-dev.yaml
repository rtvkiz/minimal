# Development variant of minimal-otelcol-contrib.
# Same collector as prod, plus a shell and debugging tools. Not for production.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Collector from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `opentelemetry-collector-contrib`)
    - opentelemetry-collector-contrib
    # /otelcol-contrib -> /usr/bin/otelcol-contrib, upstream's entrypoint path
    - opentelemetry-collector-contrib-compat
    - wolfi-baselayout
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Debugging ---
    - curl
    - openssl
    - bind-tools
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /otelcol-contrib

cmd: --config=/etc/otelcol-contrib/config.yaml

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /etc/otelcol-contrib
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-otelcol-contrib-dev"
  org.opencontainers.image.description: "Dev variant of minimal-otelcol-contrib: same collector + shell + debugging tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/otelcol-contrib"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
