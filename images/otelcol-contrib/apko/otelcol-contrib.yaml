# Minimal OpenTelemetry Collector Contrib image - using Wolfi's pre-built packages
# CVE patching via the daily rebuild (Wolfi's `opentelemetry-collector-contrib`
# package is unversioned and rolls forward to each upstream release).
#
# Drop-in for otel/opentelemetry-collector-contrib: /otelcol-contrib entry point
# (the -compat subpackage) and the same default --config path. Like upstream's
# usage, mount your pipeline at /etc/otelcol-contrib/config.yaml. Unlike
# upstream, no demo config is baked in - an apko-only image cannot add files,
# and running with no config fails fast with a clear error instead.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Collector from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `opentelemetry-collector-contrib`)
    - opentelemetry-collector-contrib
    # /otelcol-contrib -> /usr/bin/otelcol-contrib, upstream's entrypoint path
    - opentelemetry-collector-contrib-compat
    - wolfi-baselayout
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /otelcol-contrib

cmd: --config=/etc/otelcol-contrib/config.yaml

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /etc/otelcol-contrib
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-otelcol-contrib"
  org.opencontainers.image.description: "Hardened shell-less OpenTelemetry Collector Contrib built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/otelcol-contrib"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
