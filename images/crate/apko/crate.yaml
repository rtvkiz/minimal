# Minimal CrateDB image
# CrateDB (official release via melange, bundled JDK removed) on Wolfi's
# openjdk-26-jre, the JDK feature release upstream bundles. Shell-less:
# bin/crate is a shell launcher, so the entrypoint is the java command it
# builds (JVM flags copied from bin/crate for 6.5.1; GC file logging off).
#
# The default CMD runs a single node reachable from outside the container:
#   docker run -p 4200:4200 -p 5432:5432 IMAGE
# For a cluster, override CMD with your -C settings (discovery.seed_hosts,
# cluster.initial_master_nodes, network.host...). Heap: JAVA_TOOL_OPTIONS=-Xmx2g.
# Ports: 4200 HTTP/admin UI, 5432 PostgreSQL wire, 4300 transport. Data and
# logs live under /data.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our CrateDB (official release via melange; listed first: build.yml takes
    # the primary package's version from the first line matching `crate`)
    - crate
    # Java runtime: the JDK feature release CrateDB 6.5 bundles
    - openjdk-26-jre
    - openjdk-26-default-jvm
    - wolfi-baselayout
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/lib/jvm/java-26-openjdk/bin/java -Xms256m -Djava.awt.headless=true -XX:+UseG1GC -XX:G1ReservePercent=25 -XX:InitiatingHeapOccupancyPercent=30 -XX:+UseCompactObjectHeaders -Djdk.tls.rejectClientInitiatedRenegotiation=true -Dfile.encoding=UTF-8 -Dlog4j.shutdownHookEnabled=false -Dlog4j2.disable.jmx=true -Dlog4j.skipJansi=true -Dio.netty.recycler.maxCapacityPerThread=0 --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED --add-modules jdk.incubator.vector -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data -Djava.library.path=/usr/share/crate/lib -cp /usr/share/crate/lib/* io.crate.bootstrap.CrateDB -Cpath.home=/usr/share/crate
cmd: -Cnetwork.host=0.0.0.0 -Cdiscovery.type=single-node -Cpath.data=/data/data -Cpath.logs=/data/logs

work-dir: /data

environment:
  PATH: /usr/lib/jvm/java-26-openjdk/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-26-openjdk
  CRATE_HOME: /usr/share/crate
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-crate"
  org.opencontainers.image.description: "Hardened shell-less CrateDB distributed SQL database on OpenJDK 26, built from the official release with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/crate"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
