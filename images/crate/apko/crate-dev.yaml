# Development variant of minimal-crate.
# Same CrateDB, entrypoint and CMD as prod, plus the dev minimum and the
# server template's network debugging tools.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our CrateDB (official release via melange; listed first: build.yml takes
    # the primary package's version from the first line matching `crate`)
    - crate
    # Java runtime: the JDK feature release CrateDB 6.5 bundles
    - openjdk-26-jre
    - openjdk-26-default-jvm
    - wolfi-baselayout
    - ca-certificates-bundle
    # --- Dev variant minimum + server template (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget
    - curl
    - openssl
    - bind-tools

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/lib/jvm/java-26-openjdk/bin/java -Xms256m -Djava.awt.headless=true -XX:+UseG1GC -XX:G1ReservePercent=25 -XX:InitiatingHeapOccupancyPercent=30 -XX:+UseCompactObjectHeaders -Djdk.tls.rejectClientInitiatedRenegotiation=true -Dfile.encoding=UTF-8 -Dlog4j.shutdownHookEnabled=false -Dlog4j2.disable.jmx=true -Dlog4j.skipJansi=true -Dio.netty.recycler.maxCapacityPerThread=0 --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED --add-modules jdk.incubator.vector -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data -Djava.library.path=/usr/share/crate/lib -cp /usr/share/crate/lib/* io.crate.bootstrap.CrateDB -Cpath.home=/usr/share/crate
cmd: -Cnetwork.host=0.0.0.0 -Cdiscovery.type=single-node -Cpath.data=/data/data -Cpath.logs=/data/logs

work-dir: /data

environment:
  PATH: /usr/lib/jvm/java-26-openjdk/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-26-openjdk
  CRATE_HOME: /usr/share/crate
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-crate-dev"
  org.opencontainers.image.description: "Dev variant of minimal-crate: same CrateDB plus a shell, curl, openssl, bind-tools and apk-tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/crate"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
