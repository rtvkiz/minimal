# Melange build configuration for minimal elasticsearch-exporter
# Exposes Elasticsearch/OpenSearch cluster metrics for Prometheus on :9114. Point it at a cluster with --es.uri (default http://localhost:9200).
# The upstream binary keeps its underscore name (elasticsearch_exporter); image and package use
# the catalog's hyphenated convention, same as mysqld-exporter.
# Pure Go from source, CGO off (static, shell-less). License: Apache-2.0.

package:
  # Named exactly what upstream calls it, not `elasticsearch-exporter-minimal` — see
  # docs/onboarding.md "Package naming and scanner visibility".
  name: elasticsearch-exporter
  version: 1.11.0
  epoch: 0
  description: "Minimal Elasticsearch Exporter built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of the source tarball - updated by update-versions.yml workflow
  sha256: ba4dd128bd5b4362bbde9063979e21fbc71b0b351673f4a12cecefbc566521d8

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  - runs: |
      mkdir -p /home/build/elasticsearch-exporter-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/prometheus-community/elasticsearch_exporter/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/elasticsearch-exporter.tar.gz
      echo "${{vars.sha256}}  /home/build/elasticsearch-exporter.tar.gz" | sha256sum -c -
      tar xzf /home/build/elasticsearch-exporter.tar.gz -C /home/build/elasticsearch-exporter-${{package.version}} --strip-components=1
      rm /home/build/elasticsearch-exporter.tar.gz

  - runs: |
      cd /home/build/elasticsearch-exporter-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/prometheus/common/version.Version=${{package.version}}" \
        -o /home/build/elasticsearch_exporter-bin \
        .

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/elasticsearch_exporter-bin "${{targets.destdir}}/usr/bin/elasticsearch_exporter"
      chmod 0755 "${{targets.destdir}}/usr/bin/elasticsearch_exporter"

  - runs: |
      echo "Verifying elasticsearch-exporter binary and injected version..."
      "${{targets.destdir}}/usr/bin/elasticsearch_exporter" --version 2>&1 | grep -q "version ${{package.version}}" \
        || { echo "FAIL: version ${{package.version}} not reported - ldflag wrong?"; exit 1; }
