# Minimal Azure CLI image - built from source via melange
# azure-cli venv at /opt/az on Wolfi's python-3.14 (pulled in as the
# package's runtime dependency). Shell-less: the `az` launcher is a Python
# script (melange replaces pip's bash wrapper), so no /bin/sh is needed.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Azure CLI venv (built from source via melange; depends on python-3.14)
    - azure-cli

    # Certificates (Azure Resource Manager / Entra ID over TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/az

work-dir: /workspace

# HOME=/tmp: az keeps its config, token cache and installed extensions in
# $HOME/.azure = /tmp/.azure. Mount a volume there (or set AZURE_CONFIG_DIR)
# to keep a login between runs.
environment:
  PATH: /opt/az/bin:/usr/bin:/bin
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /workspace
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # Pre-created and nonroot-owned so a volume mounted here (to keep a login)
  # inherits 65532 ownership; otherwise Docker creates the mount point as
  # root and az fails with PermissionError on azureProfile.json.
  - path: /tmp/.azure
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-azure-cli"
  org.opencontainers.image.description: "Hardened shell-less Azure CLI image built from source via melange with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/azure-cli"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
