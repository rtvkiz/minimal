# Development variant of minimal-azure-cli.
# Same Azure CLI as prod, plus shell, apk-tools and the tools az scripts
# commonly pipe through or shell out to (jq, curl, git, ssh for `az ssh`).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - azure-cli
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Scripting + az subcommand helpers ---
    - curl
    - jq
    - git
    - openssh-client

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/az

work-dir: /workspace

environment:
  PATH: /opt/az/bin:/usr/bin:/bin
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /workspace
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # Pre-created and nonroot-owned so a volume mounted here (to keep a login)
  # inherits 65532 ownership; otherwise Docker creates the mount point as
  # root and az fails with PermissionError on azureProfile.json.
  - path: /tmp/.azure
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-azure-cli-dev"
  org.opencontainers.image.description: "Dev variant of minimal-azure-cli: same az + shell, jq, git and ssh for scripting. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/azure-cli"
  org.opencontainers.image.licenses: "MIT"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
