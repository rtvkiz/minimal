# Minimal mysqld-exporter image - built from source via melange
# Exposes MySQL/MariaDB metrics for Prometheus on :9104. Configure the target with
# --mysqld.address/--mysqld.username plus MYSQLD_EXPORTER_PASSWORD, or a mounted
# --config.my-cnf file.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - mysqld-exporter
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/mysqld_exporter

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-mysqld-exporter"
  org.opencontainers.image.description: "Hardened shell-less MySQL Server Exporter built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/mysqld-exporter"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
