# Melange build configuration for minimal mysqld-exporter
# Exposes MySQL/MariaDB server metrics for Prometheus on :9104. The upstream binary
# keeps its underscore name (mysqld_exporter); image and package use the catalog's
# hyphenated convention, same as memcached-exporter.
# Pure Go from source, CGO off (static, shell-less). License: Apache-2.0.

package:
  # Named exactly what upstream calls it, not `mysqld-exporter-minimal` — see
  # docs/onboarding.md "Package naming and scanner visibility".
  name: mysqld-exporter
  version: 0.21.0
  epoch: 0
  description: "Minimal MySQL Server Exporter built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of the source tarball - updated by update-versions.yml workflow
  sha256: 35a1f02a4ad81fa49fa6b1b3a3fb17a29a5e8df0019d52fb518c1a67f1ba5092

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  - runs: |
      mkdir -p /home/build/mysqld-exporter-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/prometheus/mysqld_exporter/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/mysqld-exporter.tar.gz
      echo "${{vars.sha256}}  /home/build/mysqld-exporter.tar.gz" | sha256sum -c -
      tar xzf /home/build/mysqld-exporter.tar.gz -C /home/build/mysqld-exporter-${{package.version}} --strip-components=1
      rm /home/build/mysqld-exporter.tar.gz

  - runs: |
      cd /home/build/mysqld-exporter-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/prometheus/common/version.Version=${{package.version}}" \
        -o /home/build/mysqld_exporter-bin \
        .

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/mysqld_exporter-bin "${{targets.destdir}}/usr/bin/mysqld_exporter"
      chmod 0755 "${{targets.destdir}}/usr/bin/mysqld_exporter"

  - runs: |
      echo "Verifying mysqld-exporter binary and injected version..."
      "${{targets.destdir}}/usr/bin/mysqld_exporter" --version 2>&1 | grep -q "version ${{package.version}}" \
        || { echo "FAIL: version ${{package.version}} not reported - ldflag wrong?"; exit 1; }
