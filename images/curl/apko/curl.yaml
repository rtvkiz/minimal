# Minimal curl image - using Wolfi's pre-built packages
# CVE patching via the daily rebuild (Wolfi's `curl` package is unversioned and
# rolls forward to each upstream release).
#
# Drop-in for curlimages/curl: curl is the entrypoint, so `docker run IMAGE -sSf URL`
# works unchanged. Shell-less: pipelines that need `sh -c 'curl ... | jq'` should
# use the -dev variant.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # curl from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `curl`)
    - curl

    # Base filesystem
    - wolfi-baselayout

    # Certificates (HTTPS is the common case)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/curl

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-curl"
  org.opencontainers.image.description: "Hardened shell-less curl image built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/curl"
  org.opencontainers.image.licenses: "curl"

archs:
  - x86_64
  - aarch64
