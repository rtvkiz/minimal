# Development variant of minimal-curl.
# Same curl as prod, plus a shell, apk-tools and the tools curl is usually piped into.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - curl
    - wolfi-baselayout
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Debugging ---
    - openssl
    - bind-tools
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/curl

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-curl-dev"
  org.opencontainers.image.description: "Dev variant of minimal-curl: same curl + shell + debugging tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/curl"
  org.opencontainers.image.licenses: "curl"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
