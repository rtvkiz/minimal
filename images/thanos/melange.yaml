# Melange build configuration for minimal Thanos
# Pure Go from source. Single multi-command `thanos` binary.
# License: Apache-2.0 (Thanos authors).

package:
  # Named `thanos` (not `thanos-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:thanos:thanos-minimal:*,
  # cpe:2.3:a:thanos-minimal:thanos-minimal:*, ...). NVD indexes this product
  # bare, as cpe:2.3:a:thanos:thanos:*, so none of them matched, and the Wolfi
  # secdb missed it too.
  name: thanos
  version: 0.42.4
  epoch: 0
  description: "Minimal Thanos (highly-available Prometheus long-term storage) built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `thanos`, so without this apk could install Wolfi's build instead of
    # this source-built one. provider-priority is evaluated BEFORE version in
    # that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of thanos source tarball - updated by update-versions.yml workflow
  sha256: 0f078dcb6d47bde6b3de0e962355d977f6fc017975d882531c4bd70f81f61fae

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify thanos source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/thanos-io/thanos/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/thanos.tar.gz

      echo "${{vars.sha256}}  /home/build/thanos.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf thanos.tar.gz
      rm thanos.tar.gz

  # Build the thanos binary (static).
  # Version is reported via github.com/prometheus/common/version; build tags
  # netgo,slicelabels match upstream's .promu.yml release build.
  # patch-go-deps: auto-generated — do not edit manually (test-and-keep)
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      for root in /home/build/thanos-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-base.mod
          [ -f go.sum ] && cp go.sum .pgd-base.sum || true
          # Probe each candidate CVE fix against the real build; keep the ones
          # that still compile, drop those that need upstream to update its
          # vendored code first (logged, not silent). Patches everything safely
          # patchable now instead of skipping the image wholesale.
          KEPT=""
          for fix in  github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8 github.com/aws/aws-sdk-go-v2/service/s3@v1.99.0 github.com/cloudflare/circl@v1.6.3 github.com/containerd/containerd/v2@v2.2.1 github.com/containerd/containerd@v1.7.33 github.com/docker/cli@v29.2.1+incompatible github.com/go-chi/chi/v5@v5.3.0 github.com/go-git/go-billy/v5@v5.9.0 github.com/go-git/go-git/v5@v5.19.1 github.com/go-jose/go-jose/v4@v4.1.4 github.com/google/cel-go@v0.29.0 github.com/klauspost/compress@v1.18.7 github.com/moby/buildkit@v0.28.1 github.com/moby/go-archive@v0.3.0 github.com/nwaples/rardecode/v2@v2.2.2 github.com/opencontainers/selinux@v1.13.1 github.com/quic-go/quic-go@v0.59.1 github.com/rclone/rclone@v1.74.3 github.com/ulikunitz/xz@v0.5.15 github.com/valyala/fasthttp@v1.70.0 go.etcd.io/etcd/client/pkg/v3@v3.5.33 go.mongodb.org/mongo-driver@v1.17.9 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.1 oras.land/oras-go/v2@v2.6.1 software.sslmate.com/src/go-pkcs12@v0.7.2 go.opentelemetry.io/otel/bridge/opentracing@v1.46.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.46.0 go.opentelemetry.io/otel/sdk@v1.46.0 go.opentelemetry.io/otel@v1.46.0 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0; do
            cp .pgd-base.mod go.mod
            [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
            if go get $KEPT "$fix" >/dev/null 2>&1 && GOTOOLCHAIN=local CGO_ENABLED=0 go build -mod=mod -tags netgo,slicelabels -o /dev/null ./cmd/thanos >/dev/null 2>&1; then
              KEPT="$KEPT $fix"; echo "pgd-testkeep KEPT: $fix"
            else
              echo "pgd-testkeep dropped (needs upstream): $fix"
            fi
          done
          cp .pgd-base.mod go.mod
          [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
          if [ -n "$KEPT" ]; then _retry go get $KEPT; fi
          go mod tidy -e
          rm -f .pgd-base.mod .pgd-base.sum
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/thanos-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -tags netgo,slicelabels \
        -ldflags="-s -w \
          -X github.com/prometheus/common/version.Version=${{package.version}} \
          -X github.com/prometheus/common/version.Revision=source-build \
          -X github.com/prometheus/common/version.Branch=tag-v${{package.version}}" \
        -o /home/build/thanos-bin \
        ./cmd/thanos

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/thanos-bin "${{targets.destdir}}/usr/bin/thanos"
      chmod 0755 "${{targets.destdir}}/usr/bin/thanos"

  # Verify the build
  - runs: |
      echo "Verifying thanos binary..."
      "${{targets.destdir}}/usr/bin/thanos" --version
