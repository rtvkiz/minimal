# Development variant of minimal-bash.
# Same Bash + busybox as prod, plus the dev minimum (apk-tools) and the tools
# scripts most often shell out to.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - bash
    - wolfi-baselayout
    - busybox
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - apk-tools
    - wget

    # --- Utilities scripts commonly call ---
    - curl
    - jq
    - git
    - coreutils
    - findutils
    - grep
    - sed
    - gawk

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /bin/bash

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-bash-dev"
  org.opencontainers.image.description: "Dev variant of minimal-bash: same Bash plus apk-tools, curl, jq, git and GNU utilities. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/bash"
  org.opencontainers.image.licenses: "GPL-3.0-or-later"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
