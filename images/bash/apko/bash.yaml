# Minimal Bash image - using Wolfi's pre-built packages
# CVE patching via the daily rebuild (Wolfi's `bash` package is unversioned and
# rolls forward to each upstream release).
#
# The shell IS the product here, so this is a declared prod-shell exception.
# busybox supplies the coreutils a script reaches for (cat, ls, grep, sed...);
# apk-tools stays out of prod like every other image.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Bash from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `bash`)
    - bash

    # Base filesystem
    - wolfi-baselayout

    # Core utilities for scripts (busybox applets, no package manager)
    - busybox

    # Certificates (scripts that call out over TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /bin/bash

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-bash"
  org.opencontainers.image.description: "Hardened GNU Bash image with busybox utilities and no package manager, built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/bash"
  org.opencontainers.image.licenses: "GPL-3.0-or-later"

archs:
  - x86_64
  - aarch64
