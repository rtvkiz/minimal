# Melange build configuration for minimal cluster-autoscaler
# Kubernetes Cluster Autoscaler (kubernetes/autoscaler, cluster-autoscaler/ module).
# Upstream's image (distroless) puts the binary at /cluster-autoscaler and the
# official Helm chart execs ./cluster-autoscaler from /, so that path is kept as a
# relative symlink to /usr/bin/cluster-autoscaler.
# Ships the latest release line only; Cluster Autoscaler versions track Kubernetes
# minors, so pin the matching tag of this image to your cluster's minor.
# Pure Go from source, CGO off (static, shell-less). License: Apache-2.0.

package:
  # Named exactly what upstream calls it, not `cluster-autoscaler-minimal` — see
  # docs/onboarding.md "Package naming and scanner visibility".
  name: cluster-autoscaler
  version: 1.37.0
  epoch: 0
  description: "Minimal Kubernetes Cluster Autoscaler built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # Wolfi ships a package of this name too; apko picks the highest version
    # across ALL repositories unless provider-priority pins ours.
    provider-priority: 100

vars:
  # SHA256 of the source tarball - updated by update-versions.yml workflow
  sha256: 590384787494a32d53f5c3c474da70cf81fe1e116276ef216b3c82936438aaba

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  - runs: |
      mkdir -p /home/build/cluster-autoscaler-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/kubernetes/autoscaler/archive/refs/tags/cluster-autoscaler-${{package.version}}.tar.gz" \
        -o /home/build/cluster-autoscaler.tar.gz
      echo "${{vars.sha256}}  /home/build/cluster-autoscaler.tar.gz" | sha256sum -c -
      tar xzf /home/build/cluster-autoscaler.tar.gz -C /home/build/cluster-autoscaler-${{package.version}} --strip-components=1
      rm /home/build/cluster-autoscaler.tar.gz

  # patch-go-deps: auto-generated — do not edit manually (test-and-keep)
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_workfix() {  # raise an enclosing go.work above every member's go directive
        # A go.work whose `go` directive sits below a bumped member's requirement
        # hard-fails every go command in the tree — even under GOWORK=off — before
        # the build is reached. x/crypto v0.56.0 declares go 1.26.0, which stranded
        # prometheus (go.work at 1.25.8) and etcd (1.26). Raise the workspace to the
        # build toolchain first so a bump can never sit above it; the explicit
        # go.work argument keeps `go work edit` working under GOWORK=off. No-op for
        # the majority of images, which ship no workspace at all.
        _d="$1"
        while [ -n "$_d" ] && [ "$_d" != "/" ]; do
          if [ -f "$_d/go.work" ]; then
            _gv=$(go env GOVERSION | sed 's/^go//')
            echo "pgd-work: raising $_d/go.work go directive to $_gv"
            ( cd "$_d" && go work edit -go="$_gv" go.work ) || true
            return 0
          fi
          _d=$(dirname "$_d")
        done
      }
      for root in /home/build/cluster-autoscaler-${{package.version}}/cluster-autoscaler; do
        [ -f "$root/go.mod" ] || continue
        _pgd_workfix "$root"
        ( set -e
          cd "$root"
          cp go.mod .pgd-base.mod
          [ -f go.sum ] && cp go.sum .pgd-base.sum || true
          # Probe each candidate CVE fix against the real build; keep the ones
          # that still compile, drop those that need upstream to update its
          # vendored code first (logged, not silent). Patches everything safely
          # patchable now instead of skipping the image wholesale.
          KEPT=""
          for fix in  github.com/Azure/go-ntlmssp@v0.1.1 github.com/andybalholm/brotli@v1.2.7 github.com/apache/thrift@v0.23.0 github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8 github.com/aws/aws-sdk-go-v2/service/lambda@v1.88.5 github.com/aws/aws-sdk-go-v2/service/s3@v1.99.0 github.com/cloudflare/circl@v1.6.3 github.com/containerd/containerd/v2@v2.2.1 github.com/containerd/containerd@v1.7.33 github.com/docker/cli@v29.2.1+incompatible github.com/go-chi/chi/v5@v5.3.0 github.com/go-git/go-billy/v5@v5.9.0 github.com/go-git/go-git/v5@v5.19.1 github.com/go-jose/go-jose/v4@v4.1.6 github.com/gomarkdown/markdown@v0.0.0-20260724235538-61af6e1e6971 github.com/google/cel-go@v0.29.0 github.com/gorilla/websocket@v1.5.4-0.20250319132907-e064f32e3674 github.com/insomniacslk/dhcp@v0.0.0-20260719225207-c76316d4aa82 github.com/klauspost/compress@v1.20.2 github.com/labstack/echo/v4@v4.16.1 github.com/moby/buildkit@v0.28.1 github.com/moby/go-archive@v0.3.0 github.com/moby/sys/user@v0.4.1 github.com/nwaples/rardecode/v2@v2.2.2 github.com/opencontainers/selinux@v1.13.1 github.com/prometheus/prometheus@v0.311.3 github.com/quic-go/quic-go@v0.59.1 github.com/rclone/rclone@v1.74.3 github.com/russellhaering/goxmldsig@v1.6.0 github.com/slack-go/slack@v0.23.1 github.com/ulikunitz/xz@v0.5.15 github.com/valyala/fasthttp@v1.70.0 go.etcd.io/etcd/client/pkg/v3@v3.5.33 go.mongodb.org/mongo-driver@v1.17.9 go.opentelemetry.io/otel/bridge/opentracing@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.47.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace@v1.47.0 go.opentelemetry.io/otel/sdk@v1.47.0 go.opentelemetry.io/otel@v1.47.0 go.temporal.io/api@v1.50.1 go.temporal.io/server@v1.28.4 golang.org/x/crypto@v0.58.0 golang.org/x/image@v0.45.0 golang.org/x/mod@v0.42.0 golang.org/x/net@v0.62.0 golang.org/x/oauth2@v0.36.0 golang.org/x/sync@v0.24.0 golang.org/x/sys@v0.49.0 golang.org/x/term@v0.47.0 golang.org/x/text@v0.43.0 golang.org/x/time@v0.16.0 golang.org/x/tools@v0.52.0 google.golang.org/grpc@v1.83.2 knative.dev/pkg@v0.0.0-20260531000007-52dbd5ece63f oras.land/oras-go/v2@v2.6.1 software.sslmate.com/src/go-pkcs12@v0.7.2; do
            cp .pgd-base.mod go.mod
            [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
            if go get $KEPT "$fix" >/dev/null 2>&1 && GOTOOLCHAIN=local CGO_ENABLED=0 go build -mod=mod -o /dev/null . >/dev/null 2>&1; then
              KEPT="$KEPT $fix"; echo "pgd-testkeep KEPT: $fix"
            else
              echo "pgd-testkeep dropped (needs upstream): $fix"
            fi
          done
          cp .pgd-base.mod go.mod
          [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
          if [ -n "$KEPT" ]; then _retry go get $KEPT; fi
          go mod tidy -e
          rm -f .pgd-base.mod .pgd-base.sum
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/cluster-autoscaler-${{package.version}}/cluster-autoscaler
      # version/version.go hardcodes ClusterAutoscalerVersion per release; -X keeps
      # it honest if a tag ever forgets the bump. All cloud providers are built in,
      # same as upstream's image.
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X k8s.io/autoscaler/cluster-autoscaler/version.ClusterAutoscalerVersion=${{package.version}}" \
        -o /home/build/cluster-autoscaler-bin \
        .

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/cluster-autoscaler-bin "${{targets.destdir}}/usr/bin/cluster-autoscaler"
      chmod 0755 "${{targets.destdir}}/usr/bin/cluster-autoscaler"
      ln -s usr/bin/cluster-autoscaler "${{targets.destdir}}/cluster-autoscaler"

  - runs: |
      echo "Verifying cluster-autoscaler binary and version..."
      # No --version flag: the version is logged at startup (-v=1) before it
      # exits for lack of a cluster, which is the case in this sandbox.
      out=$("${{targets.destdir}}/usr/bin/cluster-autoscaler" --cloud-provider=clusterapi -v=1 2>&1 || true)
      echo "$out" | grep -q "Cluster Autoscaler ${{package.version}}" \
        || { echo "FAIL: version ${{package.version}} not reported"; echo "$out" | head -5; exit 1; }
