# Minimal cluster-autoscaler image - built from source via melange
# Kubernetes Cluster Autoscaler, all cloud providers built in (same as upstream).
# /cluster-autoscaler is a symlink to /usr/bin/cluster-autoscaler so the official
# Helm chart's `./cluster-autoscaler` from / works unchanged.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - cluster-autoscaler
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/cluster-autoscaler

work-dir: /

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-cluster-autoscaler"
  org.opencontainers.image.description: "Hardened shell-less Kubernetes Cluster Autoscaler built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/cluster-autoscaler"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
