# Development variant of minimal-busybox.
# Same BusyBox as prod, plus the dev minimum (CONVENTIONS.md): bash, apk-tools
# and wget. Same CMD (/bin/sh) and no entrypoint, so it stays drop-in with prod.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - wolfi-baselayout
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - bash
    - apk-tools
    - wget

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

cmd: /bin/sh

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-busybox-dev"
  org.opencontainers.image.description: "Dev variant of minimal-busybox: same BusyBox plus bash, apk-tools and wget. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/busybox"
  org.opencontainers.image.licenses: "GPL-2.0-only"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
