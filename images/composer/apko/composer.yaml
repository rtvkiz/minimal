# Minimal Composer image - using Wolfi's pre-built packages
# CVE patching via the daily rebuild. Composer is unversioned in Wolfi (rolls to
# each release); PHP is pinned to the 8.5 line, so a new PHP major-minor
# arrives as a PR that CI tests, not silently on a rebuild.
#
# Carries busybox only (never bash, never apk-tools): Composer launches git and
# package scripts through Symfony Process, which goes through /bin/sh. Without
# a shell, even `composer validate` dies with "Unable to launch a new process"
# (caught by test.sh). Same restraint as maven's launcher exception.
# The entrypoint still runs the phar through php directly.
# git is a hard dependency of Wolfi's composer (VCS repositories, source
# installs).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Composer from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `composer`)
    - composer

    # Base filesystem
    - wolfi-baselayout

    # PHP 8.5 CLI and the extensions Composer needs: phar to run itself,
    # openssl for TLS to Packagist, zip to unpack dist archives, mbstring,
    # ctype, iconv and fileinfo for package metadata, curl for downloads.
    - php-8.5
    - php-8.5-phar
    - php-8.5-openssl
    - php-8.5-zip
    - php-8.5-mbstring
    - php-8.5-ctype
    - php-8.5-iconv
    - php-8.5-fileinfo
    - php-8.5-curl

    # /bin/sh for Symfony Process (git, package scripts). busybox only.
    - busybox

    # Certificates (Packagist and VCS hosts over TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/php /usr/bin/composer

work-dir: /app

# HOME=/tmp: Composer's cache and global config land in /tmp/.composer and
# /tmp/.cache (mount a volume, or set COMPOSER_HOME / COMPOSER_CACHE_DIR, to
# persist them between builds).
environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-composer"
  org.opencontainers.image.description: "Hardened Composer image on PHP 8.5 with no package manager, built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/composer"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
