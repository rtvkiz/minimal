# Melange build configuration for minimal Syncthing
# Pure Go from source. Single static `syncthing` binary (continuous P2P file
# synchronisation). License: MPL-2.0 (The Syncthing Authors).
#
# Wolfi ships no `syncthing` package, so this is a source build by necessity
# rather than by preference.

package:
  # Named `syncthing` (not `syncthing-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and a suffix
  # produces cpe:2.3:a:syncthing-minimal:syncthing-minimal:*, which matches
  # nothing in NVD. NVD indexes this product bare, as
  # cpe:2.3:a:syncthing:syncthing:*.
  name: syncthing
  version: 2.1.3
  epoch: 0
  description: "Minimal Syncthing continuous file synchronisation daemon built from source"
  copyright:
    - license: MPL-2.0

vars:
  # SHA256 of syncthing source tarball - updated by update-versions.yml workflow
  sha256: 177792c697f61fc25f02d8fc8923dfc57ebb35753bd92c8d32a73d553446d117

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify syncthing source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/syncthing/syncthing/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/syncthing.tar.gz

      echo "${{vars.sha256}}  /home/build/syncthing.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf syncthing.tar.gz
      rm syncthing.tar.gz

  # The web GUI is served from lib/api/auto/gui.files.go, which upstream
  # .gitignore's and regenerates at build time. The generator (script/genassets.go)
  # is plain Go reading the committed gui/ tree — there is no npm/yarn step — so
  # this stays a hermetic Go-only build. Without it the binary compiles but
  # serves an empty GUI (lib/api/auto/noassets.go is the fallback).
  - runs: |
      cd /home/build/syncthing-${{package.version}}
      export GOFLAGS=-mod=mod
      go run script/genassets.go -o lib/api/auto/gui.files.go gui

  # CGO_ENABLED=0 selects the pure-Go SQLite driver: internal/db/sqlite has
  # db_open_cgo.go (//go:build cgo -> mattn/go-sqlite3) and db_open_nocgo.go
  # (//go:build !cgo -> modernc.org/sqlite). Syncthing 2.x needs SQLite for its
  # index database, so getting this wrong is a runtime failure, not a link error.
  #
  # The `noupgrade` tag matches upstream's own container build
  # (`go run build.go -no-upgrade build syncthing`): it compiles out the
  # self-updater, which has no business writing to a read-only image anyway.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      _pgd_workfix() {  # raise an enclosing go.work above every member's go directive
        # A go.work whose `go` directive sits below a bumped member's requirement
        # hard-fails every go command in the tree — even under GOWORK=off — before
        # the build is reached. x/crypto v0.56.0 declares go 1.26.0, which stranded
        # prometheus (go.work at 1.25.8) and etcd (1.26). Raise the workspace to the
        # build toolchain first so a bump can never sit above it; the explicit
        # go.work argument keeps `go work edit` working under GOWORK=off. No-op for
        # the majority of images, which ship no workspace at all.
        _d="$1"
        while [ -n "$_d" ] && [ "$_d" != "/" ]; do
          if [ -f "$_d/go.work" ]; then
            _gv=$(go env GOVERSION | sed 's/^go//')
            echo "pgd-work: raising $_d/go.work go directive to $_gv"
            ( cd "$_d" && go work edit -go="$_gv" go.work ) || true
            return 0
          fi
          _d=$(dirname "$_d")
        done
      }
      for root in /home/build/syncthing-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        _pgd_workfix "$root"
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter golang.org/x/crypto@v0.56.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/syncthing-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -tags noupgrade \
        -ldflags="-s -w -buildid= \
          -X github.com/syncthing/syncthing/lib/build.Version=v${{package.version}} \
          -X github.com/syncthing/syncthing/lib/build.User=melange \
          -X github.com/syncthing/syncthing/lib/build.Host=wolfi \
          -X github.com/syncthing/syncthing/lib/build.Tags=noupgrade" \
        -o /home/build/syncthing-bin \
        ./cmd/syncthing

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/syncthing-bin "${{targets.destdir}}/usr/bin/syncthing"
      chmod 0755 "${{targets.destdir}}/usr/bin/syncthing"

  # Verify the build
  - runs: |
      echo "Verifying syncthing binary..."
      "${{targets.destdir}}/usr/bin/syncthing" --version
