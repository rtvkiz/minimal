# Melange build configuration for minimal SeaweedFS
# Pure Go from source. Single static `weed` binary — SeaweedFS is one
# multi-command executable (weed master / volume / filer / s3 / mount / …)
# rather than a set of daemons, so one binary covers every role.
# License: Apache-2.0 (Chris Lu / the SeaweedFS authors).
#
# Built from source rather than Wolfi's package because Wolfi lags upstream
# (4.32 vs 4.44 at onboarding) and this catalogue tracks upstream latest.

package:
  # Named `seaweedfs` (not `seaweedfs-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:seaweedfs:seaweedfs-minimal:*, ...). NVD indexes this product
  # bare, as cpe:2.3:a:seaweedfs:seaweedfs:*, so none of them matched.
  name: seaweedfs
  version: 4.44
  epoch: 0
  description: "Minimal SeaweedFS distributed object store and filesystem built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `seaweedfs`, so without this apk could install Wolfi's build instead
    # of this source-built one. provider-priority is evaluated BEFORE version
    # in that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of seaweedfs source tarball - updated by update-versions.yml workflow
  sha256: fcf49f93f5e7393d579fc2a63547dae83e438e3b4861b58f27c31b059861823f

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  # Download and verify SeaweedFS source.
  # Upstream tags this project WITHOUT a leading `v` (4.44, not v4.44).
  - runs: |
      mkdir -p /home/build/seaweedfs-${{package.version}}
      curl -fsSL --retry 8 --retry-all-errors \
        "https://github.com/seaweedfs/seaweedfs/archive/refs/tags/${{package.version}}.tar.gz" \
        -o /home/build/seaweedfs.tar.gz

      echo "${{vars.sha256}}  /home/build/seaweedfs.tar.gz" | sha256sum -c -

      tar xzf /home/build/seaweedfs.tar.gz -C /home/build/seaweedfs-${{package.version}} --strip-components=1
      rm /home/build/seaweedfs.tar.gz

  # The version is a source constant (weed/util/version: MAJOR_VERSION /
  # MINOR_VERSION), so there is nothing to inject with -X — only COMMIT is
  # ldflags-settable and it is cosmetic. CGO_ENABLED=0 gives a static binary.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      for root in /home/build/seaweedfs-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter golang.org/x/image@v0.45.0 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/seaweedfs-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid=" \
        -o /home/build/weed-bin \
        ./weed

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/weed-bin "${{targets.destdir}}/usr/bin/weed"
      chmod 0755 "${{targets.destdir}}/usr/bin/weed"

  # Verify the build
  - runs: |
      echo "Verifying weed binary..."
      "${{targets.destdir}}/usr/bin/weed" version
