# Minimal SeaweedFS image - distributed object store / filesystem, built from source via melange
# Shell-less, distroless. CVE patching via daily rebuilds from upstream source.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - seaweedfs
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# SeaweedFS is a single multi-command binary: the role is chosen by the first
# argument (master / volume / filer / s3 / server / …). No default role is
# assumed here — pass one, e.g. `server -dir=/data`.
#
# Default ports are all above 1024 (master 9333, volume 8080, filer 8888,
# s3 8333), so every role binds fine as nonroot.
entrypoint:
  command: /usr/bin/weed

environment:
  PATH: /usr/bin:/bin

# Writable data directory. Every storage role needs one, and a nonroot process
# cannot create it at runtime — apko must author it, owned by the run-as user.
paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-seaweedfs"
  org.opencontainers.image.description: "Hardened shell-less SeaweedFS distributed object store and filesystem built from source via melange with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/seaweedfs"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
