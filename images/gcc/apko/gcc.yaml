# Minimal GCC image - using Wolfi's pre-built toolchain
# CVE patching via the daily rebuild (Wolfi's `gcc` package is unversioned and
# rolls forward with each GCC release).
#
# Builder-shaped, like minimal-go and minimal-rust: gcc/g++ + binutils, the
# glibc headers and startup files, make and pkgconf (Wolfi's build-base set).
# Shell-less: gcc execs cc1/as/ld directly. Makefiles whose recipes need
# /bin/sh should use the -dev variant.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # GCC from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `gcc`)
    - gcc
    - binutils
    - glibc-dev
    - make
    - pkgconf

    # Base filesystem
    - wolfi-baselayout

    # Certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/gcc

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-gcc"
  org.opencontainers.image.description: "Hardened shell-less GCC C/C++ builder image (gcc, g++, binutils, make), built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/gcc"
  org.opencontainers.image.licenses: "GPL-3.0-or-later WITH GCC-exception-3.1"

archs:
  - x86_64
  - aarch64
