# Development variant of minimal-gcc.
# Same toolchain and entrypoint as prod, plus the dev minimum. The shell is what
# most Makefile recipes need (make runs each recipe line through /bin/sh).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # GCC from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `gcc`)
    - gcc
    - binutils
    - glibc-dev
    - make
    - pkgconf

    # Base filesystem
    - wolfi-baselayout

    # Certificates
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/gcc

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-gcc-dev"
  org.opencontainers.image.description: "Dev variant of minimal-gcc: same toolchain plus a shell (for Makefile recipes), apk-tools and wget. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/gcc"
  org.opencontainers.image.licenses: "GPL-3.0-or-later WITH GCC-exception-3.1"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
