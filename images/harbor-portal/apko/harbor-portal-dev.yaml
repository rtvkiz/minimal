# Development variant of minimal-harbor-portal.
# Same portal + nginx-mainline as prod, plus bash, apk-tools, curl and jq
# for debugging (CONVENTIONS.md dev-variant minimum).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Harbor's portal UI + nginx config (same as prod)
    - harbor-2.14-portal
    - harbor-2.14-portal-nginx-config
    - nginx-mainline

    # Certificates
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/JSON utilities ---
    - curl
    - jq

accounts:
  groups:
    - groupname: nginx
      gid: 65532
  users:
    - username: nginx
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/sbin/nginx -g "daemon off;"

environment:
  PATH: /usr/sbin:/usr/bin:/bin

paths:
  - path: /var/lib/nginx/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-harbor-portal-dev"
  org.opencontainers.image.description: "Development variant of the Harbor portal image with debugging tools"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/harbor-portal"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
