# Minimal TomEE image
# Apache TomEE Web Profile (built from the official ASF release via melange) on
# Wolfi's OpenJDK 25 JRE. Shell-less: the entrypoint is the java command
# catalina.sh would build in run mode (TomEE's --add-opens list, the OpenEJB
# javaagent, JULI logging, Bootstrap), written out here so no shell is needed.
# Plus --enable-native-access, which JDK 24+ asks for before Tomcat's JNI
# loader may call System.load.
# Pass extra JVM flags (heap size etc.) with JAVA_TOOL_OPTIONS.
#
# Deploy by mounting a WAR, or an exploded webapp, into /opt/tomee/webapps.
# OpenJDK is pinned to the 25 LTS line, so a new JDK major arrives as a PR
# that CI tests, not silently on a rebuild.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our TomEE (built from the official ASF release via melange)
    - tomee

    # Base filesystem
    - wolfi-baselayout

    # Java runtime
    - openjdk-25-jre
    - openjdk-25-default-jvm

    # Certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: >-
    /usr/lib/jvm/java-25-openjdk/bin/java
    -javaagent:/opt/tomee/lib/openejb-javaagent.jar
    --add-opens=java.base/java.lang=ALL-UNNAMED
    --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
    --add-opens=java.base/java.io=ALL-UNNAMED
    --add-opens=java.base/java.util=ALL-UNNAMED
    --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
    --add-opens=java.rmi/sun.rmi.transport=ALL-UNNAMED
    --enable-native-access=ALL-UNNAMED
    -Djdk.tls.ephemeralDHKeySize=2048
    -Djava.protocol.handler.pkgs=org.apache.catalina.webresources
    -Dsun.io.useCanonCaches=false
    -Djava.util.logging.config.file=/opt/tomee/conf/logging.properties
    -Djava.util.logging.manager=org.apache.juli.ClassLoaderLogManager
    -Dcatalina.base=/opt/tomee
    -Dcatalina.home=/opt/tomee
    -Djava.io.tmpdir=/opt/tomee/temp
    -classpath /opt/tomee/bin/bootstrap.jar:/opt/tomee/bin/tomcat-juli.jar
    org.apache.catalina.startup.Bootstrap

cmd: start

work-dir: /opt/tomee

environment:
  PATH: /usr/lib/jvm/java-25-openjdk/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  CATALINA_HOME: /opt/tomee
  CATALINA_BASE: /opt/tomee
  HOME: /tmp

# TomEE writes logs, temp files, compiled JSPs and expanded WARs at runtime,
# service properties under conf/conf.d, and Tomcat writes per-host context
# files under conf/Catalina.
paths:
  - path: /opt/tomee/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/tomee/temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/tomee/work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/tomee/webapps
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/tomee/conf/Catalina
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/tomee/conf/conf.d
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-tomee"
  org.opencontainers.image.description: "Hardened shell-less Apache TomEE Web Profile on OpenJDK 25, built from the official ASF release with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/tomee"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
