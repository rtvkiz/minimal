# Minimal Maven image - using Wolfi's pre-built packages
# CVE patching via the daily rebuild (Wolfi versioned packages)
# Build-tool image: Maven on a full JDK (javac is needed to compile).
#
# Carries busybox only (never bash): /usr/bin/mvn is a `#!/bin/sh` launcher
# script (plain POSIX, no bashisms) that resolves MAVEN_HOME and builds the java
# command line — there is no way to run Maven without a shell.
#
# Two version lines, both moved by update-wolfi-packages.yml:
#   maven-3.N   — the Maven block
#   openjdk-N-* — the OpenJDK block, together with the java image. Pinned
#                 rather than the `default-jdk` virtual so a new JDK major
#                 arrives as a PR that CI tests, not silently on a rebuild.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Maven from Wolfi (CVE-patched)
    - maven-3.10

    # Full JDK (javac) — Maven's compiler plugin needs it, a JRE is not enough
    - openjdk-27-default-jdk

    # /usr/bin/mvn is a #!/bin/sh launcher script — no shell, no Maven.
    - busybox

    # Certificates (Maven Central over TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/mvn

work-dir: /app

# HOME=/tmp: the local repository lands in /tmp/.m2 (mount a volume there,
# or pass -Dmaven.repo.local=..., to persist it between builds).
environment:
  PATH: /usr/lib/jvm/default-jvm/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/default-jvm
  MAVEN_HOME: /usr/share/java/maven
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-maven"
  org.opencontainers.image.description: "Hardened Apache Maven build image on OpenJDK, built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/maven"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
