# Minimal Julia image
# Julia from the official binary release (via melange). The release tarball
# is self-contained: libjulia, LLVM, OpenBLAS and the precompiled stdlib.
# Shell-less, non-root; julia is the entrypoint:
#   docker run IMAGE -e 'println(1+1)'
#   docker run -v "$PWD:/app" IMAGE script.jl
# Packages install to the depot under HOME (/tmp/.julia); mount a volume there
# to keep them between runs.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our Julia (official release via melange; listed first: build.yml takes
    # the primary package's version from the first line matching `julia`)
    - julia
    - wolfi-baselayout
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/julia

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-julia"
  org.opencontainers.image.description: "Hardened shell-less Julia language image from the official binary release, built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/julia"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
