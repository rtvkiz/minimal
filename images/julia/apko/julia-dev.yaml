# Development variant of minimal-julia.
# Same Julia and entrypoint as prod, plus the dev minimum, the runtime
# template's C toolchain (ccall into locally built libs) and git (Pkg dev).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our Julia (official release via melange; listed first: build.yml takes
    # the primary package's version from the first line matching `julia`)
    - julia
    - wolfi-baselayout
    - ca-certificates-bundle
    # --- Dev variant minimum + runtime template (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget
    - build-base
    - git

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/julia

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  LANG: C.UTF-8

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-julia-dev"
  org.opencontainers.image.description: "Dev variant of minimal-julia: same Julia plus a shell, a C toolchain, git for Pkg and apk-tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/julia"
  org.opencontainers.image.licenses: "MIT"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
