package:
  # Named `envoy` (not `envoy-minimal`) so vulnerability scanners can identify
  # it. Syft derives a package's CPE from its apk name, so the `-minimal`
  # suffix produced cpe:2.3:a:envoy-minimal:envoy-minimal:* — which matches
  # nothing in NVD (indexed as cpe:2.3:a:envoy:envoy:*) and nothing in the
  # Wolfi secdb either, so both of grype's matchers missed every CVE for this
  # package.
  name: envoy
  version: 1.39.3
  epoch: 0
  description: "Minimal Envoy proxy built from upstream releases"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `envoy` package today, but if it ever adds one at a higher version,
    # apk would silently install Wolfi's build instead of this source-built
    # one. provider-priority is evaluated BEFORE version in that comparator, so
    # this pins resolution to our package permanently.
    provider-priority: 100

vars:
  sha256_x86: f61653fb5f7645129d3092a82f21ce3e6f70d0a75fe2e861b0e7417790f2c200
  sha256_arm: 02ba9588283be771c9743cae6d013e45714cda2ca970be968a5a9f4db25ea446

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - curl
      - glibc
      - libstdc++
      - libgcc
      - ld-linux

pipeline:
  - runs: |
      BUILD_ARCH=$(uname -m)
      case "$BUILD_ARCH" in
        x86_64) ARCH_NAME="x86_64" ;;
        aarch64) ARCH_NAME="aarch_64" ;;
        *) echo "Unsupported arch: $BUILD_ARCH"; exit 1 ;;
      esac

      curl -fsSL --retry 8 --retry-all-errors "https://github.com/envoyproxy/envoy/releases/download/v${{package.version}}/envoy-${{package.version}}-linux-${ARCH_NAME}" \
        -o /tmp/envoy

      if [ "$BUILD_ARCH" = "x86_64" ]; then
        CHECKSUM="${{vars.sha256_x86}}"
      else
        CHECKSUM="${{vars.sha256_arm}}"
      fi

      echo "${CHECKSUM}  /tmp/envoy" | sha256sum -c -
      chmod +x /tmp/envoy

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /tmp/envoy "${{targets.destdir}}/usr/bin/envoy"

  - runs: |
      "${{targets.destdir}}/usr/bin/envoy" --version

update:
  enabled: true
  github:
    identifier: envoyproxy/envoy
    use-tag: true
    tag-filter: "v"
