# Minimal Argo CD image - built from source via melange
# The `argocd` multi-command binary with the web UI embedded (pnpm + webpack
# build in melange.yaml). The same binary serves as the API server, the
# application controller, the applicationset controller, the notifications
# controller and the dex-proxy, selected by the first positional argument (or
# argv[0] via the /usr/bin/argocd-<component> symlinks). Static, shell-less.
#
# Source-built since 2026-10-31: Wolfi's argo-cd-3.4 stopped receiving builds
# in June 2026 and was frozen at 3.4.3.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    - argo-cd

    # Certificates (upstream Git/OIDC connections)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: argocd
      gid: 65532
  users:
    - username: argocd
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/argocd

# No default args - `docker run minimal-argo-cd` prints argocd's usage.
# Supply the component you want at deploy time, e.g. `server` for the API
# server, `application-controller` for the controller, `notifications
# controller` for the notifications controller.

work-dir: /home/argocd

environment:
  PATH: /usr/bin:/bin
  HOME: /home/argocd

paths:
  - path: /home/argocd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-argo-cd"
  org.opencontainers.image.description: "Hardened shell-less Argo CD built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/argo-cd"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
