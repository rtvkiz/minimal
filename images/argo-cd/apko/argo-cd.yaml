# Minimal Argo CD image - using Wolfi's pre-built package
# CVE patching via the 6-hourly rebuild (Wolfi versioned package)
# argo-cd-3.4 is a pure static Go binary with no dependency on a shell or
# any other Wolfi package (no D: line in the APKINDEX entry) - unlike the
# argo-cd-repo-server sibling image, this one is genuinely shell-less.
#
# This is the `argocd` multi-command binary: the same binary serves as the
# API server, the application controller, the applicationset controller,
# the notifications controller and the dex-proxy, selected by the first
# positional argument at startup. The entrypoint below runs the API server;
# override `command`/`args` at deploy time to run the other components.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Argo CD from Wolfi (CVE-patched)
    - argo-cd-3.4

    # Certificates (upstream Git/OIDC connections)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: argocd
      gid: 65532
  users:
    - username: argocd
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/argocd

# No default args - `docker run minimal-argo-cd` prints argocd's usage.
# Supply the component you want at deploy time, e.g. `server` for the API
# server, `application-controller` for the controller, `notifications
# controller` for the notifications controller.

work-dir: /home/argocd

environment:
  PATH: /usr/bin:/bin
  HOME: /home/argocd

paths:
  - path: /home/argocd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-argo-cd"
  org.opencontainers.image.description: "Hardened shell-less Argo CD built on Wolfi with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/argo-cd"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
