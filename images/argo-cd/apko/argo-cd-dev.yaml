# Development variant of minimal-argo-cd.
# Same argocd binary from prod, plus a shell and debugging tools.
# In-house composition (no public Chainguard argo-cd-dev reference).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - argo-cd-3.4
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Debugging ---
    - curl
    - jq

accounts:
  groups:
    - groupname: argocd
      gid: 65532
  users:
    - username: argocd
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/argocd

work-dir: /home/argocd

environment:
  PATH: /usr/bin:/bin
  HOME: /home/argocd

paths:
  - path: /home/argocd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-argo-cd-dev"
  org.opencontainers.image.description: "Dev variant of minimal-argo-cd: same argocd binary + shell + debugging tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/argo-cd"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
