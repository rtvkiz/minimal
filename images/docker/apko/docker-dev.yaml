# Development variant of minimal-docker: Docker-in-Docker.
#
# DEVIATES from docs/dev-variants/CONVENTIONS.md on two points, on purpose:
#   - runs as root, and
#   - the entrypoint is dockerd-entrypoint.sh, not the prod `docker` CLI.
# dockerd needs root and --privileged to manage cgroups, mounts and iptables,
# so a nonroot dev variant with the CLI entrypoint could not run a daemon at
# all. This makes it a drop-in for `docker run --privileged docker:dind`.
# Not for production; never run it without understanding --privileged.
#
# Packages: Wolfi's docker-29 (CLI, buildx, compose, dockerd, containerd,
# runc, docker-init) + dockerd-oci-entrypoint-29 (the upstream docker-library
# dockerd-entrypoint.sh / docker-entrypoint.sh / dind scripts), openssl for the
# TLS certs the entrypoint generates under $DOCKER_TLS_CERTDIR, plus the dev
# minimum.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Docker CLI first: build.yml takes the primary package's version from the
    # first package line matching `docker-cli` (same version as prod)
    - docker-cli
    - docker-29
    - dockerd-oci-entrypoint-29
    - openssl
    # nftables backend for iptables + the nft tool. Wolfi's default `iptables`
    # is the legacy backend, but hosts on nftables-only kernels (GitHub's
    # Ubuntu 24.04 runners, most current distros) can't create the legacy NAT
    # chain dockerd needs. See the /usr/local/sbin symlinks under paths:.
    - iptables-nft
    - nftables

    - wolfi-baselayout
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

accounts:
  run-as: 0

entrypoint:
  command: /usr/bin/dockerd-entrypoint.sh

environment:
  # /usr/local/sbin first: iptables there is the nftables backend (the
  # docker:dind layout). dockerd-entrypoint.sh falls back to
  # /usr/local/sbin/.iptables-legacy when the host only has legacy iptables.
  PATH: /usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
  # Same default as docker:dind: generate TLS certs here and listen on 2376.
  # Set DOCKER_TLS_CERTDIR="" to disable TLS (daemon then listens on 2375).
  DOCKER_TLS_CERTDIR: /certs

paths:
  - path: /certs
    type: directory
    permissions: 0o755
  - path: /var/lib/docker
    type: directory
    permissions: 0o711
  # apko applies a symlink entry's permissions by following the link, so an
  # entry without permissions chmods the xtables-*-multi target to 000 and
  # breaks iptables entirely. Every link below carries 0o755 (the target's
  # original mode) for that reason.
  - path: /usr/local/sbin
    type: directory
    permissions: 0o755
  - path: /usr/local/sbin/.iptables-legacy
    type: directory
    permissions: 0o755
  - path: /usr/local/sbin/iptables
    type: symlink
    source: /sbin/xtables-nft-multi
    permissions: 0o755
  - path: /usr/local/sbin/.iptables-legacy/iptables
    type: symlink
    source: /sbin/xtables-legacy-multi
    permissions: 0o755
  - path: /usr/local/sbin/iptables-save
    type: symlink
    source: /sbin/xtables-nft-multi
    permissions: 0o755
  - path: /usr/local/sbin/.iptables-legacy/iptables-save
    type: symlink
    source: /sbin/xtables-legacy-multi
    permissions: 0o755
  - path: /usr/local/sbin/iptables-restore
    type: symlink
    source: /sbin/xtables-nft-multi
    permissions: 0o755
  - path: /usr/local/sbin/.iptables-legacy/iptables-restore
    type: symlink
    source: /sbin/xtables-legacy-multi
    permissions: 0o755
  - path: /usr/local/sbin/ip6tables
    type: symlink
    source: /sbin/xtables-nft-multi
    permissions: 0o755
  - path: /usr/local/sbin/.iptables-legacy/ip6tables
    type: symlink
    source: /sbin/xtables-legacy-multi
    permissions: 0o755
  - path: /usr/local/sbin/ip6tables-save
    type: symlink
    source: /sbin/xtables-nft-multi
    permissions: 0o755
  - path: /usr/local/sbin/.iptables-legacy/ip6tables-save
    type: symlink
    source: /sbin/xtables-legacy-multi
    permissions: 0o755
  - path: /usr/local/sbin/ip6tables-restore
    type: symlink
    source: /sbin/xtables-nft-multi
    permissions: 0o755
  - path: /usr/local/sbin/.iptables-legacy/ip6tables-restore
    type: symlink
    source: /sbin/xtables-legacy-multi
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-docker-dev"
  org.opencontainers.image.description: "Dev variant of minimal-docker: Docker-in-Docker (dockerd, containerd, CLI). Runs as root and needs --privileged. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/docker"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
