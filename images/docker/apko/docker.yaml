# Minimal Docker CLI image - using Wolfi's pre-built packages
# CVE patching via the daily rebuild (Wolfi's docker-cli is unversioned and
# rolls forward with each Docker release).
#
# Client only: docker + the buildx and compose CLI plugins, for CI jobs that
# talk to a daemon over a mounted socket or DOCKER_HOST. No daemon, no shell,
# non-root. To use the host socket as nonroot, add its group:
#   docker run -v /var/run/docker.sock:/var/run/docker.sock \
#     --group-add $(stat -c %g /var/run/docker.sock) IMAGE ps
# Docker-in-Docker (dockerd, needs --privileged + root) is the -dev variant.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Docker CLI from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `docker-cli`)
    - docker-cli
    # CLI plugins, installed under /usr/libexec/docker/cli-plugins
    - docker-cli-buildx
    - docker-compose

    # Base filesystem
    - wolfi-baselayout

    # Certificates (registries and remote daemons over TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/docker

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-docker"
  org.opencontainers.image.description: "Hardened shell-less Docker CLI image with buildx and compose, built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/docker"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
