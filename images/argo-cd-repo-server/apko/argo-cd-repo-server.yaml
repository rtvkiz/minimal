# Minimal Argo CD repo-server image - built from source via melange
# The `argocd` binary (no web UI - repo-server never serves it) under
# /usr/local/bin with upstream's per-component symlinks; the entrypoint execs
# `argocd-repo-server` directly. Upstream's uid_entrypoint.sh (a shell script
# that patches /etc/passwd for an arbitrary runtime UID) is not used: run-as
# is fixed, so its whole job is unnecessary and the image stays shell-less.
#
# git/helm/kustomize/gnupg/openssh are separate binaries argocd execs
# directly, not through a shell, so carrying them keeps the image shell-less.
#
# Source-built since 2026-10-31: Wolfi's argo-cd-3.4-repo-server stopped
# receiving builds in June 2026 and was frozen at 3.4.3.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    - argo-cd-repo-server

    # Manifest-rendering toolchain argocd execs directly (never via a shell).
    # All still maintained in Wolfi - unlike the frozen argo-cd-3.4-repo-server
    # that used to pull them in. helm-4, not helm~3: argo-cd 3.5 is built and
    # tested against Helm 4 (hack/tool-versions.sh helm4_version).
    - git
    - git-lfs
    - gnupg
    - gpg
    - gpg-agent
    - helm-4
    - kustomize
    # Client side of openssh only (git over ssh + known_hosts handling);
    # the previous image also carried sshd via the openssh meta-package.
    - openssh-client
    - openssh-keyscan
    - openssh-keygen
    - tzdata

    # Certificates (upstream Git/Helm repo connections)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: argocd
      gid: 65532
  users:
    - username: argocd
      uid: 65532
      gid: 65532
  run-as: 65532

# Exec the binary directly, not upstream's uid_entrypoint.sh (it needs a shell
# and exists only to patch /etc/passwd for an arbitrary UID - unnecessary here
# since run-as is fixed). The argo-cd-repo-server package installs the
# multi-command binary and its per-component symlinks under /usr/local/bin/,
# the path upstream's manifests and helm chart hardcode - argocd-repo-server
# is the upstream-standard invocation name.
entrypoint:
  command: /usr/local/bin/argocd-repo-server

work-dir: /home/argocd

environment:
  PATH: /usr/bin:/bin
  HOME: /home/argocd

paths:
  - path: /home/argocd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-argo-cd-repo-server"
  org.opencontainers.image.description: "Hardened shell-less Argo CD repo-server built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/argo-cd-repo-server"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
