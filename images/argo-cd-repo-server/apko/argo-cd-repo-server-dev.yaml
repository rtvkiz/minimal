# Development variant of minimal-argo-cd-repo-server.
# Same repo-server package from prod, plus bash and debugging tools.
# In-house composition (no public Chainguard argo-cd-repo-server-dev reference).

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - argo-cd-repo-server

    # Manifest-rendering toolchain argocd execs directly (never via a shell).
    # All still maintained in Wolfi - unlike the frozen argo-cd-3.4-repo-server
    # that used to pull them in. helm-4, not helm~3: argo-cd 3.5 is built and
    # tested against Helm 4 (hack/tool-versions.sh helm4_version).
    - git
    - git-lfs
    - gnupg
    - gpg
    - gpg-agent
    - helm-4
    - kustomize
    # Client side of openssh only (git over ssh + known_hosts handling);
    # the previous image also carried sshd via the openssh meta-package.
    - openssh-client
    - openssh-keyscan
    - openssh-keygen
    - tzdata
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Debugging ---
    - curl
    - jq

accounts:
  groups:
    - groupname: argocd
      gid: 65532
  users:
    - username: argocd
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/local/bin/argocd-repo-server

work-dir: /home/argocd

environment:
  PATH: /usr/bin:/bin
  HOME: /home/argocd

paths:
  - path: /home/argocd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-argo-cd-repo-server-dev"
  org.opencontainers.image.description: "Dev variant of minimal-argo-cd-repo-server: same package + shell + debugging tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/argo-cd-repo-server"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
