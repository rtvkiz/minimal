# Minimal chartmuseum image - built from source via melange
# Helm chart repository server on :8080. Defaults to local storage under /charts
# (STORAGE=local, STORAGE_LOCAL_ROOTDIR=/charts, owned by nonroot); point it at
# S3/GCS/Azure with the usual STORAGE_* variables.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    - wolfi-baselayout
    - chartmuseum
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/chartmuseum

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  STORAGE: local
  STORAGE_LOCAL_ROOTDIR: /charts

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
  - path: /charts
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: "minimal-chartmuseum"
  org.opencontainers.image.description: "Hardened shell-less ChartMuseum built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/chartmuseum"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
