# Development variant of minimal-jenkins.
# Prod already ships a wide CLI surface (coreutils, git, ssh, gnupg,
# curl, perl, etc.) for plugin compatibility. Dev just adds: bash,
# apk-tools, openssl, dig, jq.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Mirror prod exactly
    - wolfi-baselayout
    - jenkins
    - coreutils
    - diffutils
    - findutils
    - grep
    - gzip
    - less
    - patch
    - procps
    - sed
    - shadow
    - unzip
    - tzdata
    - tini
    - curl
    - libcurl-openssl4
    - git
    - git-lfs
    - openssh-client
    - openssh-keygen
    - gnupg
    - gnutar
    - glibc
    - glibc-locale-en
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libstdc++
    - libcrypt1
    - libxcrypt
    - zlib
    - libssl3
    - libcrypto3
    - ca-certificates-bundle
    - java-cacerts
    - p11-kit
    - p11-kit-trust
    - libnghttp2-14
    - nghttp3
    - libidn2
    - libpsl
    - libtasn1
    - libunistring
    - libbrotlicommon1
    - libbrotlidec1
    - libbz2-1
    - libexpat1
    - libffi
    - alsa-lib
    - libjpeg-turbo
    - giflib
    - lcms2
    - ttf-dejavu
    - libx11
    - libxau
    - libxcb
    - libxdmcp
    - libxext
    - libxi
    - libxrender
    - libxtst
    - cyrus-sasl
    - heimdal-libs
    - krb5-libs
    - krb5-conf
    - keyutils-libs
    - libldap-2.6
    - libverto
    - libacl1
    - libattr1
    - libaudit
    - libbsd
    - libcap-ng
    - libcom_err
    - libedit
    - libmd
    - libpcre2-8-0
    - libproc-2-0
    - libselinux
    - libsemanage
    - libsepol
    - linux-pam
    - sqlite-libs
    - gdbm
    - ncurses
    - ncurses-terminfo-base
    - readline
    - debianutils
    - perl

    # Dev additions
    - busybox
    - bash
    - apk-tools
    - wget
    - openssl
    - bind-tools
    - jq

accounts:
  groups:
    - groupname: jenkins
      gid: 1000
  users:
    - username: jenkins
      uid: 1000
      gid: 1000
  run-as: 1000

entrypoint:
  command: /sbin/tini -- /usr/bin/java -Xmx512m -Djava.awt.headless=true -jar /usr/share/jenkins/jenkins.war

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-minimal
  JENKINS_HOME: /var/jenkins_home
  LANG: C.UTF-8
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /var/jenkins_home
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-jenkins-dev"
  org.opencontainers.image.description: "Dev variant of minimal-jenkins: same Jenkins + bash + curl/openssl/dig/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/jenkins"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
