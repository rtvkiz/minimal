# Melange build configuration for minimal Jenkins
# Uses jlink to create a custom JRE with only required modules
# Downloads and verifies Jenkins WAR
# No shell needed in final image

package:
  # Named `jenkins` (not `jenkins-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:jenkins:jenkins-minimal:*,
  # cpe:2.3:a:jenkins-minimal:jenkins-minimal:*, ...). NVD indexes this product
  # bare, as cpe:2.3:a:jenkins:jenkins:*, so none of them matched, and the
  # Wolfi secdb missed it too.
  name: jenkins
  version: 2.568.2
  epoch: 0
  description: "Minimal Jenkins with custom JRE (jlink)"
  copyright:
    - license: MIT
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `jenkins` package today, but if it ever adds one at a higher
    # version, apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 checksum of jenkins.war - updated by update-versions.yml workflow
  sha256: 9bbb2b329e52730ba7decd1a7a1095987f6250ec761fb21157dbb2cbcd1ef590

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # zip: repack the war after swapping CVE-fixed detached plugins
      - zip
      # Full JDK needed for jlink (build-time only)
      - openjdk-21-default-jdk
      # jmods package required for jlink to create custom JRE
      - openjdk-21-jmods
      # binutils provides objcopy required by jlink --strip-debug
      - binutils
      # Fonts for Jenkins UI rendering
      - ttf-dejavu
      - fontconfig

pipeline:
  # Download and verify Jenkins WAR
  - runs: |
      mkdir -p /home/build/jenkins
      war=/home/build/jenkins/jenkins.war

      # get.jenkins.io redirects to a community mirror; mirrorbits occasionally
      # hands out a dead mirror (mirror.xmission.com was unreachable on
      # 2026-06-21, and with no connect-timeout each of curl's retries hung
      # ~132s before failing → exit 28, ~13 min wasted, whole build dead).
      # Cap the connect time so a bad mirror is abandoned in seconds, then fall
      # back to the directly-hosted archives.jenkins.io (no mirror redirect).
      ok=0
      for url in \
        "https://get.jenkins.io/war-stable/${{package.version}}/jenkins.war" \
        "https://archives.jenkins.io/war-stable/${{package.version}}/jenkins.war"; do
        if curl -fsSL --connect-timeout 30 --max-time 600 --retry 8 --retry-all-errors "$url" -o "$war"; then
          ok=1; break
        fi
        echo "WARN: jenkins.war download failed from $url, trying next source"
      done
      [ "$ok" = 1 ] || { echo "ERROR: all jenkins.war sources failed"; exit 1; }

      # Verify against pinned checksum (stored in repo, not fetched dynamically)
      echo "${{vars.sha256}}  $war" | sha256sum -c -

      # CVE fix (Critical): the bundled mina-sshd-api-core/common 2.16.0 plugins
      # carry mina-core 2.2.4 (4 advisories incl. a Critical), fixed in mina-core
      # 2.2.7. Replace both detached plugins in the war with 2.17.1, which bundles
      # mina-core 2.2.7. core 2.17.1 requires common 2.17.1 (Plugin-Dependencies),
      # so both move together. sha256-pinned. Jenkins LTS 2.555.3 still ships the
      # vulnerable 2.16.0; drop this block once a newer LTS bundles >= 2.17.1.
      PDIR=/home/build/jkplugins/WEB-INF/detached-plugins
      mkdir -p "$PDIR"
      PV=2.17.1-187.v0341274c2905
      _fetch_plugin() {  # $1=plugin $2=sha256
        curl -fsSL --retry 8 --retry-all-errors \
          "https://updates.jenkins.io/download/plugins/$1/${PV}/$1.hpi" -o "$PDIR/$1.hpi"
        echo "$2  $PDIR/$1.hpi" | sha256sum -c -
      }
      _fetch_plugin mina-sshd-api-core   9479d70a69201a0d75f816cfce4d55553402d56e0d480dbeb15f4f7333ec01b4
      _fetch_plugin mina-sshd-api-common 4bf8d267ad9435bf249ebebb6b1b5efc90dd5a1ffd9398931a1ea3c026ec13e8
      ( cd /home/build/jkplugins && zip "$war" \
          WEB-INF/detached-plugins/mina-sshd-api-core.hpi \
          WEB-INF/detached-plugins/mina-sshd-api-common.hpi )
      echo "Swapped mina-sshd-api-core/common -> ${PV} (mina-core 2.2.7)"

  # Create minimal JRE with jlink (only modules Jenkins needs)
  - runs: |
      JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      $JAVA_HOME/bin/jlink \
        --module-path $JAVA_HOME/jmods \
        --add-modules java.base,java.compiler,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.management.rmi,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.httpserver,jdk.management,jdk.net,jdk.security.auth,jdk.unsupported,jdk.zipfs \
        --strip-debug \
        --no-man-pages \
        --no-header-files \
        --compress=zip-6 \
        --output /home/build/custom-jre

  # Install to destdir
  - runs: |
      # Install custom JRE
      mkdir -p "${{targets.destdir}}/usr/lib/jvm/java-21-minimal"
      cp -a /home/build/custom-jre/* "${{targets.destdir}}/usr/lib/jvm/java-21-minimal/"

      # Create java symlink in /usr/bin
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -sf /usr/lib/jvm/java-21-minimal/bin/java "${{targets.destdir}}/usr/bin/java"

      # Install Jenkins WAR
      mkdir -p "${{targets.destdir}}/usr/share/jenkins"
      cp /home/build/jenkins/jenkins.war "${{targets.destdir}}/usr/share/jenkins/jenkins.war"

      # Install fonts (needed for Jenkins UI)
      mkdir -p "${{targets.destdir}}/usr/share/fonts"
      cp -a /usr/share/fonts/truetype "${{targets.destdir}}/usr/share/fonts/" 2>/dev/null || true
      mkdir -p "${{targets.destdir}}/etc/fonts"
      cp -a /etc/fonts/* "${{targets.destdir}}/etc/fonts/" 2>/dev/null || true

      # Strip native libraries in JRE
      find "${{targets.destdir}}/usr/lib/jvm/java-21-minimal" -name '*.so' \
        -exec strip --strip-unneeded {} + 2>/dev/null || true

  # Verify the build
  - runs: |
      echo "Verifying custom JRE..."
      "${{targets.destdir}}/usr/lib/jvm/java-21-minimal/bin/java" -version
      echo "Checking JRE size..."
      du -sh "${{targets.destdir}}/usr/lib/jvm/java-21-minimal"
      echo "Checking Jenkins WAR..."
      ls -lh "${{targets.destdir}}/usr/share/jenkins/jenkins.war"
      echo "Checking mina-core CVE fix..."
      unzip -p "${{targets.destdir}}/usr/share/jenkins/jenkins.war" \
        'WEB-INF/detached-plugins/mina-sshd-api-core.hpi' > /tmp/_mina.hpi
      if ! unzip -l /tmp/_mina.hpi | grep -q 'mina-core-2.2.7.jar'; then
        echo "ERROR: mina-core 2.2.7 not found in war (Critical fix missing)"; exit 1
      fi
      ! unzip -l /tmp/_mina.hpi | grep -q 'mina-core-2.2.4.jar' || { echo "ERROR: vulnerable mina-core 2.2.4 still present"; exit 1; }
      rm -f /tmp/_mina.hpi
      echo "✓ mina-core 2.2.7 (Critical fixed)"

# Automated version updates via wolfictl
# Jenkins LTS uses release-monitor.org (releases don't follow standard GitHub tag pattern)
  # patch-bundled-jars: auto-generated — do not edit manually
  - runs: |
      # Bundled-jar CVE fixes, sha256-pinned. Regenerated from grype by
      # .github/scripts/patch-bundled-jars.sh — do not edit by hand.
      #
      # Mirrors are rotated BEFORE the wait is widened. repo1.maven.org and
      # repo.maven.apache.org both sit behind Cloudflare, so a WAF 403 refuses
      # both; the googleapis mirror is separate infrastructure. Waiting a single
      # host out does not work — opensearch (2026-08-23) and solr (2026-08-26)
      # each burned 9 attempts over 4m15s against one host and still failed.
      _BJ_MIRRORS="https://repo1.maven.org/maven2 https://maven-central.storage-download.googleapis.com/maven2 https://repo.maven.apache.org/maven2"
      _bj_fetch() {  # $1=path-after-/maven2/  $2=output
        for _r in 1 2 3 4; do
          for _b in $_BJ_MIRRORS; do
            if curl -fsSL --connect-timeout 15 --max-time 300 \
                 --retry 2 --retry-all-errors "$_b/$1" -o "$2"; then return 0; fi
          done
          [ "$_r" -lt 4 ] && sleep $(( _r * 30 ))
        done
        echo "bundled-jar: all Maven mirrors refused $1" >&2; return 1
      }
      _swap() {  # $1=artifact $2=group-path $3=oldver $4=newver $5=sha256 $6=mode $7=classifier|-
        # $7 is a per-platform classifier (linux-x86_64, ...) or "-" for the plain
        # jar. Native artifacts ship one jar per platform and the plain match skips
        # them, which left a mixed netty in opensearch. Central publishes each
        # classifier artifact, so they are pinned individually.
        _c=""; [ "$7" = "-" ] || _c="-$7"
        # rename: jar filename carries the version, match it exactly. keep-filename:
        # filename stays the upstream version while contents change, so match any
        # version of the artifact and overwrite in place. Two anchors on that
        # match, both load-bearing: [0-9] pins the start of the version segment,
        # or netty-codec matches netty-codec-http-*.jar and overwrites the http
        # codec with the plain codec jar (keycloak died with NoClassDefFoundError
        # FullHttpResponse); the ! -name excludes classifier jars
        # (netty-transport-native-epoll-<v>-linux-x86_64.jar), whose content is
        # NOT what $1-$4.jar holds — overwriting them drops the bundled .so.
        if [ "$6" = "keep-filename" ]; then
          if [ -n "$_c" ]; then found=$(find "${{targets.destdir}}/usr/share/jenkins" -name "*$1-[0-9]*$_c.jar")
          else found=$(find "${{targets.destdir}}/usr/share/jenkins" -name "*$1-[0-9]*.jar" ! -name "*$1-[0-9]*-*.jar"); fi
        else
          found=$(find "${{targets.destdir}}/usr/share/jenkins" -name "*$1-$3$_c.jar")
        fi
        [ -n "$found" ] || { echo "  $1 $3$_c not present (upstream may already ship >=$4)"; return 0; }
        _bj_fetch "$2/$1/$4/$1-$4$_c.jar" /tmp/_bj.jar
        echo "$5  /tmp/_bj.jar" | sha256sum -c -
        for f in $found; do
          if [ "$6" = "keep-filename" ]; then
            _have=$(_jarver "$f")
            if _vge "$_have" "$4"; then echo "  $1 already at $_have (>= $4), leaving it"; continue; fi
            cp /tmp/_bj.jar "$f"
          else cp /tmp/_bj.jar "$(dirname "$f")/$1-$4$_c.jar"; rm -f "$f"; fi
          echo "  patched $1 $3 -> $4 ($6$_c)"
        done
        rm -f /tmp/_bj.jar
      }
      _swap jackson-core tools/jackson/core 3.1.3 3.1.4 3bda1cd6eff0a8d47bdfcaeae7c2bd5311d6c8ed494ef5f3e51029bb44aa9bdf rename -
      _swap jackson-databind tools/jackson/core 3.1.3 3.1.4 14034bfdf392b6ebec1b4bb6c1de29d604f0aa97251259a19d5f19af8719bb20 rename -
      _swap jackson-dataformat-toml tools/jackson/dataformat 3.1.3 3.1.4 b15c504d7587ec2880f07b9e48b23dd8bae91fff4011eca2129e29cbbbeda519 rename -
      _swap jackson-dataformat-xml tools/jackson/dataformat 3.1.3 3.1.4 840309252329c79dedc84b45179bc976934619d17c96cee69f4e07380d7e8705 rename -
      _swap jackson-dataformat-yaml tools/jackson/dataformat 3.1.3 3.1.4 f583bd16b6d39a0ec900e37948507616bb651caea58fb882560d7e63efbe56db rename -
      _swap jetty-alpn-java-server org/eclipse/jetty 12.1.8 12.1.10 cc002690501f4135d145d326a4b1b4c4872c710daf654ced9ef7028257c7925b rename -
      _swap jetty-alpn-server org/eclipse/jetty 12.1.8 12.1.10 d00e8b8ecb3b9fe02f68dd31402af3ce67200e0dec6bf4e571a824a6284c1b65 rename -
      _swap jetty-ee-webapp org/eclipse/jetty/ee 12.1.8 12.1.10 a75c0f3ec4aff18295e8ebeba5de07e67c22892f511e7637e6e51ba7b01f35e1 rename -
      _swap jetty-ee9-nested org/eclipse/jetty/ee9 12.1.8 12.1.10 6b8d196d9788e0c6ec715ed29c5c0288cf64dea708205dd097b773c2649d99fb rename -
      _swap jetty-ee9-security org/eclipse/jetty/ee9 12.1.8 12.1.10 728fb6e9910a01c8d49e01f096580b4e1c46b22d49af1a80acb3c5f4d2f72723 rename -
      _swap jetty-ee9-servlet org/eclipse/jetty/ee9 12.1.8 12.1.10 71a0518e1e3eed5a47e1e8ad47012dc5e5a17194c8c805048f4848613f675b7a rename -
      _swap jetty-ee9-webapp org/eclipse/jetty/ee9 12.1.8 12.1.10 af71494e00eddbdd893764ed62eef0f0589388af171cdc69b0aabe9a25b855b2 rename -
      _swap jetty-ee9-websocket-jetty-api org/eclipse/jetty/ee9/websocket 12.1.8 12.1.10 cee65c41aaf12bf108bbdde5a382c43e5150568caf03217534428e0001a134ee rename -
      _swap jetty-ee9-websocket-jetty-common org/eclipse/jetty/ee9/websocket 12.1.8 12.1.10 135d52a57bb4ef732e11e92741ef64114ef7a050ca63a6d5b7d6d3b3a6b2c8e1 rename -
      _swap jetty-ee9-websocket-jetty-server org/eclipse/jetty/ee9/websocket 12.1.8 12.1.10 078d66eee17298356d5a3aebcc52a2539538dd66de503dabb0048e94b8400c8a rename -
      _swap jetty-ee9-websocket-servlet org/eclipse/jetty/ee9/websocket 12.1.8 12.1.10 54c45a89862bcab48db713f5ef79f14eb4eafe73b28c59cbe098c6e82c8a8acf rename -
      _swap jetty-http2-common org/eclipse/jetty/http2 12.1.8 12.1.10 1e96e4a1137df8d3b92aab545da6ef81e585d5241ee58611188f6ff0e9779a99 rename -
      _swap jetty-http2-hpack org/eclipse/jetty/http2 12.1.8 12.1.10 a8b7a048dc32619c432a558da33d7baa81b8a227fb821829bcc467afc0b06525 rename -
      _swap jetty-http2-server org/eclipse/jetty/http2 12.1.8 12.1.10 f7c96249ea4f343fe28aebe7784e51f25e64501beb3dded6ef383bc066fb5cce rename -
      _swap jetty-http org/eclipse/jetty 12.1.8 12.1.10 090f276739fd9bf8c30511007caec669ea3804b1df1061c37f44467474bee71d rename -
      _swap jetty-io org/eclipse/jetty 12.1.8 12.1.10 448fc0f8f6f5f7251fc46de8e3aae7da14bd7c571a8043dac3dc381d08228fa0 rename -
      _swap jetty-jmx org/eclipse/jetty 12.1.8 12.1.10 baaaf76b139335125bfa51109c80d271de73f40ee8b5270674f56e90a66e9d81 rename -
      _swap jetty-security org/eclipse/jetty 12.1.8 12.1.10 2f34b7895cec4e3547a1b52e12e7e92b3f3a110bf3c17637f8743ca3f4e42f0c rename -
      _swap jetty-server org/eclipse/jetty 12.1.8 12.1.10 4b0108e87abada7027123deca17186249413232dad0a2bd58a4e70a987b5354a rename -
      _swap jetty-session org/eclipse/jetty 12.1.8 12.1.10 164649123d15a3f2be5c196e82aa652dff05c75362db71b0f4ab6bb35165020a rename -
      _swap jetty-unixdomain-server org/eclipse/jetty 12.1.8 12.1.10 d2b8656d224d8235a2f0178bbd6e345c162d9a01f6887bdd144f58512ee531db rename -
      _swap jetty-util org/eclipse/jetty 12.1.8 12.1.10 c52b4ff62cdacca8a399c611231129e6bd1074db7e3892e78cd106725cdd0ef1 rename -
      _swap jetty-websocket-core-common org/eclipse/jetty/websocket 12.1.8 12.1.10 bc6397bf67feeb18d7851b5fbf817c4ed11016024481202e8db790bb5a8321e1 rename -
      _swap jetty-websocket-core-server org/eclipse/jetty/websocket 12.1.8 12.1.10 ca9e5cdecde06d21d0637f7b0c15e40b90463290fa8c75d2c66b4bad6910608d rename -
      _swap jetty-xml org/eclipse/jetty 12.1.8 12.1.10 d4660c9fa82eabfa9e5996eff5b36ae22e5e14430c3dcc485920aef889149a89 rename -
      _swap mina-core org/apache/mina 2.2.7 2.2.8 07a62c5b2fae3a61da693f7a5c6d6711a7ea09f318972d3e76ae8a5f032329f3 rename -
      _strag=/tmp/_bj_stragglers; : > "$_strag"
      find "${{targets.destdir}}/usr/share/jenkins" \( -name "jackson*-3.1.*.jar" -o -name "jackson*-3.1.jar" \) ! -name "*-3.1.4.jar" ! -name "*-3.1.4-*.jar" >> "$_strag" 2>/dev/null || true
      find "${{targets.destdir}}/usr/share/jenkins" \( -name "jetty*-12.1.*.jar" -o -name "jetty*-12.1.jar" \) ! -name "*-12.1.10.jar" ! -name "*-12.1.10-*.jar" >> "$_strag" 2>/dev/null || true
      find "${{targets.destdir}}/usr/share/jenkins" \( -name "mina*-2.2.*.jar" -o -name "mina*-2.2.jar" \) ! -name "*-2.2.8.jar" ! -name "*-2.2.8-*.jar" >> "$_strag" 2>/dev/null || true
      if [ -s "$_strag" ]; then
        echo "patch-bundled-jars: jars left on a superseded version:" >&2
        sort -u "$_strag" >&2
        rm -f "$_strag"; exit 1
      fi
      rm -f "$_strag"
  # end-patch-bundled-jars
update:
  enabled: true
  release-monitor:
    identifier: 7518
