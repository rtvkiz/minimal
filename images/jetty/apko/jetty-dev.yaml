# Development variant of minimal-jetty.
# Same Jetty + OpenJDK 25 as prod, plus the dev minimum (shell, apk-tools) and
# curl for checking endpoints from inside the pod.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our Jetty (built from the official jetty-home via melange)
    - jetty

    # Base filesystem
    - wolfi-baselayout

    # Java runtime
    - openjdk-25-jre
    - openjdk-25-default-jvm

    # Certificates
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget
    - curl

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/lib/jvm/java-25-openjdk/bin/java -Djava.io.tmpdir=/tmp -jar /usr/share/jetty/start.jar jetty.home=/usr/share/jetty jetty.base=/var/lib/jetty

cmd: --module=http,ee10-deploy

work-dir: /var/lib/jetty

environment:
  PATH: /usr/lib/jvm/java-25-openjdk/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  JETTY_HOME: /usr/share/jetty
  JETTY_BASE: /var/lib/jetty
  HOME: /tmp

paths:
  - path: /var/lib/jetty
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/jetty/webapps
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # Jetty 12's deployer scans environments/ for per-environment config.
  - path: /var/lib/jetty/environments
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-jetty-dev"
  org.opencontainers.image.description: "Dev variant of minimal-jetty: same Jetty and OpenJDK 25 plus a shell, apk-tools and curl. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/jetty"
  org.opencontainers.image.licenses: "EPL-2.0 OR Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
