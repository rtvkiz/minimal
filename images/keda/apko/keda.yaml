# Minimal keda image - using Wolfi's pre-built package
# CVE patching via the daily rebuild (Wolfi versioned package)
#
# keda-2.19 is the KEDA operator: a Kubernetes-based Event Driven Autoscaling
# controller, installed as /usr/bin/keda. Dynamically linked (D: so:libc.so.6,
# so:ld-linux-x86-64.so.2, tzdata in the APKINDEX), unlike karpenter's fully
# static binary - apko resolves those from the Wolfi repo automatically.
#
# Wolfi also packages keda-2.19-metrics-apiserver (the metrics adapter) and
# keda-2.19-admission-webhooks separately. Those are optional companion
# deployments in the KEDA helm chart, not required for the operator to run;
# shipping them as their own images is a follow-up, not part of this one.
#
# Package name is pinned to the versioned "keda-2.19" (not a bare "keda"
# provide) because multiple keda-X.Y packages can coexist in Wolfi's index -
# same ambiguity as argo-cd/couchdb/kong/karpenter. A MAJOR-line bump
# (2.19 -> 2.20) needs a manual apko package name + build.yml grep edit,
# same as those.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # KEDA operator from Wolfi (CVE-patched)
    - keda-2.19

    # Certificates (Kubernetes API is TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/keda

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-keda"
  org.opencontainers.image.description: "Hardened shell-less KEDA Kubernetes event-driven autoscaler operator built on Wolfi with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/keda"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
