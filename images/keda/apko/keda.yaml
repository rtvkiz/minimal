# Minimal keda image - built from source via melange
# KEDA operator (Kubernetes event-driven autoscaler), /usr/bin/keda. Static
# CGO-off Go binary. tzdata is carried because the cron scaler resolves IANA
# time zones at runtime (Wolfi's package declared it as a runtime dep too).
#
# Source-built since 2026-10-31: Wolfi's keda-2.19 stopped receiving builds in
# May 2026 and was frozen at 2.19.0. keda-adapter (metrics apiserver) and
# keda-admission-webhooks are separate optional deployments, not in this image.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout
    - keda
    - tzdata

    # Certificates (Kubernetes API is TLS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/keda

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-keda"
  org.opencontainers.image.description: "Hardened shell-less KEDA Kubernetes event-driven autoscaler operator built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/keda"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
