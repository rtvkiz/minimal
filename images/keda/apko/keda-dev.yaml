# Development variant of minimal-keda.
# Same operator binary from prod, plus a shell and debugging tools.
# In-house composition (no public Chainguard keda-dev reference).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - keda-2.19
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Debugging (kubeconfig inspection) ---
    - curl
    - jq

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/keda

work-dir: /tmp

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-keda-dev"
  org.opencontainers.image.description: "Dev variant of minimal-keda: same operator binary + shell + debugging tools. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/keda"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
