# Melange build for minimal OpenSearch.
# Installs the official upstream OpenSearch "min" distribution (core only, no
# bundled plugins) rather than Wolfi's `opensearch-3` package. The free Wolfi
# package is frozen at 3.6.0-r5 while the CVE fixes (opensearch 3.7.0, which
# also bundles the fixed netty 4.2.15.Final) are enterprise-gated. The official
# 3.7.0 distribution is public, so we build from it and pick up the fixes.
# The bundled JDK is dropped in favour of Wolfi's openjdk-21 (Wolfi patches it).
# License: Apache-2.0 (OpenSearch).

package:
  # Named `opensearch` (not `opensearch-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:opensearch:opensearch-minimal:*,
  # cpe:2.3:a:opensearch-minimal:opensearch-minimal:*, ...). NVD indexes this
  # product bare, as cpe:2.3:a:opensearch:opensearch:*, so none of them
  # matched, and the Wolfi secdb missed it too.
  name: opensearch
  version: 3.8.0
  epoch: 0
  description: "Minimal OpenSearch from the official upstream min distribution"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `opensearch` package today, but if it ever adds one at a higher
    # version, apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA512 of the official opensearch-min-<ver>-linux-<arch>.tar.gz, from the
  # upstream .sha512 files. Updated by update-versions.yml.
  sha512_x86: d29783b45a3ce99b47cab6b0bf1209fc856be6e530b3b95d247af48cd4ccc18b70c5e9cb4cde332bd65b615ac51047ea97ac96249178b47fea618ad3fa416f24
  sha512_arm: 244b0c4ff07079636c48f75788814937516f8a8dfb94c04d3dd149da7f23476503e9801f4a20fe62e0c701f6c74adb2dd50ec0c9e8d97b5e5a9774f5a1089755

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  # Download and verify the official min distribution for the build arch.
  - runs: |
      BUILD_ARCH=$(uname -m)
      case "$BUILD_ARCH" in
        x86_64)  OS_ARCH="x64";   CHECKSUM="${{vars.sha512_x86}}" ;;
        aarch64) OS_ARCH="arm64"; CHECKSUM="${{vars.sha512_arm}}" ;;
        *) echo "Unsupported arch: $BUILD_ARCH"; exit 1 ;;
      esac
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors \
        "https://artifacts.opensearch.org/releases/core/opensearch/${{package.version}}/opensearch-min-${{package.version}}-linux-${OS_ARCH}.tar.gz" \
        -o /home/build/opensearch.tar.gz
      echo "${CHECKSUM}  /home/build/opensearch.tar.gz" | sha512sum -c -

      mkdir -p "${{targets.destdir}}/usr/share/opensearch"
      tar xzf /home/build/opensearch.tar.gz \
        -C "${{targets.destdir}}/usr/share/opensearch" --strip-components=1
      rm /home/build/opensearch.tar.gz

      # Drop the bundled JDK — we run on Wolfi's openjdk-21 (kept patched by
      # Wolfi). Saves ~300MB and removes the bundled JDK's CVE surface.
      rm -rf "${{targets.destdir}}/usr/share/opensearch/jdk"

      # Minimal single-node defaults for container usage. single-node discovery
      # also skips the production bootstrap checks (max_map_count, etc.).
      printf '\n# minimal image defaults\nnetwork.host: 0.0.0.0\ndiscovery.type: single-node\n' \
        >> "${{targets.destdir}}/usr/share/opensearch/config/opensearch.yml"

      # Normalize permissions: the distro ships config/ files as 0660 and
      # config/jvm.options.d as 0750 — both unreadable by "other". melange's
      # post-build xattr step (rootless in CI, unlike a local root build) then
      # fails to traverse them ("permission denied opening config/jvm.options.d").
      # a+rX makes dirs traversable and files readable without granting write;
      # apko re-chowns the tree to the runtime user (65532) afterward.
      chmod -R a+rX "${{targets.destdir}}/usr/share/opensearch"


  # patch-bundled-jars: auto-generated — do not edit manually
  - runs: |
      # Bundled-jar CVE fixes, sha256-pinned. Regenerated from grype by
      # .github/scripts/patch-bundled-jars.sh — do not edit by hand.
      _swap() {  # $1=artifact $2=group-path $3=oldver $4=newver $5=sha256 $6=mode
        # rename: jar filename carries the version, match it exactly. keep-filename:
        # filename stays the upstream version while contents change, so match any
        # version of the artifact and overwrite in place.
        if [ "$6" = "keep-filename" ]; then
          found=$(find "${{targets.destdir}}/usr/share/opensearch" -name "*$1-*.jar")
        else
          found=$(find "${{targets.destdir}}/usr/share/opensearch" -name "*$1-$3.jar")
        fi
        [ -n "$found" ] || { echo "  $1 $3 not present (upstream may already ship >=$4)"; return 0; }
        curl -fsSL --retry 5 --retry-all-errors \
          "https://repo1.maven.org/maven2/$2/$1/$4/$1-$4.jar" -o /tmp/_bj.jar
        echo "$5  /tmp/_bj.jar" | sha256sum -c -
        for f in $found; do
          if [ "$6" = "keep-filename" ]; then cp /tmp/_bj.jar "$f";
          else cp /tmp/_bj.jar "$(dirname "$f")/$1-$4.jar"; rm -f "$f"; fi
          echo "  patched $1 $3 -> $4 ($6)"
        done
        rm -f /tmp/_bj.jar
      }
      _swap httpclient5 org/apache/httpcomponents/client5 5.6.1 5.6.3 80712ff129210d7c73d9fcc1195cbee5c3c34744965c7a05ea107b3648922f18 rename
      _swap httpcore5 org/apache/httpcomponents/core5 5.4 5.4.3 18bfbbabb478dfb67f31aeaf428c387f3c3df654582e1309f708ee1f3086830a rename
      _swap httpcore5-h2 org/apache/httpcomponents/core5 5.4 5.4.3 c7db7026b8e2dea39132b04a6069f6671e2858309b20a146ec5c7dd6ed73a0b6 rename
      _swap log4j-api org/apache/logging/log4j 2.25.4 2.25.5 64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863 rename
      _swap httpcore5-h2 org/apache/httpcomponents/core5 5.4 5.4.3 c7db7026b8e2dea39132b04a6069f6671e2858309b20a146ec5c7dd6ed73a0b6 rename
      _swap httpcore5-reactive org/apache/httpcomponents/core5 5.4 5.4.3 f3b7c80d6021fee8ad42628d41eb826905fb3b595c211f001fdffa7fa1ecec3d rename
      _swap httpcore5 org/apache/httpcomponents/core5 5.4 5.4.3 18bfbbabb478dfb67f31aeaf428c387f3c3df654582e1309f708ee1f3086830a rename
      _swap log4j-core org/apache/logging/log4j 2.25.4 2.25.5 050c4f85deb48b055e9c041ac39043fbb79ce477841a11a1eb2969c86c6a0072 rename
      _swap log4j-jul org/apache/logging/log4j 2.25.4 2.25.5 23c0b34c3c31811bea7716a33137d1e9e8e228f9f8c240b69f30cdca9afe9a7a rename
      _stragglers=""
      _stragglers="$_stragglers$(find "${{targets.destdir}}/usr/share/opensearch" -name "httpclient5*-5.6.*.jar" -o -name "httpclient5*-5.6.jar" 2>/dev/null)"
      _stragglers="$_stragglers$(find "${{targets.destdir}}/usr/share/opensearch" -name "httpcore5*-5.4.*.jar" -o -name "httpcore5*-5.4.jar" 2>/dev/null)"
      _stragglers="$_stragglers$(find "${{targets.destdir}}/usr/share/opensearch" -name "httpcore5*-5.4.*.jar" -o -name "httpcore5*-5.4.jar" 2>/dev/null)"
      _stragglers="$_stragglers$(find "${{targets.destdir}}/usr/share/opensearch" -name "log4j*-2.25.*.jar" -o -name "log4j*-2.25.jar" 2>/dev/null)"
      _stragglers="$_stragglers$(find "${{targets.destdir}}/usr/share/opensearch" -name "httpcore5*-5.4.*.jar" -o -name "httpcore5*-5.4.jar" 2>/dev/null)"
      _stragglers="$_stragglers$(find "${{targets.destdir}}/usr/share/opensearch" -name "httpcore5*-5.4.*.jar" -o -name "httpcore5*-5.4.jar" 2>/dev/null)"
      _stragglers="$_stragglers$(find "${{targets.destdir}}/usr/share/opensearch" -name "httpcore5*-5.4.*.jar" -o -name "httpcore5*-5.4.jar" 2>/dev/null)"
      _stragglers="$_stragglers$(find "${{targets.destdir}}/usr/share/opensearch" -name "log4j*-2.25.*.jar" -o -name "log4j*-2.25.jar" 2>/dev/null)"
      _stragglers="$_stragglers$(find "${{targets.destdir}}/usr/share/opensearch" -name "log4j*-2.25.*.jar" -o -name "log4j*-2.25.jar" 2>/dev/null)"
      if [ -n "$_stragglers" ]; then
        echo "patch-bundled-jars: jars left on a superseded version:" >&2
        echo "$_stragglers" >&2
        exit 1
      fi
  # end-patch-bundled-jars
  # Verify the distribution shape + that the fixed netty shipped.
  - runs: |
      test -x "${{targets.destdir}}/usr/share/opensearch/bin/opensearch"
      echo "Bundled netty version(s):"
      ls "${{targets.destdir}}/usr/share/opensearch/lib/" | grep -oE 'netty[-a-z]*-[0-9.]+Final' | sort -u | head
      ls "${{targets.destdir}}/usr/share/opensearch/lib/" | grep -q 'netty.*4\.2\.15' \
        && echo "✓ netty 4.2.15 present" || echo "WARN: expected netty 4.2.15"
      echo "jackson-databind jar(s):"
      find "${{targets.destdir}}/usr/share/opensearch" -name 'jackson-databind-*.jar' -exec basename {} \;

update:
  enabled: true
  github:
    identifier: opensearch-project/OpenSearch
    use-tag: true
