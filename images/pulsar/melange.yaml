# Melange build configuration for minimal Apache Pulsar
# Official binary release + custom JRE via jlink (kafka/zookeeper JVM pattern).
# Pulsar 4.x requires Java 21. bin/pulsar is a bash launcher (prod image ships bash).
# License: Apache-2.0.

package:
  # Named `pulsar` (not `pulsar-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:pulsar:pulsar-minimal:*,
  # cpe:2.3:a:pulsar-minimal:pulsar-minimal:*, ...). NVD indexes this product
  # bare, as cpe:2.3:a:pulsar:pulsar:*, so none of them matched, and the Wolfi
  # secdb missed it too.
  name: pulsar
  version: 4.2.4
  epoch: 0
  description: "Minimal Apache Pulsar messaging/streaming server with custom JRE (jlink)"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `pulsar` package today, but if it ever adds one at a higher version,
    # apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA512 of apache-pulsar-{version}-bin.tar.gz - updated by update-versions.yml
  sha512: 8c0a63cc6421c8eb3c4a55b8895ca08a38a1c6771758251fc7a82edbc4c6a42bb8ba5c956066b637ec7e049149d467c034e854b571a4cb000f42a47ae6105971

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # Full JDK 21 needed for jlink (build-time only); Pulsar 4.x targets Java 21.
      - openjdk-21-default-jdk
      - openjdk-21-jmods
      # binutils provides objcopy required by jlink --strip-debug
      - binutils

pipeline:
  # Download and verify the official Pulsar binary release
  - runs: |
      mkdir -p /home/build
      curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors \
        "https://dlcdn.apache.org/pulsar/pulsar-${{package.version}}/apache-pulsar-${{package.version}}-bin.tar.gz" \
        -o /home/build/pulsar.tar.gz || \
      curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors \
        "https://downloads.apache.org/pulsar/pulsar-${{package.version}}/apache-pulsar-${{package.version}}-bin.tar.gz" \
        -o /home/build/pulsar.tar.gz || \
      curl -fsSL --connect-timeout 30 --retry 8 --retry-all-errors \
        "https://archive.apache.org/dist/pulsar/pulsar-${{package.version}}/apache-pulsar-${{package.version}}-bin.tar.gz" \
        -o /home/build/pulsar.tar.gz

      echo "${{vars.sha512}}  /home/build/pulsar.tar.gz" | sha512sum -c -

      cd /home/build
      tar xzf pulsar.tar.gz
      rm pulsar.tar.gz

  # Custom minimal JRE (Java 21). Pulsar bundles Netty, BookKeeper (RocksDB JNI) and
  # ZooKeeper, so the module set is generous: crypto + jgss/sasl for TLS/auth,
  # management(.agent)/jfr for JMX, jdk.sctp/jdk.net for Netty transports,
  # jdk.unsupported for Netty/RocksDB sun.misc.Unsafe usage.
  - runs: |
      JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      $JAVA_HOME/bin/jlink \
        --module-path $JAVA_HOME/jmods \
        --add-modules java.base,java.compiler,java.desktop,java.instrument,java.logging,java.management,java.management.rmi,java.naming,java.net.http,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.xml,java.xml.crypto,jdk.crypto.cryptoki,jdk.crypto.ec,jdk.httpserver,jdk.jfr,jdk.management,jdk.management.agent,jdk.naming.dns,jdk.net,jdk.sctp,jdk.security.auth,jdk.unsupported,jdk.zipfs \
        --strip-debug \
        --no-man-pages \
        --no-header-files \
        --compress=zip-6 \
        --output /home/build/custom-jre

  - runs: |
      PULSAR_SRC="/home/build/apache-pulsar-${{package.version}}"

      # Custom JRE
      mkdir -p "${{targets.destdir}}/usr/lib/jvm/java-21-minimal"
      cp -a /home/build/custom-jre/* "${{targets.destdir}}/usr/lib/jvm/java-21-minimal/"
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -sf ../lib/jvm/java-21-minimal/bin/java "${{targets.destdir}}/usr/bin/java"

      # Pulsar install — ship the runtime bits (bin/conf/lib). Drop examples/ and the
      # functions runtime (instances/) to slim; standalone messaging doesn't need them.
      mkdir -p "${{targets.destdir}}/opt/pulsar"
      cp -a "$PULSAR_SRC"/bin "$PULSAR_SRC"/conf "$PULSAR_SRC"/lib \
        "${{targets.destdir}}/opt/pulsar/"

      # Entrypoint: run a single-node standalone cluster in the foreground with data
      # and logs under /var/lib/pulsar (writable) — /opt/pulsar is read-only.
      cat > "${{targets.destdir}}/usr/bin/pulsar-entrypoint.sh" << 'ENTRY'
      #!/bin/sh
      set -e
      export PULSAR_HOME=/opt/pulsar
      export JAVA_HOME=/usr/lib/jvm/java-21-minimal
      export PULSAR_LOG_DIR="${PULSAR_LOG_DIR:-/var/lib/pulsar/logs}"
      mkdir -p "$PULSAR_LOG_DIR" /var/lib/pulsar/zookeeper /var/lib/pulsar/bookkeeper
      exec /opt/pulsar/bin/pulsar standalone \
        --zookeeper-dir /var/lib/pulsar/zookeeper \
        --bookkeeper-dir /var/lib/pulsar/bookkeeper "$@"
      ENTRY
      chmod +x "${{targets.destdir}}/usr/bin/pulsar-entrypoint.sh"

      # Whole static install world-readable/traversable (we run as nonroot 65532).
      chmod -R a+rX "${{targets.destdir}}/opt/pulsar"

      find "${{targets.destdir}}/usr/lib/jvm/java-21-minimal" -name '*.so' \
        -exec strip --strip-unneeded {} + 2>/dev/null || true

  - runs: |
      echo "Verifying JRE..."
      "${{targets.destdir}}/usr/lib/jvm/java-21-minimal/bin/java" -version
      echo "Checking Pulsar install..."
      test -x "${{targets.destdir}}/opt/pulsar/bin/pulsar"
      ls "${{targets.destdir}}"/opt/pulsar/lib/org.apache.pulsar-pulsar-broker-*.jar
      test -f "${{targets.destdir}}/opt/pulsar/conf/standalone.conf"

update:
  enabled: true
  github:
    identifier: apache/pulsar
    use-tag: true
    tag-filter: "v4."
    strip-prefix: "v"
