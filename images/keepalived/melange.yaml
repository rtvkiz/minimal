# Melange build configuration for minimal Keepalived
# Pure C from source, autotools build. VRRP failover + LVS/IPVS load balancing.
# License: GPL-2.0-or-later.

package:
  # Named `keepalived` (not `keepalived-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, so the
  # `-minimal` suffix produced
  # cpe:2.3:a:keepalived-minimal:keepalived-minimal:* — which matches nothing
  # in NVD (indexed as cpe:2.3:a:keepalived:keepalived:*) and nothing in the
  # Wolfi secdb either, so both of grype's matchers missed every CVE for this
  # package.
  name: keepalived
  version: 2.4.3
  epoch: 0
  description: "Minimal Keepalived VRRP failover and LVS load balancer built from source"
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `keepalived` package today, but if it ever adds one at a higher
    # version, apk would silently install Wolfi's build instead of this
    # source-built one. provider-priority is evaluated BEFORE version in that
    # comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of keepalived-{version}.tar.gz - updated by update-versions.yml
  sha256: a0faef8e401c143487b131b526df7541c1e33d9b8814642fa9dfe8bb250a9632

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - openssl-dev
      - libnl3-dev
      - libnfnetlink-dev
      - ipset-dev
      - libmnl-dev

pipeline:
  # Download and verify the source tarball.
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors \
        "https://www.keepalived.org/software/keepalived-${{package.version}}.tar.gz" \
        -o /home/build/keepalived.tar.gz

      echo "${{vars.sha256}}  /home/build/keepalived.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf keepalived.tar.gz
      rm keepalived.tar.gz

  # Build: VRRP + LVS via libnl3/libnfnetlink/ipset, TLS via OpenSSL.
  # --disable-dbus and --disable-snmp drop two large optional runtime surfaces
  # neither of which works in a distroless image anyway (no system bus, no
  # snmpd). --with-init=none skips installing systemd/sysvinit units.
  # --sbindir=/usr/bin installs the daemon straight into /usr/bin (Wolfi is
  # usrmerge — /usr/sbin doesn't exist), avoiding a post-install relocate.
  - runs: |
      cd /home/build/keepalived-${{package.version}}
      ./configure \
        --prefix=/usr \
        --sbindir=/usr/bin \
        --sysconfdir=/etc \
        --disable-dbus \
        --disable-snmp \
        --with-init=none \
        --disable-static
      make -j"$(nproc)"

  # Install into destdir + a minimal VRRP config.
  - runs: |
      cd /home/build/keepalived-${{package.version}}
      make install DESTDIR="${{targets.destdir}}"

      strip --strip-unneeded "${{targets.destdir}}/usr/bin/keepalived" || true

      # Default config: a single VRRP instance that is valid enough for
      # --config-test to parse offline. Real deployments mount their own
      # /etc/keepalived/keepalived.conf over this.
      mkdir -p "${{targets.destdir}}/etc/keepalived"
      cat > "${{targets.destdir}}/etc/keepalived/keepalived.conf" << 'CFG'
      global_defs {
          router_id minimal
          # Container-friendly: log to console rather than a syslog socket that
          # does not exist in a distroless image.
          enable_script_security
          script_user nonroot
      }

      vrrp_instance VI_1 {
          state BACKUP
          interface eth0
          virtual_router_id 51
          priority 100
          advert_int 1
          virtual_ipaddress {
              192.168.255.254/32
          }
      }
      CFG

  # Verify the build.
  - runs: |
      echo "Verifying Keepalived build..."
      "${{targets.destdir}}/usr/bin/keepalived" --version 2>&1 | head -3
      echo "Binary size:"
      ls -lh "${{targets.destdir}}/usr/bin/keepalived"

update:
  enabled: true
  github:
    identifier: acassen/keepalived
    strip-prefix: v
    tag-filter: "v2."
