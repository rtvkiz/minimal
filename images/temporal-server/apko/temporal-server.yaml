# minimal-temporal-server — built from source via melange
# Temporal workflow engine server, built from source with SLSA provenance.
#
# Runtime shape mirrors the published temporalio/Chainguard images so this is a
# drop-in replacement: uid 1000, TEMPORAL_HOME=/etc/temporal, work-dir
# /etc/temporal.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - temporal-server
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: temporal
      gid: 1000
  users:
    - username: temporal
      uid: 1000
      gid: 1000
  run-as: 1000

entrypoint:
  command: /usr/bin/temporal-server

cmd: start

work-dir: /etc/temporal

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  TEMPORAL_HOME: /etc/temporal

paths:
  - path: /etc/temporal/config
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-temporal-server"
  org.opencontainers.image.description: "Temporal workflow engine server, built from source with SLSA provenance."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/temporal-server"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
