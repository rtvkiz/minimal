# Melange build configuration for minimal Jaeger
# Builds Jaeger v2 from source (Go) — single all-in-one binary
# Uses in-memory storage by default; OTLP-native ingestion

package:
  # Named `jaeger` (not `jaeger-minimal`) so vulnerability scanners can
  # identify it. Syft derives a package's CPE from its apk name, and every CPE
  # it generated kept -minimal in the product field
  # (cpe:2.3:a:jaeger:jaeger-minimal:*,
  # cpe:2.3:a:jaeger-minimal:jaeger-minimal:*, ...). NVD indexes this product
  # bare, as cpe:2.3:a:jaeger:jaeger:*, so none of them matched, and the Wolfi
  # secdb missed it too.
  name: jaeger
  version: 2.20.0
  epoch: 0
  description: "Minimal Jaeger distributed tracing backend built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `jaeger` package today, but if it ever adds one at a higher version,
    # apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  sha256: 667a744192a31d3159acbeafb08e3c241ffd86118696443643b6d03cec9b2af8

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go-1.27
      - git

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-all-errors "https://github.com/jaegertracing/jaeger/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/jaeger.tar.gz
      echo "${{vars.sha256}}  /home/build/jaeger.tar.gz" | sha256sum -c -
      cd /home/build && tar xzf jaeger.tar.gz && rm jaeger.tar.gz

  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      _pgd_filter() {  # drop pins the module graph already satisfies at >= the pin
        # grype reports the FIRST fixed version, which for a backported fix sits on
        # an older minor line than the graph already carries (etcd: grype said
        # v3.5.33 while external-dns already resolved v3.6.10). Pinning that is a
        # DOWNGRADE: go either refuses the whole batch ("requires X@v3.6.4, not
        # X@v3.5.33") or accepts it and drags siblings back until the vendored
        # source stops compiling (loki: dskit CompressionAlgorithm undefined).
        # Neither is a fix — the module is already past the CVE — so skip it.
        _keep=""
        for _mv in "$@"; do
          _m="${_mv%@*}"; _v="${_mv##*@}"
          _cur=$(go list -m "$_m" 2>/dev/null | awk '{print $2}')
          if [ -n "$_cur" ] && [ "$_cur" != "$_v" ]; then
            _hi=$( { echo "$_cur"; echo "$_v"; } | sort -V | tail -1 )
            if [ "$_hi" = "$_cur" ]; then
              echo "pgd-graph: skipping ${_mv} — graph already at ${_cur}" >&2
              continue
            fi
          fi
          _keep="${_keep} ${_mv}"
        done
        printf '%s' "$_keep"
      }
      for root in /home/build/jaeger-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _PGDA=$(_pgd_filter github.com/klauspost/compress@v1.18.7 google.golang.org/grpc@v1.83.1 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0)
          if [ -n "$_PGDA" ]; then _retry go get $_PGDA; fi
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/jaeger-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X github.com/jaegertracing/jaeger/internal/version.commitSHA=release \
          -X github.com/jaegertracing/jaeger/internal/version.latestVersion=v${{package.version}}" \
        -o jaeger \
        ./cmd/jaeger/main.go

  - runs: |
      cd /home/build/jaeger-${{package.version}}

      mkdir -p "${{targets.destdir}}/usr/bin"
      cp jaeger "${{targets.destdir}}/usr/bin/"

      # Install default in-memory config
      mkdir -p "${{targets.destdir}}/etc/jaeger"
      cat > "${{targets.destdir}}/etc/jaeger/config.yaml" << 'EOF'
      service:
        extensions: [jaeger_storage, jaeger_query, healthcheckv2]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [jaeger_storage_exporter]
        telemetry:
          resource:
            service.name: jaeger
          metrics:
            level: basic
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
          logs:
            level: info

      extensions:
        healthcheckv2:
          use_v2: true
          http:
            endpoint: 0.0.0.0:13133

        jaeger_query:
          storage:
            traces: memory_store
          http:
            endpoint: 0.0.0.0:16686
          grpc:
            endpoint: 0.0.0.0:16685

        jaeger_storage:
          backends:
            memory_store:
              memory:
                max_traces: 100000

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch:

      exporters:
        jaeger_storage_exporter:
          trace_storage: memory_store
      EOF

  - runs: |
      echo "Verifying Jaeger build..."
      "${{targets.destdir}}/usr/bin/jaeger" --version
      ls -lh "${{targets.destdir}}/usr/bin/jaeger"

update:
  enabled: true
  github:
    identifier: jaegertracing/jaeger
    use-tag: true
    tag-filter: "v2."
