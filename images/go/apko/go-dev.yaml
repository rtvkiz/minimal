# Development variant of minimal-go.
#
# Note: minimal-go's prod image already includes the GCC toolchain, git,
# and most build deps because Go itself needs them. The dev variant adds
# only what's missing for interactive debugging:
#   - shell (busybox + bash)
#   - apk-tools (install ad-hoc packages)
#   - openssh-client (SSH-based git URLs for private modules)
#   - extended auth stack (krb5, ldap) for private go modules
#
# Mirrors Chainguard's go-public/devConfigs delta.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Go runtime (same as prod)
    - go-1.27

    # Build tools (same as prod — already in go prod)
    - binutils
    - build-base
    - gcc
    - make
    - pkgconf
    - posix-cc-wrappers
    - linux-headers
    - openssf-compiler-options

    # Core system (same as prod)
    - ca-certificates-bundle
    - glibc
    - glibc-dev
    - glibc-locale-posix
    - ld-linux
    - libgcc
    - libstdc++
    - libstdc++-dev
    - libcrypt1
    - libxcrypt
    - libxcrypt-dev
    - zlib
    - libssl3
    - libcrypto3
    - libcurl-openssl4
    - libnghttp2-14
    - nghttp3
    - libidn2
    - libpsl
    - libunistring
    - libbrotlicommon1
    - libbrotlidec1
    - git
    - nss-db
    - nss-hesiod

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Private module fetching via SSH ---
    - openssh-client

    # --- Extended auth stack for private modules ---
    - krb5-libs
    - libldap
    - libexpat1

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  # MUST match prod for drop-in compatibility.
  command: /usr/bin/go

work-dir: /app

environment:
  CGO_ENABLED: "1"
  GOOS: linux
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8
  GOROOT: /usr/lib/go
  GOPATH: /go

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /go
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-go-dev"
  org.opencontainers.image.description: "Dev variant of minimal-go: same Go toolchain + shell + openssh-client for private module fetching. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/go"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
