# Development variant of minimal-adminer.
# Same Adminer + PHP 8.5 as prod, plus the dev minimum (shell, apk-tools) and
# database clients for checking connectivity from inside the pod.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Our Adminer (built from the official release via melange)
    - adminer

    # Base filesystem
    - wolfi-baselayout

    # PHP 8.5 CLI (includes the built-in web server)
    - php-8.5

    # Database drivers
    - php-8.5-mysqli
    - php-8.5-mysqlnd
    - php-8.5-pgsql
    - php-8.5-pdo
    - php-8.5-pdo_sqlite

    # TLS to databases, and the string/charset handling Adminer uses
    - php-8.5-openssl
    - php-8.5-mbstring
    - php-8.5-iconv
    - php-8.5-ctype

    # Certificates (TLS connections to managed databases)
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget
    - curl

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# PHP_CLI_SERVER_WORKERS lets the built-in server handle requests in parallel
# instead of one at a time.
entrypoint:
  command: /usr/bin/php -S 0.0.0.0:8080 -t /usr/share/adminer

work-dir: /usr/share/adminer

environment:
  PATH: /usr/bin:/bin
  PHP_CLI_SERVER_WORKERS: "4"
  LANG: C.UTF-8

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-adminer-dev"
  org.opencontainers.image.description: "Dev variant of minimal-adminer: same Adminer and PHP 8.5 plus a shell, apk-tools and curl. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/adminer"
  org.opencontainers.image.licenses: "Apache-2.0 OR GPL-2.0-only"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
