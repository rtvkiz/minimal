# Minimal R image - using Wolfi's pre-built package
# CVE patching via the daily rebuild (Wolfi's `R` package is unversioned).
#
# Declared prod-shell exception (busybox only, never bash): /usr/bin/R is a
# #!/bin/sh launcher script, so R cannot start without a shell. Wolfi's R also
# depends on gcc/gfortran and headers so install.packages() can compile
# packages from source, the same shape as Docker Hub's r-base.
# R_LIBS_USER points at a writable dir so nonroot can install packages.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # R from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `R`)
    - R
    # R's C headers (R.h, Rinternals.h): install.packages() compiles source
    # packages against them, as Docker Hub's r-base does
    - R-dev

    # /usr/bin/R is a #!/bin/sh launcher (also an R dependency)
    - busybox

    # Base filesystem
    - wolfi-baselayout

    # Certificates (CRAN over HTTPS)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/R

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  R_LIBS_USER: /tmp/Rlibs
  LANG: C.UTF-8
paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-r-base"
  org.opencontainers.image.description: "Hardened R language image with no package manager, built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/r-base"
  org.opencontainers.image.licenses: "GPL-2.0-only OR GPL-3.0-only"

archs:
  - x86_64
  - aarch64
