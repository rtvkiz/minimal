# Development variant of minimal-r-base.
# Same R and entrypoint as prod (busybox already in prod), plus the dev minimum.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # R from Wolfi (listed first: build.yml takes the primary package's
    # version from the first package line matching `R`)
    - R
    # R's C headers (R.h, Rinternals.h): install.packages() compiles source
    # packages against them, as Docker Hub's r-base does
    - R-dev

    # /usr/bin/R is a #!/bin/sh launcher (also an R dependency)
    - busybox

    # Base filesystem
    - wolfi-baselayout

    # Certificates (CRAN over HTTPS)
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - bash
    - apk-tools
    - wget

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/R

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /tmp
  R_LIBS_USER: /tmp/Rlibs
  LANG: C.UTF-8
paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-r-base-dev"
  org.opencontainers.image.description: "Dev variant of minimal-r-base: same R plus bash, apk-tools and wget. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/images/r-base"
  org.opencontainers.image.licenses: "GPL-2.0-only OR GPL-3.0-only"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
