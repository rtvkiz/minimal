# Melange build configuration for minimal Skopeo
# Pure Go from source. Single `skopeo` binary — inspect/copy/sign container
# images between registries without a daemon.
# Built CGO-free with the containers_image_openpgp tag to drop the libgpgme
# and containers/storage C dependencies (btrfs/devmapper).
# License: Apache-2.0.

package:
  name: skopeo-minimal
  version: 1.23.0
  epoch: 0
  description: "Minimal Skopeo container image inspection/copy tool built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of skopeo source tarball - updated by update-versions.yml
  sha256: de96bfc2bb523c852af675ffdadd934484812ce190aa8620e1d5fd6c51442e25

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify Skopeo source
  - runs: |
      mkdir -p /home/build/skopeo-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/podman-container-tools/skopeo/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/skopeo.tar.gz

      echo "${{vars.sha256}}  /home/build/skopeo.tar.gz" | sha256sum -c -

      tar xzf /home/build/skopeo.tar.gz -C /home/build/skopeo-${{package.version}} --strip-components=1
      rm /home/build/skopeo.tar.gz

  # NOTE: excluded from patch-go-deps (SKIP_IMAGES) — skopeo vendors the
  # containers/buildkit/docker stack, whose graph is too tangled to force-bump
  # (buildkit needs docker/cli v29.2.1, fulcio v29.4.0 → `go get` conflicts).
  # Builds pure upstream from vendor/; transitive CVEs ride the version bump +
  # base rebuild + VEX.
  # CGO_ENABLED=0 + -tags containers_image_openpgp → static binary with no
  # libgpgme/btrfs/devmapper C deps (Go-native OpenPGP, graphdrivers excluded).
  # patch-go-deps: auto-generated — do not edit manually (test-and-keep)
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      for root in /home/build/skopeo-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-base.mod
          [ -f go.sum ] && cp go.sum .pgd-base.sum || true
          # Probe each candidate CVE fix against the real build; keep the ones
          # that still compile, drop those that need upstream to update its
          # vendored code first (logged, not silent). Patches everything safely
          # patchable now instead of skipping the image wholesale.
          KEPT=""
          for fix in  github.com/sigstore/fulcio@v1.8.6 filippo.io/edwards25519@v1.2.0 github.com/Azure/go-ntlmssp@v0.1.1 github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8 github.com/aws/aws-sdk-go-v2/service/s3@v1.99.0 github.com/cloudflare/circl@v1.6.3 github.com/containerd/containerd/v2@v2.2.1 github.com/containerd/containerd@v1.7.33 github.com/docker/cli@v29.2.1+incompatible github.com/go-git/go-billy/v5@v5.9.0 github.com/go-git/go-git/v5@v5.19.1 github.com/go-jose/go-jose/v4@v4.1.4 github.com/moby/buildkit@v0.28.1 github.com/nwaples/rardecode/v2@v2.2.2 github.com/opencontainers/selinux@v1.13.1 github.com/prometheus/prometheus@v0.311.3 github.com/quic-go/quic-go@v0.59.1 github.com/rclone/rclone@v1.74.3 github.com/ulikunitz/xz@v0.5.15 github.com/yuin/goldmark@v1.7.17 go.mongodb.org/mongo-driver@v1.17.9 google.golang.org/grpc@v1.82.1 oras.land/oras-go/v2@v2.6.1 software.sslmate.com/src/go-pkcs12@v0.7.2 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.44.0 go.opentelemetry.io/otel/sdk@v1.44.0 go.opentelemetry.io/otel@v1.44.0 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0; do
            cp .pgd-base.mod go.mod
            [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
            if go get $KEPT "$fix" >/dev/null 2>&1 && GOTOOLCHAIN=local CGO_ENABLED=0 go build -mod=mod -tags containers_image_openpgp -o /dev/null ./cmd/skopeo >/dev/null 2>&1; then
              KEPT="$KEPT $fix"; echo "pgd-testkeep KEPT: $fix"
            else
              echo "pgd-testkeep dropped (needs upstream): $fix"
            fi
          done
          cp .pgd-base.mod go.mod
          [ -f .pgd-base.sum ] && cp .pgd-base.sum go.sum || true
          if [ -n "$KEPT" ]; then _retry go get $KEPT; fi
          go mod tidy -e
          rm -f .pgd-base.mod .pgd-base.sum
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/skopeo-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -tags containers_image_openpgp \
        -ldflags="-s -w -buildid=" \
        -o /home/build/skopeo-bin \
        ./cmd/skopeo

  # Install binary + default containers config (skopeo fails without a signature
  # policy at /etc/containers/policy.json).
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/skopeo-bin "${{targets.destdir}}/usr/bin/skopeo"
      chmod 0755 "${{targets.destdir}}/usr/bin/skopeo"

      mkdir -p "${{targets.destdir}}/etc/containers"
      cat > "${{targets.destdir}}/etc/containers/policy.json" << 'POLICY'
      {
        "default": [{ "type": "insecureAcceptAnything" }],
        "transports": {
          "docker-daemon": { "": [{ "type": "insecureAcceptAnything" }] }
        }
      }
      POLICY
      cat > "${{targets.destdir}}/etc/containers/registries.conf" << 'REG'
      unqualified-search-registries = ["docker.io"]
      REG

  # Verify the build
  - runs: |
      echo "Verifying skopeo binary..."
      "${{targets.destdir}}/usr/bin/skopeo" --version

update:
  enabled: true
  github:
    identifier: podman-container-tools/skopeo
    use-tag: true
    tag-filter: "v1."
