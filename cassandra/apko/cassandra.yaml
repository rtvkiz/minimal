# Minimal Apache Cassandra image - official binary release + custom jlink JRE (Java 17)
# CVE patching via daily rebuilds. License: Apache-2.0.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Shell required for bin/cassandra + entrypoint (both #!/bin/sh)
    - busybox

    # Our Cassandra (binary release + custom JRE via melange)
    - cassandra

    # Core libraries for JNI / native JRE components
    - glibc
    - glibc-locale-posix
    - ld-linux

    # Certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: cassandra
      gid: 65532
  users:
    - username: cassandra
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/cassandra-entrypoint.sh

environment:
  PATH: /usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-17-minimal
  CASSANDRA_HOME: /opt/cassandra
  CASSANDRA_CONF: /opt/cassandra/conf
  CASSANDRA_LOG_DIR: /var/lib/cassandra/logs

# Cassandra's default (unset) data dirs are /var/lib/cassandra/{data,commitlog,
# saved_caches,hints}; create them (plus logs) writable by nonroot here — never in
# the melange pipeline (the SBOM step can't mkdir into the root-owned destdir).
paths:
  - path: /var/lib/cassandra
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/commitlog
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/saved_caches
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/hints
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-cassandra"
  org.opencontainers.image.description: "Hardened Apache Cassandra wide-column database with custom jlink JRE, daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/cassandra"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
