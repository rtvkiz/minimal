# Development variant of minimal-cassandra.
# Same Cassandra 5.0 + custom jlink JRE as prod, plus bash, apk-tools,
# curl/socat/jq for debugging. nodetool ships in cassandra-minimal.
#
# In-house composition. Not for production.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Cassandra + bundled JRE (same as prod)
    - cassandra-minimal

    # Core libs (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/socket debugging ---
    - curl
    - socat

    # --- JSON parsing ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: cassandra
      gid: 65532
  users:
    - username: cassandra
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/cassandra-entrypoint.sh

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  JAVA_HOME: /usr/lib/jvm/java-17-minimal
  CASSANDRA_HOME: /opt/cassandra
  CASSANDRA_CONF: /opt/cassandra/conf
  CASSANDRA_LOG_DIR: /var/lib/cassandra/logs
  LANG: C.UTF-8

paths:
  - path: /var/lib/cassandra
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/commitlog
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/saved_caches
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/hints
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/cassandra/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-cassandra-dev"
  org.opencontainers.image.description: "Dev variant of minimal-cassandra: same Cassandra + JRE + shell + curl/socat/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/cassandra"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
