# Melange build configuration for minimal Helm CLI.
# Pure Go from source. Stripped, statically linked. No daemon — this image
# packages the `helm` binary for use in CI pipelines and one-shot installs.
# License: Apache-2.0.

package:
  name: helm-minimal
  version: 3.21.3
  epoch: 0
  description: "Minimal Helm CLI for Kubernetes built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of helm source tarball - updated by update-versions.yml workflow
  sha256: 9265b7bcad329480fe1f14547befe5da1dbbede6bbd13e3dd6bfebb00d42cb68

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify helm source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/helm/helm/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/helm.tar.gz

      echo "${{vars.sha256}}  /home/build/helm.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf helm.tar.gz
      rm helm.tar.gz

  # Build helm — single static binary, version stamps via helm.sh/helm/v3/internal/version.


  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/helm-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/containerd/containerd@v1.7.33 oras.land/oras-go/v2@v2.6.2 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/helm-${{package.version}}
      BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X helm.sh/helm/v3/internal/version.version=v${{package.version}} \
          -X helm.sh/helm/v3/internal/version.metadata=source-build \
          -X helm.sh/helm/v3/internal/version.gitCommit=source-build \
          -X helm.sh/helm/v3/internal/version.gitTreeState=clean \
          -X helm.sh/helm/v3/internal/version.buildDate=${BUILD_DATE}" \
        -o /home/build/helm-bin \
        ./cmd/helm

  # Install
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/helm-bin "${{targets.destdir}}/usr/bin/helm"
      chmod 0755 "${{targets.destdir}}/usr/bin/helm"

  # Verify
  - runs: |
      echo "Verifying helm build..."
      "${{targets.destdir}}/usr/bin/helm" version
      echo "Binary size:"
      ls -lh "${{targets.destdir}}/usr/bin/helm"

update:
  enabled: true
  github:
    identifier: helm/helm
    use-tag: true
    strip-prefix: "v"
    tag-filter: "v3."
