# Minimal Apache Pulsar image - official binary release + custom jlink JRE (Java 21)
# CVE patching via daily rebuilds. License: Apache-2.0.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # bin/pulsar is a #!/usr/bin/env bash launcher with bashisms
    - busybox
    - bash

    # Our Pulsar (binary release + custom JRE via melange)
    - pulsar

    # Core libraries for JNI / native JRE components (Netty, RocksDB)
    - glibc
    - glibc-locale-posix
    - ld-linux
    # RocksDB JNI loads libstdc++.so.6 when standalone storage starts.
    - libstdc++

    # Certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: pulsar
      gid: 65532
  users:
    - username: pulsar
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/pulsar-entrypoint.sh

environment:
  PATH: /usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/java-21-minimal
  PULSAR_HOME: /opt/pulsar
  PULSAR_LOG_DIR: /var/lib/pulsar/logs

# Standalone data (zookeeper/bookkeeper) + logs must be writable by nonroot;
# create them here, never in the melange pipeline (the SBOM step can't mkdir into
# the root-owned destdir).
paths:
  - path: /var/lib/pulsar
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/pulsar/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/pulsar/zookeeper
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/pulsar/bookkeeper
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-pulsar"
  org.opencontainers.image.description: "Hardened Apache Pulsar messaging/streaming server with custom jlink JRE, daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/pulsar"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
