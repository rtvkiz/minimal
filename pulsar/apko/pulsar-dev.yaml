# Development variant of minimal-pulsar.
# Same Pulsar 4.x + custom jlink JRE as prod, plus apk-tools + curl/socat/jq for
# hitting the Pulsar Admin REST API. pulsar-admin ships in pulsar-minimal.
#
# In-house composition. Not for production.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Pulsar + bundled JRE (same as prod)
    - pulsar-minimal

    # Core libs (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    # RocksDB JNI loads libstdc++.so.6 when standalone storage starts.
    - libstdc++
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/socket debugging ---
    - curl
    - socat

    # --- JSON parsing for Admin REST output ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: pulsar
      gid: 65532
  users:
    - username: pulsar
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/pulsar-entrypoint.sh

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  JAVA_HOME: /usr/lib/jvm/java-21-minimal
  PULSAR_HOME: /opt/pulsar
  PULSAR_LOG_DIR: /var/lib/pulsar/logs
  LANG: C.UTF-8

paths:
  - path: /var/lib/pulsar
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/pulsar/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/pulsar/zookeeper
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/pulsar/bookkeeper
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-pulsar-dev"
  org.opencontainers.image.description: "Dev variant of minimal-pulsar: same Pulsar + JRE + shell + curl/socat/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/pulsar"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
