# Melange build configuration for minimal stern
# Pure Go from source. Single static `stern` binary. License: Apache-2.0.

package:
  name: stern-minimal
  version: 1.34.0
  epoch: 0
  description: "Minimal Stern multi-pod log tail built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of stern source tarball - updated by update-versions.yml workflow
  sha256: 1cfec22cef9705e68fc46060ba85164af12bd07ede9264bafb67d11400996e71

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  - runs: |
      mkdir -p /home/build/stern-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/stern/stern/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/stern.tar.gz
      echo "${{vars.sha256}}  /home/build/stern.tar.gz" | sha256sum -c -
      tar xzf /home/build/stern.tar.gz -C /home/build/stern-${{package.version}} --strip-components=1
      rm /home/build/stern.tar.gz

  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      for root in /home/build/stern-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( cd "$root" \
          && _retry go get golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0 \
          && go mod tidy -e \
          && { [ ! -d vendor ] || go mod vendor; } )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/stern-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/stern/stern/cmd.version=${{package.version}}" \
        -o /home/build/stern-bin \
        .

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/stern-bin "${{targets.destdir}}/usr/bin/stern"
      chmod 0755 "${{targets.destdir}}/usr/bin/stern"

  - runs: |
      echo "Verifying stern binary..."
      "${{targets.destdir}}/usr/bin/stern" --version
