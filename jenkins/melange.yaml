# Melange build configuration for minimal Jenkins
# Uses jlink to create a custom JRE with only required modules
# Downloads and verifies Jenkins WAR
# No shell needed in final image

package:
  name: jenkins-minimal
  version: 2.568.1
  epoch: 0
  description: "Minimal Jenkins with custom JRE (jlink)"
  copyright:
    - license: MIT

vars:
  # SHA256 checksum of jenkins.war - updated by update-jenkins.yml workflow
  sha256: 58f24f3965fbef7708629fbe158d51bf138ffd577cadbc86b46367e8ad0beb83

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # zip: repack the war after swapping CVE-fixed detached plugins
      - zip
      # Full JDK needed for jlink (build-time only)
      - openjdk-21-default-jdk
      # jmods package required for jlink to create custom JRE
      - openjdk-21-jmods
      # binutils provides objcopy required by jlink --strip-debug
      - binutils
      # Fonts for Jenkins UI rendering
      - ttf-dejavu
      - fontconfig

pipeline:
  # Download and verify Jenkins WAR
  - runs: |
      mkdir -p /home/build/jenkins
      war=/home/build/jenkins/jenkins.war

      # get.jenkins.io redirects to a community mirror; mirrorbits occasionally
      # hands out a dead mirror (mirror.xmission.com was unreachable on
      # 2026-06-21, and with no connect-timeout each of curl's retries hung
      # ~132s before failing → exit 28, ~13 min wasted, whole build dead).
      # Cap the connect time so a bad mirror is abandoned in seconds, then fall
      # back to the directly-hosted archives.jenkins.io (no mirror redirect).
      ok=0
      for url in \
        "https://get.jenkins.io/war-stable/${{package.version}}/jenkins.war" \
        "https://archives.jenkins.io/war-stable/${{package.version}}/jenkins.war"; do
        if curl -fsSL --connect-timeout 30 --max-time 600 --retry 5 --retry-all-errors "$url" -o "$war"; then
          ok=1; break
        fi
        echo "WARN: jenkins.war download failed from $url, trying next source"
      done
      [ "$ok" = 1 ] || { echo "ERROR: all jenkins.war sources failed"; exit 1; }

      # Verify against pinned checksum (stored in repo, not fetched dynamically)
      echo "${{vars.sha256}}  $war" | sha256sum -c -

      # CVE fix (Critical): the bundled mina-sshd-api-core/common 2.16.0 plugins
      # carry mina-core 2.2.4 (4 advisories incl. a Critical), fixed in mina-core
      # 2.2.7. Replace both detached plugins in the war with 2.17.1, which bundles
      # mina-core 2.2.7. core 2.17.1 requires common 2.17.1 (Plugin-Dependencies),
      # so both move together. sha256-pinned. Jenkins LTS 2.555.3 still ships the
      # vulnerable 2.16.0; drop this block once a newer LTS bundles >= 2.17.1.
      PDIR=/home/build/jkplugins/WEB-INF/detached-plugins
      mkdir -p "$PDIR"
      PV=2.17.1-187.v0341274c2905
      _fetch_plugin() {  # $1=plugin $2=sha256
        curl -fsSL --retry 5 --retry-all-errors \
          "https://updates.jenkins.io/download/plugins/$1/${PV}/$1.hpi" -o "$PDIR/$1.hpi"
        echo "$2  $PDIR/$1.hpi" | sha256sum -c -
      }
      _fetch_plugin mina-sshd-api-core   9479d70a69201a0d75f816cfce4d55553402d56e0d480dbeb15f4f7333ec01b4
      _fetch_plugin mina-sshd-api-common 4bf8d267ad9435bf249ebebb6b1b5efc90dd5a1ffd9398931a1ea3c026ec13e8
      ( cd /home/build/jkplugins && zip "$war" \
          WEB-INF/detached-plugins/mina-sshd-api-core.hpi \
          WEB-INF/detached-plugins/mina-sshd-api-common.hpi )
      echo "Swapped mina-sshd-api-core/common -> ${PV} (mina-core 2.2.7)"

  # Create minimal JRE with jlink (only modules Jenkins needs)
  - runs: |
      JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      $JAVA_HOME/bin/jlink \
        --module-path $JAVA_HOME/jmods \
        --add-modules java.base,java.compiler,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.management.rmi,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.httpserver,jdk.management,jdk.net,jdk.security.auth,jdk.unsupported,jdk.zipfs \
        --strip-debug \
        --no-man-pages \
        --no-header-files \
        --compress=zip-6 \
        --output /home/build/custom-jre

  # Install to destdir
  - runs: |
      # Install custom JRE
      mkdir -p "${{targets.destdir}}/usr/lib/jvm/java-21-minimal"
      cp -a /home/build/custom-jre/* "${{targets.destdir}}/usr/lib/jvm/java-21-minimal/"

      # Create java symlink in /usr/bin
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -sf /usr/lib/jvm/java-21-minimal/bin/java "${{targets.destdir}}/usr/bin/java"

      # Install Jenkins WAR
      mkdir -p "${{targets.destdir}}/usr/share/jenkins"
      cp /home/build/jenkins/jenkins.war "${{targets.destdir}}/usr/share/jenkins/jenkins.war"

      # Install fonts (needed for Jenkins UI)
      mkdir -p "${{targets.destdir}}/usr/share/fonts"
      cp -a /usr/share/fonts/truetype "${{targets.destdir}}/usr/share/fonts/" 2>/dev/null || true
      mkdir -p "${{targets.destdir}}/etc/fonts"
      cp -a /etc/fonts/* "${{targets.destdir}}/etc/fonts/" 2>/dev/null || true

      # Strip native libraries in JRE
      find "${{targets.destdir}}/usr/lib/jvm/java-21-minimal" -name '*.so' \
        -exec strip --strip-unneeded {} + 2>/dev/null || true

  # Verify the build
  - runs: |
      echo "Verifying custom JRE..."
      "${{targets.destdir}}/usr/lib/jvm/java-21-minimal/bin/java" -version
      echo "Checking JRE size..."
      du -sh "${{targets.destdir}}/usr/lib/jvm/java-21-minimal"
      echo "Checking Jenkins WAR..."
      ls -lh "${{targets.destdir}}/usr/share/jenkins/jenkins.war"
      echo "Checking mina-core CVE fix..."
      unzip -p "${{targets.destdir}}/usr/share/jenkins/jenkins.war" \
        'WEB-INF/detached-plugins/mina-sshd-api-core.hpi' > /tmp/_mina.hpi
      if ! unzip -l /tmp/_mina.hpi | grep -q 'mina-core-2.2.7.jar'; then
        echo "ERROR: mina-core 2.2.7 not found in war (Critical fix missing)"; exit 1
      fi
      ! unzip -l /tmp/_mina.hpi | grep -q 'mina-core-2.2.4.jar' || { echo "ERROR: vulnerable mina-core 2.2.4 still present"; exit 1; }
      rm -f /tmp/_mina.hpi
      echo "✓ mina-core 2.2.7 (Critical fixed)"

# Automated version updates via wolfictl
# Jenkins LTS uses release-monitor.org (releases don't follow standard GitHub tag pattern)
update:
  enabled: true
  release-monitor:
    identifier: 7518
