# Melange build configuration for minimal Docker Registry (distribution)
# Builds the OCI distribution registry from source (Go) as a static binary
# CGO_ENABLED=0 produces fully static binary - zero runtime deps

package:
  name: registry-minimal
  version: 3.1.1
  epoch: 0
  description: "Minimal OCI distribution registry (Docker Registry v2) built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of the distribution source tarball - updated by update-versions.yml workflow
  sha256: 419183e8c1426b5d625732cf6846a2d48ad8e898a1659d7bec7171b7d156673e

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify distribution source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/distribution/distribution/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/distribution.tar.gz

      echo "${{vars.sha256}}  /home/build/distribution.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf distribution.tar.gz
      rm distribution.tar.gz

  # Build the registry binary (static)
  # NB: upstream source tree contains a ./registry/ subdir, so -o /home/build/registry-bin
  # avoids collision with `go build -o registry` writing into that directory.


  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/distribution-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/klauspost/compress@v1.18.7 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel@v1.45.0 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/distribution-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X github.com/distribution/distribution/v3/version.version=${{package.version}} \
          -X github.com/distribution/distribution/v3/version.revision=source-build \
          -X github.com/distribution/distribution/v3/version.mainpkg=github.com/distribution/distribution/v3" \
        -o /home/build/registry-bin \
        ./cmd/registry

  # Install binary + default filesystem config
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/registry-bin "${{targets.destdir}}/usr/bin/registry"
      chmod 0755 "${{targets.destdir}}/usr/bin/registry"

      mkdir -p "${{targets.destdir}}/etc/distribution"
      cat > "${{targets.destdir}}/etc/distribution/config.yml" << 'CFG'
      version: 0.1
      log:
        level: info
        fields:
          service: registry
      storage:
        filesystem:
          rootdirectory: /var/lib/registry
        cache:
          blobdescriptor: inmemory
      http:
        addr: :5000
        headers:
          X-Content-Type-Options: [nosniff]
        debug:
          addr: :5001
          prometheus:
            enabled: false
      health:
        storagedriver:
          enabled: true
          interval: 10s
          threshold: 3
      CFG

  # Verify
  - runs: |
      echo "Verifying registry build..."
      "${{targets.destdir}}/usr/bin/registry" --version
      echo "Binary size:"
      ls -lh "${{targets.destdir}}/usr/bin/registry"

update:
  enabled: true
  github:
    identifier: distribution/distribution
    use-tag: true
    tag-filter: "v3."
    strip-prefix: "v"
