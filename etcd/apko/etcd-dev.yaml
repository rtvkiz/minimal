# Development variant of minimal-etcd.
# Same etcd + etcdctl + etcdutl (source-built via melange) as prod,
# plus bash, apk-tools, curl/socat/jq for HTTP/gRPC API debugging.
#
# etcd-minimal already ships etcdctl and etcdutl (the canonical client
# tools), so the dev variant just adds the shell + debug utilities.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem + etcd (same as prod)
    - wolfi-baselayout
    - etcd-minimal
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/gRPC debugging ---
    - curl
    - socat

    # --- JSON parsing for etcdctl --write-out=json output ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: etcd
      gid: 65532
  users:
    - username: etcd
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/etcd

cmd: >-
  --listen-client-urls=http://0.0.0.0:2379
  --advertise-client-urls=http://0.0.0.0:2379
  --listen-peer-urls=http://0.0.0.0:2380
  --initial-advertise-peer-urls=http://0.0.0.0:2380
  --initial-cluster=default=http://0.0.0.0:2380

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  ETCD_DATA_DIR: /var/lib/etcd
  LANG: C.UTF-8

paths:
  - path: /var/lib/etcd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-etcd-dev"
  org.opencontainers.image.description: "Dev variant of minimal-etcd: same etcd + etcdctl + etcdutl + shell + curl/socat/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/etcd"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
