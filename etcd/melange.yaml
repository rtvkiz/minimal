# Melange build configuration for minimal etcd
# Builds etcd and etcdctl from source (Go) with static binaries

package:
  name: etcd-minimal
  version: 3.7.1
  epoch: 0
  description: "Minimal etcd distributed key-value store built from source"
  copyright:
    - license: Apache-2.0

vars:
  sha256: 95352a96ffb1d92df77b5bce2bb239046fa94cd99dc839ff7eecfdc983416637

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://github.com/etcd-io/etcd/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/etcd.tar.gz
      echo "${{vars.sha256}}  /home/build/etcd.tar.gz" | sha256sum -c -
      cd /home/build && tar xzf etcd.tar.gz && rm etcd.tar.gz


  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/etcd-${{package.version}}/server /home/build/etcd-${{package.version}}/etcdctl /home/build/etcd-${{package.version}}/etcdutl; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel/sdk@v1.45.0 go.opentelemetry.io/otel@v1.45.0 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      # etcd 3.6 is a multi-module monorepo: server/, etcdctl/, etcdutl/ each
      # have their own go.mod and must be built from within their directory.

      # Build etcd server
      cd /home/build/etcd-${{package.version}}/server
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w \
          -X go.etcd.io/etcd/api/v3/version.GitSHA=release" \
        -o /home/build/etcd \
        .

      # Build etcdctl
      cd /home/build/etcd-${{package.version}}/etcdctl
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w" \
        -o /home/build/etcdctl \
        .

      # Build etcdutl
      cd /home/build/etcd-${{package.version}}/etcdutl
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w" \
        -o /home/build/etcdutl \
        .

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/etcd "${{targets.destdir}}/usr/bin/"
      cp /home/build/etcdctl "${{targets.destdir}}/usr/bin/"
      cp /home/build/etcdutl "${{targets.destdir}}/usr/bin/"

  - runs: |
      echo "Verifying etcd build..."
      "${{targets.destdir}}/usr/bin/etcd" --version
      "${{targets.destdir}}/usr/bin/etcdctl" version
      ls -lh "${{targets.destdir}}/usr/bin/"

update:
  enabled: true
  github:
    identifier: etcd-io/etcd
    use-tag: true
    tag-filter: "v3."
