# Melange build configuration for minimal Apache Solr
# Official binary release + custom JRE via jlink (kafka/zookeeper JVM pattern).
# Solr 10 runs on Java 21. bin/solr is a bash launcher (prod image ships bash).
# License: Apache-2.0.

package:
  # Named `solr` (not `solr-minimal`) so vulnerability scanners can identify
  # it. Syft derives a package's CPE from its apk name, and every CPE it
  # generated kept -minimal in the product field
  # (cpe:2.3:a:solr:solr-minimal:*, cpe:2.3:a:solr-minimal:solr-minimal:*,
  # ...). NVD indexes this product bare, as cpe:2.3:a:solr:solr:*, so none of
  # them matched, and the Wolfi secdb missed it too.
  name: solr
  version: 10.0.0
  epoch: 0
  description: "Minimal Apache Solr search server with custom JRE (jlink)"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi ships a
    # bare `solr`, so without this apk could install Wolfi's build instead of
    # this source-built one. provider-priority is evaluated BEFORE version in
    # that comparator, so this pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA512 of solr-{version}.tgz - updated by update-versions.yml
  sha512: 825ab4e92a839802d9f5d570600b622881ddfe4f700cab569afb7d8220590a59d11088f4e10d4dcf9395073c35d73a420cc275a9ed7b18e2f84178bfcb49ae82

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # Full JDK 21 needed for jlink (build-time only); Solr 10 targets Java 21.
      - openjdk-21-default-jdk
      - openjdk-21-jmods
      # binutils provides objcopy required by jlink --strip-debug
      - binutils

pipeline:
  # Download and verify the official Solr binary release
  - runs: |
      mkdir -p /home/build
      curl -fsSL --connect-timeout 30 --retry 5 --retry-all-errors \
        "https://dlcdn.apache.org/solr/solr/${{package.version}}/solr-${{package.version}}.tgz" \
        -o /home/build/solr.tgz || \
      curl -fsSL --connect-timeout 30 --retry 5 --retry-all-errors \
        "https://downloads.apache.org/solr/solr/${{package.version}}/solr-${{package.version}}.tgz" \
        -o /home/build/solr.tgz || \
      curl -fsSL --connect-timeout 30 --retry 5 --retry-all-errors \
        "https://archive.apache.org/dist/solr/solr/${{package.version}}/solr-${{package.version}}.tgz" \
        -o /home/build/solr.tgz

      echo "${{vars.sha512}}  /home/build/solr.tgz" | sha512sum -c -

      cd /home/build
      tar xzf solr.tgz
      rm solr.tgz

  # Custom minimal JRE (Java 21). Solr embeds Jetty and reflects broadly, so the
  # module set is generous: httpserver/net/naming for the servlet stack, crypto +
  # jgss/sasl for TLS/auth, management(.agent)/jfr for JMX/observability,
  # jdk.unsupported for Lucene's sun.misc.Unsafe usage.
  - runs: |
      JAVA_HOME=/usr/lib/jvm/java-21-openjdk
      $JAVA_HOME/bin/jlink \
        --module-path $JAVA_HOME/jmods \
        --add-modules java.base,java.compiler,java.desktop,java.instrument,java.logging,java.management,java.management.rmi,java.naming,java.net.http,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.xml,java.xml.crypto,jdk.crypto.cryptoki,jdk.crypto.ec,jdk.httpserver,jdk.incubator.vector,jdk.jfr,jdk.management,jdk.management.agent,jdk.naming.dns,jdk.net,jdk.security.auth,jdk.unsupported,jdk.zipfs \
        --strip-debug \
        --no-man-pages \
        --no-header-files \
        --compress=zip-6 \
        --output /home/build/custom-jre

  - runs: |
      SOLR_SRC="/home/build/solr-${{package.version}}"

      # Custom JRE
      mkdir -p "${{targets.destdir}}/usr/lib/jvm/java-21-minimal"
      cp -a /home/build/custom-jre/* "${{targets.destdir}}/usr/lib/jvm/java-21-minimal/"
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -sf ../lib/jvm/java-21-minimal/bin/java "${{targets.destdir}}/usr/bin/java"

      # Solr install — ship the runtime bits only (bin/server/modules/lib/licenses);
      # drop docs/, docker/, example/, cross-dc-manager/ to slim the image.
      mkdir -p "${{targets.destdir}}/opt/solr"
      cp -a "$SOLR_SRC"/bin "$SOLR_SRC"/server "$SOLR_SRC"/modules "$SOLR_SRC"/lib "$SOLR_SRC"/licenses \
        "${{targets.destdir}}/opt/solr/"

      # Replace vulnerable bundled JARs before the install is sealed.
      JARROOT="${{targets.destdir}}/opt/solr"
      # patch-java-deps: auto-generated — do not edit manually
      #
      # Upstream ships prebuilt JARs; these are the vendored copies grype flags.
      # Each swap replaces one vulnerable JAR with the fixed release from Maven
      # Central. A swap that finds no matching file is a hard error: it means the
      # bundled version moved and this block is stale, which must not be mistaken
      # for "nothing to do".
      jar_swap() {
        _g="$1"; _a="$2"; _old="$3"; _new="$4"; _cls="${5:-}"
        _sfx=""; [ -n "$_cls" ] && _sfx="-$_cls"
        _url="https://repo1.maven.org/maven2/$(echo "$_g" | tr . /)/$_a/$_new/$_a-$_new$_sfx.jar"
        _n=0
        for _f in $(find "$JARROOT" -name "$_a-$_old$_sfx.jar"); do
          _d=$(dirname "$_f")
          curl -sSfL --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 5 \
            "$_url" -o "$_d/$_a-$_new$_sfx.jar"
          # A truncated or HTML error body would install silently and only fail at
          # runtime; every JAR is a zip, so check the magic bytes before deleting
          # the copy we are replacing.
          case "$(head -c2 "$_d/$_a-$_new$_sfx.jar")" in
            PK) ;;
            *) echo "patch-java-deps: $_a-$_new$_sfx.jar is not a zip" >&2; exit 1 ;;
          esac
          rm -f "$_f"
          _n=$((_n + 1))
        done
        if [ "$_n" -eq 0 ]; then
          echo "patch-java-deps: no $_a-$_old$_sfx.jar found under $JARROOT" >&2
          exit 1
        fi
        echo "patch-java-deps: $_a $_old -> $_new ($_n file(s))"
      }
      
      jar_swap com.fasterxml.jackson.core jackson-core 2.20.0 2.21.5 
      jar_swap com.fasterxml.jackson.core jackson-databind 2.20.0 2.21.5 
      jar_swap io.netty netty-codec-compression 4.2.6.Final 4.2.16.Final 
      jar_swap io.netty netty-codec-http2 4.2.6.Final 4.2.16.Final 
      jar_swap io.netty netty-codec-http 4.2.6.Final 4.2.16.Final 
      jar_swap io.netty netty-handler-proxy 4.2.6.Final 4.2.16.Final 
      jar_swap io.netty netty-handler 4.2.6.Final 4.2.16.Final 
      jar_swap io.netty netty-transport-classes-epoll 4.2.6.Final 4.2.16.Final 
      jar_swap io.netty netty-transport-native-epoll 4.2.6.Final 4.2.16.Final linux-x86_64
      jar_swap org.apache.calcite calcite-core 1.37.0 1.42.0 
      jar_swap org.apache.httpcomponents.core5 httpcore5 5.2.3 5.4.3 
      jar_swap org.apache.kafka kafka-clients 3.9.1 3.9.2 
      jar_swap org.apache.logging.log4j log4j-1.2-api 2.25.3 2.25.4 
      jar_swap org.apache.logging.log4j log4j-core 2.25.3 2.25.4 
      jar_swap org.apache.logging.log4j log4j-layout-template-json 2.25.3 2.25.4 
      jar_swap org.apache.opennlp opennlp-tools 2.5.6 2.5.9 
      jar_swap org.apache.zookeeper zookeeper 3.9.4 3.9.5 
      jar_swap org.eclipse.jetty jetty-http 12.0.27 12.0.36 
      jar_swap org.eclipse.jetty jetty-security 12.0.27 12.0.36 
      jar_swap org.eclipse.jetty jetty-server 12.0.27 12.0.36 
      jar_swap org.eclipse.jetty jetty-util 12.0.27 12.0.36 
      jar_swap org.lz4 lz4-java 1.8.0 1.8.1 
      
      # Mixed-version guard. Siblings with no CVE of their own are not listed
      # above (netty-common, netty-buffer, ...), so they would silently stay at the
      # old version and break the classpath. Any leftover at a version we just
      # upgraded away from fails the build and names the file to add.
      leftover=$(find "$JARROOT" -name "*-2.25.3.jar" -o -name "*-2.25.3-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 2.25.3 after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      leftover=$(find "$JARROOT" -name "*-1.37.0.jar" -o -name "*-1.37.0-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 1.37.0 after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      leftover=$(find "$JARROOT" -name "*-2.20.0.jar" -o -name "*-2.20.0-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 2.20.0 after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      leftover=$(find "$JARROOT" -name "*-5.2.3.jar" -o -name "*-5.2.3-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 5.2.3 after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      leftover=$(find "$JARROOT" -name "*-3.9.1.jar" -o -name "*-3.9.1-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 3.9.1 after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      leftover=$(find "$JARROOT" -name "*-3.9.4.jar" -o -name "*-3.9.4-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 3.9.4 after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      leftover=$(find "$JARROOT" -name "*-12.0.27.jar" -o -name "*-12.0.27-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 12.0.27 after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      leftover=$(find "$JARROOT" -name "*-4.2.6.Final.jar" -o -name "*-4.2.6.Final-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 4.2.6.Final after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      leftover=$(find "$JARROOT" -name "*-2.5.6.jar" -o -name "*-2.5.6-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 2.5.6 after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      leftover=$(find "$JARROOT" -name "*-1.8.0.jar" -o -name "*-1.8.0-*.jar")
      if [ -n "$leftover" ]; then
        echo "patch-java-deps: JARs left at 1.8.0 after upgrade:" >&2
        echo "$leftover" >&2
        exit 1
      fi
      # end-patch-java-deps

      # Entrypoint: seed SOLR_HOME with the bundled solr.xml (Solr writes cores under
      # SOLR_HOME, which must be writable — /opt/solr is read-only), then run in the
      # foreground bound on all interfaces.
      cat > "${{targets.destdir}}/usr/bin/solr-entrypoint.sh" << 'ENTRY'
      #!/bin/sh
      set -e
      export SOLR_HOME="${SOLR_HOME:-/var/solr/data}"
      export SOLR_LOGS_DIR="${SOLR_LOGS_DIR:-/var/solr/logs}"
      export JAVA_HOME=/usr/lib/jvm/java-21-minimal
      mkdir -p "$SOLR_HOME" "$SOLR_LOGS_DIR"
      if [ ! -f "$SOLR_HOME/solr.xml" ]; then
        cp /opt/solr/server/solr/solr.xml "$SOLR_HOME/solr.xml"
      fi
      exec /opt/solr/bin/solr start -f "$@"
      ENTRY
      chmod +x "${{targets.destdir}}/usr/bin/solr-entrypoint.sh"

      # Whole static install world-readable/traversable (we run as nonroot 65532).
      chmod -R a+rX "${{targets.destdir}}/opt/solr"

      find "${{targets.destdir}}/usr/lib/jvm/java-21-minimal" -name '*.so' \
        -exec strip --strip-unneeded {} + 2>/dev/null || true

  - runs: |
      echo "Verifying JRE..."
      "${{targets.destdir}}/usr/lib/jvm/java-21-minimal/bin/java" -version
      echo "Checking Solr install..."
      test -x "${{targets.destdir}}/opt/solr/bin/solr"
      ls "${{targets.destdir}}"/opt/solr/server/solr/solr.xml
      ls "${{targets.destdir}}"/opt/solr/server/solr-webapp/webapp/WEB-INF/lib/solr-core-*.jar

update:
  enabled: true
  github:
    identifier: apache/solr
    use-tag: true
    tag-filter: "releases/solr/10."
    strip-prefix: "releases/solr/"
