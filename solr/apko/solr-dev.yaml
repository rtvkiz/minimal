# Development variant of minimal-solr.
# Same Solr 10 + custom jlink JRE as prod, plus apk-tools + curl/socat/jq for
# hitting the Solr Admin API.
#
# In-house composition. Not for production.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Solr + bundled JRE (same as prod)
    - solr-minimal

    # Core libs (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    - ca-certificates-bundle
    # The upstream launcher uses procps-only flags such as `ps -p`.
    - procps

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/socket debugging ---
    - curl
    - socat

    # --- JSON parsing for Admin API output ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: solr
      gid: 65532
  users:
    - username: solr
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/solr-entrypoint.sh

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  JAVA_HOME: /usr/lib/jvm/java-21-minimal
  SOLR_HOME: /var/solr/data
  SOLR_LOGS_DIR: /var/solr/logs
  SOLR_HOST_BIND: 0.0.0.0
  LANG: C.UTF-8

paths:
  - path: /var/solr
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/solr/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/solr/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-solr-dev"
  org.opencontainers.image.description: "Dev variant of minimal-solr: same Solr + JRE + shell + curl/socat/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/solr"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
