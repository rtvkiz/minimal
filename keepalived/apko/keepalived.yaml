# Minimal Keepalived image - built from source via melange
# CVE patching via the 6-hourly rebuild from upstream source

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Our Keepalived (built from source via melange)
    - keepalived

    # Core libraries
    - glibc
    - ld-linux
    - libgcc

    # SSL/TLS (checker SSL_GET health checks)
    - libssl3
    - libcrypto3

    # Netlink (VRRP address manipulation, LVS/IPVS)
    - libnl3

    # Certificates
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# Foreground (--dont-fork) VRRP daemon logging to the console rather than to a
# syslog socket that does not exist in a distroless image.
#
# IMPORTANT — capabilities: keepalived manipulates network interfaces and sends
# VRRP multicast, so a real deployment needs CAP_NET_ADMIN, CAP_NET_RAW and
# CAP_NET_BROADCAST (and usually host networking). It runs as nonroot 65532 here
# to keep the catalog's non-root invariant; grant the caps rather than running
# the container as root:
#   docker run --cap-add NET_ADMIN --cap-add NET_RAW --cap-add NET_BROADCAST \
#     --network host -v ./keepalived.conf:/etc/keepalived/keepalived.conf ...
# Without them the daemon parses its config and starts, but cannot claim a VIP.
entrypoint:
  command: /usr/bin/keepalived --dont-fork --log-console --use-file=/etc/keepalived/keepalived.conf

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/keepalived
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-keepalived"
  org.opencontainers.image.description: "Hardened shell-less Keepalived VRRP failover and LVS load balancer built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/keepalived"
  org.opencontainers.image.licenses: "GPL-2.0-or-later"

archs:
  - x86_64
  - aarch64
