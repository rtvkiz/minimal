# Development variant of minimal-envoy.
# Same source-built envoy as prod, plus shell, apk-tools,
# curl/openssl/dig + jq (envoy /stats and /config_dump emit JSON).

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base + envoy (same as prod)
    - wolfi-baselayout
    - envoy-minimal
    - ca-certificates-bundle
    - glibc
    - libstdc++
    - libgcc
    - ld-linux

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/TLS/DNS debugging ---
    - curl
    - openssl
    - bind-tools

    # --- JSON parsing for envoy admin endpoint output ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/envoy

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  LANG: C.UTF-8

paths:
  - path: /etc/envoy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-envoy-dev"
  org.opencontainers.image.description: "Dev variant of minimal-envoy: same envoy + shell + curl/openssl/dig/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/envoy"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
