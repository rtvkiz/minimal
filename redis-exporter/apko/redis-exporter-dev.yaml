# Development variant of minimal-redis-exporter.
# Same binary from prod, plus a shell, a redis client and the HTTP/JSON tools
# needed to work out why a scrape reports up=0.
#
# In-house composition (no public Chainguard redis-exporter-dev reference).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # redis_exporter (same as prod)
    - redis-exporter

    # Certificates (same as prod)
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- Redis client: talk to the scrape target directly ---
    - valkey-cli

    # --- HTTP/TLS/JSON debugging ---
    - curl
    - jq
    - openssl

    # --- DNS troubleshooting ---
    - bind-tools

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/redis_exporter

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  LANG: C.UTF-8

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-redis-exporter-dev"
  org.opencontainers.image.description: "Dev variant of minimal-redis-exporter: same binary + shell, valkey-cli, curl/jq/openssl and dig. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/redis-exporter"
  org.opencontainers.image.licenses: "MIT"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
