# Minimal redis_exporter image - built from source via melange
# CVE patching via the 6-hourly rebuild from upstream source

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Our redis_exporter (built from source via melange)
    - redis-exporter

    # Certificates — Redis/Valkey over TLS, and HTTPS scrape targets
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# Scrapes a Redis/Valkey instance and exposes it as Prometheus metrics on :9121.
# Point it at an instance with REDIS_ADDR (or --redis.addr); it defaults to
# redis://localhost:6379 and serves /metrics regardless, reporting up=0 while
# the target is unreachable.
#
# The upstream binary keeps its underscore name (redis_exporter) while the image
# and package use the catalog's hyphenated convention (redis-exporter).
#
# :9121 is above 1024, so nonroot binds it without any capability.
entrypoint:
  command: /usr/bin/redis_exporter

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-redis-exporter"
  org.opencontainers.image.description: "Hardened shell-less Redis exporter for Prometheus built from source via melange with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/redis-exporter"
  org.opencontainers.image.licenses: "MIT"

archs:
  - x86_64
  - aarch64
