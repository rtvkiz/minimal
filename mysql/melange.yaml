# Melange build configuration for minimal MySQL
# Builds MySQL from source with server + client only
# No plugins, no extras, minimal footprint

package:
  name: mysql-minimal
  version: 8.4.9
  epoch: 0
  description: "Minimal MySQL server and client built from source"
  copyright:
    - license: GPL-2.0-only

vars:
  # SHA256 checksum of source tarball - updated by update-mysql.yml workflow
  sha256: e4aa8b39e42d1fe078f33bbd73695fac2b54dbc7bb137f0bdbe63f7be1a02d6b

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - cmake
      - linux-headers
      - openssl-dev
      - ncurses-dev
      - libevent-dev
      - bison
      - perl
      - libtirpc-dev
      - rpcsvc-proto
      - protobuf-dev

pipeline:
  # Download and verify MySQL source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors "https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-${{package.version}}.tar.gz" \
        -o /home/build/mysql.tar.gz

      # Verify checksum
      echo "${{vars.sha256}}  /home/build/mysql.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf mysql.tar.gz
      rm mysql.tar.gz

  # Configure, build, and install MySQL.
  #
  # Pattern follows wolfi-dev/os mysql-9.7.yaml: `make install DESTDIR=…`
  # lets MySQL place files at their canonical paths, including the bundled
  # protobuf 24.4 shared libs into ${prefix}/lib/private/ — exactly where
  # mysqld's compiled-in RPATH ($ORIGIN/../lib/private) resolves them.
  # No manual `cp` of build outputs, so we stop fighting MySQL's CMake
  # layout every time it changes between minor versions.
  - runs: |
      cd /home/build/mysql-${{package.version}}
      mkdir build && cd build
      cmake .. \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DMYSQL_DATADIR=/var/lib/mysql \
        -DSYSCONFDIR=/etc/mysql \
        -DMYSQL_UNIX_ADDR=/var/run/mysqld/mysqld.sock \
        -DWITH_SSL=system \
        -DWITH_ZLIB=bundled \
        -DDOWNLOAD_BOOST=1 \
        -DWITH_BOOST=/home/build/boost \
        -DWITH_UNIT_TESTS=OFF \
        -DWITH_ROUTER=OFF \
        -DWITH_DEBUG=OFF \
        -DCOMPILATION_COMMENT="Minimal Hardened Build" \
        -DCMAKE_C_FLAGS="-g0" \
        -DCMAKE_CXX_FLAGS="-g0" \
        -DWITHOUT_ARCHIVE_STORAGE_ENGINE=1 \
        -DWITHOUT_BLACKHOLE_STORAGE_ENGINE=1 \
        -DWITHOUT_EXAMPLE_STORAGE_ENGINE=1 \
        -DWITHOUT_FEDERATED_STORAGE_ENGINE=1 \
        -DWITHOUT_NDB_STORAGE_ENGINE=1 \
        -DWITHOUT_NDBCLUSTER_STORAGE_ENGINE=1 \
        -DWITHOUT_PERFSCHEMA_STORAGE_ENGINE=0 \
        -DWITH_NDB=OFF \
        -DWITH_PROTOBUF=bundled \
        -DWITH_ICU=bundled
      make -j$(nproc)
      make install DESTDIR="${{targets.destdir}}"

  # Trim the install to a minimal footprint, drop X Plugin, ship entrypoint.
  - runs: |
      D="${{targets.destdir}}"

      # Drop dev / test / docs — keep server, client, plugins, share/.
      rm -rf "$D/usr/mysql-test" \
             "$D/usr/include" \
             "$D/usr/docs" \
             "$D/usr/share/doc" \
             "$D/usr/share/man" \
             "$D/usr/share/info" \
             "$D/usr/lib/pkgconfig" \
             "$D/usr/lib64/pkgconfig"

      # Drop static archives and the libmysqlclient family — this is a server
      # image, not a client SDK. The mysql CLI links libmysqlclient statically
      # (see MySQL CMake), so removing the .so does not break it.
      find "$D/usr/lib" "$D/usr/lib64" -maxdepth 1 \
        \( -name 'libmysqlclient*' -o -name '*.a' \) -delete 2>/dev/null || true

      # Drop X Plugin (libmysqlx.so, port 33060). It dynamically links the
      # system libprotobuf-lite even with -DWITH_PROTOBUF=bundled, which
      # would re-introduce the Wolfi protobuf+absl ABI drift this image is
      # built to avoid. Classic protocol on 3306 is unaffected.
      find "$D" -name 'libmysqlx.so' -delete

      # Bundled protobuf shared libs (libprotobuf-lite.so.24.4.0,
      # libprotobuf.so.24.4.0) were installed to /usr/lib/private/ by
      # `make install`. mysqld's RPATH resolves them there, and apko's
      # auto-provides scanner self-satisfies the SO deps from the same
      # package, so no Wolfi libprotobuf-lite dependency is needed.

      # Strip ELF binaries and shared libraries in the destdir.
      find "$D" -type f \( -perm -u+x -o -name '*.so*' \) -print0 |
        while IFS= read -r -d '' f; do
          case "$(file -L "$f" 2>/dev/null)" in
            *ELF*) strip --strip-unneeded "$f" 2>/dev/null || true ;;
          esac
        done

      # Entrypoint script — auto-initialize on first run.
      cat > "$D/usr/bin/docker-entrypoint.sh" << 'ENTRY'
      #!/bin/sh
      set -e

      if [ ! -f /var/lib/mysql/ibdata1 ]; then
        echo "Initializing MySQL data directory..."
        mysqld --initialize-insecure
      fi

      exec mysqld "$@"
      ENTRY
      chmod +x "$D/usr/bin/docker-entrypoint.sh"

  # Verify the build
  - runs: |
      echo "Verifying MySQL build..."
      "${{targets.destdir}}/usr/bin/mysqld" --version
      "${{targets.destdir}}/usr/bin/mysql" --version
      echo "Checking bundled protobuf libs in /usr/lib/private/:"
      ls -lh "${{targets.destdir}}/usr/lib/private/" 2>/dev/null || \
        echo "WARNING: /usr/lib/private/ missing — protobuf may not have installed"
      echo "Checking binary sizes..."
      ls -lh "${{targets.destdir}}/usr/bin/mysqld"
      ls -lh "${{targets.destdir}}/usr/bin/mysql"

update:
  enabled: true
  github:
    identifier: mysql/mysql-server
    use-tag: true
    tag-filter: "mysql-8.4."
