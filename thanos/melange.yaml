# Melange build configuration for minimal Thanos
# Pure Go from source. Single multi-command `thanos` binary.
# License: Apache-2.0 (Thanos authors).

package:
  name: thanos-minimal
  version: 0.42.3
  epoch: 0
  description: "Minimal Thanos (highly-available Prometheus long-term storage) built from source"
  copyright:
    - license: Apache-2.0

vars:
  # SHA256 of thanos source tarball - updated by update-versions.yml workflow
  sha256: cdb2b17c9a6423a5bea2c44ce7d8bd6b71bbe385c5812027e6dd2db6f61beb1b

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify thanos source
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/thanos-io/thanos/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/thanos.tar.gz

      echo "${{vars.sha256}}  /home/build/thanos.tar.gz" | sha256sum -c -

      cd /home/build
      tar xzf thanos.tar.gz
      rm thanos.tar.gz

  # Build the thanos binary (static).
  # Version is reported via github.com/prometheus/common/version; build tags
  # netgo,slicelabels match upstream's .promu.yml release build.
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/thanos-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/go-jose/go-jose/v4@v4.1.4 github.com/klauspost/compress@v1.18.7 go.mongodb.org/mongo-driver@v1.17.7 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.44.0 go.opentelemetry.io/otel/sdk@v1.44.0 go.opentelemetry.io/otel@v1.44.0 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/thanos-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -tags netgo,slicelabels \
        -ldflags="-s -w \
          -X github.com/prometheus/common/version.Version=${{package.version}} \
          -X github.com/prometheus/common/version.Revision=source-build \
          -X github.com/prometheus/common/version.Branch=tag-v${{package.version}}" \
        -o /home/build/thanos-bin \
        ./cmd/thanos

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/thanos-bin "${{targets.destdir}}/usr/bin/thanos"
      chmod 0755 "${{targets.destdir}}/usr/bin/thanos"

  # Verify the build
  - runs: |
      echo "Verifying thanos binary..."
      "${{targets.destdir}}/usr/bin/thanos" --version
