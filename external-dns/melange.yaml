# Melange build configuration for minimal ExternalDNS
# Pure Go from source. Single static `external-dns` binary — a Kubernetes
# controller that syncs Services/Ingresses to external DNS providers.
# License: Apache-2.0.

package:
  # Named `external-dns` (not `external-dns-minimal`) so vulnerability scanners
  # can identify it. Syft derives a package's CPE from its apk name, and every
  # CPE it generated kept -minimal in the product field
  # (cpe:2.3:a:external-dns:external-dns-minimal:*,
  # cpe:2.3:a:external-dns-minimal:external-dns-minimal:*, ...). NVD indexes
  # this product bare, as cpe:2.3:a:external-dns:external-dns:*, so none of
  # them matched, and the Wolfi secdb missed it too.
  name: external-dns
  version: 0.21.0
  epoch: 0
  description: "Minimal ExternalDNS Kubernetes DNS controller built from source"
  copyright:
    - license: Apache-2.0
  dependencies:
    # apko resolves a top-level package name across ALL repositories and picks
    # the highest version — it does not prefer our local repo (apko v1.1.6
    # pkg/apk/apk/repo.go, comparePackages: `compare` is nil for a top-level
    # request, so the repository-matching tiebreak never runs). Wolfi has no
    # bare `external-dns` package today, but if it ever adds one at a higher
    # version, apk would silently install it instead of this source-built one.
    # provider-priority is evaluated BEFORE version in that comparator, so this
    # pins resolution to our package permanently.
    provider-priority: 100

vars:
  # SHA256 of external-dns source tarball - updated by update-versions.yml
  sha256: 78fd72654681bb6ebf13f1360551f8aafb08f2d0eeecdd6523a89c8631b5cf64

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  # Download and verify ExternalDNS source
  - runs: |
      mkdir -p /home/build/external-dns-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/kubernetes-sigs/external-dns/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/external-dns.tar.gz

      echo "${{vars.sha256}}  /home/build/external-dns.tar.gz" | sha256sum -c -

      tar xzf /home/build/external-dns.tar.gz -C /home/build/external-dns-${{package.version}} --strip-components=1
      rm /home/build/external-dns.tar.gz

  # Version is reported via pkg/apis/externaldns.Version (see upstream Makefile).
  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/external-dns-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get github.com/projectcontour/contour@v1.33.5 google.golang.org/grpc@v1.82.1 go.opentelemetry.io/otel@v1.45.0 golang.org/x/crypto@v0.55.0 golang.org/x/net@v0.58.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.41.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.49.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/external-dns-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X sigs.k8s.io/external-dns/pkg/apis/externaldns.Version=${{package.version}}" \
        -o /home/build/external-dns-bin \
        .

  # Install binary
  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/external-dns-bin "${{targets.destdir}}/usr/bin/external-dns"
      chmod 0755 "${{targets.destdir}}/usr/bin/external-dns"

  # Verify the build
  - runs: |
      echo "Verifying external-dns binary..."
      "${{targets.destdir}}/usr/bin/external-dns" --version

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/external-dns
    use-tag: true
    tag-filter: "v0."
