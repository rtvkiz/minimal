# Melange build configuration for minimal sops
# Pure Go from source. Single static `sops` binary. License: MPL-2.0.

package:
  name: sops-minimal
  version: 3.13.2
  epoch: 0
  description: "Minimal SOPS secrets OPerationS editor built from source"
  copyright:
    - license: MPL-2.0

vars:
  # SHA256 of sops source tarball - updated by update-versions.yml workflow
  sha256: 79560b53814e20031d094a293d6c169314eaaf97efd6e95a6d765e61e881db2c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - build-base
      - go
      - git

pipeline:
  - runs: |
      mkdir -p /home/build/sops-${{package.version}}
      curl -fsSL --retry 5 --retry-all-errors \
        "https://github.com/getsops/sops/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/sops.tar.gz
      echo "${{vars.sha256}}  /home/build/sops.tar.gz" | sha256sum -c -
      tar xzf /home/build/sops.tar.gz -C /home/build/sops-${{package.version}} --strip-components=1
      rm /home/build/sops.tar.gz

  # patch-go-deps: auto-generated — do not edit manually
  - runs: |
      export GOWORK=off
      _retry() { local i; for i in 5 15 30; do "$@" && return 0; echo "retry: $* failed, sleeping ${i}s"; sleep $i; done; "$@"; }
      _pgd_reqs() { awk '$1=="require" && $2=="(" {b=1;next} b && $1==")" {b=0;next} b && index($1,"/")>0 && substr($2,1,1)=="v" {print $1,$2;next} $1=="require" && NF>=3 && index($2,"/")>0 && substr($3,1,1)=="v" {print $2,$3}' "$1"; }
      for root in /home/build/sops-${{package.version}}; do
        [ -f "$root/go.mod" ] || continue
        ( set -e
          cd "$root"
          cp go.mod .pgd-orig.mod
          _retry go get google.golang.org/grpc@v1.82.1 golang.org/x/crypto@v0.54.0 golang.org/x/net@v0.57.0 golang.org/x/sys@v0.47.0 golang.org/x/text@v0.40.0 golang.org/x/term@v0.45.0 golang.org/x/time@v0.15.0 golang.org/x/sync@v0.22.0 golang.org/x/tools@v0.48.0
          go mod tidy -e
          # go mod tidy can downgrade a source-pinned require below what the
          # source shipped (e.g. a lockstep family like openbao's
          # go-kms-wrapping transit v2.8.0 -> v2.1.0, which then fails to build
          # against its core sibling still at v2.8.0). Re-raise any require tidy
          # dropped below its pre-tidy version. Corrects only upward, so CVE
          # bumps (>= source) are never undone.
          _pgd_reqs .pgd-orig.mod > .pgd-o.txt
          _pgd_reqs go.mod > .pgd-n.txt
          awk 'NR==FNR{o[$1]=$2;next} ($1 in o) && o[$1]!=$2 {print $1,o[$1],$2}' .pgd-o.txt .pgd-n.txt | while read -r p ov cv; do
            hi=$( { echo "$ov"; echo "$cv"; } | sort -V | tail -1 )
            if [ "$hi" = "$ov" ]; then
              echo "pgd-guard: restoring $p: $cv -> $ov (tidy downgraded below source pin)"
              _retry go get "$p@$ov"
            fi
          done
          rm -f .pgd-orig.mod .pgd-o.txt .pgd-n.txt
          [ ! -d vendor ] || go mod vendor
        )
      done
  # end-patch-go-deps
  - runs: |
      cd /home/build/sops-${{package.version}}
      GOTOOLCHAIN=local CGO_ENABLED=0 go build \
        -trimpath \
        -ldflags="-s -w -buildid= \
          -X github.com/getsops/sops/v3/version.Version=${{package.version}}" \
        -o /home/build/sops-bin \
        ./cmd/sops

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp /home/build/sops-bin "${{targets.destdir}}/usr/bin/sops"
      chmod 0755 "${{targets.destdir}}/usr/bin/sops"

  - runs: |
      echo "Verifying sops binary..."
      "${{targets.destdir}}/usr/bin/sops" --version
