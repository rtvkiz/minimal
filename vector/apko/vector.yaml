# Minimal Vector image - using Wolfi's pre-built package
# Shell-less/distroless for security
# CVE patching via the 6-hourly rebuild (Wolfi rolling package)

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Vector from Wolfi (CVE-patched)
    - vector

    # Core system libraries
    - glibc
    - ld-linux
    - libgcc

    # TLS (HTTP/Kafka/Elasticsearch sinks) + DNS resolution
    - openssl
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# Vector runs in the foreground by default (no daemonisation), so no flag is
# needed to keep it attached — unlike dnsmasq/keepalived.
#
# The Wolfi package ships a default /etc/vector/vector.yaml (a demo_logs ->
# remap -> console pipeline), so the image starts and emits parsed JSON with no
# config mounted. Real deployments mount their own config over that path, or
# override the command with `--config /path/to/vector.yaml`.
entrypoint:
  command: /usr/bin/vector

environment:
  PATH: /usr/bin:/bin
  # Vector writes disk buffers and checkpoint state here. Must be writable by
  # nonroot; see the paths: entry below.
  VECTOR_DATA_DIR: /var/lib/vector

paths:
  - path: /var/lib/vector
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-vector"
  org.opencontainers.image.description: "Hardened shell-less Vector observability data pipeline built on Wolfi with CVE patches on every rebuild"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/vector"
  org.opencontainers.image.licenses: "MPL-2.0"

archs:
  - x86_64
  - aarch64
