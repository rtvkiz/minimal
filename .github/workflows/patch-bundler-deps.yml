name: Patch Ruby Bundler Dependencies

on:
  # workflow_dispatch only until validated; once stable, add:
  #   schedule:
  #     - cron: '30 1,7,13,19 * * *'  # 30 min after patch-go-deps
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  GRYPE_VERSION: v0.109.1

jobs:
  patch-bundler-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cache Grype binary
        id: grype-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/bin/grype
          key: grype-${{ env.GRYPE_VERSION }}-linux-amd64

      - name: Install Grype
        if: steps.grype-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-all-errors -o /tmp/grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/grype.tar.gz -C /usr/local/bin grype
          rm -f /tmp/grype.tar.gz

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing patch-bundler-deps PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_URL=$(gh pr list --head patch-bundler-deps --base main --state open --json url --jq '.[0].url // ""')
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Scan Bundler images and generate patches
        id: scan
        run: |
          D='$'
          # Image -> Bundler app source dir (where Gemfile + Gemfile.lock live).
          declare -A SRCROOTS=(
            [rails]="/home/build/rails-${D}{{package.version}}"
          )

          # Build marker. We insert the bundle-update pipeline step before this line.
          declare -A BUILD_MARKERS=(
            [rails]='bundle install'
          )

          HAS_PATCHES=false
          PATCHED_LIST=""
          SUMMARY=""

          for IMAGE in "${!SRCROOTS[@]}"; do
            echo "=== Scanning $IMAGE ==="
            FULL_IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${IMAGE}:latest"
            MELANGE_FILE="${IMAGE}/melange.yaml"

            if grep -q "# patch-bundler-deps: auto-generated" "$MELANGE_FILE"; then
              awk '/# patch-bundler-deps: auto-generated/{skip=1} /# end-patch-bundler-deps/{skip=0; next} !skip' \
                "$MELANGE_FILE" > "${MELANGE_FILE}.tmp" && mv "${MELANGE_FILE}.tmp" "$MELANGE_FILE"
            fi

            # Extract gem-type CVE matches with fix versions.
            FIXES=$(grype "$FULL_IMAGE" -o json 2>/dev/null | \
              jq -r '
                [.matches[]
                  | select(.artifact.type == "gem")
                  | select(.vulnerability.fix.versions | length > 0)
                  | {pkg: .artifact.name, fix: .vulnerability.fix.versions[0]}
                ]
                | unique_by(.pkg)
                | .[]
                | "\(.pkg)@\(.fix)"
              ' 2>/dev/null | sort -u || true)

            if [ -z "$FIXES" ]; then
              echo "  No fixable gem CVEs"
              continue
            fi

            SRCROOT="${SRCROOTS[$IMAGE]}"
            MARKER="${BUILD_MARKERS[$IMAGE]}"

            # Verify each gem@version exists on rubygems.org before emitting.
            BUNDLE_UPDATES=""
            APPLIED_COUNT=0
            while IFS= read -r gem_ver; do
              [ -z "$gem_ver" ] && continue
              gem="${gem_ver%@*}"
              ver="${gem_ver#*@}"
              if ! curl -fs --max-time 10 "https://rubygems.org/api/v2/rubygems/${gem}/versions/${ver}.json" >/dev/null 2>&1; then
                echo "  Skipping ${gem_ver}: version not on rubygems.org"
                continue
              fi
              # `bundle update <gem> --conservative` lifts only this gem (and its deps if needed).
              BUNDLE_UPDATES="${BUNDLE_UPDATES}      bundle update ${gem} --conservative\n"
              APPLIED_COUNT=$((APPLIED_COUNT + 1))
            done <<< "$FIXES"

            if [ "$APPLIED_COUNT" -eq 0 ]; then
              echo "  No compatible Bundler patches after filtering"
              continue
            fi

            PATCH_BLOCK="  # patch-bundler-deps: auto-generated — do not edit manually\n  - runs: |\n      cd ${SRCROOT}\n${BUNDLE_UPDATES}  # end-patch-bundler-deps\n"

            MARKER_LINE=$(grep -n "$MARKER" "$MELANGE_FILE" | head -1 | cut -d: -f1)
            [ -z "$MARKER_LINE" ] && { echo "  WARN: marker not found"; continue; }

            MARKER_INDENT=$(sed -n "${MARKER_LINE}p" "$MELANGE_FILE" | sed 's/[^ ].*//' | wc -c)
            if [ "$MARKER_INDENT" -gt 4 ]; then
              RUNS_LINE=$(head -n "$MARKER_LINE" "$MELANGE_FILE" | grep -n "^  - runs:" | tail -1 | cut -d: -f1)
              [ -n "$RUNS_LINE" ] && MARKER_LINE=$RUNS_LINE
            fi

            head -n $((MARKER_LINE - 1)) "$MELANGE_FILE" > "${MELANGE_FILE}.tmp"
            echo -e "$PATCH_BLOCK" >> "${MELANGE_FILE}.tmp"
            tail -n +${MARKER_LINE} "$MELANGE_FILE" >> "${MELANGE_FILE}.tmp"
            mv "${MELANGE_FILE}.tmp" "$MELANGE_FILE"

            HAS_PATCHES=true
            PATCHED_LIST="${PATCHED_LIST} ${IMAGE}"
            SUMMARY="${SUMMARY}- **${IMAGE}**: ${APPLIED_COUNT} gem(s) bumped\n"
            echo "  Patched $APPLIED_COUNT gems"
          done

          PATCHED_LIST=$(echo "$PATCHED_LIST" | xargs)

          if [ "$HAS_PATCHES" = true ]; then
            echo "has_patches=true" >> "$GITHUB_OUTPUT"
            echo "patched_images=$PATCHED_LIST" >> "$GITHUB_OUTPUT"
            { echo "summary<<EOF"; echo -e "$SUMMARY"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "has_patches=false" >> "$GITHUB_OUTPUT"
            echo "No Bundler dep patches needed"
          fi

      - name: Close stale patch-bundler-deps PR
        if: steps.scan.outputs.has_patches != 'true' && steps.existing-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr close "${{ steps.existing-pr.outputs.pr_url }}" \
            --comment "Closing: latest patch-bundler-deps scan produced no patch changes."
          git push origin --delete patch-bundler-deps || true

      - name: Create PR and enable auto-merge
        if: steps.scan.outputs.has_patches == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="patch-bundler-deps"
          PR_TITLE="fix(bundler-deps): patch vulnerable Ruby gem dependencies"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git diff --cached --quiet && { echo "No file changes"; exit 0; }
          git commit -m "fix(bundler-deps): patch vulnerable Ruby gem dependencies"
          git push -u origin "$BRANCH" --force

          cat > /tmp/pr.md <<'PRBODY'
          ## Summary

          Scans published Bundler-driven images with grype, identifies gem-level CVEs
          with known fix versions, and emits `bundle update <gem> --conservative`
          commands in each image's melange.yaml.

          ## Patched images

          ${{ steps.scan.outputs.summary }}

          ## Verification

          CI builds all images — if green, the gem bumps install + Rails boots.

          ---
          Auto-generated by [patch-bundler-deps](${{ github.server_url }}/${{ github.repository }}/actions/workflows/patch-bundler-deps.yml).
          PRBODY

          PR_URL="${{ steps.existing-pr.outputs.pr_url }}"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$PR_TITLE" --add-label dependencies --add-label security --body-file /tmp/pr.md
          else
            PR_URL=$(gh pr create --title "$PR_TITLE" --label dependencies --label security --body-file /tmp/pr.md)
          fi
          echo "Created PR: $PR_URL"
          gh pr merge "$PR_URL" --auto --squash --delete-branch
