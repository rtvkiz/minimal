name: Deploy catalog site

# Builds and deploys the minimalcontainers.com catalog to GitHub Pages.
#
# Decoupled from the image build: this runs on its own and reuses the scan /
# SBOM artifacts uploaded by the most recent successful "Build Hardened Images"
# run, so a site or catalog change ships in ~2 minutes without a 57-image rebuild.
#
# Triggers:
#   workflow_run    — after each build completes → redeploy with fresh scan data
#   push (main)     — site/catalog/apko changes  → fast redeploy reusing latest data
#   workflow_dispatch — manual, on demand

on:
  workflow_run:
    workflows: ["Build Hardened Images"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'catalog.json'
      - '**/apko/*.yaml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; don't cancel an in-flight deploy (Pages dislikes it).
concurrency:
  group: deploy-catalog-site
  cancel-in-progress: false

jobs:
  deploy:
    # For workflow_run, only proceed when the build actually succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # force-push the built site to the gh-pages branch
      actions: read      # download artifacts from the build run
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Source scan data from the latest successful FULL build — one that scanned
      # (nearly) all images. Partial push builds only scan changed images, so we
      # judge completeness by the vulnerability-report artifact count rather than
      # the trigger event: any run with >= MIN reports qualifies (full push,
      # schedule, or dispatch), and thin partial builds are skipped. This keeps a
      # data-thin build from ever deploying over a complete one.
      - name: Resolve source build run
        id: buildrun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MIN=50   # catalog has 57 images; allow a few flaky scans
          RID=""
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&branch=main&per_page=20" \
                        --jq '.workflow_runs[].id'); do
            # Stream the matching names and count with wc -l. Do NOT use
            # `--jq '... | length'`: with --paginate, jq runs per page and emits
            # one length per page (e.g. "44\n10" for a >100-artifact run), which
            # then fails the numeric test below and skips a complete build.
            N=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --paginate \
                  --jq '.artifacts[].name | select(startswith("vulnerability-report-"))' | wc -l)
            echo "run $id → $N vulnerability-report artifacts"
            if [ "${N:-0}" -ge "$MIN" ]; then RID=$id; break; fi
          done
          if [ -z "$RID" ]; then
            echo "::error::No successful build with >= $MIN image reports found to source scan data from."
            exit 1
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Sourcing scan artifacts from full build run $RID"

      # Download the per-image scan reports (+ SBOM sidecars) from that build.
      # NOTE: we page through the artifact list via the API rather than using
      # actions/download-artifact, which only sees the first 100 artifacts — a
      # full build emits >100 (54+ reports, 44 packages-*, SBOMs, SARIF), so the
      # action silently drops reports past the cap and images show as "partial".
      - name: Download scan reports and SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          RID="${{ steps.buildrun.outputs.run_id }}"
          gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" --paginate \
            --jq '.artifacts[] | select((.name|startswith("vulnerability-report-")) or (.name|startswith("catalog-sbom-"))) | "\(.id)\t\(.name)"' \
            > /tmp/arts.tsv
          echo "Matching artifacts: $(wc -l < /tmp/arts.tsv)"
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            if gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "/tmp/$name.zip" 2>/dev/null; then
              unzip -o -q "/tmp/$name.zip" -d reports
            else
              echo "::warning::failed to fetch artifact $name ($id)"
            fi
          done < /tmp/arts.tsv
          echo "Report files downloaded: $(ls reports 2>/dev/null | wc -l)"

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # Assemble the dataset from the reused reports, then build the static site.
      # Call the data script + astro directly (NOT `npm run build`, whose prebuild
      # hook would regenerate images.json WITHOUT the reports dir).
      - name: Build site
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export BUILD_DATE="$(date -u +"%Y-%m-%d %H:%M UTC")"
          export COMMIT_SHA="${GITHUB_SHA:0:7}"
          node scripts/build-data.mjs ../reports
          npx astro build

      # Publish by force-pushing the build to the gh-pages branch. Each deploy is
      # a fresh orphan commit, so the commit SHA changes every time and GitHub
      # Pages always republishes — unlike actions/deploy-pages, which dedupes by
      # commit and so ignores data-only refreshes on an unchanged main. The
      # branch is kept at a single commit (force-push) to avoid history bloat.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site/dist
          touch .nojekyll   # serve _astro/ as-is (skip the Pages Jekyll build)
          test -f CNAME || echo "::warning::CNAME missing from build output"
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy $(date -u +%FT%TZ) · data run ${{ steps.buildrun.outputs.run_id }} · site ${GITHUB_SHA:0:7}"
          echo "Committing $(git ls-files | wc -l) files to gh-pages"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
