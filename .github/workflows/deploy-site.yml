name: Deploy catalog site

# Builds and deploys the minimalcontainers.com catalog to GitHub Pages.
#
# Decoupled from the image build: this runs on its own and reuses the scan /
# SBOM artifacts uploaded by the most recent successful "Build Hardened Images"
# run, so a site or catalog change ships in ~2 minutes without a 57-image rebuild.
#
# Triggers:
#   workflow_run    — after each build completes → redeploy with fresh scan data
#   push (main)     — site/catalog/apko changes  → fast redeploy reusing latest data
#   workflow_dispatch — manual, on demand

on:
  workflow_run:
    workflows: ["Build Hardened Images"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'catalog.json'
      - '**/apko/*.yaml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; don't cancel an in-flight deploy (Pages dislikes it).
concurrency:
  group: deploy-catalog-site
  cancel-in-progress: false

jobs:
  deploy:
    # For workflow_run, only proceed when the build actually succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # force-push the built site to the gh-pages branch
      actions: read      # download artifacts from the build run
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Source scan data from the latest successful FULL build — one that scanned
      # (nearly) all images. Partial push builds only scan changed images, so we
      # judge completeness by the vulnerability-report artifact count rather than
      # the trigger event: any run with enough reports qualifies (full push,
      # schedule, or dispatch), and thin partial builds are skipped. This keeps a
      # data-thin build from ever deploying over a complete one.
      #
      # COMPLETENESS IS RELATIVE TO THE RUN, NOT TO HEAD. This used to compare
      # every candidate against `catalog.json` at HEAD. Onboarding 8 images
      # (#691) therefore raised the bar from 109 to 117 while every existing
      # build had scanned the 112 images that existed when it ran, so nothing
      # qualified and the site could not deploy at all for ~6 hours — until the
      # next 6-hourly full rebuild produced 120 reports. A 112-report build from
      # when the catalog held 112 is COMPLETE, and is now judged as such by
      # reading catalog.json at that run's own commit.
      #
      # AND WE NO LONGER HARD-FAIL. If nothing is complete, deploy from the most
      # complete run available and warn loudly, rather than publishing nothing:
      # during that incident the site sat un-deployed while holding a perfectly
      # good 112-image dataset. Stale scan data is a visible, bounded problem;
      # a dead deploy pipeline is not.
      - name: Resolve source build run
        id: buildrun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          HEAD_IMAGES=$(jq '.images|length' catalog.json)

          # Absolute floor. Even a "complete for its era" run is not worth
          # deploying if the catalog has since grown hugely; this keeps a very
          # old run from publishing over a mostly-current one.
          FLOOR=$(( HEAD_IMAGES / 2 ))

          RID=""; RID_N=0
          BEST=""; BEST_N=0; BEST_MIN=0

          # per_page=40, and partial `push` builds are skipped outright: they
          # scan only changed images (6-8 reports is typical), so they can never
          # qualify and used to consume the search window. With a busy afternoon
          # of pushes the single qualifying run could scroll out of a 20-run
          # window entirely and break deploys with no catalog change at all.
          while read -r id sha ev; do
            [ -n "$id" ] || continue
            if [ "$ev" = "push" ]; then
              echo "run $id (push) → skipped, partial by construction"
              continue
            fi

            # Stream the matching names and count with wc -l. Do NOT use
            # `--jq '... | length'`: with --paginate, jq runs per page and emits
            # one length per page (e.g. "44\n10" for a >100-artifact run), which
            # then fails the numeric test below and skips a complete build.
            N=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --paginate \
                  --jq '.artifacts[].name | select(startswith("vulnerability-report-"))' | wc -l)

            # The catalog as it stood at THAT commit, not at HEAD.
            RUN_IMAGES=$(gh api "repos/${{ github.repository }}/contents/catalog.json?ref=$sha" \
                           --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | jq '.images|length' 2>/dev/null || echo "")
            [ -n "$RUN_IMAGES" ] || RUN_IMAGES=$HEAD_IMAGES   # deleted/unreachable commit
            MIN=$(( RUN_IMAGES - 3 ))   # tolerance for a few flaky per-image scans

            echo "run $id ($ev) → $N reports; catalog was $RUN_IMAGES at $sha, needs >= $MIN"

            if [ "${N:-0}" -ge "$MIN" ] && [ "${N:-0}" -ge "$FLOOR" ]; then
              RID=$id; RID_N=$N; RUN_IMAGES_SEL=$RUN_IMAGES; break
            fi
            if [ "${N:-0}" -gt "$BEST_N" ]; then BEST=$id; BEST_N=$N; BEST_MIN=$MIN; fi
          done < <(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&branch=main&per_page=40" \
                     --jq '.workflow_runs[] | "\(.id) \(.head_sha) \(.event)"')

          if [ -n "$RID" ]; then
            echo "Sourcing scan artifacts from complete build run $RID ($RID_N reports)"
            echo "scan_complete=true" >> "$GITHUB_OUTPUT"
            echo "scan_reports=$RID_N" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEST" ] && [ "$BEST_N" -ge "$FLOOR" ]; then
            RID=$BEST; RID_N=$BEST_N
            echo "::warning title=Partial scan data::No complete build found; deploying from run $BEST with $BEST_N reports (catalog is now $HEAD_IMAGES). Images missing a report render as unscanned until the next full build."
            echo "scan_complete=false" >> "$GITHUB_OUTPUT"
            echo "scan_reports=$BEST_N" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No successful build with at least $FLOOR image reports found to source scan data from."
            exit 1
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

          {
            echo "### Scan data source"
            echo
            echo "- build run: \`$RID\`"
            echo "- reports: **$RID_N** (catalog at HEAD: $HEAD_IMAGES)"
            if [ -n "${RUN_IMAGES_SEL:-}" ]; then
              echo "- that run's catalog: $RUN_IMAGES — complete for its commit"
            else
              echo "- :warning: **partial** — no complete build available"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Download the per-image scan reports (+ SBOM sidecars) from that build.
      # NOTE: we page through the artifact list via the API rather than using
      # actions/download-artifact, which only sees the first 100 artifacts — a
      # full build emits >100 (54+ reports, 44 packages-*, SBOMs, SARIF), so the
      # action silently drops reports past the cap and images show as "partial".
      - name: Download scan reports and SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          RID="${{ steps.buildrun.outputs.run_id }}"
          gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts" --paginate \
            --jq '.artifacts[] | select((.name|startswith("vulnerability-report-")) or (.name|startswith("catalog-sbom-"))) | "\(.id)\t\(.name)"' \
            > /tmp/arts.tsv
          echo "Matching artifacts: $(wc -l < /tmp/arts.tsv)"
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            if gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "/tmp/$name.zip" 2>/dev/null; then
              unzip -o -q "/tmp/$name.zip" -d reports
            else
              echo "::warning::failed to fetch artifact $name ($id)"
            fi
          done < /tmp/arts.tsv
          echo "Report files downloaded: $(ls reports 2>/dev/null | wc -l)"

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # Assemble the dataset from the reused reports, then build the static site.
      # Call the data script + astro directly (NOT `npm run build`, whose prebuild
      # hook would regenerate images.json WITHOUT the reports dir).
      - name: Build site
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export BUILD_DATE="$(date -u +"%Y-%m-%d %H:%M UTC")"
          export COMMIT_SHA="${GITHUB_SHA:0:7}"
          node scripts/build-data.mjs ../reports
          npx astro build

      # Publish by force-pushing the build to the gh-pages branch. Each deploy is
      # a fresh orphan commit, so the commit SHA changes every time and GitHub
      # Pages always republishes — unlike actions/deploy-pages, which dedupes by
      # commit and so ignores data-only refreshes on an unchanged main. The
      # branch is kept at a single commit (force-push) to avoid history bloat.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site/dist
          touch .nojekyll   # serve _astro/ as-is (skip the Pages Jekyll build)
          test -f CNAME || echo "::warning::CNAME missing from build output"
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy $(date -u +%FT%TZ) · data run ${{ steps.buildrun.outputs.run_id }} · site ${GITHUB_SHA:0:7}"
          echo "Committing $(git ls-files | wc -l) files to gh-pages"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
