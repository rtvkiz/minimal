name: Cleanup Package Versions

# Mark-and-sweep GC for the minimal-* GHCR packages (.github/scripts/ghcr-gc.py).
#
# Keeps every tag users pull (latest, <version>, :3 / :3.15 line tags), the
# newest 30 dated builds per variant, and everything those reference: per-arch
# manifests, signatures, SBOM and provenance attestations. Sweeps the rest:
# aged-out dated builds, orphaned signatures/attestations, unreferenced
# manifests, and legacy tags no build produces any more (bare YYYYMMDD,
# -amd64/-arm64).
#
# The previous version deleted *untagged* versions. On GHCR every per-arch
# manifest of a multi-arch image is an untagged version, so that would have
# broken every image the first time it ran with dry_run=false; it only ever
# ran as a dry run.
#
# Reconcile, don't batch: each run is budgeted against the REST rate limit
# (MAX_DELETES, RATE_FLOOR) and the next run resumes.
#
# Token: GITHUB_TOKEN only, scoped to this repo's packages. A classic PAT
# with delete:packages would reach every package on the account, so we don't
# use one. GITHUB_TOKEN's 1,000 req/h budget is shared with every workflow in
# the repo: RATE_FLOOR always leaves headroom for the others, and the site
# deploy reads tags from the registry rather than REST so it doesn't drain it.
# The first pass has a large backlog and drains over days of hourly runs.
#
# Mode: manual runs default to report. Scheduled runs use the repo variable
# GC_SCHEDULE_MODE (report until someone has read a real report, then apply).

on:
  schedule:
    - cron: '17 * * * *'   # hourly: each run spends what the budget allows, the next resumes
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = log only, apply = delete'
        type: choice
        options: [report, apply]
        default: report
      only:
        description: 'Space-separated image names (default: every catalog image)'
        type: string
        default: ''

permissions: {}

concurrency:
  group: cleanup-packages
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            catalog.json
            .github/scripts/ghcr-gc.py
            .github/scripts/test_ghcr_gc.py
          sparse-checkout-cone-mode: false

      - name: Self-test the sweep planner
        run: python3 .github/scripts/test_ghcr_gc.py

      - name: Sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          MODE: ${{ github.event_name == 'schedule' && (vars.GC_SCHEDULE_MODE || 'report') || inputs.mode }}
          ONLY: ${{ inputs.only }}
          KEEP_DATED: '30'
          MIN_AGE_HOURS: '24'
          MAX_DELETES: '700'
          RATE_FLOOR: '350'   # never spend the last 350/h: other workflows share this budget
          MAX_MINUTES: '70'   # stop cleanly before timeout-minutes (90)
          ROTATE: ${{ github.run_number }}
        run: |
          if [ -n "$ONLY" ]; then
            read -r -a NAMES <<< "$ONLY"
          else
            mapfile -t NAMES < <(jq -r '.images[].name' catalog.json)
          fi
          # -u: unbuffered, so progress is visible live and survives a timeout kill
          python3 -u .github/scripts/ghcr-gc.py "${NAMES[@]}"
