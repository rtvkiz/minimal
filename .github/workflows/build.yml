name: Build Hardened Images

on:
  push:
    branches: [main]
    paths:
      - 'images/*/apko/*.yaml'
      - 'images/*/melange.yaml'
      - 'images/*/test.sh'
      - 'images/*/test-dev.sh'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  schedule:
    # Rebuild every 6 hours to keep images and vulnerability counts fresh
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # Schedule/dispatch get unique groups (never cancelled); push/PR cancel previous on same ref
  group: build-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  GRYPE_VERSION: v0.109.1
  # Force cosign 2.6+ to write .sig/.att tags instead of OCI 1.1 referrers.
  # ghcr.io accepts referrers but cosign stores them with empty artifactType
  # and no annotations, so `cosign verify` and `cosign verify-attestation`
  # silently find nothing. Legacy tag mode is interoperable across all
  # registries and verifier versions.
  COSIGN_REGISTRY_REFERRERS_MODE: legacy

jobs:
  #----------------------------------------------------------------------------
  # DETECT CHANGED IMAGES — only build what changed (full rebuild on cron/dispatch)
  #----------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      melange-matrix: ${{ steps.filter.outputs.melange-matrix }}
      apko-matrix: ${{ steps.filter.outputs.apko-matrix }}
      build-melange-matrix: ${{ steps.filter.outputs.build-melange-matrix }}
      has-melange: ${{ steps.filter.outputs.has-melange }}
      has-apko: ${{ steps.filter.outputs.has-apko }}
      has-build-melange: ${{ steps.filter.outputs.has-build-melange }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect changes and generate matrices
        id: filter
        run: |
          # Image configuration
          MELANGE_IMAGES='[
            {"name":"jenkins","variants":["prod","dev"]},
            {"name":"redis-slim","apko":"redis-slim/apko/redis.yaml","variants":["prod","dev"]},
            {"name":"mysql","variants":["prod","dev"]},{"name":"memcached","variants":["prod","dev"]},{"name":"caddy","variants":["prod","dev"]},
            {"name":"haproxy","variants":["prod","dev"]},{"name":"ruby","variants":["prod","dev"]},{"name":"php","variants":["prod","dev"]},{"name":"rails","variants":["prod","dev"]},
            {"name":"kafka","variants":["prod","dev"]},{"name":"zookeeper","variants":["prod","dev"]},{"name":"cassandra","variants":["prod","dev"]},{"name":"solr","variants":["prod","dev"]},{"name":"flink","variants":["prod","dev"]},{"name":"pulsar","variants":["prod","dev"]},{"name":"tomcat","variants":["prod","dev"]},{"name":"valkey","variants":["prod","dev"]},{"name":"nats","variants":["prod","dev"]},
            {"name":"traefik","variants":["prod","dev"]},{"name":"rabbitmq","variants":["prod","dev"]},{"name":"minio","variants":["prod","dev"]},
            {"name":"prometheus","variants":["prod","dev"]},{"name":"alertmanager","variants":["prod","dev"]},{"name":"mariadb","variants":["prod","dev"]},{"name":"etcd","variants":["prod","dev"]},
            {"name":"victoria-metrics","variants":["prod","dev"]},{"name":"jaeger","variants":["prod","dev"]},{"name":"otelcol","variants":["prod","dev"]},
            {"name":"qdrant","variants":["prod","dev"]},{"name":"vaultwarden","variants":["prod","dev"]},{"name":"envoy","variants":["prod","dev"]},{"name":"gitea","variants":["prod","dev"]},
            {"name":"coredns","variants":["prod","dev"]},{"name":"openbao","variants":["prod","dev"]},{"name":"loki","variants":["prod","dev"]},
            {"name":"fluent-bit","variants":["prod","dev"]},{"name":"keycloak","variants":["prod","dev"]},
            {"name":"registry","variants":["prod","dev"]},{"name":"mailpit","variants":["prod","dev"]},
            {"name":"consul","variants":["prod","dev"]},{"name":"tempo","variants":["prod","dev"]},
            {"name":"mosquitto","variants":["prod","dev"]},{"name":"pgbouncer","variants":["prod","dev"]},{"name":"unbound","variants":["prod","dev"]},{"name":"keepalived","variants":["prod","dev"]},{"name":"metrics-server","variants":["prod","dev"]},{"name":"external-dns","variants":["prod","dev"]},{"name":"velero","variants":["prod","dev"]},{"name":"kaniko","variants":["prod","dev"]},{"name":"step-ca","variants":["prod","dev"]},{"name":"skopeo","variants":["prod","dev"]},
            {"name":"helm","variants":["prod","dev"]},
            {"name":"kubectl","variants":["prod","dev"]},
            {"name":"telegraf","variants":["prod","dev"]},
            {"name":"mimir","variants":["prod","dev"]},
            {"name":"opentofu","variants":["prod","dev"]},
            {"name":"trivy","variants":["prod","dev"]},
            {"name":"cosign","variants":["prod","dev"]},
            {"name":"syft","variants":["prod","dev"]},
            {"name":"grype","variants":["prod","dev"]},
            {"name":"oras","variants":["prod","dev"]},
            {"name":"gitleaks","variants":["prod","dev"]},
            {"name":"step-cli","variants":["prod","dev"]},
            {"name":"opa","variants":["prod","dev"]},
            {"name":"osv-scanner","variants":["prod","dev"]},
            {"name":"notation","variants":["prod","dev"]},
            {"name":"conftest","variants":["prod","dev"]},
            {"name":"kubeconform","variants":["prod","dev"]},
            {"name":"kube-bench","variants":["prod","dev"]},
            {"name":"trufflehog","variants":["prod","dev"]},
            {"name":"dex","variants":["prod","dev"]},
            {"name":"tailscale","variants":["prod","dev"]},
            {"name":"descheduler","variants":["prod","dev"]},
            {"name":"kube-vip","variants":["prod","dev"]},
            {"name":"zipkin","variants":["prod","dev"]},
            {"name":"rclone","variants":["prod","dev"]},
            {"name":"restic","variants":["prod","dev"]},
            {"name":"seaweedfs","variants":["prod","dev"]},
            {"name":"syncthing","variants":["prod","dev"]},
            {"name":"nsq","variants":["prod","dev"]},
            {"name":"oauth2-proxy","variants":["prod","dev"]},
            {"name":"flux","variants":["prod","dev"]},
            {"name":"kustomize","variants":["prod","dev"]},
            {"name":"sops","variants":["prod","dev"]},
            {"name":"crane","variants":["prod","dev"]},
            {"name":"kubeseal","variants":["prod","dev"]},
            {"name":"helmfile","variants":["prod","dev"]},
            {"name":"regctl","variants":["prod","dev"]},
            {"name":"stern","variants":["prod","dev"]},
            {"name":"thanos","variants":["prod","dev"]},
            {"name":"node-exporter","variants":["prod","dev"]},
            {"name":"blackbox-exporter","variants":["prod","dev"]},
            {"name":"redis-exporter","variants":["prod","dev"]},
            {"name":"kube-state-metrics","variants":["prod","dev"]},
            {"name":"pushgateway","variants":["prod","dev"]},
            {"name":"deno","variants":["prod","dev"]},
            {"name":"opensearch","variants":["prod","dev"]}
          ]'
          APKO_IMAGES='[
            {"name":"python","grep":"python-[0-9]","variants":["prod","dev"]},
            {"name":"node-slim","apko":"node-slim/apko/node.yaml","grep":"nodejs-[0-9]","variants":["prod","dev"]},
            {"name":"go","grep":"go-[0-9]","variants":["prod","dev"]},
            {"name":"nginx","grep":"nginx-mainline","variants":["prod","dev"]},
            {"name":"httpd","grep":"apache2","variants":["prod","dev"]},
            {"name":"postgres-slim","apko":"postgres-slim/apko/postgres.yaml","grep":"postgresql-[0-9]","variants":["prod","dev"]},
            {"name":"bun","grep":"bun","variants":["prod","dev"]},
            {"name":"sqlite","grep":"sqlite","variants":["prod","dev"]},
            {"name":"dotnet","grep":"dotnet-[0-9].*-runtime","variants":["prod","dev"]},
            {"name":"java","grep":"openjdk-[0-9]+","variants":["prod","dev"]},
            {"name":"dnsmasq","grep":"dnsmasq","variants":["prod","dev"]},
            {"name":"vector","grep":"vector","variants":["prod","dev"]},
            {"name":"patroni","grep":"patroni","variants":["prod","dev"]}
          ]'

          # Determine if full rebuild is needed
          EVENT="${{ github.event_name }}"
          FULL_REBUILD=false
          BUILD_YML_IMAGES=""   # image names extracted from build.yml diff

          if [[ "$EVENT" == "schedule" ]] || [[ "$EVENT" == "workflow_dispatch" ]]; then
            FULL_REBUILD=true
          else
            if [[ "$EVENT" == "pull_request" ]]; then
              DIFF_BASE="${{ github.event.pull_request.base.sha }}"
            else
              DIFF_BASE="${{ github.event.before }}"
            fi
            if [[ "$DIFF_BASE" == "0000000000000000000000000000000000000000" ]]; then
              FULL_REBUILD=true
            else
              CHANGED_FILES=$(git diff --name-only "$DIFF_BASE" "${{ github.sha }}" 2>/dev/null || echo ".github/workflows/build.yml")
              if echo "$CHANGED_FILES" | grep -q "^\.github/workflows/build\.yml$"; then
                # Smarter detection: if the ONLY build.yml changes are inside
                # the MELANGE_IMAGES / APKO_IMAGES JSON arrays (adding/editing
                # `{"name":"foo", ...}` entries), rebuild just those images.
                # If anything else changed (jq matrix logic, job defs, env vars,
                # permissions), fall back to a full rebuild.
                # Why: a 128-job full rebuild for a one-line variants:["prod","dev"]
                # addition triggers GitHub Actions token throttling on the
                # concurrent ARM runner checkouts ("could not read Username").
                BUILD_DIFF=$(git diff "$DIFF_BASE" "${{ github.sha }}" -- .github/workflows/build.yml 2>/dev/null || echo "")
                # Strip diff headers; keep only added/removed content lines.
                BUILD_DIFF_BODY=$(echo "$BUILD_DIFF" | grep -E '^[+-]' | grep -vE '^[+-]{3}')
                # Lines that look like an image entry (one we can route surgically).
                IMAGE_ENTRY_LINES=$(echo "$BUILD_DIFF_BODY" | grep -cE '^[+-][[:space:]]*\{"name":"[a-z][a-z0-9-]*"' || true)
                NON_BLANK_LINES=$(echo "$BUILD_DIFF_BODY" | grep -cE '^[+-][[:space:]]*[^[:space:]]' || true)
                if [ "$NON_BLANK_LINES" -gt 0 ] && [ "$IMAGE_ENTRY_LINES" -eq "$NON_BLANK_LINES" ]; then
                  # All changed lines are image-entry edits — extract names.
                  BUILD_YML_IMAGES=$(echo "$BUILD_DIFF_BODY" | grep -oE '"name":"[a-z][a-z0-9-]*"' | sed 's/"name":"//; s/"$//' | sort -u)
                  echo "build.yml change is image-entry-only; routing to: $BUILD_YML_IMAGES"
                else
                  FULL_REBUILD=true
                  echo "build.yml change affects matrix/job logic; falling back to FULL_REBUILD"
                fi
              fi
            fi
          fi

          echo "Event: $EVENT, Full rebuild: $FULL_REBUILD"

          if [ "$FULL_REBUILD" = true ]; then
            CHANGED=$(echo "$MELANGE_IMAGES $APKO_IMAGES" | jq -s 'add | [.[].name]')
          else
            # Combine file-diff image dirs with image names extracted from build.yml diff.
            # The image name is the SECOND path segment: #551 moved all 101 image
            # directories under images/. While this still took the first segment it
            # resolved every image change to the literal string "images", which
            # matches no catalog name, so every build job was skipped and the run
            # reported green — PRs and pushes stopped building images entirely and
            # only the 6-hourly FULL_REBUILD caught breakage (that is how the
            # opensearch/keycloak failures in #556 reached main on a green PR).
            CHANGED=$( ( echo "$CHANGED_FILES" | grep -E '^images/[^/]+/' | sed -E 's|^images/([^/]+)/.*|\1|'
                        echo "$BUILD_YML_IMAGES"
                      ) | grep -v '^$' | sort -u | jq -R . | jq -s .)
            echo "Changed dirs: $CHANGED"
          fi

          # Generate melange-build matrix (per-arch entries)
          MELANGE_MATRIX=$(echo "$MELANGE_IMAGES" | jq -c --argjson changed "$CHANGED" '{include: [
            .[] | select(.name as $n | $changed | index($n)) |
            ((.arches // "x86_64,aarch64") | split(","))[] as $arch |
            {
              name: .name,
              melange_config: ("images/" + .name + "/melange.yaml"),
              arch: $arch,
              runner: (if $arch == "aarch64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)
            }
          ]}')

          # Generate build-melange matrix (one entry per image x variant).
          # Images without explicit `variants` build prod only; opt-in to a
          # dev variant by adding `"variants":["prod","dev"]` and creating
          # <name>/apko/<name>-dev.yaml + <name>/test-dev.sh.
          BUILD_MELANGE_MATRIX=$(echo "$MELANGE_IMAGES" | jq -c --argjson changed "$CHANGED" '{include: [
            .[] | select(.name as $n | $changed | index($n)) | . as $img |
            (.variants // ["prod"])[] as $variant |
            {
              name: $img.name,
              variant: $variant,
              apko_config: (
                if $variant == "dev"
                then ("images/" + $img.name + "/apko/" + $img.name + "-dev.yaml")
                else ("images/" + ($img.apko // ($img.name + "/apko/" + $img.name + ".yaml")))
                end
              ),
              melange_config: ("images/" + $img.name + "/melange.yaml"),
              arches: ($img.arches // "x86_64,aarch64"),
              tag_suffix: (if $variant == "dev" then "-dev" else "" end),
              latest_tag: (if $variant == "dev" then "latest-dev" else "latest" end),
              test_script: ("images/" + (if $variant == "dev" then ($img.name + "/test-dev.sh") else ($img.name + "/test.sh") end)),
              scan_for_cves: ($variant == "prod")
            }
          ]}')

          # Generate build-apko matrix.
          # Per-image variant fan-out: same convention as BUILD_MELANGE_MATRIX.
          # Images opt-in to a dev variant by adding `"variants":["prod","dev"]`
          # plus a `<name>/apko/<name>-dev.yaml` file (universal convention,
          # regardless of what the prod apko file is named).
          # See docs/dev-variants/CONVENTIONS.md.
          APKO_MATRIX=$(echo "$APKO_IMAGES" | jq -c --argjson changed "$CHANGED" '{include: [
            .[] | select(.name as $n | $changed | index($n)) | . as $img |
            ($img.variants // ["prod"])[] as $variant |
            {
              name: $img.name,
              variant: $variant,
              apko_config: (
                if $variant == "dev"
                then ("images/" + $img.name + "/apko/" + $img.name + "-dev.yaml")
                else ("images/" + ($img.apko // ($img.name + "/apko/" + $img.name + ".yaml")))
                end
              ),
              primary_grep: $img.grep,
              tag_suffix: (if $variant == "dev" then "-dev" else "" end),
              latest_tag: (if $variant == "dev" then "latest-dev" else "latest" end),
              test_script: ("images/" + (if $variant == "dev" then ($img.name + "/test-dev.sh") else ($img.name + "/test.sh") end)),
              scan_for_cves: ($variant == "prod")
            }
          ]}')

          # Output matrices and flags
          {
            echo "melange-matrix=$MELANGE_MATRIX"
            echo "apko-matrix=$APKO_MATRIX"
            echo "build-melange-matrix=$BUILD_MELANGE_MATRIX"
            echo "has-melange=$(echo "$MELANGE_MATRIX" | jq '.include | length > 0')"
            echo "has-apko=$(echo "$APKO_MATRIX" | jq '.include | length > 0')"
            echo "has-build-melange=$(echo "$BUILD_MELANGE_MATRIX" | jq '.include | length > 0')"
          } >> "$GITHUB_OUTPUT"

          # Summary
          echo "### Build Matrix" >> $GITHUB_STEP_SUMMARY
          echo "- Melange builds: $(echo "$MELANGE_MATRIX" | jq '.include | length')" >> $GITHUB_STEP_SUMMARY
          echo "- Apko builds: $(echo "$APKO_MATRIX" | jq '.include | length')" >> $GITHUB_STEP_SUMMARY
          echo "- Image assemblies: $(echo "$BUILD_MELANGE_MATRIX" | jq '.include | length')" >> $GITHUB_STEP_SUMMARY

  #----------------------------------------------------------------------------
  # VALIDATE OPENVEX DOCUMENTS
  #
  # Runs on every event so a malformed vex/<image>.openvex.json blocks merge
  # before image builds start. Standalone — no needs:/depends — so it's the
  # fastest signal a contributor gets.
  #----------------------------------------------------------------------------
  validate-vex:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate OpenVEX docs
        run: bash tools/vex/validate.sh

  #----------------------------------------------------------------------------
  # CATALOG DRIFT CHECK
  # The minimalcontainers.com site is generated from catalog.json, which must
  # list exactly the images this workflow builds. Fail fast if they drift.
  #----------------------------------------------------------------------------
  validate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assert catalog.json matches the build matrix
        run: |
          # Images the catalog site advertises.
          jq -r '.images[].name' catalog.json | sort -u > /tmp/catalog.txt
          # Images this workflow actually builds (both matrix arrays). The
          # literal "foo" comes from an example in a code comment — exclude it.
          grep -oE '"name":"[a-z0-9-]+"' .github/workflows/build.yml \
            | sed 's/.*"name":"//; s/"//' | grep -vx foo | sort -u > /tmp/matrix.txt
          if ! diff -u /tmp/matrix.txt /tmp/catalog.txt; then
            echo "::error::catalog.json and the build matrix have drifted (< build matrix, > catalog.json). Update catalog.json."
            exit 1
          fi
          echo "OK — catalog.json matches the build matrix ($(wc -l < /tmp/catalog.txt) images)."

      - name: Assert every prod image has auto-update configured
        # Invariant: no image ships without a live auto-update mechanism (a
        # cron-enabled versions.yaml row, a declared Wolfi-package class, or a
        # bespoke updater). Same check as local `make check-autoupdate`.
        run: make check-autoupdate

      - name: Assert the website's factual claims still hold
        # Invariant: nothing on minimalcontainers.com contradicts this repo, and
        # no retracted claim comes back. A page renders identically whether its
        # numbers are right or wrong, so nothing failed when /about kept saying
        # Docker Hardened had "Hundreds" of images months after Docker released
        # 1,000+ free, or when a page shipped claiming bitnami/helm exists (it
        # 404s). Offline only here — competitor repo lookups need --online and
        # must not make a third party's outage fail our build. Same check as
        # local `make check-site-claims`.
        run: make check-site-claims

      - name: Assert no build environment uses a bare toolchain provider
        # Invariant: melange build environments pin the versioned toolchain
        # package (go-1.26, nodejs-26, rust-1.97), never the bare provider.
        # apk resolves a bare provider to the HIGHEST version, so `- go` changes
        # compiler the moment Wolfi publishes a new minor — no PR, no signal.
        # That is how go-1.27 landed mid-build on 2026-08-19 and took trivy (and
        # four scheduled runs) down. Same check as local
        # `make check-toolchain-pins`.
        run: make check-toolchain-pins

      # Upstream mirrors rate-limit; curl's default backoff loses that race and
      # turns a self-clearing 429 into a red main. Three in four days (kafka,
      # opensearch, flink) before this gate existed.
      - name: Check download retry backoff
        run: make check-curl-retries

      # Every image page's <meta name="description"> comes from catalog.json.
      # Without this an image can ship with no description (or a copy of another
      # image's), which is invisible to search and has to be retrofitted later.
      # Same check as local `make check-catalog-descriptions`.
      - name: Check catalog descriptions
        run: make check-catalog-descriptions

      - name: Assert docs match the catalog
        # The README's image count sat at 96 while the catalog grew to 100 —
        # badge, nav link and heading — because nothing compared them.
        run: make check-docs

      - name: Assert apk package invariants
        # Enforces what docs/onboarding.md previously only stated: no -minimal
        # suffix (it breaks both grype paths), catalog primary_package ==
        # melange package.name, and provider-priority: 100 wherever Wolfi ships
        # the same name. nats shipped under the NATS *CLI's* name while
        # catalog.json correctly said nats-server — nothing compared them.
        run: make check-packages

  #----------------------------------------------------------------------------
  # GENERATE EPHEMERAL SIGNING KEY (PRs only - secrets not available for forks)
  #----------------------------------------------------------------------------
  keygen:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Cache melange binary
        id: melange-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/go/bin/melange
          key: melange-0.41.1-${{ runner.arch }}

      - name: Install melange
        if: steps.melange-cache.outputs.cache-hit != 'true'
        run: go install chainguard.dev/melange@v0.41.1

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Generate ephemeral signing key
        run: |
          echo "Generating ephemeral key for PR build (not used for publishing)"
          melange keygen

      - name: Upload signing key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: melange-ephemeral-key
          path: |
            melange.rsa
            melange.rsa.pub
          retention-days: 1

  #----------------------------------------------------------------------------
  # BUILD MELANGE PACKAGES (native runners per architecture)
  #----------------------------------------------------------------------------
  melange-build:
    needs: [detect-changes, keygen]
    if: always() && needs.detect-changes.outputs.has-melange == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.melange-matrix) }}
      max-parallel: 20

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Cache melange binary
        id: melange-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/go/bin/melange
          key: melange-0.41.1-${{ runner.arch }}

      - name: Install melange
        if: steps.melange-cache.outputs.cache-hit != 'true'
        run: go install chainguard.dev/melange@v0.41.1

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # For PRs: download ephemeral key from keygen job
      - name: Download ephemeral signing key (PR)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: melange-ephemeral-key
          path: .

      # For push/schedule: use repository secret
      - name: Setup signing key (protected branch)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.MELANGE_SIGNING_KEY }}" > melange.rsa
          echo "${{ secrets.MELANGE_SIGNING_KEY_PUB }}" > melange.rsa.pub
          chmod 600 melange.rsa

      - name: Pin latest Go from Wolfi
        run: |
          # Skip for non-Go images (kafka, jenkins, qdrant, etc.)
          if ! grep -q '^\s*- go$' "${{ matrix.melange_config }}"; then
            echo "No bare 'go' package in config — skipping"
            exit 0
          fi
          # Resolve the latest go-1.XX package from Wolfi's APKINDEX
          # This ensures builds always use the latest patched Go, preventing
          # stale stdlib CVEs from Go's toolchain auto-download fetching .0 releases
          ARCH=${{ matrix.arch }}
          # --retry alone backs off from ~1s, so 5 attempts collapse into a ~30s
          # burst — a blip any longer than that takes the job down (flux x86_64,
          # main 2026-08-12, curl 22, while the same fetch succeeded on aarch64
          # in that very run). --retry-delay spreads the attempts over ~2min
          # instead; --max-time bounds a hung connection. -S so the HTTP status
          # reaches the log: -s alone swallowed it and left only the exit code.
          curl -sSfL --connect-timeout 10 --max-time 120 \
            --retry 5 --retry-delay 15 --retry-all-errors \
            "https://packages.wolfi.dev/os/${ARCH}/APKINDEX.tar.gz" -o /tmp/apkindex.tar.gz
          tar xzf /tmp/apkindex.tar.gz -C /tmp APKINDEX
          LATEST_GO=$(grep '^P:go-1\.' /tmp/APKINDEX \
            | grep -vE '(doc|asm|covdata|cover|nm|objdump|test2json)' \
            | sed 's/^P://' | sort -t. -k2 -n | tail -1)
          rm -f /tmp/apkindex.tar.gz /tmp/APKINDEX
          # An empty result would make the sed below rewrite `- go` to a bare
          # `- `, producing invalid YAML that fails much later with an opaque
          # melange error. The pipeline above cannot report this itself: it ends
          # in `tail`, which exits 0 on empty input, so set -e never trips.
          if [ -z "$LATEST_GO" ]; then
            echo "::error::no go-1.* package found in Wolfi's ${ARCH} APKINDEX"
            exit 1
          fi
          echo "Latest Go in Wolfi: $LATEST_GO"
          sed -i "s/- go$/- ${LATEST_GO}/" "${{ matrix.melange_config }}"
          echo "Go package in config:"
          grep -E '^\s*- go' "${{ matrix.melange_config }}" || true

      - name: Build package with melange
        run: |
          chmod 600 melange.rsa
          melange build ${{ matrix.melange_config }} \
            --arch ${{ matrix.arch }} \
            --signing-key melange.rsa \
            --out-dir ./packages \
            --runner docker

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            packages/
            melange.rsa.pub
          retention-days: 1

  #----------------------------------------------------------------------------
  # BUILD APKO-ONLY IMAGES (no melange dependency)
  #----------------------------------------------------------------------------
  build-apko:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has-apko == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.detect-changes.outputs.apko-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Cache apko binary
        id: apko-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/go/bin/apko
          key: apko-1.1.6-${{ runner.arch }}

      - name: Install apko
        if: steps.apko-cache.outputs.cache-hit != 'true'
        run: go install chainguard.dev/apko@v1.1.6

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # cosign-installer curls the release binary from github.com with no
      # --retry, so a single "Recv failure: Connection reset by peer" (curl 35)
      # kills the job before any build work happens (rails, main 2026-08-11).
      # It is a `uses:` step, so nick-fields/retry cannot wrap it — the retry
      # has to be a repeat of the step itself.
      - name: Setup cosign
        id: setup-cosign
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Setup cosign (retry)
        if: github.event_name != 'pull_request' && steps.setup-cosign.outcome == 'failure'
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # See the matching comment in build-melange: packages.wolfi.dev returns
      # intermittent 403s on APKINDEX.tar.gz and apko does not retry them.
      - name: Build image with apko
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            apko build ${{ matrix.apko_config }} \
              ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}${{ matrix.tag_suffix }} \
              ${{ matrix.name }}${{ matrix.tag_suffix }}.tar \
              --arch x86_64
            docker load < ${{ matrix.name }}${{ matrix.tag_suffix }}.tar
            LOADED_IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep "minimal-${{ matrix.name }}" | grep "${{ github.sha }}${{ matrix.tag_suffix }}" | head -1)
            docker tag "$LOADED_IMAGE" ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}${{ matrix.tag_suffix }}

      - name: Report image size
        run: |
          echo "## ${{ matrix.name }}${{ matrix.tag_suffix }} Image Size" >> $GITHUB_STEP_SUMMARY
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | \
            grep "minimal-${{ matrix.name }}" | grep "${{ github.sha }}${{ matrix.tag_suffix }}" >> $GITHUB_STEP_SUMMARY || true

      # CVE scan: prod variants only. Dev variants intentionally ship a larger
      # surface (shell, compilers, etc.) and are not tracked on the dashboard.
      - name: Cache Grype binary
        if: matrix.scan_for_cves
        id: grype-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/bin/grype
          key: grype-${{ env.GRYPE_VERSION }}-linux-amd64

      - name: Install Grype
        if: matrix.scan_for_cves && steps.grype-cache.outputs.cache-hit != 'true'
        run: |
          # Same retry-burst problem as the Wolfi APKINDEX fetch above: spread
          # the attempts out and bound a hung connection.
          curl -fL --connect-timeout 10 --max-time 300 \
            --retry 5 --retry-delay 15 --retry-all-errors -o /tmp/grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz"
          tar -tzf /tmp/grype.tar.gz > /dev/null
          tar -xzf /tmp/grype.tar.gz -C /usr/local/bin grype
          rm -f /tmp/grype.tar.gz

      - name: Verify Grype
        if: matrix.scan_for_cves
        run: grype version

      # Grype downloads its vulnerability DB on each scan. A connection reset
      # or 502 from the DB CDN used to fail the entire scheduled rebuild
      # (nginx scan, 2026-06-17: "connection reset by peer ... failed to load
      # vulnerability db"; cosign had the same class of flake the day prior).
      # Isolate the network fetch into a retried, best-effort `db update`
      # backed by a date-keyed cache, then scan offline (auto-update off):
      # a transient blip now retries, and a brief outage still scans from the
      # cached DB, instead of taking down the run for every image.
      - name: Grype DB cache key
        if: matrix.scan_for_cves
        id: grype-db-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Grype DB
        if: matrix.scan_for_cves
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ env.GRYPE_VERSION }}-${{ steps.grype-db-date.outputs.date }}
          restore-keys: |
            grype-db-${{ env.GRYPE_VERSION }}-

      - name: Update Grype DB (retried, best-effort)
        if: matrix.scan_for_cves
        continue-on-error: true
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 20
          command: grype db update

      - name: Scan image for vulnerabilities
        if: matrix.scan_for_cves
        env:
          GRYPE_DB_AUTO_UPDATE: "false"
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}"
          grype "$IMAGE" \
            -o json=grype-${{ matrix.name }}.json \
            -o sarif=grype-${{ matrix.name }}.sarif

      - name: Emit image metadata sidecar
        if: matrix.scan_for_cves
        run: |
          # Sidecar JSON consumed by tools/dashboard/build.sh — drives the
          # Size, Built-ago, raw vs VEX-effective CVE columns, and digest
          # on the published CVE dashboard.
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}"
          SIZE_BYTES=$(docker image inspect "$IMAGE" --format '{{.Size}}' 2>/dev/null || echo 0)
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' 2>/dev/null | sed 's|.*@||')
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          GRYPE_REPORT="grype-${{ matrix.name }}.json"
          VEX_FILE="vex/${{ matrix.name }}.openvex.json"
          [ -f "$VEX_FILE" ] || VEX_FILE=""

          # Suppressed CVE IDs: statements where status is not_affected | fixed.
          SUPPRESSED_JSON='[]'
          STMT_COUNT=0
          if [ -n "$VEX_FILE" ]; then
            STMT_COUNT=$(jq '.statements | length' "$VEX_FILE")
            SUPPRESSED_JSON=$(jq '[.statements[]
              | select(.status == "not_affected" or .status == "fixed")
              | .vulnerability.name] | unique' "$VEX_FILE")
          fi

          # Reconcile VEX against this fresh scan so suppressions can't silently
          # rot into false information. drift.stale = a suppressed CVE that's no
          # longer present; drift.now_fixable = a suppressed CVE that now has a
          # newer upstream fix (should be patched, not hidden). Surfaced in the
          # sidecar -> dashboard and warned in the job summary; non-blocking.
          VEX_DRIFT='{"stale":[],"now_fixable":[]}'
          if [ -n "$VEX_FILE" ] && [ -f "$GRYPE_REPORT" ]; then
            VEX_DRIFT=$(bash tools/vex/reconcile.sh --json "$GRYPE_REPORT" "$VEX_FILE" || true)
            [ -z "$VEX_DRIFT" ] && VEX_DRIFT='{"stale":[],"now_fixable":[]}'
            NSTALE=$(jq '.stale | length' <<<"$VEX_DRIFT")
            NFIX=$(jq '.now_fixable | length' <<<"$VEX_DRIFT")
            if [ "$NSTALE" -gt 0 ] || [ "$NFIX" -gt 0 ]; then
              echo "::warning title=VEX drift::${{ matrix.name }}: $NSTALE stale, $NFIX now-fixable VEX suppression(s) — see vex/${{ matrix.name }}.openvex.json"
            fi
          fi

          # Severity counts — raw straight from grype, effective drops any
          # match whose .vulnerability.id is in the suppressed set.
          #
          # `total` is the COUNT OF MATCHES, not the sum of the named buckets.
          # Grype emits a severity outside critical/high/medium/low for some
          # feeds — every Go advisory (GO-YYYY-NNNN) arrives as "Unknown"
          # because the Go vuln DB assigns no CVSS score. Summing four buckets
          # silently dropped those: helm reported 0 while carrying
          # GO-2026-5932 in golang.org/x/crypto. Counting matches directly
          # means a severity we do not enumerate can never vanish again.
          counts() {
            local report="$1" suppressed="$2"
            jq --argjson sup "$suppressed" '
              [ .matches[] | select((.vulnerability.id | IN($sup[])) | not) ] as $m
              | def sev_count(level):
                  [ $m[] | select(.vulnerability.severity | ascii_upcase == level) ] | length;
                {
                  critical:   sev_count("CRITICAL"),
                  high:       sev_count("HIGH"),
                  medium:     sev_count("MEDIUM"),
                  low:        sev_count("LOW"),
                  negligible: sev_count("NEGLIGIBLE"),
                  unknown:    sev_count("UNKNOWN")
                }
                | . + {total: ($m | length)}
            ' "$report"
          }

          if [ -f "$GRYPE_REPORT" ]; then
            RAW_COUNTS=$(counts "$GRYPE_REPORT" '[]')
            EFF_COUNTS=$(counts "$GRYPE_REPORT" "$SUPPRESSED_JSON")
          else
            RAW_COUNTS='{"critical":0,"high":0,"medium":0,"low":0,"negligible":0,"unknown":0,"total":0}'
            EFF_COUNTS="$RAW_COUNTS"
          fi

          # Provenance split. Our images declare Wolfi provenance, so grype
          # matches OUR OWN package names against Wolfi/Chainguard's advisory
          # feed and compares our -r0 against their -rN rebuild counter. Those
          # counters belong to different distros and are not comparable; on
          # 2026-08-24 that produced 341 findings not present in any image.
          # The script separates them on evidence and never hides a finding
          # whose fix needs a newer upstream version. See the script header.
          PROVENANCE='{}'
          if [ -f "$GRYPE_REPORT" ]; then
            # Never fail the build over a reporting step. If reconciliation
            # breaks we fall back to an empty provenance block, which makes
            # every consumer report the RAW counts — over-reporting, not
            # under-reporting. Loud warning, safe direction.
            if ! PROVENANCE=$(bash .github/scripts/reconcile-apk-provenance.sh "$GRYPE_REPORT" . ); then
              echo "::warning title=Provenance::${{ matrix.name }}: reconciliation failed; falling back to raw counts"
              PROVENANCE='{}'
            fi

            # needs_review = our own package, no corroboration in the contents,
            # but the fix requires a newer UPSTREAM version. Either we are
            # genuinely stale or the distro has forked the project. Never
            # auto-excluded, so surface it where someone will see it.
            NREVIEW=$(jq '.needs_review | length' <<<"$PROVENANCE")
            if [ "${NREVIEW:-0}" -gt 0 ]; then
              echo "::warning title=Provenance review::${{ matrix.name }}: $NREVIEW advisory(ies) claim a fix in a newer upstream version — we may be stale, or upstream may have been forked"
            fi
          fi

          jq -n \
            --arg name "${{ matrix.name }}" \
            --argjson size "${SIZE_BYTES:-0}" \
            --arg built_at "$BUILT_AT" \
            --arg digest "$DIGEST" \
            --arg image_ref "$IMAGE" \
            --argjson raw "$RAW_COUNTS" \
            --argjson effective "$EFF_COUNTS" \
            --argjson suppressed "$SUPPRESSED_JSON" \
            --argjson statements "$STMT_COUNT" \
            --argjson drift "$VEX_DRIFT" \
            --argjson provenance "$PROVENANCE" \
            '{
              name: $name,
              size_bytes: $size,
              built_at: $built_at,
              digest: $digest,
              image_ref: $image_ref,
              raw: $raw,
              effective: $effective,
              vex: { statements: $statements, suppressed: $suppressed, drift: $drift },
              provenance: $provenance
            }' \
            > meta-${{ matrix.name }}.json
          cat meta-${{ matrix.name }}.json

      - name: Generate vulnerability report
        if: always() && matrix.scan_for_cves
        run: |
          REPORT="grype-${{ matrix.name }}.json"
          if [ ! -f "$REPORT" ]; then
            echo "## Security Scan: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
            echo "Scan report not found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Count vulnerabilities by severity (grype uses Title Case severity).
          # TOTAL is the match count, not the sum of the named buckets — Go
          # advisories (GO-YYYY-NNNN) carry no CVSS score and arrive as
          # "Unknown", so summing four buckets under-reports them to zero.
          CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "CRITICAL")] | length' "$REPORT")
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "HIGH")] | length' "$REPORT")
          MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "MEDIUM")] | length' "$REPORT")
          LOW=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "LOW")] | length' "$REPORT")
          NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "NEGLIGIBLE")] | length' "$REPORT")
          UNKNOWN=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "UNKNOWN")] | length' "$REPORT")
          TOTAL=$(jq '.matches | length' "$REPORT")

          # Header
          echo "## Security Scan: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan date:** $(date -u +%Y-%m-%d) | **Image:** minimal-${{ matrix.name }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Summary table
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| HIGH | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| MEDIUM | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| LOW | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "| NEGLIGIBLE | $NEGLIGIBLE |" >> $GITHUB_STEP_SUMMARY
          echo "| UNKNOWN | $UNKNOWN |" >> $GITHUB_STEP_SUMMARY
          echo "| **TOTAL** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -eq 0 ]; then
            echo "No vulnerabilities found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Detailed table for CRITICAL and HIGH
          if [ "$((CRITICAL + HIGH))" -gt 0 ]; then
            echo "### CRITICAL / HIGH Vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Library | CVE | Severity | Installed | Fixed | Title |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----|----------|-----------|-------|-------|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              [.matches[] | select(.vulnerability.severity | ascii_upcase | (. == "CRITICAL" or . == "HIGH"))]
              | sort_by(if .vulnerability.severity | ascii_upcase == "CRITICAL" then 0 else 1 end)
              | .[]
              | "| \(.artifact.name) | \(.vulnerability.id) | \(.vulnerability.severity | ascii_upcase) | \(.artifact.version) | \(.vulnerability.fix.versions[0] // "n/a") | \(.vulnerability.description // "n/a" | .[0:80]) |"
            ' "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "No CRITICAL or HIGH vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

          # Unscored advisories. These carry no CVSS severity (the Go vuln DB
          # assigns none), so they never appear in the CRITICAL/HIGH table
          # above. List them explicitly or they are reported as a bare count
          # with no way to tell what they are.
          if [ "$UNKNOWN" -gt 0 ]; then
            echo "### Unscored advisories (no CVSS severity)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Library | Advisory | Installed | Fixed |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|----------|-----------|-------|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              [.matches[] | select(.vulnerability.severity | ascii_upcase == "UNKNOWN")]
              | sort_by(.artifact.name, .vulnerability.id)
              | .[]
              | "| \(.artifact.name) | \(.vulnerability.id) | \(.artifact.version) | \((.vulnerability.fix.versions // [])[0] // "none") |"
            ' "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload vulnerability report
        if: always() && matrix.scan_for_cves
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerability-report-${{ matrix.name }}
          path: |
            grype-${{ matrix.name }}.json
            meta-${{ matrix.name }}.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@66b39da20ccc656acc90dd27ea30f5d458ec33ce # v3.28.19
        if: always() && matrix.scan_for_cves && hashFiles(format('grype-{0}.sarif', matrix.name)) != ''
        continue-on-error: true
        with:
          sarif_file: 'grype-${{ matrix.name }}.sarif'
          category: 'grype-${{ matrix.name }}'

      - name: Extract version from SBOM
        id: version
        run: |
          # Read primary package name from apko config (source of truth).
          # Dev variants resolve their own SBOM but the primary package
          # version matches prod (same upstream binary).
          # Restrict to actual package list entries (apko yaml indented `- pkg`)
          # so header comments mentioning a related package name don't false-match.
          PRIMARY_PKG=$(grep -oE '^[[:space:]]+-[[:space:]]+${{ matrix.primary_grep }}[a-z0-9.\-]*' ${{ matrix.apko_config }} | grep -oE '${{ matrix.primary_grep }}[a-z0-9.\-]*' | head -1)
          if [ -z "$PRIMARY_PKG" ]; then
            echo "::error::Failed to extract primary package from ${{ matrix.apko_config }} using pattern '${{ matrix.primary_grep }}'"
            exit 1
          fi
          VERSION=$(jq -r --arg pkg "$PRIMARY_PKG" '.packages[] | select(.name == $pkg) | .versionInfo' sbom-x86_64.spdx.json | head -1)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to extract version for $PRIMARY_PKG from SBOM"
            exit 1
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Primary package: $PRIMARY_PKG, version: $VERSION"
          # Also clear any attestation markers so the attest step's
          # idempotence guard starts from a clean slate for this publish.
          rm -f sbom-*.spdx.json .attested-sbom-*.spdx.json

      - name: Test image
        run: |
          export IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}${{ matrix.tag_suffix }}"
          bash ./${{ matrix.test_script }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        id: publish
        run: |
          # Retry apko publish: ghcr.io intermittently returns BLOB_UNKNOWN
          # when the index manifest references a blob the registry hasn't
          # finished receiving yet. Three attempts with 15s backoff.
          PUBLISH_OUT=apko-publish.out
          # Immutable per-build dated tag (YYYYMMDD) so every rebuild is preserved
          # as version history — the plain :<version> tag moves on same-version
          # rebuilds. Daily granularity; retention is bounded by cleanup-packages.yml.
          DATE_TAG=$(date -u +%Y%m%d)
          # Rolling major/minor tags (:3, :3.21) so consumers can track a line
          # instead of choosing between :latest (breaks on a major bump) and an
          # exact patch (frozen, including security fixes). Same digest.
          # shellcheck source=.github/scripts/version-ladder.sh
          . ./.github/scripts/version-ladder.sh
          IMAGE_REF="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}"
          VER="${{ steps.version.outputs.tag }}"
          SUF="${{ matrix.tag_suffix }}"

          TAGS=(
            "${IMAGE_REF}:${VER}${SUF}"
            "${IMAGE_REF}:${VER}-${DATE_TAG}${SUF}"
            "${IMAGE_REF}:${{ matrix.latest_tag }}"
          )
          for L in $(derive_version_ladder "$VER"); do
            TAGS+=("${IMAGE_REF}:${L}${SUF}")
          done
          echo "Publishing tags: ${TAGS[*]}"

          for attempt in 1 2 3; do
            if apko publish ${{ matrix.apko_config }} \
                "${TAGS[@]}" \
                --arch x86_64,aarch64 \
                --sbom-path . \
                > "$PUBLISH_OUT" 2>&1; then
              cat "$PUBLISH_OUT"
              break
            fi
            echo "::warning::apko publish attempt $attempt/3 failed"
            cat "$PUBLISH_OUT"
            if [ $attempt -eq 3 ]; then
              echo "::error::apko publish failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done
          # apko prints "ref@digest" on the last line
          DIGEST=$(grep -oE 'sha256:[a-f0-9]{64}' "$PUBLISH_OUT" | tail -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::Failed to parse image digest from apko publish output"
            cat "$PUBLISH_OUT"
            exit 1
          fi
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}@${DIGEST}" >> $GITHUB_OUTPUT

      - name: Sign image with cosign
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 5
          max_attempts: 3
          # Same Sigstore flakiness as the SBOM attest step below.
          retry_wait_seconds: 60
          command: |
            # Rekor answers a re-POST of an identical entry with HTTP 409
            # createLogEntryConflict, and cosign surfaces that as exit 1. But 409
            # means the signature IS in the transparency log — the desired end
            # state. Left untreated it makes this step non-idempotent: any blip
            # that lands the entry then drops the connection guarantees every
            # remaining attempt "fails" on the conflict (jenkins, main
            # 2026-08-06). Treat it as success so the retry can converge.
            OUT=$(cosign sign --yes "${{ steps.publish.outputs.image }}" 2>&1); RC=$?
            echo "$OUT"
            if [ "$RC" -ne 0 ] && echo "$OUT" | grep -q 'createLogEntryConflict'; then
              echo "note: rekor already holds an equivalent entry — signature is recorded, treating as success"
              RC=0
            fi
            exit "$RC"

      - name: Attach SBOM attestation
        if: github.event_name != 'pull_request' && steps.publish.outputs.digest != ''
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 5
          max_attempts: 3
          # Sigstore (fulcio/timestamp/rekor) resets connections under load;
          # the default 10s gap burned all 3 attempts in ~30s and failed the
          # whole scheduled build (conftest-dev, 2026-07-29). Back off properly.
          retry_wait_seconds: 60
          command: |
            # apko --sbom-path . writes per-arch + index SBOMs to the working directory during publish
            #
            # This loop must be idempotent across attempts. It attests three
            # SBOMs; if the third hits a transient rekor error, a naive retry
            # re-attests all three and the first two now come back 409
            # createLogEntryConflict — so the step could never go green again
            # (deno, main 2026-08-06: 3 attempts, all lost to conflicts on
            # SBOMs that had already succeeded). Two guards: skip SBOMs already
            # attested in an earlier attempt, and treat 409 as success.
            FOUND=0
            FAILED=0
            for SBOM in sbom-x86_64.spdx.json sbom-aarch64.spdx.json sbom-index.spdx.json; do
              [ -f "$SBOM" ] || continue
              FOUND=$((FOUND + 1))
              if [ -f ".attested-${SBOM}" ]; then
                echo "skipping ${SBOM}: already attested in an earlier attempt"
                continue
              fi
              OUT=$(cosign attest --yes --type spdxjson \
                --predicate "$SBOM" \
                "${{ steps.publish.outputs.image }}" 2>&1); RC=$?
              echo "$OUT"
              if [ "$RC" -ne 0 ] && echo "$OUT" | grep -q 'createLogEntryConflict'; then
                # Unlike `cosign sign`, a rekor 409 here does NOT imply the
                # desired end state: cosign aborts at the tlog step *before*
                # pushing the attestation to the registry. Blanket-treating it
                # as success published a green build whose spdxjson attestation
                # was absent from GHCR, and the verify step then burned all 5
                # attempts on a condition no retry can fix (postgres-slim, main
                # 2026-08-11). Probe the registry and only accept the conflict
                # if the attestation is actually there; otherwise leave RC
                # non-zero so the retry re-attests.
                if cosign verify-attestation --type spdxjson \
                     --certificate-identity-regexp='https://github.com/rtvkiz/minimal/' \
                     --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
                     "${{ steps.publish.outputs.image }}" > /dev/null 2>&1; then
                  echo "note: rekor conflict for ${SBOM}, attestation is present in the registry — treating as success"
                  RC=0
                else
                  echo "::warning::rekor conflict for ${SBOM} but no spdxjson attestation in the registry — will retry"
                fi
              fi
              if [ "$RC" -eq 0 ]; then
                touch ".attested-${SBOM}"
              else
                echo "::warning::attestation for ${SBOM} failed (will retry)"
                FAILED=1
              fi
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "::error::No SBOM files found to attest"
              ls -la sbom-*.spdx.json 2>&1 || true
              exit 1
            fi
            exit "$FAILED"

      # This action talks to both GHCR and rekor, and fails intermittently on
      # each: "OCIError: Error uploading artifact to container registry"
      # (mariadb, velero) and "InternalError: error fetching tlog entry"
      # (osv-scanner, kubeconform) — all on main, 2026-08-10. Every other
      # sigstore step here is already wrapped in nick-fields/retry; this one
      # was the last bare `uses:` and was the single largest source of red
      # scheduled builds. Same repeat-the-step pattern as Setup cosign, with a
      # backoff in between since the failures are load-related.
      - name: Generate SLSA build provenance
        id: slsa-provenance
        if: github.event_name != 'pull_request' && steps.publish.outputs.digest != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Back off before provenance retry
        if: github.event_name != 'pull_request' && steps.slsa-provenance.outcome == 'failure'
        run: |
          # Jittered, not fixed. A large run fires 80+ attestations at once and
          # trips the installation rate limit; a constant 60s meant every job
          # then retried in the same instant against the same limit, so the
          # retry was guaranteed to fail with it. This is the same burst bug as
          # the curl --retry fix above. Spread over 1-6min instead.
          sleep $(( (RANDOM % 300) + 60 ))

      - name: Generate SLSA build provenance (retry)
        id: slsa-retry
        continue-on-error: true
        if: github.event_name != 'pull_request' && steps.slsa-provenance.outcome == 'failure'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Back off before final provenance attempt
        if: github.event_name != 'pull_request' && steps.slsa-retry.outcome == 'failure'
        run: sleep $(( (RANDOM % 600) + 300 ))

      - name: Generate SLSA build provenance (final)
        if: github.event_name != 'pull_request' && steps.slsa-retry.outcome == 'failure'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      # Sign/attest publish their results to GHCR + Rekor asynchronously;
      # verification can race the propagation and report "no signatures found"
      # for ~30–60s even though the sign step succeeded. nick-fields/retry
      # rides out the GHCR/sigstore eventual-consistency gap (httpd hit this
      # in scheduled run #27342089679). It also covers transient sigstore TUF
      # CDN outages: cosign fetches its trusted root from
      # tuf-repo-cdn.sigstore.dev, and an i/o timeout there fails verify with
      # "trusted root is required" (loki, scheduled run 2026-06-21). 5 attempts
      # with 30s backoff widens the window enough to ride out a brief TUF blip.
      - name: Verify attestations are discoverable
        if: github.event_name != 'pull_request' && steps.publish.outputs.digest != ''
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            set -e
            IMAGE="${{ steps.publish.outputs.image }}"
            echo "Verifying cosign signature..."
            cosign verify \
              --certificate-identity-regexp='https://github.com/rtvkiz/minimal/' \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              "$IMAGE" > /dev/null
            echo "Verifying SBOM attestation..."
            cosign verify-attestation --type spdxjson \
              --certificate-identity-regexp='https://github.com/rtvkiz/minimal/' \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              "$IMAGE" > /dev/null
            echo "Verifying SLSA provenance..."
            gh attestation verify "oci://$IMAGE" --owner ${{ github.repository_owner }} > /dev/null
            echo "All attestations verified."

      # Rename the per-arch SBOM apko wrote during publish to a stable,
      # per-image name that the catalog site's data builder
      # (site/scripts/build-data.mjs) consumes for the Packages tab. Prod only
      # (matches grype/meta). Non-fatal if absent.
      - name: Save SBOM sidecar for catalog site
        if: always() && matrix.scan_for_cves && github.event_name != 'pull_request'
        run: |
          for S in sbom-x86_64.spdx.json sbom-aarch64.spdx.json sbom-index.spdx.json; do
            if [ -f "$S" ]; then
              cp "$S" "sbom-${{ matrix.name }}.spdx.json"
              echo "Saved catalog SBOM from $S"
              break
            fi
          done

      - name: Upload SBOM sidecar for catalog site
        if: always() && matrix.scan_for_cves && github.event_name != 'pull_request' && hashFiles(format('sbom-{0}.spdx.json', matrix.name)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          retention-days: 90
          if-no-files-found: ignore

  #----------------------------------------------------------------------------
  # BUILD MELANGE-BASED IMAGES (needs packages from melange-build)
  #----------------------------------------------------------------------------
  build-melange:
    needs: [detect-changes, melange-build]
    # Run even if some melange-build entries failed — individual images whose
    # packages failed will error at artifact download, not cascade to others
    if: always() && needs.detect-changes.outputs.has-build-melange == 'true' && needs.melange-build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write

    strategy:
      max-parallel: 20
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.build-melange-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Cache apko binary
        id: apko-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/go/bin/apko
          key: apko-1.1.6-${{ runner.arch }}

      - name: Install apko
        if: steps.apko-cache.outputs.cache-hit != 'true'
        run: go install chainguard.dev/apko@v1.1.6

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      # cosign-installer curls the release binary from github.com with no
      # --retry, so a single "Recv failure: Connection reset by peer" (curl 35)
      # kills the job before any build work happens (rails, main 2026-08-11).
      # It is a `uses:` step, so nick-fields/retry cannot wrap it — the retry
      # has to be a repeat of the step itself.
      - name: Setup cosign
        id: setup-cosign
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Setup cosign (retry)
        if: github.event_name != 'pull_request' && steps.setup-cosign.outcome == 'failure'
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Download x86_64 packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-${{ matrix.name }}-x86_64
          path: ./packages-x86_64

      - name: Download aarch64 packages
        if: contains(matrix.arches, 'aarch64')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-${{ matrix.name }}-aarch64
          path: ./packages-aarch64

      - name: Merge packages
        run: |
          mkdir -p ./packages
          # Copy x86_64 packages
          cp -r ./packages-x86_64/packages/* ./packages/ 2>/dev/null || true
          # Copy aarch64 packages (merge into same structure)
          cp -r ./packages-aarch64/packages/* ./packages/ 2>/dev/null || true
          # Use signing key from either (they're the same content, different builds)
          cp ./packages-x86_64/melange.rsa.pub ./melange.rsa.pub

          echo "Merged package structure:"
          find ./packages -type f -name "*.apk" | head -20

      # For push/schedule: overwrite with repository public key (for publishing)
      - name: Setup signing key (protected branch)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.MELANGE_SIGNING_KEY_PUB }}" > melange.rsa.pub

      # packages.wolfi.dev intermittently answers APKINDEX.tar.gz with 403 under
      # load, and apko has no internal retry for index fetches — a single 403
      # failed opa-dev outright on the scheduled main build (2026-08-06). Every
      # other network-touching step here is already wrapped; this one was the
      # gap.
      - name: Build image with apko
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            apko build ${{ matrix.apko_config }} \
              ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}${{ matrix.tag_suffix }} \
              ${{ matrix.name }}${{ matrix.tag_suffix }}.tar \
              --arch x86_64 \
              --repository-append ./packages \
              --keyring-append ./melange.rsa.pub
            docker load < ${{ matrix.name }}${{ matrix.tag_suffix }}.tar
            LOADED_IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep "minimal-${{ matrix.name }}" | grep "${{ github.sha }}${{ matrix.tag_suffix }}" | head -1)
            docker tag "$LOADED_IMAGE" ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}${{ matrix.tag_suffix }}

      - name: Report image size
        run: |
          echo "## ${{ matrix.name }}${{ matrix.tag_suffix }} Image Size" >> $GITHUB_STEP_SUMMARY
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | \
            grep "minimal-${{ matrix.name }}" | grep "${{ github.sha }}${{ matrix.tag_suffix }}" >> $GITHUB_STEP_SUMMARY || true

      # CVE scan: prod variants only. Dev variants intentionally ship a larger
      # surface (shell, compilers, etc.) and are not tracked on the dashboard.
      - name: Cache Grype binary
        if: matrix.scan_for_cves
        id: grype-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/bin/grype
          key: grype-${{ env.GRYPE_VERSION }}-linux-amd64

      - name: Install Grype
        if: matrix.scan_for_cves && steps.grype-cache.outputs.cache-hit != 'true'
        run: |
          # Same retry-burst problem as the Wolfi APKINDEX fetch above: spread
          # the attempts out and bound a hung connection.
          curl -fL --connect-timeout 10 --max-time 300 \
            --retry 5 --retry-delay 15 --retry-all-errors -o /tmp/grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz"
          tar -tzf /tmp/grype.tar.gz > /dev/null
          tar -xzf /tmp/grype.tar.gz -C /usr/local/bin grype
          rm -f /tmp/grype.tar.gz

      - name: Verify Grype
        if: matrix.scan_for_cves
        run: grype version

      # Grype downloads its vulnerability DB on each scan. A connection reset
      # or 502 from the DB CDN used to fail the entire scheduled rebuild
      # (nginx scan, 2026-06-17: "connection reset by peer ... failed to load
      # vulnerability db"; cosign had the same class of flake the day prior).
      # Isolate the network fetch into a retried, best-effort `db update`
      # backed by a date-keyed cache, then scan offline (auto-update off):
      # a transient blip now retries, and a brief outage still scans from the
      # cached DB, instead of taking down the run for every image.
      - name: Grype DB cache key
        if: matrix.scan_for_cves
        id: grype-db-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Grype DB
        if: matrix.scan_for_cves
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ env.GRYPE_VERSION }}-${{ steps.grype-db-date.outputs.date }}
          restore-keys: |
            grype-db-${{ env.GRYPE_VERSION }}-

      - name: Update Grype DB (retried, best-effort)
        if: matrix.scan_for_cves
        continue-on-error: true
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 20
          command: grype db update

      - name: Scan image for vulnerabilities
        if: matrix.scan_for_cves
        env:
          GRYPE_DB_AUTO_UPDATE: "false"
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}"
          grype "$IMAGE" \
            -o json=grype-${{ matrix.name }}.json \
            -o sarif=grype-${{ matrix.name }}.sarif

      - name: Emit image metadata sidecar
        if: matrix.scan_for_cves
        run: |
          # Sidecar JSON consumed by tools/dashboard/build.sh — drives the
          # Size, Built-ago, raw vs VEX-effective CVE columns, and digest
          # on the published CVE dashboard.
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}"
          SIZE_BYTES=$(docker image inspect "$IMAGE" --format '{{.Size}}' 2>/dev/null || echo 0)
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' 2>/dev/null | sed 's|.*@||')
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          GRYPE_REPORT="grype-${{ matrix.name }}.json"
          VEX_FILE="vex/${{ matrix.name }}.openvex.json"
          [ -f "$VEX_FILE" ] || VEX_FILE=""

          # Suppressed CVE IDs: statements where status is not_affected | fixed.
          SUPPRESSED_JSON='[]'
          STMT_COUNT=0
          if [ -n "$VEX_FILE" ]; then
            STMT_COUNT=$(jq '.statements | length' "$VEX_FILE")
            SUPPRESSED_JSON=$(jq '[.statements[]
              | select(.status == "not_affected" or .status == "fixed")
              | .vulnerability.name] | unique' "$VEX_FILE")
          fi

          # Reconcile VEX against this fresh scan so suppressions can't silently
          # rot into false information. drift.stale = a suppressed CVE that's no
          # longer present; drift.now_fixable = a suppressed CVE that now has a
          # newer upstream fix (should be patched, not hidden). Surfaced in the
          # sidecar -> dashboard and warned in the job summary; non-blocking.
          VEX_DRIFT='{"stale":[],"now_fixable":[]}'
          if [ -n "$VEX_FILE" ] && [ -f "$GRYPE_REPORT" ]; then
            VEX_DRIFT=$(bash tools/vex/reconcile.sh --json "$GRYPE_REPORT" "$VEX_FILE" || true)
            [ -z "$VEX_DRIFT" ] && VEX_DRIFT='{"stale":[],"now_fixable":[]}'
            NSTALE=$(jq '.stale | length' <<<"$VEX_DRIFT")
            NFIX=$(jq '.now_fixable | length' <<<"$VEX_DRIFT")
            if [ "$NSTALE" -gt 0 ] || [ "$NFIX" -gt 0 ]; then
              echo "::warning title=VEX drift::${{ matrix.name }}: $NSTALE stale, $NFIX now-fixable VEX suppression(s) — see vex/${{ matrix.name }}.openvex.json"
            fi
          fi

          # Severity counts — raw straight from grype, effective drops any
          # match whose .vulnerability.id is in the suppressed set.
          #
          # `total` is the COUNT OF MATCHES, not the sum of the named buckets.
          # Grype emits a severity outside critical/high/medium/low for some
          # feeds — every Go advisory (GO-YYYY-NNNN) arrives as "Unknown"
          # because the Go vuln DB assigns no CVSS score. Summing four buckets
          # silently dropped those: helm reported 0 while carrying
          # GO-2026-5932 in golang.org/x/crypto. Counting matches directly
          # means a severity we do not enumerate can never vanish again.
          counts() {
            local report="$1" suppressed="$2"
            jq --argjson sup "$suppressed" '
              [ .matches[] | select((.vulnerability.id | IN($sup[])) | not) ] as $m
              | def sev_count(level):
                  [ $m[] | select(.vulnerability.severity | ascii_upcase == level) ] | length;
                {
                  critical:   sev_count("CRITICAL"),
                  high:       sev_count("HIGH"),
                  medium:     sev_count("MEDIUM"),
                  low:        sev_count("LOW"),
                  negligible: sev_count("NEGLIGIBLE"),
                  unknown:    sev_count("UNKNOWN")
                }
                | . + {total: ($m | length)}
            ' "$report"
          }

          if [ -f "$GRYPE_REPORT" ]; then
            RAW_COUNTS=$(counts "$GRYPE_REPORT" '[]')
            EFF_COUNTS=$(counts "$GRYPE_REPORT" "$SUPPRESSED_JSON")
          else
            RAW_COUNTS='{"critical":0,"high":0,"medium":0,"low":0,"negligible":0,"unknown":0,"total":0}'
            EFF_COUNTS="$RAW_COUNTS"
          fi

          # Provenance split. Our images declare Wolfi provenance, so grype
          # matches OUR OWN package names against Wolfi/Chainguard's advisory
          # feed and compares our -r0 against their -rN rebuild counter. Those
          # counters belong to different distros and are not comparable; on
          # 2026-08-24 that produced 341 findings not present in any image.
          # The script separates them on evidence and never hides a finding
          # whose fix needs a newer upstream version. See the script header.
          PROVENANCE='{}'
          if [ -f "$GRYPE_REPORT" ]; then
            # Never fail the build over a reporting step. If reconciliation
            # breaks we fall back to an empty provenance block, which makes
            # every consumer report the RAW counts — over-reporting, not
            # under-reporting. Loud warning, safe direction.
            if ! PROVENANCE=$(bash .github/scripts/reconcile-apk-provenance.sh "$GRYPE_REPORT" . ); then
              echo "::warning title=Provenance::${{ matrix.name }}: reconciliation failed; falling back to raw counts"
              PROVENANCE='{}'
            fi

            # needs_review = our own package, no corroboration in the contents,
            # but the fix requires a newer UPSTREAM version. Either we are
            # genuinely stale or the distro has forked the project. Never
            # auto-excluded, so surface it where someone will see it.
            NREVIEW=$(jq '.needs_review | length' <<<"$PROVENANCE")
            if [ "${NREVIEW:-0}" -gt 0 ]; then
              echo "::warning title=Provenance review::${{ matrix.name }}: $NREVIEW advisory(ies) claim a fix in a newer upstream version — we may be stale, or upstream may have been forked"
            fi
          fi

          jq -n \
            --arg name "${{ matrix.name }}" \
            --argjson size "${SIZE_BYTES:-0}" \
            --arg built_at "$BUILT_AT" \
            --arg digest "$DIGEST" \
            --arg image_ref "$IMAGE" \
            --argjson raw "$RAW_COUNTS" \
            --argjson effective "$EFF_COUNTS" \
            --argjson suppressed "$SUPPRESSED_JSON" \
            --argjson statements "$STMT_COUNT" \
            --argjson drift "$VEX_DRIFT" \
            --argjson provenance "$PROVENANCE" \
            '{
              name: $name,
              size_bytes: $size,
              built_at: $built_at,
              digest: $digest,
              image_ref: $image_ref,
              raw: $raw,
              effective: $effective,
              vex: { statements: $statements, suppressed: $suppressed, drift: $drift },
              provenance: $provenance
            }' \
            > meta-${{ matrix.name }}.json
          cat meta-${{ matrix.name }}.json

      - name: Generate vulnerability report
        if: always() && matrix.scan_for_cves
        run: |
          REPORT="grype-${{ matrix.name }}.json"
          if [ ! -f "$REPORT" ]; then
            echo "## Security Scan: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
            echo "Scan report not found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Count vulnerabilities by severity (grype uses Title Case severity).
          # TOTAL is the match count, not the sum of the named buckets — Go
          # advisories (GO-YYYY-NNNN) carry no CVSS score and arrive as
          # "Unknown", so summing four buckets under-reports them to zero.
          CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "CRITICAL")] | length' "$REPORT")
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "HIGH")] | length' "$REPORT")
          MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "MEDIUM")] | length' "$REPORT")
          LOW=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "LOW")] | length' "$REPORT")
          NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "NEGLIGIBLE")] | length' "$REPORT")
          UNKNOWN=$(jq '[.matches[] | select(.vulnerability.severity | ascii_upcase == "UNKNOWN")] | length' "$REPORT")
          TOTAL=$(jq '.matches | length' "$REPORT")

          # Header
          echo "## Security Scan: ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan date:** $(date -u +%Y-%m-%d) | **Image:** minimal-${{ matrix.name }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Summary table
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| HIGH | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| MEDIUM | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| LOW | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "| NEGLIGIBLE | $NEGLIGIBLE |" >> $GITHUB_STEP_SUMMARY
          echo "| UNKNOWN | $UNKNOWN |" >> $GITHUB_STEP_SUMMARY
          echo "| **TOTAL** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -eq 0 ]; then
            echo "No vulnerabilities found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Detailed table for CRITICAL and HIGH
          if [ "$((CRITICAL + HIGH))" -gt 0 ]; then
            echo "### CRITICAL / HIGH Vulnerabilities" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Library | CVE | Severity | Installed | Fixed | Title |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----|----------|-----------|-------|-------|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              [.matches[] | select(.vulnerability.severity | ascii_upcase | (. == "CRITICAL" or . == "HIGH"))]
              | sort_by(if .vulnerability.severity | ascii_upcase == "CRITICAL" then 0 else 1 end)
              | .[]
              | "| \(.artifact.name) | \(.vulnerability.id) | \(.vulnerability.severity | ascii_upcase) | \(.artifact.version) | \(.vulnerability.fix.versions[0] // "n/a") | \(.vulnerability.description // "n/a" | .[0:80]) |"
            ' "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "No CRITICAL or HIGH vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

          # Unscored advisories. These carry no CVSS severity (the Go vuln DB
          # assigns none), so they never appear in the CRITICAL/HIGH table
          # above. List them explicitly or they are reported as a bare count
          # with no way to tell what they are.
          if [ "$UNKNOWN" -gt 0 ]; then
            echo "### Unscored advisories (no CVSS severity)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Library | Advisory | Installed | Fixed |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|----------|-----------|-------|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              [.matches[] | select(.vulnerability.severity | ascii_upcase == "UNKNOWN")]
              | sort_by(.artifact.name, .vulnerability.id)
              | .[]
              | "| \(.artifact.name) | \(.vulnerability.id) | \(.artifact.version) | \((.vulnerability.fix.versions // [])[0] // "none") |"
            ' "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload vulnerability report
        if: always() && matrix.scan_for_cves
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerability-report-${{ matrix.name }}
          path: |
            grype-${{ matrix.name }}.json
            meta-${{ matrix.name }}.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@66b39da20ccc656acc90dd27ea30f5d458ec33ce # v3.28.19
        if: always() && matrix.scan_for_cves && hashFiles(format('grype-{0}.sarif', matrix.name)) != ''
        continue-on-error: true
        with:
          sarif_file: 'grype-${{ matrix.name }}.sarif'
          category: 'grype-${{ matrix.name }}'

      - name: Extract version from melange config
        id: version
        run: |
          PKG_VERSION=$(awk '/^  version:/ {print $2}' "${{ matrix.melange_config }}")
          PKG_EPOCH=$(awk '/^  epoch:/ {print $2}' "${{ matrix.melange_config }}")
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Failed to extract version from ${{ matrix.melange_config }}"
            exit 1
          fi
          echo "tag=${PKG_VERSION}-r${PKG_EPOCH}" >> $GITHUB_OUTPUT
          echo "Image version: ${PKG_VERSION}-r${PKG_EPOCH}"

      - name: Test image
        run: |
          export IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}:${{ github.sha }}${{ matrix.tag_suffix }}"
          bash ./${{ matrix.test_script }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        id: publish
        run: |
          # Retry apko publish: ghcr.io intermittently returns BLOB_UNKNOWN
          # when the index manifest references a blob the registry hasn't
          # finished receiving yet. Three attempts with 15s backoff.
          PUBLISH_OUT=apko-publish.out
          # Immutable per-build dated tag (YYYYMMDD) so every rebuild is preserved
          # as version history — the plain :<version> tag moves on same-version
          # rebuilds. Daily granularity; retention is bounded by cleanup-packages.yml.
          DATE_TAG=$(date -u +%Y%m%d)
          # Rolling major/minor tags — see the matching comment in build-apko.
          # shellcheck source=.github/scripts/version-ladder.sh
          . ./.github/scripts/version-ladder.sh
          IMAGE_REF="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}"
          VER="${{ steps.version.outputs.tag }}"
          SUF="${{ matrix.tag_suffix }}"

          TAGS=(
            "${IMAGE_REF}:${VER}${SUF}"
            "${IMAGE_REF}:${VER}-${DATE_TAG}${SUF}"
            "${IMAGE_REF}:${{ matrix.latest_tag }}"
          )
          for L in $(derive_version_ladder "$VER"); do
            TAGS+=("${IMAGE_REF}:${L}${SUF}")
          done
          echo "Publishing tags: ${TAGS[*]}"

          for attempt in 1 2 3; do
            if apko publish ${{ matrix.apko_config }} \
                "${TAGS[@]}" \
                --arch ${{ matrix.arches }} \
                --repository-append ./packages \
                --keyring-append ./melange.rsa.pub \
                --sbom-path . \
                > "$PUBLISH_OUT" 2>&1; then
              cat "$PUBLISH_OUT"
              break
            fi
            echo "::warning::apko publish attempt $attempt/3 failed"
            cat "$PUBLISH_OUT"
            if [ $attempt -eq 3 ]; then
              echo "::error::apko publish failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done
          DIGEST=$(grep -oE 'sha256:[a-f0-9]{64}' "$PUBLISH_OUT" | tail -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::Failed to parse image digest from apko publish output"
            cat "$PUBLISH_OUT"
            exit 1
          fi
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}@${DIGEST}" >> $GITHUB_OUTPUT

      - name: Sign image with cosign
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 5
          max_attempts: 3
          # Same Sigstore flakiness as the SBOM attest step below.
          retry_wait_seconds: 60
          command: |
            # Rekor 409 createLogEntryConflict == already recorded; see the
            # matching comment in the build-apko job's sign step.
            OUT=$(cosign sign --yes "${{ steps.publish.outputs.image }}" 2>&1); RC=$?
            echo "$OUT"
            if [ "$RC" -ne 0 ] && echo "$OUT" | grep -q 'createLogEntryConflict'; then
              echo "note: rekor already holds an equivalent entry — signature is recorded, treating as success"
              RC=0
            fi
            exit "$RC"

      - name: Attach SBOM attestation
        if: github.event_name != 'pull_request' && steps.publish.outputs.digest != ''
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 5
          max_attempts: 3
          # Sigstore (fulcio/timestamp/rekor) resets connections under load;
          # the default 10s gap burned all 3 attempts in ~30s and failed the
          # whole scheduled build (conftest-dev, 2026-07-29). Back off properly.
          retry_wait_seconds: 60
          command: |
            # Idempotent across attempts — see the matching comment in the
            # build-apko job's attest step (deno, main 2026-08-06).
            FAILED=0
            for SBOM in sbom-x86_64.spdx.json sbom-aarch64.spdx.json sbom-index.spdx.json; do
              [ -f "$SBOM" ] || continue
              if [ -f ".attested-${SBOM}" ]; then
                echo "skipping ${SBOM}: already attested in an earlier attempt"
                continue
              fi
              OUT=$(cosign attest --yes --type spdxjson \
                --predicate "$SBOM" \
                "${{ steps.publish.outputs.image }}" 2>&1); RC=$?
              echo "$OUT"
              if [ "$RC" -ne 0 ] && echo "$OUT" | grep -q 'createLogEntryConflict'; then
                # Unlike `cosign sign`, a rekor 409 here does NOT imply the
                # desired end state: cosign aborts at the tlog step *before*
                # pushing the attestation to the registry. Blanket-treating it
                # as success published a green build whose spdxjson attestation
                # was absent from GHCR, and the verify step then burned all 5
                # attempts on a condition no retry can fix (postgres-slim, main
                # 2026-08-11). Probe the registry and only accept the conflict
                # if the attestation is actually there; otherwise leave RC
                # non-zero so the retry re-attests.
                if cosign verify-attestation --type spdxjson \
                     --certificate-identity-regexp='https://github.com/rtvkiz/minimal/' \
                     --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
                     "${{ steps.publish.outputs.image }}" > /dev/null 2>&1; then
                  echo "note: rekor conflict for ${SBOM}, attestation is present in the registry — treating as success"
                  RC=0
                else
                  echo "::warning::rekor conflict for ${SBOM} but no spdxjson attestation in the registry — will retry"
                fi
              fi
              if [ "$RC" -eq 0 ]; then
                touch ".attested-${SBOM}"
              else
                echo "::warning::attestation for ${SBOM} failed (will retry)"
                FAILED=1
              fi
            done
            exit "$FAILED"

      # This action talks to both GHCR and rekor, and fails intermittently on
      # each: "OCIError: Error uploading artifact to container registry"
      # (mariadb, velero) and "InternalError: error fetching tlog entry"
      # (osv-scanner, kubeconform) — all on main, 2026-08-10. Every other
      # sigstore step here is already wrapped in nick-fields/retry; this one
      # was the last bare `uses:` and was the single largest source of red
      # scheduled builds. Same repeat-the-step pattern as Setup cosign, with a
      # backoff in between since the failures are load-related.
      - name: Generate SLSA build provenance
        id: slsa-provenance
        if: github.event_name != 'pull_request' && steps.publish.outputs.digest != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Back off before provenance retry
        if: github.event_name != 'pull_request' && steps.slsa-provenance.outcome == 'failure'
        run: |
          # Jittered, not fixed. A large run fires 80+ attestations at once and
          # trips the installation rate limit; a constant 60s meant every job
          # then retried in the same instant against the same limit, so the
          # retry was guaranteed to fail with it. This is the same burst bug as
          # the curl --retry fix above. Spread over 1-6min instead.
          sleep $(( (RANDOM % 300) + 60 ))

      - name: Generate SLSA build provenance (retry)
        id: slsa-retry
        continue-on-error: true
        if: github.event_name != 'pull_request' && steps.slsa-provenance.outcome == 'failure'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Back off before final provenance attempt
        if: github.event_name != 'pull_request' && steps.slsa-retry.outcome == 'failure'
        run: sleep $(( (RANDOM % 600) + 300 ))

      - name: Generate SLSA build provenance (final)
        if: github.event_name != 'pull_request' && steps.slsa-retry.outcome == 'failure'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${{ matrix.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      # Same propagation race as build-apko's verify step — see comment there.
      - name: Verify attestations are discoverable
        if: github.event_name != 'pull_request' && steps.publish.outputs.digest != ''
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            set -e
            IMAGE="${{ steps.publish.outputs.image }}"
            echo "Verifying cosign signature..."
            cosign verify \
              --certificate-identity-regexp='https://github.com/rtvkiz/minimal/' \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              "$IMAGE" > /dev/null
            echo "Verifying SBOM attestation..."
            cosign verify-attestation --type spdxjson \
              --certificate-identity-regexp='https://github.com/rtvkiz/minimal/' \
              --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
              "$IMAGE" > /dev/null
            echo "Verifying SLSA provenance..."
            gh attestation verify "oci://$IMAGE" --owner ${{ github.repository_owner }} > /dev/null
            echo "All attestations verified."

      # See build-apko for rationale — stable per-image SBOM for the catalog site.
      - name: Save SBOM sidecar for catalog site
        if: always() && matrix.scan_for_cves && github.event_name != 'pull_request'
        run: |
          for S in sbom-x86_64.spdx.json sbom-aarch64.spdx.json sbom-index.spdx.json; do
            if [ -f "$S" ]; then
              cp "$S" "sbom-${{ matrix.name }}.spdx.json"
              echo "Saved catalog SBOM from $S"
              break
            fi
          done

      - name: Upload SBOM sidecar for catalog site
        if: always() && matrix.scan_for_cves && github.event_name != 'pull_request' && hashFiles(format('sbom-{0}.spdx.json', matrix.name)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalog-sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          retention-days: 90
          if-no-files-found: ignore

  #----------------------------------------------------------------------------
  # SUMMARY
  #----------------------------------------------------------------------------
  summary:
    needs: [detect-changes, build-apko, build-melange]
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    steps:
      - name: Check results
        run: |
          HAS_APKO="${{ needs.detect-changes.outputs.has-apko }}"
          HAS_MELANGE="${{ needs.detect-changes.outputs.has-build-melange }}"
          APKO="${{ needs.build-apko.result }}"
          MELANGE="${{ needs.build-melange.result }}"
          echo "build-apko: $APKO (expected: $HAS_APKO)"
          echo "build-melange: $MELANGE (expected: $HAS_MELANGE)"

          FAILED=false
          if [ "$HAS_APKO" = "true" ] && [ "$APKO" != "success" ]; then
            echo "::error::build-apko did not succeed: $APKO"
            FAILED=true
          fi
          if [ "$HAS_MELANGE" = "true" ] && [ "$MELANGE" != "success" ]; then
            echo "::error::build-melange did not succeed: $MELANGE"
            FAILED=true
          fi
          if [ "$FAILED" = true ]; then
            exit 1
          fi
          echo "All expected builds succeeded!"

  # NOTE: the catalog site (minimalcontainers.com) is built and deployed by a
  # separate workflow, .github/workflows/deploy-site.yml, which runs after this
  # workflow completes (workflow_run) and reuses the scan/SBOM artifacts uploaded
  # by the build jobs above. Deploy is decoupled from the image build so site
  # changes ship in ~2 minutes without a full rebuild.

  #----------------------------------------------------------------------------
  # CLEANUP OLD VERSIONS
  #----------------------------------------------------------------------------
  cleanup:
    needs: [build-apko, build-melange]
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    permissions:
      packages: write
    steps:
      - name: Delete old untagged versions
        run: |
          gh api "/users/${{ github.repository_owner }}/packages?package_type=container" \
            --paginate --jq '.[].name' 2>/dev/null | \
          while read -r pkg; do
            echo "Cleaning old versions from $pkg..."
            gh api "/users/${{ github.repository_owner }}/packages/container/$pkg/versions" \
              --paginate --jq '[.[] | select(.metadata.container.tags | length == 0)] | sort_by(.created_at) | reverse | .[4:] | .[].id' 2>/dev/null | \
            while read -r id; do
              echo "  Deleting version $id"
              gh api --method DELETE "/users/${{ github.repository_owner }}/packages/container/$pkg/versions/$id" 2>/dev/null || true
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
