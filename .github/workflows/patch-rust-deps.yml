name: Patch Rust Transitive Dependencies

on:
  schedule:
    # 15 min after patch-go-deps fires, so the two don't race for PR creation.
    - cron: '15 1,7,13,19 * * *'
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  GRYPE_VERSION: v0.109.1

jobs:
  patch-rust-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cache Grype binary
        id: grype-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/bin/grype
          key: grype-${{ env.GRYPE_VERSION }}-linux-amd64

      - name: Install Grype
        if: steps.grype-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-all-errors -o /tmp/grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/grype.tar.gz -C /usr/local/bin grype
          rm -f /tmp/grype.tar.gz

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing patch-rust-deps PR
        id: existing-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_URL=$(gh pr list --head patch-rust-deps --base main --state open --json url --jq '.[0].url // ""')
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Scan Rust images and generate patches
        id: scan
        run: |
          # Image -> source directory (inside the melange build sandbox).
          D='$'
          declare -A SRCROOTS=(
            [qdrant]="/home/build/qdrant-${D}{{package.version}}"
          )

          # Build marker (inserted before this line).
          declare -A BUILD_MARKERS=(
            [qdrant]='cargo build --release'
          )

          HAS_PATCHES=false
          PATCHED_LIST=""
          SUMMARY=""

          for IMAGE in "${!SRCROOTS[@]}"; do
            echo "=== Scanning $IMAGE ==="
            FULL_IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/minimal-${IMAGE}:latest"
            MELANGE_FILE="${IMAGE}/melange.yaml"
            BEFORE_HASH=$(sha256sum "$MELANGE_FILE" | awk '{print $1}')

            # Remove any prior auto-block first.
            if grep -q "# patch-rust-deps: auto-generated" "$MELANGE_FILE"; then
              awk '/# patch-rust-deps: auto-generated/{skip=1} /# end-patch-rust-deps/{skip=0; next} !skip' \
                "$MELANGE_FILE" > "${MELANGE_FILE}.tmp" && mv "${MELANGE_FILE}.tmp" "$MELANGE_FILE"
            fi

            # Extract rust-crate CVE matches with fix versions.
            FIXES=$(grype "$FULL_IMAGE" -o json 2>/dev/null | \
              jq -r '
                [.matches[]
                  | select(.artifact.type == "rust-crate")
                  | select(.vulnerability.fix.versions | length > 0)
                  | {pkg: .artifact.name, fix: .vulnerability.fix.versions[0]}
                ]
                | unique_by(.pkg)
                | .[]
                | "\(.pkg)@\(.fix)"
              ' 2>/dev/null | sort -u || true)

            if [ -z "$FIXES" ]; then
              echo "  No fixable Rust crate CVEs"
              continue
            fi

            SRCROOT="${SRCROOTS[$IMAGE]}"
            MARKER="${BUILD_MARKERS[$IMAGE]}"

            # Verify each crate@version exists on crates.io before emitting.
            CARGO_UPDATES=""
            APPLIED_COUNT=0
            while IFS= read -r crate_ver; do
              [ -z "$crate_ver" ] && continue
              crate="${crate_ver%@*}"
              ver="${crate_ver#*@}"
              if ! curl -fs --max-time 10 "https://crates.io/api/v1/crates/${crate}/${ver}" >/dev/null 2>&1; then
                echo "  Skipping ${crate_ver}: version not in crates.io"
                continue
              fi
              CARGO_UPDATES="${CARGO_UPDATES}      cargo update -p ${crate} --precise ${ver}\n"
              APPLIED_COUNT=$((APPLIED_COUNT + 1))
            done <<< "$FIXES"

            if [ "$APPLIED_COUNT" -eq 0 ]; then
              echo "  No compatible Rust patches after filtering"
              continue
            fi

            PATCH_BLOCK="  # patch-rust-deps: auto-generated — do not edit manually\n  - runs: |\n      cd ${SRCROOT}\n${CARGO_UPDATES}  # end-patch-rust-deps\n"

            MARKER_LINE=$(grep -n "$MARKER" "$MELANGE_FILE" | head -1 | cut -d: -f1)
            if [ -z "$MARKER_LINE" ]; then
              echo "  WARN: build marker '$MARKER' not found, skipping"
              continue
            fi

            MARKER_INDENT=$(sed -n "${MARKER_LINE}p" "$MELANGE_FILE" | sed 's/[^ ].*//' | wc -c)
            if [ "$MARKER_INDENT" -gt 4 ]; then
              RUNS_LINE=$(head -n "$MARKER_LINE" "$MELANGE_FILE" | grep -n "^  - runs:" | tail -1 | cut -d: -f1)
              [ -n "$RUNS_LINE" ] && MARKER_LINE=$RUNS_LINE
            fi

            head -n $((MARKER_LINE - 1)) "$MELANGE_FILE" > "${MELANGE_FILE}.tmp"
            echo -e "$PATCH_BLOCK" >> "${MELANGE_FILE}.tmp"
            tail -n +${MARKER_LINE} "$MELANGE_FILE" >> "${MELANGE_FILE}.tmp"
            mv "${MELANGE_FILE}.tmp" "$MELANGE_FILE"

            HAS_PATCHES=true
            PATCHED_LIST="${PATCHED_LIST} ${IMAGE}"
            SUMMARY="${SUMMARY}- **${IMAGE}**: ${APPLIED_COUNT} crate(s) bumped\n"
            echo "  Patched $APPLIED_COUNT crates"
          done

          PATCHED_LIST=$(echo "$PATCHED_LIST" | xargs)

          if [ "$HAS_PATCHES" = true ]; then
            echo "has_patches=true" >> "$GITHUB_OUTPUT"
            echo "patched_images=$PATCHED_LIST" >> "$GITHUB_OUTPUT"
            { echo "summary<<EOF"; echo -e "$SUMMARY"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "has_patches=false" >> "$GITHUB_OUTPUT"
            echo "No Rust dep patches needed"
          fi

      - name: Close stale patch-rust-deps PR
        if: steps.scan.outputs.has_patches != 'true' && steps.existing-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr close "${{ steps.existing-pr.outputs.pr_url }}" \
            --comment "Closing: latest patch-rust-deps scan produced no patch changes."
          git push origin --delete patch-rust-deps || true

      - name: Create PR and enable auto-merge
        if: steps.scan.outputs.has_patches == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="patch-rust-deps"
          PR_TITLE="fix(rust-deps): patch vulnerable Rust crate dependencies"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git diff --cached --quiet && { echo "No file changes"; exit 0; }
          git commit -m "fix(rust-deps): patch vulnerable Rust crate dependencies"
          git push -u origin "$BRANCH" --force

          cat > /tmp/pr.md <<'PRBODY'
          ## Summary

          Scans published Rust images with grype, identifies crate-level CVEs with
          known fix versions, and emits targeted `cargo update -p <crate> --precise <ver>`
          commands in each image's melange.yaml.

          ## Patched images

          ${{ steps.scan.outputs.summary }}

          ## Verification

          CI builds all images — if green, the bumps compile cleanly.

          ---
          Auto-generated by [patch-rust-deps](${{ github.server_url }}/${{ github.repository }}/actions/workflows/patch-rust-deps.yml).
          PRBODY

          PR_URL="${{ steps.existing-pr.outputs.pr_url }}"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$PR_TITLE" --add-label dependencies --add-label security --body-file /tmp/pr.md
          else
            PR_URL=$(gh pr create --title "$PR_TITLE" --label dependencies --label security --body-file /tmp/pr.md)
          fi
          echo "Created PR: $PR_URL"
          gh pr merge "$PR_URL" --auto --squash --delete-branch
