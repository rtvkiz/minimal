name: Check Wolfi Package Updates

on:
  schedule:
    # Check weekly on Mondays at 7am UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the toolchain-pin diff without writing or opening a PR"
        type: boolean
        default: false

permissions: {}

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download and parse Wolfi APKINDEX
        id: check
        run: |
          set -e

          # Download Wolfi package index
          # -f so an HTTP error is retried rather than written to the file as an
          # error page that only fails later at tar -xzf.
          curl -fsS --retry 3 --retry-all-errors https://packages.wolfi.dev/os/x86_64/APKINDEX.tar.gz -o /tmp/APKINDEX.tar.gz
          tar -xzf /tmp/APKINDEX.tar.gz -C /tmp

          # Parse APKINDEX to find available packages
          # Format: P:package-name followed by V:version
          awk '/^P:/{pkg=$0} /^V:/{print pkg, $0}' /tmp/APKINDEX | \
            sed 's/P://; s/V://' > /tmp/packages.txt

          echo "=== Checking for updates ==="

          # --- Python ---
          CURRENT_PYTHON=$(grep -oP 'python-\d+\.\d+' images/python/apko/python.yaml | head -1)
          echo "Current Python package: $CURRENT_PYTHON"

          # Find all python-3.x packages (not python-3.x-base, python-3.x-dev, etc.)
          LATEST_PYTHON=$(grep -E "^python-3\.[0-9]+ " /tmp/packages.txt | \
            awk '{print $1}' | sort -t. -k2 -n | tail -1)
          echo "Latest Python package: $LATEST_PYTHON"

          if [ -n "$LATEST_PYTHON" ] && [ "$LATEST_PYTHON" != "$CURRENT_PYTHON" ]; then
            echo "python_update=true" >> $GITHUB_OUTPUT
            echo "python_current=$CURRENT_PYTHON" >> $GITHUB_OUTPUT
            echo "python_latest=$LATEST_PYTHON" >> $GITHUB_OUTPUT
            echo "  -> Update available: $CURRENT_PYTHON -> $LATEST_PYTHON"
          else
            echo "  -> Up to date"
          fi

          # --- Go ---
          CURRENT_GO=$(grep -oP 'go-\d+\.\d+' images/go/apko/go.yaml | head -1)
          echo "Current Go package: $CURRENT_GO"

          # Find all go-1.x packages
          LATEST_GO=$(grep -E "^go-1\.[0-9]+ " /tmp/packages.txt | \
            awk '{print $1}' | sort -t. -k2 -n | tail -1)
          echo "Latest Go package: $LATEST_GO"

          if [ -n "$LATEST_GO" ] && [ "$LATEST_GO" != "$CURRENT_GO" ]; then
            echo "go_update=true" >> $GITHUB_OUTPUT
            echo "go_current=$CURRENT_GO" >> $GITHUB_OUTPUT
            echo "go_latest=$LATEST_GO" >> $GITHUB_OUTPUT
            echo "  -> Update available: $CURRENT_GO -> $LATEST_GO"
          else
            echo "  -> Up to date"
          fi

          # --- Node.js ---
          CURRENT_NODE=$(grep -oP 'nodejs-\d+' images/node-slim/apko/node.yaml | head -1)
          echo "Current Node.js package: $CURRENT_NODE"

          # Find all nodejs-XX packages (LTS versions are even numbers)
          # Node LTS lines are EVEN majors (20/22/24…); odd majors are
          # short-lived non-LTS. Filter to even before picking the highest.
          LATEST_NODE=$(grep -E "^nodejs-[0-9]+ " /tmp/packages.txt | \
            awk '{n=$1; sub(/nodejs-/,"",n); if (n%2==0) print $1}' | sort -t- -k2 -n | tail -1)
          echo "Latest Node.js package: $LATEST_NODE"

          if [ -n "$LATEST_NODE" ] && [ "$LATEST_NODE" != "$CURRENT_NODE" ]; then
            echo "node_update=true" >> $GITHUB_OUTPUT
            echo "node_current=$CURRENT_NODE" >> $GITHUB_OUTPUT
            echo "node_latest=$LATEST_NODE" >> $GITHUB_OUTPUT
            echo "  -> Update available: $CURRENT_NODE -> $LATEST_NODE"
          else
            echo "  -> Up to date"
          fi

          # --- .NET Runtime ---
          CURRENT_DOTNET=$(grep -oP 'dotnet-\d+-runtime' images/dotnet/apko/dotnet.yaml | head -1)
          echo "Current .NET package: $CURRENT_DOTNET"

          # Find all dotnet-XX-runtime packages
          LATEST_DOTNET=$(grep -E "^dotnet-[0-9]+-runtime " /tmp/packages.txt | \
            awk '{print $1}' | sort -t- -k2 -n | tail -1)
          echo "Latest .NET package: $LATEST_DOTNET"

          if [ -n "$LATEST_DOTNET" ] && [ "$LATEST_DOTNET" != "$CURRENT_DOTNET" ]; then
            echo "dotnet_update=true" >> $GITHUB_OUTPUT
            echo "dotnet_current=$CURRENT_DOTNET" >> $GITHUB_OUTPUT
            echo "dotnet_latest=$LATEST_DOTNET" >> $GITHUB_OUTPUT
            echo "  -> Update available: $CURRENT_DOTNET -> $LATEST_DOTNET"
          else
            echo "  -> Up to date"
          fi

          # --- OpenJDK ---
          CURRENT_JDK=$(grep -oP 'openjdk-\d+-jre' images/java/apko/java.yaml | head -1)
          echo "Current OpenJDK package: $CURRENT_JDK"

          # Find all openjdk-XX-jre packages
          LATEST_JDK=$(grep -E "^openjdk-[0-9]+-jre " /tmp/packages.txt | \
            awk '{print $1}' | sort -t- -k2 -n | tail -1)
          echo "Latest OpenJDK package: $LATEST_JDK"

          if [ -n "$LATEST_JDK" ] && [ "$LATEST_JDK" != "$CURRENT_JDK" ]; then
            echo "jdk_update=true" >> $GITHUB_OUTPUT
            echo "jdk_current=$CURRENT_JDK" >> $GITHUB_OUTPUT
            echo "jdk_latest=$LATEST_JDK" >> $GITHUB_OUTPUT
            echo "  -> Update available: $CURRENT_JDK -> $LATEST_JDK"
          else
            echo "  -> Up to date"
          fi

          # --- PostgreSQL ---
          CURRENT_PG=$(grep -oP 'postgresql-\d+' images/postgres-slim/apko/postgres.yaml | head -1)
          echo "Current PostgreSQL package: $CURRENT_PG"

          # Find all postgresql-XX packages
          LATEST_PG=$(grep -E "^postgresql-[0-9]+ " /tmp/packages.txt | \
            awk '{print $1}' | sort -t- -k2 -n | tail -1)
          echo "Latest PostgreSQL package: $LATEST_PG"

          if [ -n "$LATEST_PG" ] && [ "$LATEST_PG" != "$CURRENT_PG" ]; then
            echo "pg_update=true" >> $GITHUB_OUTPUT
            echo "pg_current=$CURRENT_PG" >> $GITHUB_OUTPUT
            echo "pg_latest=$LATEST_PG" >> $GITHUB_OUTPUT
            echo "  -> Update available: $CURRENT_PG -> $LATEST_PG"
          else
            echo "  -> Up to date"
          fi

          # Summary
          echo ""
          echo "=== Summary ==="
          if [ -n "$LATEST_PYTHON" ] && [ "$LATEST_PYTHON" != "$CURRENT_PYTHON" ]; then
            echo "Python: $CURRENT_PYTHON -> $LATEST_PYTHON"
          fi
          if [ -n "$LATEST_GO" ] && [ "$LATEST_GO" != "$CURRENT_GO" ]; then
            echo "Go: $CURRENT_GO -> $LATEST_GO"
          fi
          if [ -n "$LATEST_NODE" ] && [ "$LATEST_NODE" != "$CURRENT_NODE" ]; then
            echo "Node.js: $CURRENT_NODE -> $LATEST_NODE"
          fi
          if [ -n "$LATEST_DOTNET" ] && [ "$LATEST_DOTNET" != "$CURRENT_DOTNET" ]; then
            echo ".NET: $CURRENT_DOTNET -> $LATEST_DOTNET"
          fi
          if [ -n "$LATEST_JDK" ] && [ "$LATEST_JDK" != "$CURRENT_JDK" ]; then
            echo "OpenJDK: $CURRENT_JDK -> $LATEST_JDK"
          fi
          if [ -n "$LATEST_PG" ] && [ "$LATEST_PG" != "$CURRENT_PG" ]; then
            echo "PostgreSQL: $CURRENT_PG -> $LATEST_PG"
          fi

      # --- Python PR ---
      - name: Create Python PR
        if: steps.check.outputs.python_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD="${{ steps.check.outputs.python_current }}"
          NEW="${{ steps.check.outputs.python_latest }}"
          sed -i "s/$OLD/$NEW/g" images/python/apko/*.yaml
          BRANCH="update-python-${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(python): upgrade to ${NEW}"
          git push --force -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore(python): upgrade to ${NEW}" \
            --label dependencies --label python \
            --body "Upgrades Python from \`${OLD}\` to \`${NEW}\` (detected from Wolfi APKINDEX).

          ---
          Auto-created by [update-wolfi-packages](${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-wolfi-packages.yml).")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          git checkout main
          git checkout -- .

      # --- Go PR ---
      - name: Create Go PR
        if: steps.check.outputs.go_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD="${{ steps.check.outputs.go_current }}"
          NEW="${{ steps.check.outputs.go_latest }}"
          sed -i "s/$OLD/$NEW/g" images/go/apko/*.yaml
          BRANCH="update-go-${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(go): upgrade to ${NEW}"
          git push --force -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore(go): upgrade to ${NEW}" \
            --label dependencies --label go \
            --body "Upgrades Go from \`${OLD}\` to \`${NEW}\` (detected from Wolfi APKINDEX).

          ---
          Auto-created by [update-wolfi-packages](${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-wolfi-packages.yml).")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          git checkout main
          git checkout -- .

      # --- Node.js PR ---
      - name: Create Node.js PR
        if: steps.check.outputs.node_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD="${{ steps.check.outputs.node_current }}"
          NEW="${{ steps.check.outputs.node_latest }}"
          sed -i "s/$OLD/$NEW/g" images/node-slim/apko/*.yaml
          BRANCH="update-node-${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(node): upgrade to ${NEW}"
          git push --force -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore(node): upgrade to ${NEW}" \
            --label dependencies --label nodejs \
            --body "Upgrades Node.js from \`${OLD}\` to \`${NEW}\` (detected from Wolfi APKINDEX).

          ---
          Auto-created by [update-wolfi-packages](${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-wolfi-packages.yml).")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          git checkout main
          git checkout -- .

      # --- .NET PR ---
      - name: Create .NET PR
        if: steps.check.outputs.dotnet_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD="${{ steps.check.outputs.dotnet_current }}"
          NEW="${{ steps.check.outputs.dotnet_latest }}"
          # $OLD/$NEW are the versioned runtime pkg (e.g. dotnet-10-runtime), but
          # the dev image also pins dotnet-N-sdk / -targeting-pack / a bare
          # dotnet-N. Rewrite the whole dotnet-<major> family (\b stops at
          # dotnet-100), else dev drifts to a mismatched major.
          OLD_MAJOR=$(echo "$OLD" | grep -oE '[0-9]+' | head -1)
          NEW_MAJOR=$(echo "$NEW" | grep -oE '[0-9]+' | head -1)
          sed -i -E "s/dotnet-${OLD_MAJOR}\b/dotnet-${NEW_MAJOR}/g" images/dotnet/apko/*.yaml
          BRANCH="update-dotnet-${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(dotnet): upgrade to ${NEW}"
          git push --force -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore(dotnet): upgrade to ${NEW}" \
            --label dependencies --label dotnet \
            --body "Upgrades .NET Runtime from \`${OLD}\` to \`${NEW}\` (detected from Wolfi APKINDEX).

          ---
          Auto-created by [update-wolfi-packages](${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-wolfi-packages.yml).")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          git checkout main
          git checkout -- .

      # --- OpenJDK PR ---
      - name: Create OpenJDK PR
        if: steps.check.outputs.jdk_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD="${{ steps.check.outputs.jdk_current }}"
          NEW="${{ steps.check.outputs.jdk_latest }}"
          OLD_VER=$(echo "$OLD" | grep -oP '\d+')
          NEW_VER=$(echo "$NEW" | grep -oP '\d+')
          # Rewrite the whole openjdk-<major> family — jre, default-jvm, AND the
          # dev-only default-jdk + a bare openjdk-N — plus the java-<major>-openjdk
          # JAVA_HOME token. The old per-suffix seds missed dev's default-jdk.
          sed -i -E "s/openjdk-${OLD_VER}\b/openjdk-${NEW_VER}/g" images/java/apko/*.yaml
          sed -i "s/java-${OLD_VER}-openjdk/java-${NEW_VER}-openjdk/g" images/java/apko/*.yaml
          BRANCH="update-java-${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(java): upgrade to ${NEW}"
          git push --force -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore(java): upgrade to ${NEW}" \
            --label dependencies --label java \
            --body "Upgrades OpenJDK JRE from \`${OLD}\` to \`${NEW}\` (detected from Wolfi APKINDEX).

          ---
          Auto-created by [update-wolfi-packages](${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-wolfi-packages.yml).")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          git checkout main
          git checkout -- .

      # --- PostgreSQL PR ---
      - name: Create PostgreSQL PR
        if: steps.check.outputs.pg_update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD="${{ steps.check.outputs.pg_current }}"
          NEW="${{ steps.check.outputs.pg_latest }}"
          OLD_VER=$(echo "$OLD" | grep -oP '\d+')
          NEW_VER=$(echo "$NEW" | grep -oP '\d+')
          # Rewrite the whole postgres family, not just postgresql-N: libpq, ecpg and
          # pgaudit carry the same major and a bare postgresql-N sed left them on the
          # old one, which would ship a mixed-major image (postgresql-19 beside
          # libpq-18). \b keeps postgresql-18-client in scope while the anchored
          # family list leaves unrelated pins (libxml2-16, libldap-2.6) alone.
          #
          # patroni pins the SAME family and must move in lockstep. It was omitted
          # here and classified wolfi-rolling, so its pin was watched by nothing —
          # postgres-slim would advance while patroni silently stayed behind.
          # Detection still reads postgres-slim as the source of truth.
          for f in images/postgres-slim/apko/*.yaml images/patroni/apko/*.yaml; do
            sed -i -E "s/\b(postgresql|libpq|ecpg|pgaudit)-${OLD_VER}\b/\1-${NEW_VER}/g" "$f"
          done
          BRANCH="update-postgres-${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(postgres): upgrade to ${NEW}"
          git push --force -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore(postgres): upgrade to ${NEW}" \
            --label dependencies --label postgresql \
            --body "Upgrades PostgreSQL from \`${OLD}\` to \`${NEW}\` (detected from Wolfi APKINDEX).

          ---
          Auto-created by [update-wolfi-packages](${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-wolfi-packages.yml).")
          gh pr merge "$PR_URL" --auto --squash --delete-branch

      # --- Toolchain pins in melange build environments ---------------------
      # Separate from the per-language steps above: those bump the toolchain
      # SHIPPED by an image (images/go/apko), this bumps the toolchain images
      # are BUILT WITH (images/*/melange.yaml). Both matter — the second is what
      # silently changed under us when Wolfi published go-1.27.
      #
      # Every run bumps every image, including ones a previous run held back, so
      # a held-back pin clears itself once upstream catches up. CI's per-image
      # build is the probe.
      - name: Bump toolchain pins in build environments
        id: toolchain
        run: |
          ./.github/scripts/bump-toolchain-pins.sh \
            --packages /tmp/packages.txt \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Create toolchain PR
        if: steps.toolchain.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY: ${{ steps.toolchain.outputs.summary }}
          SUFFIX: ${{ steps.toolchain.outputs.branch_suffix }}
        run: |
          BRANCH="update-toolchain-${SUFFIX}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Only the recipes — the script touches nothing else, and -A here could
          # sweep in unrelated working-tree state from an earlier step.
          git add images/
          git commit -m "chore(toolchain): bump build-environment pins to ${SUFFIX}"
          git push --force -u origin "$BRANCH"
          # Reuse an open PR on this branch rather than stacking duplicates.
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // ""')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --title "chore(toolchain): bump build-environment pins to ${SUFFIX}" \
              --label dependencies \
              --body "Bumps the language-toolchain packages that melange **builds with** (not the ones images ship).

          ${SUMMARY}

          Detected from the Wolfi APKINDEX. Build environments pin versioned packages rather than
          the bare provider, because a bare provider resolves to the newest version and changes the
          compiler mid-build — that is how go-1.27 landed unannounced on 2026-08-19 and broke
          trivy. The check-toolchain-pins gate enforces the pinning; this PR is what moves it.

          **CI is the probe.** Every image affected is rebuilt below. If everything is green this
          merges automatically. If an image cannot build on the new toolchain, it should be reverted
          to its previous pin and held back until upstream adapts — the rest still advance.

          ---
          Auto-created by [update-wolfi-packages](${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-wolfi-packages.yml).")
          fi
          echo "PR: $PR_URL"
          gh pr merge "$PR_URL" --auto --squash --delete-branch
          git checkout main
          git checkout -- .
