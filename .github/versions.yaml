# ============================================================================
# Bespoke github-tags variants (custom prefix / tag normalization / non-melange
# target files). All share the github-tags fetcher.
# ============================================================================

# OpenSearch is built from the official upstream "min" distribution (not
# Wolfi's lagging opensearch-3 package). Per-arch tarballs; sha512 of each
# recorded into the melange vars. Replaces the old update-opensearch.yml.
- name: opensearch
  cron-enabled: true   # wave 8 (dispatch-validated 2026-07-08)
  files: [opensearch/melange.yaml]
  source: { type: github-tags, repo: opensearch-project/OpenSearch, pattern: '^([0-9]+\.[0-9]+\.[0-9]+)$', pin-major: 3 }
  tarballs:
    - { url: "https://artifacts.opensearch.org/releases/core/opensearch/{version}/opensearch-min-{version}-linux-x64.tar.gz",   field: sha512_x86, algo: sha512 }
    - { url: "https://artifacts.opensearch.org/releases/core/opensearch/{version}/opensearch-min-{version}-linux-arm64.tar.gz", field: sha512_arm, algo: sha512 }
  major-issue: true
  links:
    releases: "https://github.com/opensearch-project/OpenSearch/releases"
    notes: "https://github.com/opensearch-project/OpenSearch/releases/tag/{version}"

- name: mysql
  cron-enabled: true   # wave 7
  files: [mysql/melange.yaml]
  # MySQL 8.4 LTS tags upstream are mysql-cluster-8.4.X. Strip prefix on read.
  source:
    type: github-tags
    repo: mysql/mysql-server
    pattern: '^mysql-cluster-8\.4\.[0-9]+$'
    strip-prefix: 'mysql-cluster-'
    pin-major: 8
  tarball:
    url: "https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-{version}.tar.gz"
    field: sha256
  major-issue: true
  links:
    releases: "https://dev.mysql.com/downloads/mysql/"
    notes: "https://dev.mysql.com/doc/relnotes/mysql/8.4/en/"

- name: ruby
  cron-enabled: true   # wave 7
  # Ruby bump touches BOTH ruby/melange.yaml AND rails/melange.yaml — rails is
  # built on top of the same Ruby interpreter and tracks ruby_version 1:1.
  files: [ruby/melange.yaml, rails/melange.yaml]
  extra-fields: [ruby_version]   # also rewrite `^  ruby_version:` in every file
  source:
    type: github-tags
    repo: ruby/ruby
    # Accept both modern `v3.4.7` and legacy `v3_4_7` tag forms; exclude rc/preview.
    pattern: '^v[0-9]+([._][0-9]+){2}$'
    strip-prefix: 'v'
    tag-rewrite: { from: '_', to: '.' }
    pin-major: 4
  tarball:
    # cache.ruby-lang.org expects the SERIES (4.0) directory; use {minor}.
    url: "https://cache.ruby-lang.org/pub/ruby/{minor}/ruby-{version}.tar.gz"
    field: sha256
  major-issue: true
  links:
    releases: "https://www.ruby-lang.org/en/downloads/releases/"
    notes: "https://www.ruby-lang.org/en/news/"

# NOTE: opensearch and minio are deliberately kept on their bespoke
# update-opensearch.yml / update-minio.yml workflows:
#   - opensearch edits both the Makefile and several README columns whose
#     regex patterns are tuned for this README's exact table layout. A
#     generic pattern engine cannot safely express that.
#   - minio's upstream tag is `RELEASE.YYYY-MM-DDTHH-MM-SSZ`; the melange
#     `version:` derives a `YYYY.MM.DD` date string from it while a second
#     field `minio_release:` keeps the full tag for the download URL. That
#     tag-vs-version split is not worth lifting into the framework for one
#     image. Both workflows stay authoritative.
