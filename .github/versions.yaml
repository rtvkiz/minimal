# Registry of upstream sources for every image we auto-bump.
#
# Consumed by .github/workflows/update-versions.yml — that workflow runs a
# matrix over this file and shells out to .github/scripts/{check,apply,open-pr}.sh.
#
# This file is the single source of truth for "how do we discover, download,
# and patch a new upstream version?" for each image. To onboard a new image,
# add a row here — do not write a per-image workflow.
#
# Schema (per row)
# ----------------
#   name:    short identifier; used as matrix key, label, branch prefix
#   files:   list of files to edit when a new version is found. Each entry is
#            either a plain string (use default sed pattern for `version:`,
#            `<field>:`, `epoch:` in a melange.yaml) or a {path, pattern,
#            template} triple for arbitrary text files (Makefile, README).
#   source:  how to discover the latest upstream version
#     type:    github-releases-latest | github-tags | html-listing | plain-text | rubygems
#     repo:    "owner/repo" for github-* types
#     gem:     gem name for rubygems
#     urls:    list of URLs for html-listing / plain-text (first non-empty wins)
#     pattern: regex applied to candidates; capturing group 1 is the version
#     strip-v: true to strip a leading "v" from tag names
#     pin-major: integer; refuse upgrades that change major version. If a higher
#                major appears, surface as next_major_* output (→ optional issue).
#   tarball: (optional) how to fetch the artifact whose hash we record
#     url:     template with {version} and any keys from `vars`
#     urls:    list of templates; first that succeeds wins (mirror fallback)
#     field:   melange.yaml key to write the digest into (sha256, sha512, …)
#     algo:    digest algorithm (sha256 | sha512); defaults to field name
#     vars:    extra template substitutions (e.g. {scala: "2.13"})
#   tarballs: list form of `tarball:` for multi-asset images (e.g. envoy x86+arm)
#   field:   for source-only rows (rails), the melange key to write the bare
#            version into. No tarball, no checksum.
#   major-issue: true to open a GitHub issue when a new major appears
#   links:   metadata used in the PR body
#     releases: URL of the upstream releases page
#     notes:    template, may contain {version}

# ============================================================================
# github-releases-latest — hits /repos/<repo>/releases/latest, takes .tag_name
# ============================================================================

- name: qdrant
  cron-enabled: true   # wave 1
  files: [qdrant/melange.yaml]
  source: { type: github-releases-latest, repo: qdrant/qdrant, strip-v: true, pin-major: 1 }
  tarball: { url: "https://github.com/qdrant/qdrant/archive/refs/tags/v{version}.tar.gz", field: sha256 }
  major-issue: true
  links:
    releases: "https://github.com/qdrant/qdrant/releases"
    notes: "https://github.com/qdrant/qdrant/releases/tag/v{version}"

