# ============================================================================
# json — fetch URL returning JSON, run a jq expression to get the bare version
# ============================================================================

- name: mariadb
  # Deliberately pinned to the 11.4 LTS series (URL is series-scoped). New
  # majors/LTS lines are a human decision (like mysql 8.4) — not auto-detected.
  cron-enabled: true   # wave 6
  files: [images/mariadb/melange.yaml]
  source:
    type: json
    url: "https://downloads.mariadb.org/rest-api/mariadb/11.4/"
    jq: '[.releases | keys[] | select(test("^11\\.4\\."))] | sort_by(split(".") | map(tonumber)) | last'
    pin-major: 11
  tarball:
    url: "https://archive.mariadb.org/mariadb-{version}/source/mariadb-{version}.tar.gz"
    field: sha256
  links:
    releases: "https://mariadb.org/download/"
    notes: "https://mariadb.com/kb/en/release-notes-mariadb-11-4-series/"

- name: php
  cron-enabled: true   # wave 6
  files: [images/php/melange.yaml]
  source:
    type: json
    # {series} is templated from current MAJOR.MINOR (e.g. 8.5) at check time.
    # php.net's per-series JSON endpoint intermittently stalls for the current
    # series (it hung on 8.5 in the 2026-07-20 run and 4-min-timed-out the job),
    # so fall back to the major-only query — same {"version": ...} shape,
    # currently reliable. fetch_first_url tries these in order; --max-time now
    # bounds a stalled primary so the fallback is actually reached.
    urls:
      - "https://www.php.net/releases/index.php?json&version={series}"
      - "https://www.php.net/releases/index.php?json&version=8"
    jq: '.version // empty'
  tarball:
    url: "https://www.php.net/distributions/php-{version}.tar.gz"
    field: sha256
  links:
    releases: "https://www.php.net/downloads.php"
    notes: "https://www.php.net/ChangeLog-{major}.php"

# ============================================================================
# rails — version-field-only edit (no tarball/checksum). Source is RubyGems
