# ============================================================================
# github-tags — hits /repos/<repo>/tags?per_page=100, filters by regex,
# strips prefix, semver-sorts, takes the highest match. Use this when the
# upstream's `/releases/latest` is unreliable (e.g. mixed-major repos).
# ============================================================================

- name: caddy
  files: [caddy/melange.yaml]
  source: { type: github-tags, repo: caddyserver/caddy, pattern: '^v2\.[0-9]+\.[0-9]+$', strip-prefix: 'v', pin-major: 2 }
  tarball: { url: "https://github.com/caddyserver/caddy/archive/refs/tags/v{version}.tar.gz", field: sha256 }
  major-issue: true
  links:
    releases: "https://github.com/caddyserver/caddy/releases"
    notes: "https://github.com/caddyserver/caddy/releases/tag/v{version}"

