# Minimal OpenSearch image - official upstream min distribution via melange.
# OpenSearch 3.x with Wolfi OpenJDK 21. Built from the official 3.7.0 min
# distribution (not Wolfi's lagging opensearch-3 package) to pick up CVE fixes
# (opensearch 3.7.0 also bundles the fixed netty 4.2.15.Final).

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # OpenSearch core from the official min distribution (our melange package)
    - opensearch
    # Wolfi OpenJDK 21 (we dropped the distro's bundled JDK)
    - openjdk-21-default-jvm
    # bin/opensearch is a bash script
    - bash
    - busybox
    - curl

    # Core runtime libraries
    - glibc
    - glibc-locale-posix
    - ld-linux

    # Certificates (required for TLS, cluster comms, and S3 snapshots)
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: opensearch
      gid: 65532
  users:
    - username: opensearch
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/share/opensearch/bin/opensearch

environment:
  OPENSEARCH_HOME: /usr/share/opensearch
  OPENSEARCH_PATH_CONF: /usr/share/opensearch/config
  # bin/opensearch runs the JVM from Wolfi's openjdk-21 (bundled JDK removed)
  OPENSEARCH_JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
  # network.host + discovery.type=single-node are baked into config/opensearch.yml
  # by the melange build (the min distro ships no docker entrypoint to translate
  # dotted env vars). The min distribution has no security plugin, so it runs
  # open by default — configure TLS in your own config for production.
  LANG: C.UTF-8

paths:
  # Own the whole OpenSearch home as the runtime user (matches the official
  # OpenSearch image). The min distro's config/ ships subdirs like
  # jvm.options.d that nonroot must read, plus config/ + data/ + logs/ must be
  # writable (keystore, indices, logs). recursive chowns the package contents.
  - path: /usr/share/opensearch
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
    recursive: true
  - path: /usr/share/opensearch/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/opensearch/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-opensearch"
  org.opencontainers.image.description: "Hardened OpenSearch 3.x image on Wolfi with OpenJDK 21, daily CVE patches"
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/opensearch"
  org.opencontainers.image.licenses: "Apache-2.0"

archs:
  - x86_64
  - aarch64
