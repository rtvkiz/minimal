# Development variant of minimal-kafka.
# Same Kafka 4.x + custom jlink JRE as prod, plus bash, apk-tools,
# curl/socat/jq for hitting AdminClient HTTP endpoints, kafka's own
# CLI scripts (kafka-topics.sh, kafka-console-*.sh) ship in
# the kafka package so no extra apk needed for those.
#
# In-house composition.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    # Local melange-built packages (passed via --repository-append CLI flag)
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # Local signing key passed via --keyring-append CLI flag
  packages:
    # Base filesystem
    - wolfi-baselayout

    # Kafka + bundled JRE (same as prod)
    - kafka

    # Core libs (same as prod)
    - glibc
    - glibc-locale-posix
    - ld-linux
    - ca-certificates-bundle

    # --- Dev variant minimum (CONVENTIONS.md) ---
    - busybox
    - bash
    - apk-tools
    - wget

    # --- HTTP/socket debugging ---
    - curl
    - socat

    # --- JSON parsing for AdminClient REST output ---
    - jq

    # --- VCS ---
    - git

accounts:
  groups:
    - groupname: kafka
      gid: 65532
  users:
    - username: kafka
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/kafka-entrypoint.sh

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
  KAFKA_DATA: /var/kafka/data
  LANG: C.UTF-8

paths:
  - path: /var/kafka/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "minimal-kafka-dev"
  org.opencontainers.image.description: "Dev variant of minimal-kafka: same Kafka + JRE + shell + curl/socat/jq. Not for production."
  org.opencontainers.image.url: "https://github.com/rtvkiz/minimal"
  org.opencontainers.image.source: "https://github.com/rtvkiz/minimal/tree/main/kafka"
  org.opencontainers.image.licenses: "Apache-2.0"
  dev.minimal.variant: "dev"

archs:
  - x86_64
  - aarch64
